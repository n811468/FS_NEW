<script>
/* ---------------------------------------------------------------
 * 前端分成兩種頁面：
 *   1. ENTITIES  — 單純的主檔維護(車型/車系/情境/科目)，沿用「表單 + 列表」通用元件。
 *   2. 表格編輯頁 — 銷售構成、銷貨成本、營業費用、開發總投、費率、匯率，
 *      改成一次看到全部、直接在格子裡改、最後按一次「儲存」的表格式介面。
 * ------------------------------------------------------------- */
const GATE_OPTIONS = ['GATE F', 'GATE E', 'GATE D', 'GATE C', 'GATE B', 'GATE A', 'GATE Z'];
const SCENARIO_TYPES = ['現況', '目標'];
// 結構科目與自動計算科目不能刪、父科目也不能改，否則損益鏈會接錯段（後端也會擋，這裡只是不畫按鈕）
const PROTECTED_LINE_CODES = ['A', 'B', 'C', 'E', 'G', 'I', 'K'];
const PL_LINE_PARENT_OPTIONS = [
  ['B', 'B 銷貨成本'],
  ['E', 'E 銷售費用(銷貨毛利前)'],
  ['G', 'G 產品貢獻前費用'],
  ['I', 'I 固定營業費用']
];
const LINE_PARENT_OPTIONS = [['', '(結構科目，不可改)']].concat(PL_LINE_PARENT_OPTIONS);
// 開發總投填寫流程：部門 -> 設備/模具/費用大類 -> 實際攤提落點。大類只是用來分組/篩選
// 攤提落點選單，避免自己新增的攤提落點越加越多之後全部混在同一個下拉選單裡不好找。
const DEV_AMORT_CATEGORIES = ['設備', '模具', '費用'];
// 建立新情境時可以整批帶入的資料類別
const SCENARIO_COPY_PARTS = [
  { key: 'salesmix', label: '銷售構成' },
  { key: 'costofsales', label: '銷貨成本' },
  { key: 'devinvestment', label: '開發總投' },
  { key: 'operatingexpense', label: '營業費用' },
  { key: 'parameters', label: '費率/匯率' }
];

const ENTITIES = {
  vehicletypes: {
    label: '車型主檔', pk: 'VehicleTypeID',
    getFn: 'getVehicleTypes', saveGridFn: 'saveVehicleTypeGrid', deleteFn: 'deleteVehicleType',
    renameFn: 'renameVehicleType', scopedBy: null,
    columns: [
      { name: 'VehicleTypeID', label: '車型代號', lockAfterCreate: true, width: 140 },
      { name: 'Notes', label: '備註', width: 360 }
    ]
  },
  vehicles: {
    label: '車系設定', pk: 'VehicleID',
    getFn: 'getVehicles', saveGridFn: 'saveVehicleGrid', deleteFn: 'deleteVehicle',
    renameFn: 'renameVehicle', scopedBy: 'vehicleType',
    columns: [
      { name: 'VehicleID', label: '車系代號', lockAfterCreate: true, width: 140 },
      { name: 'VehicleCode', label: '車系名稱', width: 220 },
      { name: 'SortOrder', label: '排序', type: 'number', width: 70 },
      { name: 'Notes', label: '備註', width: 320 }
    ]
  },
  scenarios: {
    label: '情境設定', pk: 'ScenarioID',
    getFn: 'getScenarios', saveGridFn: 'saveScenarioGrid', deleteFn: 'deleteScenario',
    scopedBy: 'vehicleType', createUi: 'scenario',
    columns: [
      { name: 'Gate', label: 'GATE 別', type: 'select', options: GATE_OPTIONS, width: 110 },
      { name: 'ScenarioName', label: '情境名稱', width: 200 },
      { name: 'ScenarioType', label: '情境性質', type: 'select', options: SCENARIO_TYPES, width: 90 },
      { name: 'CreatedDate', label: '建立日期', type: 'date', width: 140 },
      { name: 'Notes', label: '備註', width: 280 }
    ]
  },
  lineitems: {
    label: '科目設定', pk: 'LineCode',
    getFn: 'getPLLineItems', saveGridFn: 'savePLLineItemGrid', deleteFn: 'deletePLLineItem',
    scopedBy: null,
    restorable: true,
    columns: [
      { name: 'LineCode', label: '科目代碼', auto: true, width: 80 },
      // 自動計算科目與結構科目的名稱寫的就是它的公式，由程式決定；改了只會讓名稱跟數字對不起來
      { name: 'LineName', label: '科目名稱', width: 280, lockIf: r => r.__existing && isFixedLineItem(r) },
      { name: 'ParentLine', label: '父科目', type: 'select', options: LINE_PARENT_OPTIONS, width: 190,
        lockIf: r => r.__existing && isFixedLineItem(r) },
      { name: 'Category', label: '分類', width: 110 },
      { name: 'SortOrder', label: '排序值', type: 'number', width: 80 },
      { name: 'AutoSource', label: '自動計算來源', readOnly: true, width: 150 }
    ]
  }
};

/** 結構科目或自動計算科目：父科目固定、名稱不可改 */
function isFixedLineItem(row) {
  return PROTECTED_LINE_CODES.indexOf(row.LineCode) !== -1 || !!row.AutoSource;
}
/**
 * DEV_AMORT 是使用者自己在「開發總投」頁面新增的攤提落點，跟其他內建的自動計算科目
 * (售價結構、貨物稅、季Margin、模具/設備/CMC/BASE廠開發費攤提)不一樣：那些是程式定義、
 * 名稱代表固定公式；DEV_AMORT 是使用者自訂的科目，理當跟其他手動科目一樣可以刪除
 * （後端 deletePLLineItem 仍會擋住「還有開發總投資料指到這裡」的情況，不會憑空弄丟資料）。
 */
function isDeletableAutoLineItem(row) {
  return row.AutoSource === 'DEV_AMORT';
}

// 表格編輯頁：key -> 渲染函式名稱
const GRID_PANELS = {
  salesmix: 'renderSalesMixPanel',
  costofsales: 'renderCostOfSalesPanel',
  operatingexpense: 'renderOperatingExpensePanel',
  devinvestment: 'renderDevInvestmentPanel',
  paramrates: 'renderRatePanel',
  paramfx: 'renderFxPanel'
};

let currentVehicleTypeId = '';
let currentScenarioId = '';
let currentScenario = null;      // 目前情境的完整資料(含 Gate / ScenarioType)
let scenarioCache = [];
let currentTab = 'vehicletypes';

/**
 * 表格編輯頁的資料快取：切分頁很常常常是「切回剛剛看過的那頁」，
 * 每次都重新跟後端要資料會讓畫面先空白一下才畫出來，感覺卡頓。
 * 有快取就先用快取立刻畫出來，同時仍照常在背景重新取一次最新資料、拿到後才重畫，
 * 兩次畫面之間使用者已經看得到內容，不再面對空白等待。
 */
const panelDataCache_ = {};
/**
 * scope 決定這個快取鍵要不要跟著車型/情境變動：
 * 'none' 兩者都跟資料無關（如車型主檔、科目設定 —— 全系統共用一份）、
 * 'vehicleType' 只跟車型有關（如車系設定 —— 情境換了不影響）、
 * 'scenario' 只跟情境有關（如開發總投 —— 車型換了情境也會跟著清空，不必重複區分）、
 * 省略或 'both' 則兩者都要區分（如銷售構成、銷貨成本）。
 * 沒分清楚的話，資料明明沒變，換一下情境或車型就會讓不相關頁面的快取失效，
 * 切回去時又要空等一次伺服器回應，感覺像整頁重新載入。
 */
function panelCacheKey_(prefix, scope) {
  const vt = (scope === 'none' || scope === 'scenario') ? '' : currentVehicleTypeId;
  const sc = (scope === 'none' || scope === 'vehicleType') ? '' : currentScenarioId;
  return prefix + '::' + vt + '::' + sc;
}
// 靜默模式：初始化(或切換車型)時會連續設定車型/情境，每一步都重繪會造成
// 同一個分頁被畫三、四次、也重複打伺服器。開啟後只更新狀態不渲染，最後統一渲染一次。
let silent = false;

/* ---------------- 共用工具 ---------------- */
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(v, digits) {
  if (v === '' || v === null || v === undefined) return '';
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: digits === undefined ? 0 : digits });
}
/** 科目名稱/備註等使用者輸入會被塞進 HTML，& < > " 都要轉義，否則表格會被破壞 */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function showGlobalError(err) {
  const box = document.getElementById('global-error');
  const msg = '發生錯誤：' + (err && err.message ? err.message : err);
  console.error(err);
  if (!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}
function clearGlobalError() {
  const box = document.getElementById('global-error');
  if (box) box.style.display = 'none';
}
/** 包住 success handler：伺服器呼叫成功後前端渲染若丟例外，也要顯示在畫面上 */
function safeHandler(fn) {
  return function () {
    try { clearGlobalError(); return fn.apply(null, arguments); }
    catch (e) { showGlobalError(e); }
  };
}
function setStatus(key, text, cls) {
  const el = document.getElementById('status-' + key);
  if (el) { el.textContent = text; el.className = 'status-msg' + (cls ? ' ' + cls : ''); }
}
/** 表格編輯頁的共用外框：標題 + 工具列 + 狀態 + 內容 */
function gridShell(key, title) {
  return `
    <h3>${title}</h3>
    <div id="toolbar-${key}" class="toolbar"></div>
    <div id="status-${key}" class="status-msg"></div>
    <div id="grid-${key}"></div>
  `;
}
function scenarioLabel(s) {
  return [s.Gate, s.ScenarioName].filter(v => v).join(' ') || s.ScenarioID;
}
function requireScope(key, needScenario) {
  const panel = document.getElementById('panel-' + key);
  if (!currentVehicleTypeId) { panel.innerHTML = '<p class="muted">請先在上方選擇車型</p>'; return false; }
  if (needScenario && !currentScenarioId) { panel.innerHTML = '<p class="muted">請先在上方選擇情境</p>'; return false; }
  return true;
}

/* ---------------- 頁籤 / 上方選單 ---------------- */
function switchTab(key) {
  currentTab = key;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  saveAppState_();
  renderTab(key);
}

/**
 * 記住「目前在哪一頁、選了哪個車型/情境」，讓整頁重新載入後能回到原本的位置。
 * 地端版匯入資料包、載入示範資料後都會整頁重新載入，使用者自己按 F5 也是；沒有這層記憶的話，
 * 畫面每次都會跳回「車型主檔」分頁、車型/情境選單也重設成第一筆。存最基本的三個狀態就好，
 * 表格編輯頁裡「還沒存檔的修改」本來就無法安全地跨頁面重新載入還原，不在這裡處理。
 */
const APP_STATE_KEY_ = 'plApp.state.v1';
function saveAppState_() {
  try {
    localStorage.setItem(APP_STATE_KEY_, JSON.stringify({
      tab: currentTab, vehicleTypeId: currentVehicleTypeId, scenarioId: currentScenarioId
    }));
  } catch (e) { /* 無痕模式等情況存不了就算了，不影響功能 */ }
}
function loadAppState_() {
  try {
    const s = JSON.parse(localStorage.getItem(APP_STATE_KEY_) || 'null');
    if (s && typeof s === 'object') return s;
  } catch (e) { /* 壞掉的資料當作沒有 */ }
  return {};
}

function renderTab(key) {
  if (silent) return;
  if (key === 'dashboard') loadComparisonPicker();
  else if (GRID_PANELS[key]) window[GRID_PANELS[key]]();
  else if (ENTITIES[key]) renderEntityPanel(key);
}

/** 開場：車型 + 情境一次取回，期間不重繪，最後只渲染一次目前分頁 */
function loadVehicleTypeSelector(preferredId, preferredScenarioId) {
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      renderVehicleTypeOptions(data.vehicleTypes || [], data.vehicleTypeId);
      currentVehicleTypeId = data.vehicleTypeId || '';
      renderScenarioOptions(data.scenarios || [], preferredScenarioId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); renderTab(currentTab); })
    .getBootstrap(preferredId || currentVehicleTypeId);
}

function renderVehicleTypeOptions(types, pick) {
  const sel = document.getElementById('vehicletype-selector');
  sel.innerHTML = '<option value="">-- 選擇車型 --</option>' +
    types.map(t => `<option value="${esc(t.VehicleTypeID)}">${esc(t.VehicleTypeID)}</option>`).join('');
  sel.value = pick || '';
}

/** 把情境選單畫出來並決定選哪一個，不觸發伺服器呼叫 */
function renderScenarioOptions(scenarios, preferredId) {
  scenarioCache = scenarios || [];
  const sel = document.getElementById('scenario-selector');
  sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const ids = scenarioCache.map(s => s.ScenarioID);
  const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
    : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
    : ids[0] || '';
  sel.value = pick;
  setCurrentScenario(pick);
}

/** 只更新目前情境狀態與標籤，渲染交給呼叫端決定 */
function setCurrentScenario(value) {
  currentScenarioId = value;
  currentScenario = scenarioCache.filter(s => s.ScenarioID === value)[0] || null;
  const badge = document.getElementById('scenario-type-badge');
  if (badge) {
    badge.textContent = currentScenario ? (currentScenario.ScenarioType || '現況') : '';
    badge.style.display = currentScenario ? 'inline-block' : 'none';
  }
  saveAppState_();
}

function onVehicleTypeChange(value) {
  currentVehicleTypeId = value;
  currentScenarioId = '';
  currentScenario = null;
  saveAppState_();
  // 車型換了之後情境清單也要換，換完才渲染一次，避免同一個分頁畫兩遍
  loadScenarioSelector();
}

function loadScenarioSelector(preferredId) {
  const sel = document.getElementById('scenario-selector');
  if (!currentVehicleTypeId) {
    sel.innerHTML = '<option value="">-- 請先選車型 --</option>';
    scenarioCache = [];
    setCurrentScenario('');
    renderTab(currentTab);
    return;
  }
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      renderScenarioOptions(scenarios, preferredId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); })
    .getScenarios(currentVehicleTypeId);
}

function onScenarioChange(value) {
  setCurrentScenario(value);
  renderTab(currentTab);
}

/* ---------------- 主檔維護（表格直接編輯，不需要先按「編輯」） ---------------- */
let entityRows = {};        // key -> 目前表格上的資料列（__existing 標記是否已存在於後端）
let pendingStatus = null;   // 重畫表格後才顯示的訊息（例如建立情境後整個面板會被重繪）

function renderEntityPanel(key) {
  const cfg = ENTITIES[key];
  const panel = document.getElementById('panel-' + key);
  if (cfg.scopedBy === 'vehicleType' && !currentVehicleTypeId) {
    panel.innerHTML = '<p class="muted">請先在上方選擇車型</p>';
    return;
  }
  panel.innerHTML = gridShell(key, cfg.label);
  loadEntityData(key);
}

/** ENTITIES 的 scopedBy 只有 'vehicleType' 或 null，剛好對應到快取鍵要區分到什麼程度 */
function entityCacheScope_(cfg) { return cfg.scopedBy === 'vehicleType' ? 'vehicleType' : 'none'; }

function loadEntityData(key) {
  const cfg = ENTITIES[key];
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId] : [];
  const cacheKey = panelCacheKey_(key, entityCacheScope_(cfg));
  const apply = rows => { entityRows[key] = (rows || []).map(r => Object.assign({}, r, { __existing: true })); drawEntityGrid(key); };
  if (panelDataCache_[cacheKey]) apply(panelDataCache_[cacheKey]);
  google.script.run
    .withSuccessHandler(safeHandler(rows => { panelDataCache_[cacheKey] = rows; apply(rows); }))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function drawEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = entityRows[key] || [];

  document.getElementById('toolbar-' + key).innerHTML = `
    <button type="button" class="btn" onclick="saveEntityGrid('${key}')">儲存</button>
    ${cfg.createUi === 'scenario' ? '' :
      `<button type="button" class="btn secondary" onclick="addEntityRow('${key}')">新增一列</button>`}
    ${cfg.restorable ? '<button type="button" class="btn secondary" onclick="restoreBuiltInLines()">恢復內建科目預設值</button>' : ''}
  ` + (cfg.createUi === 'scenario' ? scenarioToolbarHtml() : '');

  const body = rows.length
    ? rows.map((r, i) => `<tr${r.__existing ? '' : ' class="new-row"'}>
        ${cfg.columns.map(col => entityCellHtml(key, i, col, r)).join('')}
        <td class="row-actions">${entityRowActionHtml(key, i, r, rows.length)}</td>
      </tr>`).join('')
    : `<tr><td class="muted" colspan="${cfg.columns.length + 1}">尚無資料</td></tr>`;

  document.getElementById('grid-' + key).innerHTML = `
    <div class="grid-scroll">
      <table class="grid-table entity-table">
        <thead><tr>${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th>操作</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;

  if (key === 'scenarios') autoFillNewScenarioName_();

  if (pendingStatus && pendingStatus.key === key) {
    setStatus(key, pendingStatus.text, pendingStatus.cls);
    pendingStatus = null;
  }
}

function entityCellHtml(key, i, col, row) {
  const value = row[col.name] === undefined || row[col.name] === null ? '' : row[col.name];
  const locked = col.readOnly || col.auto ||
    (col.lockAfterCreate && row.__existing) ||
    (col.lockIf && col.lockIf(row));
  const style = col.width ? ` style="width:${col.width}px;"` : '';

  if (locked) {
    // 新增列的自動編號欄位還沒有值，先讓使用者知道存檔時系統會配號
    const shown = col.auto && !value ? '(儲存時自動編號)' : value;
    return `<td class="row-head calc">${esc(shown)}</td>`;
  }
  if (col.type === 'select') {
    const options = col.options.map(o => {
      const [v, text] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}"${String(value) === String(v) ? ' selected' : ''}>${esc(text)}</option>`;
    }).join('');
    return `<td><select${style} onchange="onEntityField('${key}', ${i}, '${col.name}', this.value)">${options}</select></td>`;
  }
  return `<td><input type="${col.type || 'text'}" step="any" value="${esc(value)}"${style}
    oninput="onEntityField('${key}', ${i}, '${col.name}', this.value)"></td>`;
}

function entityHasSortOrder(key) {
  return ENTITIES[key].columns.some(c => c.name === 'SortOrder');
}

/** 有排序值(SortOrder)的表格才給上下移動鈕：直接跟前/後一列交換排序值，比自己打數字調順序直覺 */
function moveButtonsHtml(key, i, total) {
  if (!entityHasSortOrder(key)) return '';
  return `<button type="button" class="btn secondary row-move" title="往上移" ${i === 0 ? 'disabled' : ''}
      onclick="moveEntityRow('${key}', ${i}, -1)">▲</button>` +
    `<button type="button" class="btn secondary row-move" title="往下移" ${i === total - 1 ? 'disabled' : ''}
      onclick="moveEntityRow('${key}', ${i}, 1)">▼</button>`;
}

/**
 * 上下移動：交換這一列跟相鄰列的排序值(SortOrder)與陣列位置，畫面馬上照新順序重排，
 * 不必先按儲存才看得到效果；跟其他修改一樣，最後按「儲存」才會真的送出。
 * 新增列(還沒存檔、沒有既有 SortOrder)只搬陣列位置，跟已存在列的排序值互換沒有意義。
 */
function moveEntityRow(key, i, dir) {
  const rows = entityRows[key];
  const j = i + dir;
  if (j < 0 || j >= rows.length) return;
  const a = rows[i], b = rows[j];
  if (a.SortOrder !== '' && a.SortOrder !== undefined && a.SortOrder !== null &&
      b.SortOrder !== '' && b.SortOrder !== undefined && b.SortOrder !== null) {
    const tmp = a.SortOrder; a.SortOrder = b.SortOrder; b.SortOrder = tmp;
  }
  rows[i] = b; rows[j] = a;
  drawEntityGrid(key);
}

function entityRowActionHtml(key, i, row, total) {
  const move = moveButtonsHtml(key, i, total);
  if (!row.__existing) {
    return move + `<button type="button" class="btn secondary" onclick="removeEntityRow('${key}', ${i})">移除</button>`;
  }
  const cfg = ENTITIES[key];
  const renameBtn = cfg.renameFn
    ? `<button type="button" class="btn secondary" onclick="renameEntityRow('${key}', ${i})">重新命名</button>` : '';
  if (key === 'lineitems' && isFixedLineItem(row) && !isDeletableAutoLineItem(row)) {
    return move + renameBtn + '<span class="muted">不可刪除</span>';
  }
  return move + renameBtn + `<button type="button" class="btn danger" onclick="deleteEntityRow('${key}', ${i})">刪除</button>`;
}

/**
 * 車型/車系代號重新命名：不能直接在格子裡改代號 —— 代號是其他表格的外鍵(車系記著車型代號、
 * 銷售構成/成本記著車系代號)，直接改字串只會讓那些資料的鍵值對不到，變成孤兒資料。
 * 改用後端的 rename 函式，一次把所有引用該代號的地方都更新過去。
 */
function renameEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const oldId = row[cfg.pk];
  const newId = (prompt('新的代號：', oldId) || '').trim();
  if (!newId || newId === oldId) return;
  const args = key === 'vehicles' ? [currentVehicleTypeId, oldId, newId] : [oldId, newId];
  setStatus(key, '重新命名中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      // 改名會牽動其他表格裡引用這個代號的資料(銷售構成/成本/費用...)，這些頁面的快取一併清掉，
      // 不然切分頁時會先看到還記得舊代號的畫面。
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      // 目前選取的車型代號如果剛好是被改名的那個，選單跟後續呼叫都要跟著改用新代號
      if (key === 'vehicletypes' && currentVehicleTypeId === oldId) currentVehicleTypeId = newId;
      pendingStatus = { key: key, text: `已將「${oldId}」改名為「${newId}」`, cls: 'ok' };
      loadEntityData(key);
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.renameFn](...args);
}

function onEntityField(key, i, field, value) {
  entityRows[key][i][field] = value;
  if (key === 'scenarios' && (field === 'CreatedDate' || field === 'ScenarioType')) {
    autoFillScenarioName_(i);
  }
}

/** yyyy-MM-dd -> "MMDD"，用來組情境名稱的日期後綴 */
function dateToMMDD_(dateStr) {
  const m = String(dateStr || '').match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? m[1] + m[2] : '';
}

/**
 * 情境名稱自動帶入：選了建立日期(或改了情境性質)後，把名稱補成「情境性質+MMDD」(如「現況0901」)。
 * 只在名稱是空白、或還是上一次自動帶入的值時才覆蓋 —— 使用者手動打過的名稱不會被蓋掉，
 * 蓋掉之後再打的字仍算「手動」，之後就算又改日期也不會再被自動帶入的值覆蓋。
 */
function autoFillScenarioName_(i) {
  const row = entityRows.scenarios[i];
  const suffix = dateToMMDD_(row.CreatedDate);
  if (!suffix) return;
  const auto = (row.ScenarioType || '') + suffix;
  if (!row.ScenarioName || row.ScenarioName === row.__scenarioNameAuto) {
    row.ScenarioName = auto;
    row.__scenarioNameAuto = auto;
    drawEntityGrid('scenarios');
  }
}

function addEntityRow(key) {
  const cfg = ENTITIES[key];
  const row = { __existing: false };
  cfg.columns.forEach(c => { row[c.name] = ''; });
  if (cfg.pk) row[cfg.pk] = '';
  entityRows[key].push(row);
  drawEntityGrid(key);
}

/** 還沒存進後端的新增列，直接從畫面上拿掉就好 */
function removeEntityRow(key, i) {
  entityRows[key].splice(i, 1);
  drawEntityGrid(key);
}

function deleteEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  if (!confirm('確定要刪除這筆資料嗎？')) return;
  setStatus(key, '刪除中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      pendingStatus = { key: key, text: '已刪除', cls: 'ok' };
      loadEntityData(key);
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.deleteFn](row[cfg.pk]);
}

function saveEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = (entityRows[key] || []).map(r => {
    // 只送出後端 schema 認得的欄位，__existing 這類前端旗標不要一起送過去
    const copy = {};
    cfg.columns.forEach(c => { copy[c.name] = r[c.name] === undefined ? '' : r[c.name]; });
    if (cfg.pk) copy[cfg.pk] = r[cfg.pk] === undefined ? '' : r[cfg.pk];
    return copy;
  });
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId, rows] : [rows];

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
      entityRows[key] = (saved || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid(key);
      setStatus(key, '已儲存', 'ok');
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveGridFn](...args);
}

/**
 * 把內建科目的名稱、父科目、分類、排序整個回復成程式預設值。
 * 自動計算科目的名稱平常就會自動對回程式碼（開頁時 getBootstrap 會同步），
 * 這顆按鈕是給明細科目的名稱與排序被改亂之後用的。
 */
function restoreBuiltInLines() {
  if (!confirm('會把所有內建科目的名稱、父科目、分類與排序回復成系統預設值（自己新增的科目不受影響），確定嗎？')) return;
  setStatus('lineitems', '回復中...');
  google.script.run
    .withSuccessHandler(safeHandler(rows => {
      entityRows.lineitems = (rows || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid('lineitems');
      setStatus('lineitems', '已回復內建科目的預設名稱與排序', 'ok');
    }))
    .withFailureHandler(err => setStatus('lineitems', '錯誤：' + err.message, 'err'))
    .restoreBuiltInLineItems();
}

/** 車型/情境改動後，上方的選單也要跟著更新（但不要重畫目前這個分頁，會蓋掉剛顯示的訊息） */
function afterEntityChange(key) {

  if (key === 'scenarios') refreshScenarioOptions();
}

function selectedCopyParts() {
  return SCENARIO_COPY_PARTS
    .filter(p => { const el = document.getElementById('copy-part-' + p.key); return el && el.checked; })
    .map(p => p.key);
}

/** 「新增情境」表單：情境性質改變時，名稱欄位還是空白或還是上次自動帶入的值，就重新帶一次(性質+今天MMDD) */
let newScenarioNameAuto_ = '';
function autoFillNewScenarioName_() {
  const nameEl = document.getElementById('new-scenario-name');
  const typeEl = document.getElementById('new-scenario-type');
  if (!nameEl || !typeEl) return;
  const auto = (typeEl.value || '') + dateToMMDD_(today());
  if (!nameEl.value || nameEl.value === newScenarioNameAuto_) {
    nameEl.value = auto;
    newScenarioNameAuto_ = auto;
  }
}

function createScenario() {
  const name = val('new-scenario-name');
  if (!name) { setStatus('scenarios', '請輸入情境名稱', 'err'); return; }
  const source = val('new-scenario-source');
  const parts = selectedCopyParts();
  if (source && !parts.length) {
    setStatus('scenarios', '請至少勾選一項要帶入的資料，或把來源情境改成「不帶入」', 'err');
    return;
  }
  setStatus('scenarios', '建立中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      pendingStatus = { key: 'scenarios', text: source ? '已建立情境，並帶入來源情境的資料' : '已建立情境', cls: 'ok' };
      loadEntityData('scenarios');
      refreshScenarioOptions(saved && saved.ScenarioID);
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .createScenarioFrom({
      ScenarioID: '',
      Gate: val('new-scenario-gate'),
      ScenarioName: name,
      ScenarioType: val('new-scenario-type'),
      VehicleTypeID: currentVehicleTypeId,
      CreatedDate: today(),
      Notes: ''
    }, source, parts);
}

function importIntoCurrentScenario() {
  const source = val('import-scenario-source');
  if (!currentScenarioId) { setStatus('scenarios', '請先在上方選擇要帶入的目標情境', 'err'); return; }
  if (!source) { setStatus('scenarios', '請選擇來源情境', 'err'); return; }
  const parts = selectedCopyParts();
  if (!parts.length) { setStatus('scenarios', '請至少勾選一項要帶入的資料', 'err'); return; }
  if (!confirm('帶入會先清掉目前情境所勾選類別的資料，再整批複製來源情境的內容，確定嗎？')) return;

  setStatus('scenarios', '帶入中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      setStatus('scenarios', '已帶入來源情境的資料（開發總投的挑戰低減目標已清空，請重新填寫）', 'ok');
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .copyScenarioData(source, currentScenarioId, parts);
}

function today() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ================= 銷售構成（依車系自動列出，台數/構成比動態連動） ================= */
let salesMixRows = [];

function renderSalesMixPanel() {
  if (!requireScope('salesmix', true)) return;
  const panel = document.getElementById('panel-salesmix');
  panel.innerHTML = gridShell('salesmix', '銷售構成與售價');
  const cacheKey = panelCacheKey_('salesmix');
  if (panelDataCache_[cacheKey]) { salesMixRows = panelDataCache_[cacheKey].rows || []; drawSalesMixGrid(); }
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      panelDataCache_[cacheKey] = data;
      salesMixRows = data.rows || [];
      drawSalesMixGrid();
    }))
    .withFailureHandler(showGlobalError)
    .getSalesMixGrid(currentScenarioId, currentVehicleTypeId);
}

function drawSalesMixGrid() {
  const grid = document.getElementById('grid-salesmix');
  if (!salesMixRows.length) {
    document.getElementById('toolbar-salesmix').innerHTML = '';
    grid.innerHTML = '<p class="muted">這個車型還沒有車系，請先到「車系設定」建立車系。</p>';
    return;
  }
  const totalUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);

  document.getElementById('toolbar-salesmix').innerHTML = `
    <label style="display:flex;align-items:center;gap:6px;">車型月總台數：
      <input id="sm-total" type="number" step="any" style="width:110px;" value="${totalUnits || ''}"
             oninput="onSalesMixTotalInput()">
    </label>
    <button type="button" class="btn" onclick="saveSalesMixGrid()">儲存</button>
    <span class="muted">LIFE CYCLE 總台數 = 月台數 × 12 × LC年限</span>
  `;

  grid.innerHTML = `
    <div class="grid-scroll">
    <table class="grid-table sticky-head-col">
      <thead><tr>
        <th>車系</th><th>構成比%</th><th>月台數</th><th>LC年限</th><th>LC總台數</th>
        <th>建議零售價<br>(含稅)</th><th>強配件<br>售價</th><th>廢車<br>處理費</th><th>稅別</th>
        <th title="計算貨物稅完稅價格時，從廠價扣除這個金額">水平配件外移<br>調降廠價</th>
        <th>備註</th>
      </tr></thead>
      <tbody>
        ${salesMixRows.map((r, i) => `
          <tr>
            <td class="row-head">${esc(r.VehicleID)}${r.VehicleCode ? ' - ' + esc(r.VehicleCode) : ''}</td>
            <td><input type="number" step="any" value="${esc(r.SalesMixPct)}" oninput="onSalesMixPctInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MonthlyVolume)}" oninput="onSalesMixVolumeInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.LifeCycleYears)}" oninput="onSalesMixField(${i}, 'LifeCycleYears', this.value)"></td>
            <td class="calc" id="sm-lc-${i}">${fmt(num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears))}</td>
            <td><input type="number" step="any" value="${esc(r.ListPriceTaxIncl)}" oninput="onSalesMixField(${i}, 'ListPriceTaxIncl', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MandatoryAccessoryPrice)}" oninput="onSalesMixField(${i}, 'MandatoryAccessoryPrice', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.ScrapFee)}" oninput="onSalesMixField(${i}, 'ScrapFee', this.value)"></td>
            <td><select onchange="onSalesMixField(${i}, 'ScrapFeeTaxStatus', this.value)">
              ${['含稅', '未稅'].map(o => `<option value="${o}"${r.ScrapFeeTaxStatus === o ? ' selected' : ''}>${o}</option>`).join('')}
            </select></td>
            <td><input type="number" step="any" value="${esc(r.HorizontalPartsPriceAdj)}" oninput="onSalesMixField(${i}, 'HorizontalPartsPriceAdj', this.value)"></td>
            <td><input type="text" class="note-input" value="${esc(r.Notes)}" oninput="onSalesMixField(${i}, 'Notes', this.value)"></td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td class="row-head">合計</td>
        <td id="sm-sum-pct" class="calc"></td>
        <td id="sm-sum-units" class="calc"></td>
        <td></td><td id="sm-sum-lc" class="calc"></td>
        <td colspan="6"></td>
      </tr></tfoot>
    </table>
    </div>`;
  updateSalesMixTotals();
}

function onSalesMixField(i, field, value) { salesMixRows[i][field] = value; updateSalesMixTotals(); }

/** 改台數：總台數 = 各車系台數加總，所有構成比依台數重算 */
function onSalesMixVolumeInput(i, value) {
  salesMixRows[i].MonthlyVolume = value === '' ? '' : num(value);
  const total = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  salesMixRows.forEach(r => { r.SalesMixPct = total > 0 ? round2(num(r.MonthlyVolume) / total * 100) : ''; });
  document.getElementById('sm-total').value = total || '';
  syncSalesMixInputs({ skipVolumeIndex: i });
}

/** 改構成比：以車型月總台數為基準反推該車系台數，其餘車系的構成比再依台數回算 */
function onSalesMixPctInput(i, value) {
  salesMixRows[i].SalesMixPct = value === '' ? '' : num(value);
  const total = num(val('sm-total'));
  if (total > 0) {
    // 台數保留小數：構成比 5% × 365 台 = 18.25 台，四捨五入會讓構成比對不回去
    salesMixRows[i].MonthlyVolume = round2(num(value) / 100 * total);
  }
  syncSalesMixInputs({ skipPctIndex: i });
}

/** 改車型月總台數：各車系依目前構成比重新分配台數 */
function onSalesMixTotalInput() {
  const total = num(val('sm-total'));
  if (total > 0) {
    salesMixRows.forEach(r => { r.MonthlyVolume = round2(num(r.SalesMixPct) / 100 * total); });
  }
  syncSalesMixInputs({});
}

function round2(n) { return Math.round(n * 100) / 100; }

/** 把 salesMixRows 的值寫回輸入框（跳過使用者正在輸入的那一格，避免游標跳動） */
function syncSalesMixInputs(opts) {
  const rows = document.querySelectorAll('#grid-salesmix tbody tr');
  salesMixRows.forEach((r, i) => {
    const tr = rows[i];
    if (!tr) return;
    const pctInput = tr.children[1].querySelector('input');
    const volInput = tr.children[2].querySelector('input');
    if (opts.skipPctIndex !== i) pctInput.value = r.SalesMixPct === '' ? '' : r.SalesMixPct;
    if (opts.skipVolumeIndex !== i) volInput.value = r.MonthlyVolume === '' ? '' : r.MonthlyVolume;
  });
  updateSalesMixTotals();
}

function updateSalesMixTotals() {
  const sumPct = salesMixRows.reduce((s, r) => s + num(r.SalesMixPct), 0);
  const sumUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  let sumLc = 0;
  salesMixRows.forEach((r, i) => {
    const lc = num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears);
    sumLc += lc;
    const cell = document.getElementById('sm-lc-' + i);
    if (cell) cell.textContent = fmt(lc);
  });
  const pctCell = document.getElementById('sm-sum-pct');
  if (pctCell) {
    pctCell.textContent = fmt(sumPct, 2) + '%';
    // 構成比合計不是 100% 時標紅，避免加權平均被算錯還沒發現
    pctCell.className = 'calc' + (Math.abs(sumPct - 100) > 0.01 && sumPct !== 0 ? ' negative' : '');
  }
  const unitCell = document.getElementById('sm-sum-units');
  if (unitCell) unitCell.textContent = fmt(sumUnits);
  const lcCell = document.getElementById('sm-sum-lc');
  if (lcCell) lcCell.textContent = fmt(sumLc);
}

function saveSalesMixGrid() {
  setStatus('salesmix', '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      panelDataCache_[panelCacheKey_('salesmix')] = data;
      salesMixRows = data.rows || [];
      drawSalesMixGrid();
      setStatus('salesmix', '已儲存', 'ok');
    }))
    .withFailureHandler(err => setStatus('salesmix', '錯誤：' + err.message, 'err'))
    .saveSalesMixGrid(currentScenarioId, currentVehicleTypeId, salesMixRows);
}

/* ================= 金額矩陣（銷貨成本 / 營業費用共用） ================= */

  },
  operatingexpense: {

  }
};

let matrixData = {};   // key -> {lines, vehicles, values, currencies}

function renderCostOfSalesPanel() { renderMatrixPanel('costofsales'); }
function renderOperatingExpensePanel() { renderMatrixPanel('operatingexpense'); }

function renderMatrixPanel(key) {
  if (!requireScope(key, true)) return;

  const cacheKey = panelCacheKey_(key);

    .withFailureHandler(showGlobalError)
    [cfg.getFn](currentScenarioId, currentVehicleTypeId);
}

function drawMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const data = matrixData[key];
  const grid = document.getElementById('grid-' + key);

  const parentSelect = cfg.parentOptions
    ? `<select id="${key}-new-parent">${cfg.parentOptions.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`

            <button type="button" class="btn secondary row-move" title="往右移" ${i === data.vehicles.length - 1 ? 'disabled' : ''}
              onclick="reorderMatrixVehicle('${key}', '${esc(v.VehicleID)}', 1)">▶</button>
          </div>

      </tr></thead>
      <tbody>
        ${data.lines.map(line => `
          <tr data-line="${esc(line.value)}">
            <td class="row-head">${esc(matrixLineName(line))}</td>
            ${currencyCell(line)}
            ${data.vehicles.map(v => {
              const cell = (data.values[line.value] || {})[v.VehicleID] || {};
              return `<td><input type="number" step="any" value="${esc(cell.Amount)}"

            }).join('')}
            <td class="calc" id="${key}-sum-${esc(line.value)}"></td>
            <td><input type="text" id="${key}-note-${esc(line.value)}" value="${esc(firstCellProp(data, line.value, 'Notes'))}"></td>

/** 自動計算科目的格子：唯讀，貨物稅(b13)滑鼠移過去可以看到完整計算過程 */
function autoLineCellHtml(data, lineCode, vehicleId) {
  const amt = (data.autoValues[lineCode] || {})[vehicleId];
  if (amt === undefined) return '<td class="calc muted">—</td>';
  const detail = data.commodityTaxDetail && data.commodityTaxDetail[vehicleId];
  // 跟儀表板一樣用 data-tip 提示(原生 title 在會橫向捲動的表格裡常被裁掉)
  const tip = (lineCode === 'b13' && detail) ? ` tabindex="0" data-tip="${esc('貨物稅計算過程\n' + commodityTaxDetailText(detail))}"` : '';
  return `<td class="calc"${tip}>${fmt(amt)}</td>`;
}
/** 把貨物稅的計算過程攤開成文字，滑鼠移到金額上就看得到每一步是怎麼來的 */
function commodityTaxDetailText(d) {
  const pct = n => (n * 100).toFixed(1) + '%';
  return [
    `廠價(未稅) ${fmt(d.exFactoryPrice)}`,
    `− 水平配件外移調降廠價 ${fmt(d.horizontalPartsAdj)}`,
    `− 廣宣+促銷+批標售+季Margin ${fmt(d.deductTotal)}`,
    `= 完稅價格基礎 ${fmt(d.dutiableBase / (d.calcRate || 1))}`,
    `× 完稅價格計算率 ${pct(d.calcRate)} = ${fmt(d.dutiableBase)}`,
    `÷ (1+貨物稅率${pct(d.taxRate)}) × 貨物稅率 = 貨物稅 ${fmt(d.tax)}`
  ].join('\n');
}

/** 同一列(科目)的幣別/備註是列層級設定，讀取時取該列第一個有值的格子 */
function firstCellProp(data, lineCode, prop) {
  const row = data.values[lineCode] || {};
  const key = Object.keys(row).filter(k => row[k] && row[k][prop])[0];
  return key ? row[key][prop] : '';
}

/**
 * 右邊那一欄是「加權平均」而不是合計：一列是同一個成本項目在各車系的單台金額，
 * 把它們相加只會得到一個沒有意義的數字。改成用銷售構成比加權，跟儀表板的加權平均欄位一致。
 * 表尾則是各車系自己的科目合計（同一車系各科目相加是有意義的）。
 */
function updateMatrixTotals(key) {
  const data = matrixData[key];
  const mix = {};
  let mixTotal = 0;
  data.vehicles.forEach(v => { mix[v.VehicleID] = num(v.SalesMixPct); mixTotal += num(v.SalesMixPct); });

  const colSum = {};
  let weightedGrand = 0;
  data.lines.forEach(line => {
    let weighted = 0;
    document.querySelectorAll(`#grid-${key} input[data-line="${line.value}"]`).forEach(inp => {
      const v = num(inp.value);
      colSum[inp.dataset.vehicle] = (colSum[inp.dataset.vehicle] || 0) + v;
      weighted += v * (mix[inp.dataset.vehicle] || 0);
    });
    weighted = mixTotal ? weighted / mixTotal : 0;
    weightedGrand += weighted;
    const cell = document.getElementById(`${key}-sum-${line.value}`);
    if (cell) cell.textContent = mixTotal ? fmt(weighted) : '—';
  });

  const autoSum = {};
  (data.autoLines || []).forEach(line => {
    data.vehicles.forEach(v => {
      const amt = (data.autoValues[line.value] || {})[v.VehicleID];
      if (amt !== undefined) autoSum[v.VehicleID] = (autoSum[v.VehicleID] || 0) + amt;
    });
  });

  data.vehicles.forEach(v => {
    const cell = document.getElementById(`${key}-colsum-${v.VehicleID}`);
    if (cell) cell.textContent = fmt(colSum[v.VehicleID] || 0);
    const withAutoCell = document.getElementById(`${key}-colsum-withauto-${v.VehicleID}`);
    if (withAutoCell) withAutoCell.textContent = fmt((colSum[v.VehicleID] || 0) + (autoSum[v.VehicleID] || 0));
  });
  const g = document.getElementById(`${key}-grandsum`);
  if (g) g.textContent = mixTotal ? fmt(weightedGrand) : '—';
}

function saveMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const cells = [];
  document.querySelectorAll(`#grid-${key} input[data-line]`).forEach(inp => {
    const line = inp.dataset.line;
    const cell = {
      RowID: inp.dataset.rowid || '',
      VehicleID: inp.dataset.vehicle,
      LineCode: line,
      Amount: inp.value === '' ? '' : num(inp.value),
      Notes: val(`${key}-note-${line}`)
    };
    if (cfg.hasCurrency) cell.Currency = val(`${key}-cur-${line}`) || 'TWD';
    cells.push(cell);
  });

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已儲存', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveFn](currentScenarioId, cells);
}

function addMatrixLine(key) {
  const cfg = MATRIX_CONFIG[key];
  const name = val(`${key}-new-name`);
  if (!name) { setStatus(key, '請先輸入項目名稱', 'err'); return; }
  const parent = cfg.parentOptions ? val(`${key}-new-parent`) : cfg.parentLine;
  setStatus(key, '新增中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已新增項目', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .addLineItemInline(parent, name);
}

function deleteMatrixLine(key, lineCode) {
  if (!confirm('科目表是全域共用的：刪除這個項目會一併清掉它在「所有情境」各車系已輸入的金額，確定嗎？')) return;
  setStatus(key, '刪除中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已刪除項目', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .deleteLineItemInline(lineCode);
}

/**
 * 車系欄位順序：直接在矩陣頁面用左右移動鈕調整，不必切去「車系設定」頁。
 * 車系順序是全車型共用的設定（跟儀表板、車系設定頁看到的是同一份），
 * 立即存檔生效，其他頁面的快取要一併清掉，不然切分頁時會先看到還沒更新的舊順序。
 */
function reorderMatrixVehicle(key, vehicleId, direction) {
  setStatus(key, '調整車系順序中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      setStatus(key, '已調整車系順序', 'ok');
      renderMatrixPanel(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .reorderVehicle(currentVehicleTypeId, vehicleId, direction);
}

/**
 * 金額/低減%/攤提落點改變時，不必等按「儲存」才知道下面的彙總表會變成怎樣：
 * debounce 一下(避免每打一個字元就打一次伺服器)，拿目前畫面上(含未存檔)的 devRows 直接試算。
 * 這是唯讀試算(previewDevInvestmentSummary 不寫入任何資料)，失敗也不用打擾使用者，
 * 反正真正的錯誤檢查在按「儲存」時後端還是會擋下來。
 */
let devPreviewTimer_ = null;
function scheduleDevTargetsPreview_() {
  if (!currentScenarioId || !devSummary) return;
  if (devPreviewTimer_) clearTimeout(devPreviewTimer_);
  devPreviewTimer_ = setTimeout(() => {
    google.script.run
      .withSuccessHandler(preview => {
        if (!devSummary) return;
        devSummary.targets = preview.targets;
        devSummary.lifeCycleUnits = preview.lifeCycleUnits;
        const box = document.getElementById('dev-targets-box');
        if (box) box.innerHTML = devTargetsTableHtml();
      })
      .withFailureHandler(() => {})
      .previewDevInvestmentSummary(currentScenarioId, devRows);
  }, 400);
}

function onDevField(i, field, value) {
  devRows[i][field] = value;
  syncDevReduced_(i);
  scheduleDevTargetsPreview_();
}

/** 低減後金額 = 金額 × (1 - 低減目標%/100)，四捨五入到整數方便對數字 */
function devReducedAmount(r) {
  return Math.round(num(r.Amount) * (1 - num(r.ChallengeReductionPct) / 100));
}

/** 金額或低減目標%改變時，重算低減後金額欄位(輸入框直接改值，不必整個重畫表格) */
function syncDevReduced_(i) {
  const cell = document.getElementById('dev-reduced-' + i);
  if (cell) cell.value = devReducedAmount(devRows[i]);
}

/** 直接改低減目標%：正常方向，順著改低減後金額 */
function onDevPctInput(i, value) {
  devRows[i].ChallengeReductionPct = value;
  syncDevReduced_(i);
  scheduleDevTargetsPreview_();
}

/**
 * 雙向試算：直接輸入「低減後金額」時反推低減目標%（金額固定不動），
 * 這樣使用者不管是先想好目標低減成多少金額、還是先想好要砍幾%，都可以直接填那一欄。
 */
function onDevReducedInput(i, value) {
  const amount = num(devRows[i].Amount);
  const reduced = num(value);
  devRows[i].ChallengeReductionPct = amount ? Math.round((1 - reduced / amount) * 10000) / 100 : 0;
  const pctInput = document.getElementById('dev-pct-' + i);
  if (pctInput) pctInput.value = devRows[i].ChallengeReductionPct;
  scheduleDevTargetsPreview_();
}
function addDevRow() {
  devRows.push({ RowID: '', Department: '', TargetLineCode: '', Amount: '', Currency: 'TWD', ChallengeReductionPct: '', Notes: '' });
  drawDevGrid();
}

/** 這個攤提落點科目屬於哪個大類(設備/模具/費用)，查 getDevInvestmentSummary 回傳的選項表 */
function devTargetCategoryOf(targetLineCode) {
  const opt = (devSummary.targetOptions || []).find(o => o.value === targetLineCode);
  return opt ? opt.category : '';
}
/** 大類改變時，攤提落點要重新篩選成該大類底下的選項；先選過的落點如果不屬於新大類就清空 */
function onDevCategoryChange(i, category) {
  devRows[i].__category = category;
  const target = devTargetCategoryOf(devRows[i].TargetLineCode);
  if (target !== category) devRows[i].TargetLineCode = '';
  drawDevGrid();
  scheduleDevTargetsPreview_();
}

/** 在開發總投頁面直接新增攤提落點科目，之後就會出現在「攤提落點」下拉選單裡 */
function addDevAmortTarget() {

/** 攤提基準台數：開發投資的攤提台數常與銷售構成的預估台數不同，可獨立設定；留空則沿用銷售構成 */

/** 上下移動部門列：只搬陣列順序，實際的 SortOrder 由後端在儲存時依送出順序重新編號 */
function moveDevRow(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= devRows.length) return;
  const tmp = devRows[i]; devRows[i] = devRows[j]; devRows[j] = tmp;
  drawDevGrid();
}
function removeDevRow(i) {
  // 清空欄位即可：儲存時後端會把空白列(含既有 RowID)刪掉
  devRows[i] = { RowID: devRows[i].RowID, Department: '', TargetLineCode: '', Amount: '', Currency: 'TWD', ChallengeReductionPct: '', Notes: '' };

  scheduleDevTargetsPreview_();
}

    .withSuccessHandler(safeHandler(summary => {

/* ================= 儀表板：多車型 / 多情境比較 ================= */
let comparisonOptions = [];
let comparisonSelections = [];
let lastComparison = null;
let dashPrefsLoaded_ = false;
let dashView = 'table';               // 目前顯示哪個子頁：'columns' 比較欄位 / 'table' 損益表 / 'chart' 圖表 / 'diff' 差異比較
// 新增比較欄位那一列還沒送出的草稿(車型/情境/車系)，跟已經加入的 comparisonSelections 分開放
let builderDraft_ = { vehicleTypeId: '', scenarioId: '', vehicleId: '' };

function loadComparisonPicker() {
  google.script.run
    .withSuccessHandler(safeHandler(options => {
      comparisonOptions = options || [];
      // 第一次進儀表板先把上次的比較欄位/顯示設定從瀏覽器還原回來(見 loadDashPrefs_)，
      // 不必每次打開都重新加一遍欄位；已被刪掉的情境/車系會被濾掉。
      if (!dashPrefsLoaded_) { loadDashPrefs_(); dashPrefsLoaded_ = true; }
      comparisonSelections = comparisonSelections.filter(selectionExists_);
      // 上方選了哪個情境，儀表板就該看得到那個情境 —— 不管是第一次進來(還沒加任何比較欄位)，
      // 還是已經加過其他欄位、中途把上方情境切到別的(如切去改「目標」的開發總投再回來看儀表板)，
      // 只要目前選的情境還沒被加進來，就補一欄「加權平均」；只新增不刪除，不會把使用者原本
      // 排好的比較欄位洗掉，也不會重複加(已經有這個情境的欄位就不動)。
      if (currentScenarioId && !comparisonSelections.some(s => s.ScenarioID === currentScenarioId)) {
        comparisonSelections.push({ ScenarioID: currentScenarioId, VehicleID: '' });
      }
      if (!comparisonSelections.length) dashView = 'columns';   // 還沒有任何比較欄位時，直接停在「比較欄位」頁面
      // 進儀表板一律重新跟後端要一次：其他分頁可能剛改過成本/費用，快取在手上的舊結果不能信
      refreshDashboard(true);
    }))
    .withFailureHandler(showGlobalError)
    .getComparisonOptions();
}

/** 這組(情境,車系)在目前的選項樹裡還存在嗎？情境或車系被刪掉後，記住的比較欄位就不該再出現 */
function selectionExists_(sel) {
  return comparisonOptions.some(t =>
    t.scenarios.some(s => s.ScenarioID === sel.ScenarioID) &&
    (!sel.VehicleID || t.vehicles.some(v => v.VehicleID === sel.VehicleID)));
}

/**
 * 建構比較欄位：整張表都是下拉選單，改哪一列就直接換那一欄要比的資料 ——
 * 跟系統其他頁面「表格式編輯」的慣例一致，不再另外用一組獨立的挑選器 + 卡片列表。
 * 最後一列永遠是「新增」列，選好車型/情境/車系後按「加入」才會變成一個真正的比較欄位。
 */
function comparisonBuilderHtml_() {
  if (!comparisonOptions.length) return '<p class="muted">尚無車型資料，請先在「車型主檔」建立車型。</p>';
  if (!builderDraft_.vehicleTypeId || !comparisonOptions.some(t => t.VehicleTypeID === builderDraft_.vehicleTypeId)) {
    builderDraft_.vehicleTypeId = comparisonOptions[0].VehicleTypeID;
    builderDraft_.scenarioId = ''; builderDraft_.vehicleId = '';
  }
  const draftType = comparisonOptions.find(t => t.VehicleTypeID === builderDraft_.vehicleTypeId);
  if (!draftType.scenarios.some(s => s.ScenarioID === builderDraft_.scenarioId)) {
    builderDraft_.scenarioId = (draftType.scenarios[0] && draftType.scenarios[0].ScenarioID) || '';
  }
  if (builderDraft_.vehicleId && !draftType.vehicles.some(v => v.VehicleID === builderDraft_.vehicleId)) {
    builderDraft_.vehicleId = '';
  }

  const rows = comparisonSelections.map((sel, i) => builderRowHtml_(sel, i)).join('');
  return `
    <p class="muted">每一列是一個比較欄位（車型 × 情境 × 車系）。改下拉選單直接換這一欄要比的資料，
      用箭頭或拖曳調整順序；最後一列選好之後按「加入」新增一欄。</p>
    <div class="grid-scroll"><table class="grid-table builder-table">
      <thead><tr><th></th><th>車型</th><th>情境</th><th>車系</th><th></th></tr></thead>
      <tbody id="builder-rows">
        ${rows}
        ${builderNewRowHtml_(draftType)}
      </tbody>
    </table></div>
    ${comparisonSelections.length ? `<div class="toolbar"><button type="button" class="btn secondary" onclick="clearComparisonColumns()">全部清除</button></div>` : ''}
  `;
}

function builderRowHtml_(sel, i) {
  const type = comparisonOptions.find(t => t.scenarios.some(s => s.ScenarioID === sel.ScenarioID));
  const typeId = type ? type.VehicleTypeID : '';
  const scenarios = type ? type.scenarios : [];
  const vehicles = type ? type.vehicles : [];
  return `<tr draggable="true" data-idx="${i}"
      ondragstart="onRowDragStart_(event, ${i})" ondragover="onRowDragOver_(event)"
      ondrop="onRowDrop_(event, ${i})" ondragend="onRowDragEnd_(event)">
    <td class="row-actions">
      <span class="chip-handle" data-tip="拖曳調整順序">⠿</span>
      <button type="button" class="row-move" data-tip="往上移" ${i === 0 ? 'disabled' : ''}
        onclick="moveComparisonColumn(${i}, -1)">▲</button>
      <button type="button" class="row-move" data-tip="往下移" ${i === comparisonSelections.length - 1 ? 'disabled' : ''}
        onclick="moveComparisonColumn(${i}, 1)">▼</button>
    </td>
    <td><select onchange="onBuilderRowTypeChange_(${i}, this.value)">
      ${comparisonOptions.map(t => `<option value="${esc(t.VehicleTypeID)}"${t.VehicleTypeID === typeId ? ' selected' : ''}>${esc(t.VehicleTypeID)}</option>`).join('')}
    </select></td>
    <td><select onchange="onBuilderRowScenarioChange_(${i}, this.value)">
      ${scenarios.map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === sel.ScenarioID ? ' selected' : ''}>${esc(scenarioLabel(s))}</option>`).join('')}
    </select></td>
    <td><select onchange="onBuilderRowVehicleChange_(${i}, this.value)">
      <option value=""${!sel.VehicleID ? ' selected' : ''}>加權平均</option>
      ${vehicles.map(v => `<option value="${esc(v.VehicleID)}"${v.VehicleID === sel.VehicleID ? ' selected' : ''}>${esc(v.VehicleCode || v.VehicleID)}</option>`).join('')}
    </select></td>
    <td class="row-actions"><button type="button" class="btn danger" onclick="removeComparisonColumn(${i})">✕</button></td>
  </tr>`;
}

function builderNewRowHtml_(draftType) {
  const scenarios = draftType ? draftType.scenarios : [];
  const vehicles = draftType ? draftType.vehicles : [];
  return `<tr class="builder-new-row">
    <td class="row-actions muted">+</td>
    <td><select onchange="onBuilderDraftChange_('vehicleTypeId', this.value)">
      ${comparisonOptions.map(t => `<option value="${esc(t.VehicleTypeID)}"${t.VehicleTypeID === builderDraft_.vehicleTypeId ? ' selected' : ''}>${esc(t.VehicleTypeID)}</option>`).join('')}
    </select></td>
    <td>${scenarios.length ? `<select onchange="onBuilderDraftChange_('scenarioId', this.value)">
      ${scenarios.map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === builderDraft_.scenarioId ? ' selected' : ''}>${esc(scenarioLabel(s))}</option>`).join('')}
    </select>` : '<span class="muted">(此車型尚無情境)</span>'}</td>
    <td><select onchange="onBuilderDraftChange_('vehicleId', this.value)">
      <option value=""${!builderDraft_.vehicleId ? ' selected' : ''}>加權平均</option>
      ${vehicles.map(v => `<option value="${esc(v.VehicleID)}"${v.VehicleID === builderDraft_.vehicleId ? ' selected' : ''}>${esc(v.VehicleCode || v.VehicleID)}</option>`).join('')}
    </select></td>
    <td class="row-actions">
      <button type="button" class="btn" ${scenarios.length ? '' : 'disabled'} onclick="addComparisonColumn()" data-tip="把這一欄加入比較">加入</button>
      <button type="button" class="btn secondary" ${scenarios.length ? '' : 'disabled'}
        onclick="addAllVehiclesOfScenario()" data-tip="把這個情境底下所有車系(含加權平均)都加入">全部車系</button>
    </td>
  </tr>`;
}

function onBuilderDraftChange_(field, value) {
  builderDraft_[field] = value;
  if (field === 'vehicleTypeId') { builderDraft_.scenarioId = ''; builderDraft_.vehicleId = ''; }
  if (field === 'scenarioId') { builderDraft_.vehicleId = ''; }
  rerenderCurrentView_();
}

/** 編輯已加入的比較欄位：換車型等於整欄換掉，情境/車系跟著重選第一個 */
function onBuilderRowTypeChange_(i, typeId) {
  const type = comparisonOptions.find(t => t.VehicleTypeID === typeId);
  const scenarioId = (type && type.scenarios[0] && type.scenarios[0].ScenarioID) || '';
  applyBuilderEdit_(i, { ScenarioID: scenarioId, VehicleID: '' });
}
function onBuilderRowScenarioChange_(i, scenarioId) {
  applyBuilderEdit_(i, { ScenarioID: scenarioId, VehicleID: comparisonSelections[i].VehicleID });
}
function onBuilderRowVehicleChange_(i, vehicleId) {
  applyBuilderEdit_(i, { ScenarioID: comparisonSelections[i].ScenarioID, VehicleID: vehicleId });
}
/** 套用一列的編輯結果；如果改完會跟另一欄重複，就擋下來、把選單復原成原本的值 */
function applyBuilderEdit_(i, next) {
  if (comparisonSelections.some((s, j) => j !== i && s.ScenarioID === next.ScenarioID && s.VehicleID === next.VehicleID)) {
    showGlobalError('這個比較欄位已經加入過了。');
    rerenderCurrentView_();
    return;
  }
  comparisonSelections[i] = next;
  refreshDashboard();
}

function addComparisonColumn() {
  if (!builderDraft_.scenarioId) { showGlobalError('此車型尚無情境，請先在「情境設定」建立情境。'); return; }
  pushSelection(builderDraft_.scenarioId, builderDraft_.vehicleId);
  refreshDashboard();
}

/** 一次把某情境底下所有車系都加進來比較（常用：看單一情境各車系的差異） */
function addAllVehiclesOfScenario() {
  const type = comparisonOptions.find(t => t.VehicleTypeID === builderDraft_.vehicleTypeId);
  if (!builderDraft_.scenarioId || !type) return;
  type.vehicles.forEach(v => pushSelection(builderDraft_.scenarioId, v.VehicleID));
  pushSelection(builderDraft_.scenarioId, '');
  refreshDashboard();
}

function pushSelection(scenarioId, vehicleId) {
  if (comparisonSelections.some(s => s.ScenarioID === scenarioId && s.VehicleID === vehicleId)) return;
  comparisonSelections.push({ ScenarioID: scenarioId, VehicleID: vehicleId });
}

function removeComparisonColumn(idx) {
  comparisonSelections.splice(idx, 1);
  refreshDashboard();
}
function clearComparisonColumns() {
  comparisonSelections = [];
  refreshDashboard();
}

/**
 * 比較欄位排序可自訂：交換陣列順序後重畫。
 * 已經算好的欄位不必再跟後端要一次 —— refreshDashboard() 會依 comparisonSelections 的順序
 * 從 lastComparison 裡挑出對應的欄位(reorderComparison_)，只有新加進來、還沒算過的欄位才送後端。
 */
function moveComparisonColumn(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= comparisonSelections.length) return;
  const tmp = comparisonSelections[idx];
  comparisonSelections[idx] = comparisonSelections[target];
  comparisonSelections[target] = tmp;
  refreshDashboard();
}

/* ---- 比較欄位可直接拖曳整列調整順序，比只能按上下箭頭一次一步更直覺 ---- */
let dragRowFrom_ = null;
function onRowDragStart_(e, i) {
  dragRowFrom_ = i;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function onRowDragOver_(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function onRowDrop_(e, i) {
  e.preventDefault();
  if (dragRowFrom_ === null || dragRowFrom_ === i) return;
  const [moved] = comparisonSelections.splice(dragRowFrom_, 1);
  comparisonSelections.splice(i, 0, moved);
  dragRowFrom_ = null;
  refreshDashboard();
}
function onRowDragEnd_() {
  dragRowFrom_ = null;
  const box = document.getElementById('builder-rows');
  if (box) box.querySelectorAll('tr.dragging').forEach(el => el.classList.remove('dragging'));
}

/* ---- 儀表板顯示選項（切換時只重畫，不重算；全部記在瀏覽器裡，下次打開還在） ---- */
let pctBase = 'exfactory';            // 第二小欄：'exfactory' 對廠價% / 'revenue' 對收入% / 'diff' 與基準差異 / 'diffpct' 與基準差異% / 'none'
let showPriceStructure = true;        // 是否顯示 P1~P9 售價結構
let chartLineCodes = ['A', 'K'];      // 「科目比較」圖要畫哪幾個科目
let collapsedGroups = new Set();      // 目前收合中的大項(B/E/G/I)，切換 % 基準等重畫時要保留住
let diffPairs = [];                   // 使用者自己選的差異比較組合 [{aKey, bKey}]，key 見 colKey_()
let baselineKey = '';                 // 比較基準欄位(colKey_)；空字串 = 不設定比較基準
let amountUnit = 1;                   // 金額單位：1 = 元、1000 = 千元
let volumeBasis = 'unit';             // 金額基礎：'unit' 單台 / 'year' 年度總額(×月銷量×12) / 'lc' LC 總額(×LC 總台數)
let highlightBest = false;            // 每一列標示最佳/最差的欄位
let showKpi = true;                   // 顯示重點指標卡片
let chartType = 'byLine';             // 'byLine' 科目比較(橫軸=科目) / 'byColumn' (橫軸=比較欄位) / 'structure' 損益結構 / 'waterfall' 損益瀑布
let chartValue = 'amount';            // 圖表數值：'amount' 金額 / 'pct' 百分比
let chartLabels = true;               // 圖上顯示數值標籤

const DASH_PREFS_KEY_ = 'plDashboard.prefs.v1';
function dashPrefsSnapshot_() {
  return {
    selections: comparisonSelections, diffPairs, pctBase, showPriceStructure, chartLineCodes,
    baselineKey, amountUnit, volumeBasis, highlightBest, showKpi, chartType, chartValue, chartLabels,
    dashView, collapsed: Array.from(collapsedGroups)
  };
}
function saveDashPrefs_() {
  try { localStorage.setItem(DASH_PREFS_KEY_, JSON.stringify(dashPrefsSnapshot_())); } catch (e) { /* 無痕模式等情況存不了就算了 */ }
}
function loadDashPrefs_() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(DASH_PREFS_KEY_) || 'null'); } catch (e) { p = null; }
  if (!p || typeof p !== 'object') return;
  if (Array.isArray(p.selections)) comparisonSelections = p.selections.filter(s => s && s.ScenarioID).map(s => ({ ScenarioID: String(s.ScenarioID), VehicleID: String(s.VehicleID || '') }));
  if (Array.isArray(p.diffPairs)) diffPairs = p.diffPairs.filter(d => d && d.aKey && d.bKey);
  if (['exfactory', 'revenue', 'diff', 'diffpct', 'none'].indexOf(p.pctBase) !== -1) pctBase = p.pctBase;
  if (typeof p.showPriceStructure === 'boolean') showPriceStructure = p.showPriceStructure;
  if (Array.isArray(p.chartLineCodes) && p.chartLineCodes.length) chartLineCodes = p.chartLineCodes.map(String);
  if (typeof p.baselineKey === 'string') baselineKey = p.baselineKey;
  if (p.amountUnit === 1 || p.amountUnit === 1000) amountUnit = p.amountUnit;
  if (['unit', 'year', 'lc'].indexOf(p.volumeBasis) !== -1) volumeBasis = p.volumeBasis;
  if (typeof p.highlightBest === 'boolean') highlightBest = p.highlightBest;
  if (typeof p.showKpi === 'boolean') showKpi = p.showKpi;
  if (['byLine', 'byColumn', 'structure', 'waterfall'].indexOf(p.chartType) !== -1) chartType = p.chartType;
  if (p.chartValue === 'amount' || p.chartValue === 'pct') chartValue = p.chartValue;
  if (typeof p.chartLabels === 'boolean') chartLabels = p.chartLabels;
  if (['columns', 'table', 'chart', 'diff'].indexOf(p.dashView) !== -1) dashView = p.dashView;
  if (Array.isArray(p.collapsed)) collapsedGroups = new Set(p.collapsed.map(String));
}

/** 工具列上的每一個開關都走這裡：改狀態 → 記住 → 重畫（不重算） */
function setDashOption(name, value) {
  switch (name) {
    case 'pctBase': pctBase = value; break;
    case 'showPriceStructure': showPriceStructure = !!value; break;
    case 'amountUnit': amountUnit = Number(value) === 1000 ? 1000 : 1; break;
    case 'volumeBasis': volumeBasis = value; break;
    case 'highlightBest': highlightBest = !!value; break;
    case 'showKpi': showKpi = !!value; break;
    case 'chartType': chartType = value; break;
    case 'chartValue': chartValue = value; break;
    case 'chartLabels': chartLabels = !!value; break;
    default: return;
  }
  saveDashPrefs_();
  if (lastComparison) renderDashboard(lastComparison);
}
function setPctBase(v) { setDashOption('pctBase', v); }
function setShowPriceStructure(v) { setDashOption('showPriceStructure', v); }

/**
 * 設定比較基準欄位（表格第二小欄的「與基準差異」、重點指標卡片的 vs 基準都以它為準）。
 * 比較基準不是必要的 —— 沒設定就是沒有，不會偷偷預設成第一欄；再點一次目前的基準會取消設定。
 */
function setBaselineColumn(key) {
  key = key || '';
  baselineKey = (key && key === baselineKey) ? '' : key;
  saveDashPrefs_();
  rerenderCurrentView_();
}

/** 比較欄位的唯一鍵值：情境+車系（跟 comparisonSelections 是同一組資料，只是換一種查法） */
function colKey_(col) {
  return (col.scenarioId || '') + '|' + (col.vehicleId || '');
}
/**
 * 星星按鈕改用「第幾欄」而不是把 colKey_ 直接寫進 onclick 的字串裡。
 * 車系代號是使用者自己輸入的，裡面只要有一個單引號(如 Driver's Van)就會把
 * onclick="setBaselineColumn('...')" 的 JS 字串截斷 —— 而且 esc() 也救不了：
 * HTML 屬性裡的實體(&#39;)會先被解碼、才輪到 JS 解析，等於原封不動把引號送進去。
 * 索引是程式自己產生的數字，沒有這個問題。
 */
function setBaselineColumnAt(i) {
  const col = lastComparison && (lastComparison.columns || [])[i];
  if (col) setBaselineColumn(colKey_(col));
}
function selKey_(sel) {
  return (sel.ScenarioID || '') + '|' + (sel.VehicleID || '');
}

/**
 * 重新取得比較結果。
 * force = true：整份重新跟後端算(進儀表板、按「重新計算」)。
 * 否則只把「還沒算過」的欄位送後端，算回來後併進手上的結果(mergeComparison_)；
 * 純粹調整順序或移除欄位完全不打後端。Apps Script 每一次呼叫都要一兩秒，
 * 加一欄就把全部欄位重算一次，欄位一多會越加越慢。
 */
let dashRequestSeq_ = 0;
function refreshDashboard(force) {
  if (!comparisonOptions.length) { loadComparisonPicker(); return; }
  saveDashPrefs_();
  if (!comparisonSelections.length) {
    lastComparison = { columns: [], lines: [] };
    setDashStatus_('');
    renderDashboard(lastComparison);
    return;
  }
  const known = (!force && lastComparison) ? (lastComparison.columns || []) : [];
  const missing = comparisonSelections.filter(sel => !known.some(c => colKey_(c) === selKey_(sel)));
  if (!missing.length) {
    lastComparison = reorderComparison_(lastComparison, comparisonSelections);
    renderDashboard(lastComparison);
    return;
  }
  const seq = ++dashRequestSeq_;
  if (force || !lastComparison) setDashViewHtml_('<p class="muted">計算中...</p>');
  setDashStatus_(force ? '計算中…' : `計算新增的 ${missing.length} 個欄位…`);
  google.script.run
    .withSuccessHandler(safeHandler(result => {
      // 比這次更晚送出的請求已經在路上了，舊的結果一律丟掉(不分整份重算或只算新增欄位)：
      // 較新的那次請求的 missing 是照「目前手上已經有哪幾欄」算出來的，一定涵蓋舊請求要算的欄位，
      // 丟掉不會少算，反而是讓晚回來的舊結果蓋回去才會把新資料改回舊數字。
      if (seq !== dashRequestSeq_) return;
      setDashStatus_('');
      lastComparison = force ? result : mergeComparison_(lastComparison, result);
      lastComparison = reorderComparison_(lastComparison, comparisonSelections);
      renderDashboard(lastComparison);
    }))
    .withFailureHandler(err => {
      if (seq !== dashRequestSeq_) return;
      setDashStatus_('');
      // 只換子頁籤的內容，不能把整個 dashboard-content 洗掉 —— 子頁籤列跟「重新計算」都在裡面，
      // 洗掉之後使用者就沒有任何入口可以去「比較欄位」把算不出來的那一欄移除了
      // (比較欄位記在 localStorage，重新整理也還在，等於整個儀表板從此打不開)。
      setDashViewHtml_('<p class="status-msg err">計算失敗：' + esc(err && err.message ? err.message : err) +
        '</p><p class="muted">請切到「比較欄位」把算不出來的那一欄移除或改選（例如該車系在這個情境沒有銷售構成資料）。</p>');
    })
    .calculateComparison(force ? comparisonSelections : missing);
}
function setDashStatus_(text) {
  const el = document.getElementById('dash-status');
  if (el) el.textContent = text || '';
}

/** 只換子頁籤的內容區；外框(子頁籤列)還沒畫過就先補畫一次，之後一律只動內容 */
function setDashViewHtml_(html) {
  const view = document.getElementById('dash-view');
  if (view) { view.innerHTML = html; return; }
  const content = document.getElementById('dashboard-content');
  if (content) content.innerHTML = `${dashSubNavHtml((lastComparison && lastComparison.columns) || [])}<div id="dash-view">${html}</div>`;
}

/** 把後端新算回來的欄位併進手上的結果：同鍵值的欄位以新的為準，科目取聯集後照 SortOrder 排 */
function mergeComparison_(base, add) {
  if (!base) return add;
  const cols = (base.columns || []).slice();
  (add.columns || []).forEach(c => {
    const at = cols.findIndex(x => colKey_(x) === colKey_(c));
    if (at === -1) cols.push(c); else cols[at] = c;
  });
  const lines = (base.lines || []).slice();
  (add.lines || []).forEach(l => { if (!lines.some(x => x.LineCode === l.LineCode)) lines.push(l); });
  lines.sort((a, b) => (Number(a.SortOrder) || 0) - (Number(b.SortOrder) || 0));
  return Object.assign({}, base, { columns: cols, lines: lines });
}

/** 依目前的比較欄位順序挑出對應的欄位；沒有任何欄位有數字的科目不再列出(跟後端的規則一致) */
function reorderComparison_(result, selections) {
  if (!result) return result;
  const cols = selections.map(sel => (result.columns || []).find(c => colKey_(c) === selKey_(sel))).filter(c => c);
  const lines = (result.lines || []).filter(l => cols.some(c => c.amounts[l.LineCode] !== undefined && c.amounts[l.LineCode] !== null));
  return Object.assign({}, result, { columns: cols, lines: lines });
}

/**
 * 儀表板拆成四個子頁籤，一次只專心看一件事，不再把建構欄位/損益表/圖表/差異比較全部疊在同一頁：
 *   比較欄位 — 加入/調整要比較的車型×情境×車系
 *   損益表   — 主表格 + 重點指標卡片 + 小計驗算
 *   圖表     — 四種柱狀圖
 *   差異比較 — 使用者自選兩欄的差異卡片
 * 子頁籤本身也記在瀏覽器裡，下次打開還在同一頁。
 */
function renderDashboard(result) {
  const content = document.getElementById('dashboard-content');
  const cols = (result && result.columns) || [];
  const lines = (result && result.lines) || [];

  // 重畫會把整個內容換掉：正在顯示的提示要收掉、表格的橫向捲動位置要留住
  hideTooltip_();
  const oldScroller = content.querySelector('.grid-scroll');
  const scrollLeft = oldScroller && oldScroller.scrollLeft ? oldScroller.scrollLeft : 0;

  content.innerHTML = `${dashSubNavHtml(cols)}<div id="dash-view">${dashViewHtml_(cols, lines)}</div>`;
  const scroller = content.querySelector('.grid-scroll');
  if (scroller && scrollLeft) scroller.scrollLeft = scrollLeft;
  installTableCrosshair_(content);
}

/** 沒有 lastComparison(還沒算過、或選過又清空)時也能安全重畫目前這一頁 */
function rerenderCurrentView_() {
  renderDashboard(lastComparison || { columns: [], lines: [] });
}

function dashSubNavHtml(cols) {
  const tabs = [
    ['columns', '比較欄位' + (cols.length ? `（${cols.length}）` : '')],
    ['table', '損益表'],
    ['chart', '圖表'],
    ['diff', '差異比較']
  ];
  return `
    <div class="dash-subnav">
      ${tabs.map(([key, label]) => `<button type="button" class="dash-subnav-btn${dashView === key ? ' active' : ''}"
          onclick="setDashView('${key}')">${esc(label)}</button>`).join('')}
      <span class="dash-subnav-status" id="dash-status"></span>
      <button type="button" class="btn secondary dash-subnav-refresh" onclick="refreshDashboard(true)"
        data-tip="整份重新跟後端計算（平常加入欄位只算新加的那幾欄）">重新計算</button>
    </div>`;
}
function setDashView(key) {
  dashView = key;
  saveDashPrefs_();
  rerenderCurrentView_();
}

function dashViewHtml_(cols, lines) {
  if (dashView === 'columns') return comparisonBuilderHtml_();
  if (!cols.length) return '<p class="muted">請先切到「比較欄位」加入至少一個比較欄位。</p>';
  if (dashView === 'chart') return chartSectionHtml(cols, lines);
  if (dashView === 'diff') return diffSectionHtml_(cols, lines);
  return tableViewHtml_(cols, lines);
}

function tableViewHtml_(cols, lines) {
  return `
    ${dashboardToolbarHtml(cols)}
    ${subtotalCheckHtml(cols)}
    ${kpiStripHtml(cols, lines)}
    <div id="csv-output" style="display:none;"></div>
    <div class="table-meta">${tableMetaText_(cols)}</div>
    <div class="grid-scroll" id="pl-table-wrap">${plTableHtml(cols, lines)}</div>
  `;
}

/** 只重畫損益表本體（收合大項用）：卡片不動，表格的捲動位置也不動 */
function rerenderTable_() {
  if (!lastComparison) return;
  const wrap = document.getElementById('pl-table-wrap');
  if (!wrap) { rerenderCurrentView_(); return; }
  hideTooltip_();
  wrap.innerHTML = plTableHtml(lastComparison.columns || [], lastComparison.lines || []);
}

/* ---- 金額的顯示口徑：單位(元/千元) × 基礎(單台/年度/LC 總額) ---- */
function basisFactor_(col) {
  const v = (col && col.volume) || {};
  if (volumeBasis === 'year') return (Number(v.monthlyVolume) || 0) * 12;
  if (volumeBasis === 'lc') return Number(v.units) || 0;
  return 1;
}
/** 表格/圖表/卡片一律用這個把後端的單台金額換成畫面上要顯示的數字 */
function displayAmount_(v, col) {
  return Number(v) * basisFactor_(col) / amountUnit;
}
function unitLabel_() { return amountUnit === 1000 ? '千元' : '元'; }
function basisLabel_() {
  return volumeBasis === 'year' ? '年度總額' : volumeBasis === 'lc' ? 'LC 總額' : '單台';
}
function basisFormula_(col) {
  const v = (col && col.volume) || {};
  if (volumeBasis === 'year') return `單台 × 月銷量 ${fmt(v.monthlyVolume)} 台 × 12`;
  if (volumeBasis === 'lc') return `單台 × LC 總台數 ${fmt(v.units)} 台`;
  return '';
}
function pctBaseOf_(col) {
  return pctBase === 'revenue' ? Number(col.revenue) : Number(col.exFactoryPrice);
}
function pctBaseName_() {
  return pctBase === 'revenue' ? '對收入' : '對廠價';
}
/**
 * 帶正負號的差異顯示：+1,234 / -1,234。
 * 四捨五入到指定小數位後如果變成 0、但其實不是真的 0(常見於「千元」單位下差幾百元)，
 * 就多留幾位小數，最多到 3 位 —— 不然使用者會看到一排「vs 基準 +0」，
 * 以為這個功能沒作用，其實只是差異被四捨五入蓋掉了。
 */
function signed_(v, digits) {
  const n = Number(v) || 0;
  if (n === 0) return '0';
  let d = digits === undefined ? 0 : digits;
  const maxD = d + 3;
  while (d < maxD && Number(n.toFixed(d)) === 0) d++;
  return (n > 0 ? '+' : '') + fmt(n, d);
}
function tableMetaText_(cols) {
  const parts = [`金額單位：${unitLabel_()}`, `基礎：${basisLabel_()}`];
  if (pctBase === 'exfactory' || pctBase === 'revenue') parts.push(`第二欄：${pctBaseName_()}%`);
  if (pctBase === 'diff' || pctBase === 'diffpct') {
    const b = baselineCol_(cols);
    parts.push(b
      ? `第二欄：與基準（${b.label}）的${pctBase === 'diffpct' ? '差異%' : '差異'}`
      : '尚未設定比較基準，第二欄先顯示「—」（用上面的「比較基準」下拉選單或欄位標題的 ☆ 設定）');
  }
  if (highlightBest && cols.length > 1) parts.push('▲ 該列最佳　▼ 該列最差');
  return parts.map(esc).join('　・　');
}

/**
 * 這個科目「越高越好」還是「越低越好」：收入/毛利/淨利越高越好，成本與費用越低越好。
 * 表格的最佳/最差標示、與基準差異的顏色、差異柱狀圖的紅綠都用這一個判斷，口徑一致。
 * 售價結構(P1~P9)沒有好壞可言，回傳 null。
 */
function lineBetter_(line) {
  if (!line || line.isPriceStructure) return null;
  if (line.ParentLine || line.LineCode === 'B' || line.LineCode === 'J') return 'low';
  if (['A', 'C', 'E', 'G', 'I', 'K'].indexOf(line.LineCode) !== -1) return 'high';
  return null;
}
/** 差異是好是壞：'good' / 'bad' / ''（沒有方向或沒有差異） */
function deltaTone_(line, delta) {
  const better = lineBetter_(line);
  if (!better || !delta) return '';
  return (delta > 0) === (better === 'high') ? 'good' : 'bad';
}

/** 目前的比較基準欄位；不一定要設，沒設定就回傳 null(不會偷偷預設成第一欄) */
function baselineCol_(cols) {
  if (!baselineKey) return null;
  return (cols || []).find(c => colKey_(c) === baselineKey) || null;
}

  return `

        <select onchange="setBaselineColumn(this.value)">
