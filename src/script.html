/**
 * 表格編輯頁的資料快取：切分頁很常常常是「切回剛剛看過的那頁」，
 * 每次都重新跟後端要資料會讓畫面先空白一下才畫出來，感覺卡頓。
 * 有快取就先用快取立刻畫出來，同時仍照常在背景重新取一次最新資料、拿到後才重畫，
 * 兩次畫面之間使用者已經看得到內容，不再面對空白等待。
 */
const panelDataCache_ = {};
/**
 * scope 決定這個快取鍵要不要跟著車型/情境變動：
 * 'none' 兩者都跟資料無關（如車型主檔、科目設定 —— 全系統共用一份）、
 * 'vehicleType' 只跟車型有關（如車系設定 —— 情境換了不影響）、
 * 'scenario' 只跟情境有關（如開發總投 —— 車型換了情境也會跟著清空，不必重複區分）、
 * 省略或 'both' 則兩者都要區分（如銷售構成、銷貨成本）。
 * 沒分清楚的話，資料明明沒變，換一下情境或車型就會讓不相關頁面的快取失效，
 * 切回去時又要空等一次伺服器回應，感覺像整頁重新載入。
 */
function panelCacheKey_(prefix, scope) {
  const vt = (scope === 'none' || scope === 'scenario') ? '' : currentVehicleTypeId;
  const sc = (scope === 'none' || scope === 'vehicleType') ? '' : currentScenarioId;
  return prefix + '::' + vt + '::' + sc;
}
// 靜默模式：初始化(或切換車型)時會連續設定車型/情境，每一步都重繪會造成
// 同一個分頁被畫三、四次、也重複打伺服器。開啟後只更新狀態不渲染，最後統一渲染一次。
let silent = false;

/* ---------------- 共用工具 ---------------- */
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(v, digits) {
  if (v === '' || v === null || v === undefined) return '';
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: digits === undefined ? 0 : digits });
}
/** 科目名稱/備註等使用者輸入會被塞進 HTML，& < > " 都要轉義，否則表格會被破壞 */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function showGlobalError(err) {
  const box = document.getElementById('global-error');
  const msg = '發生錯誤：' + (err && err.message ? err.message : err);
  console.error(err);
  if (!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}
function clearGlobalError() {
  const box = document.getElementById('global-error');
  if (box) box.style.display = 'none';
}
/** 包住 success handler：伺服器呼叫成功後前端渲染若丟例外，也要顯示在畫面上 */
function safeHandler(fn) {
  return function () {
    try { clearGlobalError(); return fn.apply(null, arguments); }
    catch (e) { showGlobalError(e); }
  };
}
/** 狀態訊息：處理中的文字留在頁面上；成功/失敗另外跳 toast(看得到又不會一直佔位置) */
function setStatus(key, text, cls) {
  const el = document.getElementById('status-' + key);
  if (el) {
    el.textContent = cls ? '' : text;
    el.className = 'status-msg';
  }
  if (cls === 'ok') toast(text, 'ok');
  else if (cls === 'err') toast(String(text).replace(/^錯誤：/, ''), 'err');
}
/** 表格編輯頁的共用外框：標題 + 工具列 + 狀態 + 內容 */

function emptyStateHtml(icon, title, text, actionHtml) {

}

/* ================= v2 共用介面元件：Toast / 對話框 / 未儲存提醒 / 拖曳排序 ================= */

/** 右上角短暫提示：儲存成功、錯誤等不必停在畫面上的訊息 */
function toast(text, kind, ms) {
  const box = document.getElementById('toasts');
  if (!box || !text) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 250); }, ms || (kind === 'err' ? 6000 : 2600));
}

/**
 * 對話框：取代瀏覽器的 prompt()/confirm()（那兩個長得很突兀、不能放說明、也不能一次問好幾個欄位）。
 * openModal({ title, body(HTML), okText, danger, wide, fields:[{name,label,value,type,options,help,placeholder}] })
 * 回傳 Promise：按確定 → 欄位值物件(沒有欄位就是 true)；按取消/Esc → null。
 */
function openModal(opts) {
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'modal' + (opts.wide ? ' wide' : '');
    const fields = opts.fields || [];
    const fieldHtml = fields.map((f, i) => {
      const id = 'mf-' + i;
      let input;
      if (f.type === 'select') {
        input = `<select id="${id}">${(f.options || []).map(o => {
          const [v, t] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(v)}"${String(v) === String(f.value || '') ? ' selected' : ''}>${esc(t)}</option>`;
        }).join('')}</select>`;
      } else if (f.type === 'textarea') {
        input = `<textarea id="${id}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`;
      } else if (f.type === 'checks') {
        input = `<div class="chip-list" id="${id}">${(f.options || []).map(o => `<label class="chk"><input type="checkbox" value="${esc(o[0])}"${(f.value || []).indexOf(o[0]) !== -1 ? ' checked' : ''}> ${esc(o[1])}</label>`).join('')}</div>`;
      } else {
        input = `<input id="${id}" type="${f.type || 'text'}" step="any" value="${esc(f.value === undefined ? '' : f.value)}" placeholder="${esc(f.placeholder || '')}">`;
      }
      return `<label class="field"><span>${esc(f.label)}</span>${input}${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</label>`;
    }).join('');
    dlg.innerHTML = `
      <form method="dialog">
        <div class="modal-head"><h3>${esc(opts.title || '')}</h3></div>
        <div class="modal-body">${opts.body || ''}${fieldHtml}</div>
        <div class="modal-foot">
          ${opts.noCancel ? '' : `<button type="button" class="btn secondary" value="cancel">${esc(opts.cancelText || '取消')}</button>`}
          <button type="submit" class="btn${opts.danger ? ' danger solid' : ''}" value="ok">${esc(opts.okText || '確定')}</button>
        </div>
      </form>`;
    document.body.appendChild(dlg);
    let done = false;
    const finish = val => { if (done) return; done = true; dlg.close(); dlg.remove(); resolve(val); };
    dlg.querySelector('button[value=cancel]') && dlg.querySelector('button[value=cancel]').addEventListener('click', () => finish(null));
    dlg.addEventListener('cancel', e => { e.preventDefault(); finish(null); });
    dlg.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      if (!fields.length) { finish(true); return; }
      const out = {};
      fields.forEach((f, i) => {
        const el = dlg.querySelector('#mf-' + i);
        out[f.name] = f.type === 'checks' ? Array.from(el.querySelectorAll('input:checked')).map(x => x.value) : el.value;
      });
      if (opts.validate) {
        const msg = opts.validate(out);
        if (msg) { toast(msg, 'err'); return; }
      }
      finish(out);
    });
    dlg.showModal();
    const first = dlg.querySelector('input,select,textarea');
    if (first) { first.focus(); if (first.select) first.select(); }
  });
}
function confirmModal(title, body, okText, danger) {
  return openModal({ title, body: `<p>${body}</p>`, okText: okText || '確定', danger: !!danger });
}

/**
 * 未儲存的修改：表格編輯頁一改東西就在畫面底部浮出「有尚未儲存的修改」+ 儲存/放棄，
 * 不必回到頁首找儲存鈕；Ctrl+S 也能存。切換分頁/車型/情境、關閉視窗前會先確認，不會默默把改到一半的東西丟掉。
 */
let dirtyState_ = null;   // { key, save, discard, count }
function markDirty(key, save, discard) {
  if (!dirtyState_ || dirtyState_.key !== key) dirtyState_ = { key, save, discard, count: 0 };
  dirtyState_.save = save; dirtyState_.discard = discard || dirtyState_.discard;
  dirtyState_.count++;
  const bar = document.getElementById('savebar');
  if (bar) bar.classList.add('show');
}
function clearDirty() {
  dirtyState_ = null;
  const bar = document.getElementById('savebar');
  if (bar) bar.classList.remove('show');
}
function isDirty_() { return !!dirtyState_; }
/** 要離開目前畫面前問一下；回傳 Promise<boolean>(true = 可以離開) */
function confirmLeave_() {
  if (!dirtyState_) return Promise.resolve(true);
  return openModal({
    title: '有尚未儲存的修改', body: '<p>這一頁還有修改沒有儲存，要先儲存嗎？</p>',
    okText: '放棄修改並離開', danger: true, cancelText: '留在這一頁'
  }).then(ok => { if (ok) clearDirty(); return !!ok; });
}
function installSaveBar_() {
  const save = document.getElementById('savebar-save');
  const discard = document.getElementById('savebar-discard');
  if (save) save.onclick = () => { if (dirtyState_ && dirtyState_.save) dirtyState_.save(); };
  if (discard) discard.onclick = () => {
    const d = dirtyState_;
    clearDirty();
    if (d && d.discard) d.discard(); else renderTab(currentTab);
  };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (dirtyState_ && dirtyState_.save) dirtyState_.save();
    }
  });
  window.addEventListener('beforeunload', e => { if (dirtyState_) { e.preventDefault(); e.returnValue = ''; } });
}

/**
 * 拖曳排序(全系統共用)：取代一次只能移一格的 ▲▼/◀▶ 按鈕。
 *   - 抓住 ⠿ 把手拖到想要的位置放開(滑鼠、觸控都可以)，拖曳中其他列即時讓位
 *   - 鍵盤：把手取得焦點後 Alt+↑/↓(或 ←/→) 一次移一格
 * makeSortable(container, { items: '選擇器', handle: '選擇器', onEnd(keys, moved) })
 *   items 要有 data-key；放開後依畫面順序回傳 key 陣列，由呼叫端決定要不要立即存檔。
 *   group(item) 可選：回傳群組鍵，只允許在同一群組內移動(科目樹的同一個父科目底下)。
 */
function makeSortable(container, opts) {
  if (!container || !container.addEventListener || container.__sortable) return;
  container.__sortable = true;
  const itemSel = opts.items, handleSel = opts.handle || '.drag-handle';
  // direct：只管直接子元素(巢狀清單如科目樹，每一層各自排序，互不干擾)
  const itemsNow = () => Array.from(container.querySelectorAll(itemSel)).filter(el => !opts.direct || el.parentNode === container);
  const keysNow = () => itemsNow().map(el => el.getAttribute('data-key'));
  let drag = null;
  const groupOf = el => opts.group ? opts.group(el) : '';

  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest(handleSel);
    if (!handle || !container.contains(handle) || e.button > 0) return;
    const item = handle.closest(itemSel);
    if (!item || (opts.direct && item.parentNode !== container)) return;
    e.preventDefault();
    drag = { item, startY: e.clientY, startX: e.clientX, before: keysNow().join('\u0001'), group: groupOf(item), moved: false };
    item.classList.add('sort-dragging');
    document.body.classList.add('sorting');
    hideTooltip_ && hideTooltip_();
    handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if (!drag) return;
    const horizontal = !!opts.horizontal;
    const siblings = itemsNow().filter(el => el !== drag.item && groupOf(el) === drag.group);
    const pos = horizontal ? e.clientX : e.clientY;
    for (const sib of siblings) {
      const r = sib.getBoundingClientRect();
      const mid = horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
      const isAfterDrag = drag.item.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING;
      if (isAfterDrag && pos > mid) { insertAfterGroupBlock_(sib, drag.item, opts); drag.moved = true; break; }
      if (!isAfterDrag && pos < mid) { sib.parentNode.insertBefore(drag.item, sib); moveTrailing_(drag.item, opts); drag.moved = true; break; }
    }
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    d.item.classList.remove('sort-dragging');
    document.body.classList.remove('sorting');
    const after = keysNow();
    if (after.join('\u0001') !== d.before) {
      d.item.classList.add('sort-flash');
      setTimeout(() => d.item.classList.remove('sort-flash'), 900);
      opts.onEnd(after, d.item.getAttribute('data-key'));
    }
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('keydown', e => {
    const handle = e.target.closest && e.target.closest(handleSel);
    if (!handle || !e.altKey) return;
    const dir = (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : 0;
    if (!dir) return;
    e.preventDefault();
    const item = handle.closest(itemSel);
    if (!item || (opts.direct && item.parentNode !== container)) return;
    const g = groupOf(item);
    const peers = itemsNow().filter(el => groupOf(el) === g);
    const idx = peers.indexOf(item), j = idx + dir;
    if (j < 0 || j >= peers.length) return;
    // 真的把 DOM 搬過去(有些呼叫端是照畫面順序讀，如科目樹)，再回傳新順序
    const ref = peers[j];
    if (dir < 0) ref.parentNode.insertBefore(item, ref);
    else ref.parentNode.insertBefore(item, ref.nextSibling);
    const key = item.getAttribute('data-key');
    opts.onEnd(keysNow(), key, true);
    // 重畫之後把焦點放回同一個把手，可以連續按 Alt+↑↓
    setTimeout(() => {
      const again = document.querySelector(`[data-key="${CSS.escape(key)}"] ${handleSel}`);
      if (again) again.focus();
    }, 700);
  });
}
/** 科目樹拖曳：一個父科目連同它底下的子科目要一起搬(items 用 data-block 標出區塊成員) */
function insertAfterGroupBlock_(sib, item, opts) {
  let ref = sib;
  if (opts.blockOf) { const tail = opts.blockOf(sib); if (tail) ref = tail; }
  ref.parentNode.insertBefore(item, ref.nextSibling);
  moveTrailing_(item, opts);
}
function moveTrailing_(item, opts) {
  if (!opts.trailingOf) return;
  const trail = opts.trailingOf(item);
  let ref = item;
  trail.forEach(el => { ref.parentNode.insertBefore(el, ref.nextSibling); ref = el; });
}
/** ⠿ 拖曳把手的 HTML(可以用鍵盤 Alt+↑↓ 操作) */
function dragHandleHtml(label) {
  return `<span class="drag-handle" tabindex="0" role="button" aria-label="${esc(label || '拖曳調整順序')}" data-tip="拖曳調整順序（或 Alt+↑↓）">⠿</span>`;
}

const PAGE_META = {
  dashboard: ['結果呈現', '損益儀表板'], report: ['結果呈現', 'GATE 審議報告'],
  salesmix: ['輸入資料', '銷售構成與售價'], costofsales: ['輸入資料', '銷貨成本'],
  devinvestment: ['輸入資料', '開發總投'], operatingexpense: ['輸入資料', '營業費用'],
  lineitems: ['計算設定', '科目與公式'], paramrates: ['計算設定', '參數與比率'], paramfx: ['計算設定', '匯率設定'],
  vehicletypes: ['主檔', '車型主檔'], vehicles: ['主檔', '車系設定'], scenarios: ['主檔', '情境設定']
};

/* ---------------- 頁籤 / 上方選單 ---------------- */
function switchTab(key, force) {
  if (!force && key !== currentTab && isDirty_()) {
    confirmLeave_().then(ok => { if (ok) switchTab(key, true); });
    return;
  }
  clearDirty();
  currentTab = key;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  const meta = PAGE_META[key] || ['', ''];
  const crumb = document.getElementById('page-crumb'), title = document.getElementById('page-title');
  if (crumb) crumb.textContent = meta[0];
  if (title) title.textContent = meta[1];
  document.body.classList.remove('nav-open');
  saveAppState_();
  renderTab(key);
}

/**
 * 記住「目前在哪一頁、選了哪個車型/情境」，讓整頁重新載入後能回到原本的位置。
 * 地端版匯入資料包、載入示範資料後都會整頁重新載入，使用者自己按 F5 也是；沒有這層記憶的話，
 * 畫面每次都會跳回「車型主檔」分頁、車型/情境選單也重設成第一筆。存最基本的三個狀態就好，
 * 表格編輯頁裡「還沒存檔的修改」本來就無法安全地跨頁面重新載入還原，不在這裡處理。
 */
const APP_STATE_KEY_ = 'plApp.state.v1';
function saveAppState_() {
  try {
    localStorage.setItem(APP_STATE_KEY_, JSON.stringify({
      tab: currentTab, vehicleTypeId: currentVehicleTypeId, scenarioId: currentScenarioId
    }));
  } catch (e) { /* 無痕模式等情況存不了就算了，不影響功能 */ }
}
function loadAppState_() {
  try {
    const s = JSON.parse(localStorage.getItem(APP_STATE_KEY_) || 'null');
    if (s && typeof s === 'object') return s;
  } catch (e) { /* 壞掉的資料當作沒有 */ }
  return {};
}

function renderTab(key) {
  if (silent) return;
  if (key === 'dashboard') loadComparisonPicker();
  else if (key === 'report') renderReportPanel();
  else if (key === 'lineitems') renderChartPanel();
  else if (GRID_PANELS[key]) window[GRID_PANELS[key]]();
  else if (ENTITIES[key]) renderEntityPanel(key);
}

/** 開場：車型 + 情境一次取回，期間不重繪，最後只渲染一次目前分頁 */
function loadVehicleTypeSelector(preferredId, preferredScenarioId) {
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      renderVehicleTypeOptions(data.vehicleTypes || [], data.vehicleTypeId);
      currentVehicleTypeId = data.vehicleTypeId || '';
      renderScenarioOptions(data.scenarios || [], preferredScenarioId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); renderTab(currentTab); })
    .getBootstrap(preferredId || currentVehicleTypeId);
}

function renderVehicleTypeOptions(types, pick) {
  const sel = document.getElementById('vehicletype-selector');
  sel.innerHTML = '<option value="">-- 選擇車型 --</option>' +
    types.map(t => `<option value="${esc(t.VehicleTypeID)}">${esc(t.VehicleTypeID)}</option>`).join('');
  sel.value = pick || '';
}

/** 把情境選單畫出來並決定選哪一個，不觸發伺服器呼叫 */
function renderScenarioOptions(scenarios, preferredId) {
  scenarioCache = scenarios || [];
  const sel = document.getElementById('scenario-selector');
  sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const ids = scenarioCache.map(s => s.ScenarioID);
  const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
    : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
    : ids[0] || '';
  sel.value = pick;
  setCurrentScenario(pick);
}

/** 只更新目前情境狀態與標籤，渲染交給呼叫端決定 */
function setCurrentScenario(value) {
  currentScenarioId = value;
  currentScenario = scenarioCache.filter(s => s.ScenarioID === value)[0] || null;
  const badge = document.getElementById('scenario-type-badge');
  if (badge) {
    const t = currentScenario ? (currentScenario.ScenarioType || '現況') : '';
    badge.textContent = t;
    badge.className = 'type-badge t-' + t;
    badge.style.display = currentScenario ? 'inline-flex' : 'none';
  }
  saveAppState_();
}

function onVehicleTypeChange(value) {
  if (isDirty_()) {
    const sel = document.getElementById('vehicletype-selector');
    sel.value = currentVehicleTypeId;
    confirmLeave_().then(ok => { if (ok) { sel.value = value; onVehicleTypeChange(value); } });
    return;
  }
  currentVehicleTypeId = value;
  currentScenarioId = '';
  currentScenario = null;
  saveAppState_();
  // 車型換了之後情境清單也要換，換完才渲染一次，避免同一個分頁畫兩遍
  loadScenarioSelector();
}

function loadScenarioSelector(preferredId) {
  const sel = document.getElementById('scenario-selector');
  if (!currentVehicleTypeId) {
    sel.innerHTML = '<option value="">-- 請先選車型 --</option>';
    scenarioCache = [];
    setCurrentScenario('');
    renderTab(currentTab);
    return;
  }
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      renderScenarioOptions(scenarios, preferredId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); })
    .getScenarios(currentVehicleTypeId);
}

function onScenarioChange(value) {
  if (isDirty_()) {
    const sel = document.getElementById('scenario-selector');
    sel.value = currentScenarioId;
    confirmLeave_().then(ok => { if (ok) { sel.value = value; onScenarioChange(value); } });
    return;
  }
  setCurrentScenario(value);
  renderTab(currentTab);
}

/* ---------------- 主檔維護（表格直接編輯，不需要先按「編輯」） ---------------- */
let entityRows = {};        // key -> 目前表格上的資料列（__existing 標記是否已存在於後端）
let pendingStatus = null;   // 重畫表格後才顯示的訊息（例如建立情境後整個面板會被重繪）

function renderEntityPanel(key) {
  const cfg = ENTITIES[key];
  const panel = document.getElementById('panel-' + key);
  if (cfg.scopedBy === 'vehicleType' && !requireScope(key, false)) return;
  panel.innerHTML = gridShell(key, cfg.label, cfg.intro);
  loadEntityData(key);
}

/** ENTITIES 的 scopedBy 只有 'vehicleType' 或 null，剛好對應到快取鍵要區分到什麼程度 */
function entityCacheScope_(cfg) { return cfg.scopedBy === 'vehicleType' ? 'vehicleType' : 'none'; }

function loadEntityData(key) {
  const cfg = ENTITIES[key];
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId] : [];
  const cacheKey = panelCacheKey_(key, entityCacheScope_(cfg));
  const apply = rows => {
    if (isDirty_()) return;   // 使用者已經開始改了，背景回來的資料不要蓋掉畫面
    entityRows[key] = (rows || []).map(r => Object.assign({}, r, { __existing: true }));
    drawEntityGrid(key);
  };
  if (panelDataCache_[cacheKey]) apply(panelDataCache_[cacheKey]);
  google.script.run
    .withSuccessHandler(safeHandler(rows => { panelDataCache_[cacheKey] = rows; apply(rows); }))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function drawEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = entityRows[key] || [];
  const toolbar = document.getElementById('toolbar-' + key);
  if (!toolbar) return;

  toolbar.innerHTML = (cfg.createUi === 'scenario' ? '' : cfg.createUi === 'vehicleType'
    ? `<button type="button" class="btn" onclick="createVehicleTypeDialog()">＋ 新增車型</button>`
    : `<button type="button" class="btn" onclick="addEntityRow('${key}')">＋ 新增一列</button>`) +
    `<span class="spacer"></span><button type="button" class="btn secondary" onclick="saveEntityGrid('${key}')">儲存</button>` +
    (cfg.createUi === 'scenario' ? scenarioToolbarHtml() : '');

  const sortable = cfg.sortable && rows.length > 1;
  const body = rows.length
    ? rows.map((r, i) => `<tr${r.__existing ? '' : ' class="new-row"'} data-key="${i}">
        ${sortable ? `<td class="row-actions">${r.__existing ? dragHandleHtml() : ''}</td>` : ''}
        ${cfg.columns.map(col => entityCellHtml(key, i, col, r)).join('')}
        <td class="row-actions">${entityRowActionHtml(key, i, r, rows.length)}</td>
      </tr>`).join('')
    : `<tr><td class="muted" colspan="${cfg.columns.length + 2}" style="text-align:center;padding:24px;">尚無資料</td></tr>`;

  document.getElementById('grid-' + key).innerHTML = `
    <div class="grid-scroll">
      <table class="grid-table entity-table">
        <thead><tr>${sortable ? '<th style="width:36px;"></th>' : ''}${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th>操作</th></tr></thead>
        <tbody id="entity-body-${key}">${body}</tbody>
      </table>
    </div>`;

  if (sortable) {
    makeSortable(document.getElementById('entity-body-' + key), {
      items: 'tr[data-key]',
      onEnd: keys => {
        const old = entityRows[key];
        entityRows[key] = keys.map(k => old[Number(k)]);
        if (entityRows[key].some(r => !r.__existing)) {
          drawEntityGrid(key);
          toast('新增的列還沒儲存，先按「儲存」後再調整順序會立即生效', 'warn');
          return;
        }
        const ids = entityRows[key].map(r => r[cfg.pk]);
        drawEntityGrid(key);
        google.script.run
          .withSuccessHandler(safeHandler(saved => {
            panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
            Object.keys(panelDataCache_).forEach(k => { if (k.indexOf(key + '::') !== 0) delete panelDataCache_[k]; });
            toast('已更新順序', 'ok', 1400);
            if (key === 'scenarios') refreshScenarioOptions(currentScenarioId);
          }))
          .withFailureHandler(err => { toast(err.message, 'err'); loadEntityData(key); })
          [cfg.sortable](currentVehicleTypeId, ids);
      }
    });
  }
  if (key === 'scenarios') autoFillNewScenarioName_();
  if (pendingStatus && pendingStatus.key === key) {
    setStatus(key, pendingStatus.text, pendingStatus.cls);
    pendingStatus = null;
  }
}

function entityCellHtml(key, i, col, row) {
  const value = row[col.name] === undefined || row[col.name] === null ? '' : row[col.name];
  const locked = col.readOnly || col.auto ||
    (col.lockAfterCreate && row.__existing) ||
    (col.lockIf && col.lockIf(row));
  const style = col.width ? ` style="width:${col.width}px;"` : '';

  if (locked) {
    const shown = col.auto && !value ? '(儲存時自動編號)' : value;
    return `<td class="row-head">${esc(shown)}</td>`;
  }
  if (col.type === 'select') {
    const options = col.options.map(o => {
      const [v, text] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}"${String(value) === String(v) ? ' selected' : ''}>${esc(text)}</option>`;
    }).join('');
    return `<td><select${style} onchange="onEntityField('${key}', ${i}, '${col.name}', this.value)">${options}</select></td>`;
  }
  return `<td><input type="${col.type || 'text'}" step="any" value="${esc(value)}"${style}
    oninput="onEntityField('${key}', ${i}, '${col.name}', this.value)"></td>`;
}

function entityRowActionHtml(key, i, row) {
  if (!row.__existing) {
    return `<button type="button" class="btn ghost sm" onclick="removeEntityRow('${key}', ${i})">移除</button>`;
  }
  const cfg = ENTITIES[key];
  const renameBtn = cfg.renameFn
    ? `<button type="button" class="btn ghost sm" onclick="renameEntityRow('${key}', ${i})">改代號</button>` : '';
  return renameBtn + `<button type="button" class="btn danger sm" onclick="deleteEntityRow('${key}', ${i})">刪除</button>`;
}

/**
 * 車型/車系代號重新命名：代號是其他表格的外鍵，不能直接在格子裡改字串，
 * 改用後端的 rename 函式一次把所有引用該代號的地方(含科目表、作法、車系個別公式)都更新過去。
 */
function renameEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const oldId = row[cfg.pk];
  openModal({
    title: '修改代號：' + oldId,
    body: '<p class="help">所有引用這個代號的資料（車系、情境、銷售構成、成本、科目表…）會一起改成新代號。</p>',
    fields: [{ name: 'id', label: '新的代號', value: oldId }],
    okText: '修改',
    validate: v => !v.id.trim() ? '代號不能空白' : ''
  }).then(v => {
    if (!v) return;
    const newId = v.id.trim();
    if (newId === oldId) return;
    const args = key === 'vehicles' ? [currentVehicleTypeId, oldId, newId] : [oldId, newId];
    setStatus(key, '修改中...');
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        if (key === 'vehicletypes' && currentVehicleTypeId === oldId) currentVehicleTypeId = newId;
        pendingStatus = { key: key, text: `已將「${oldId}」改為「${newId}」`, cls: 'ok' };
        loadEntityData(key);
        afterEntityChange(key);
      }))
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
      [cfg.renameFn](...args);
  });
}

function onEntityField(key, i, field, value) {
  entityRows[key][i][field] = value;
  markDirty(key, () => saveEntityGrid(key), () => { clearDirty(); loadEntityData(key); });
  if (key === 'scenarios' && (field === 'CreatedDate' || field === 'ScenarioType')) {
    autoFillScenarioName_(i);
  }
}

/** yyyy-MM-dd -> "MMDD"，用來組情境名稱的日期後綴 */
function dateToMMDD_(dateStr) {
  const m = String(dateStr || '').match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? m[1] + m[2] : '';
}

/**
 * 情境名稱自動帶入：選了建立日期(或改了情境性質)後，把名稱補成「情境性質+MMDD」(如「現況0901」)。
 * 只在名稱是空白、或還是上一次自動帶入的值時才覆蓋 —— 使用者手動打過的名稱不會被蓋掉。
 */
function autoFillScenarioName_(i) {
  const row = entityRows.scenarios[i];
  const suffix = dateToMMDD_(row.CreatedDate);
  if (!suffix) return;
  const auto = (row.ScenarioType || '') + suffix;
  if (!row.ScenarioName || row.ScenarioName === row.__scenarioNameAuto) {
    row.ScenarioName = auto;
    row.__scenarioNameAuto = auto;
    drawEntityGrid('scenarios');
  }
}

function addEntityRow(key) {
  const cfg = ENTITIES[key];
  const row = { __existing: false };
  cfg.columns.forEach(c => { row[c.name] = ''; });
  if (cfg.pk) row[cfg.pk] = '';
  entityRows[key].push(row);
  drawEntityGrid(key);
  markDirty(key, () => saveEntityGrid(key), () => { clearDirty(); loadEntityData(key); });
  const inputs = document.querySelectorAll(`#entity-body-${key} tr:last-child input`);
  if (inputs[0]) inputs[0].focus();
}

/** 還沒存進後端的新增列，直接從畫面上拿掉就好 */
function removeEntityRow(key, i) {
  entityRows[key].splice(i, 1);
  drawEntityGrid(key);
}

function deleteEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const label = row[cfg.pk] && cfg.pk !== 'ScenarioID' ? row[cfg.pk] : scenarioLabel(row);
  confirmModal('刪除「' + label + '」？', key === 'vehicletypes'
    ? '車型與它自己的科目表會一起刪除。底下的車系與情境資料不會被刪，但會看不到。這個動作無法復原。'
    : '這個動作無法復原。', '刪除', true).then(ok => {
    if (!ok) return;
    setStatus(key, '刪除中...');
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        pendingStatus = { key: key, text: '已刪除', cls: 'ok' };
        loadEntityData(key);
        afterEntityChange(key);
      }))
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
      [cfg.deleteFn](row[cfg.pk]);
  });
}

function saveEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = (entityRows[key] || []).map(r => {
    const copy = {};
    cfg.columns.forEach(c => { copy[c.name] = r[c.name] === undefined ? '' : r[c.name]; });
    if (cfg.pk) copy[cfg.pk] = r[cfg.pk] === undefined ? '' : r[cfg.pk];
    return copy;
  });
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId, rows] : [rows];

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      clearDirty();
      panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
      entityRows[key] = (saved || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid(key);
      setStatus(key, '已儲存', 'ok');
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveGridFn](...args);
}

/** 新增車型：同時決定這個車型的科目表從哪裡開始(標準範本，或複製某個既有車型) */
function createVehicleTypeDialog() {
  const others = (entityRows.vehicletypes || []).filter(r => r.__existing).map(r => r.VehicleTypeID);
  openModal({
    title: '新增車型',
    body: '<p class="help">科目表會依每個車型各自一份。可以從標準範本開始，或複製一個科目結構比較接近的既有車型，之後再到「科目與公式」調整。</p>',
    fields: [
      { name: 'id', label: '車型代號', placeholder: '例：DA' },
      { name: 'notes', label: '備註', placeholder: '選填' },
      { name: 'source', label: '科目表從哪裡開始', type: 'select', value: '',
        options: [['', '標準範本']].concat(others.map(id => [id, '複製「' + id + '」的科目表'])) }
    ],
    okText: '建立',
    validate: v => !v.id.trim() ? '請輸入車型代號' : ''
  }).then(v => {
    if (!v) return;
    google.script.run
      .withSuccessHandler(safeHandler(types => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        toast('已建立車型 ' + v.id.trim(), 'ok');
        entityRows.vehicletypes = (types || []).map(r => Object.assign({}, r, { __existing: true }));
        drawEntityGrid('vehicletypes');
        currentVehicleTypeId = v.id.trim();
        loadVehicleTypeSelector(currentVehicleTypeId);
      }))
      .withFailureHandler(err => toast(err.message, 'err'))
      .createVehicleType(v.id.trim(), v.notes, v.source);
  });
}

/** 車型/情境改動後，上方的選單也要跟著更新（但不要重畫目前這個分頁） */
function afterEntityChange(key) {
  if (key === 'vehicletypes') refreshVehicleTypeOptions();
  if (key === 'scenarios') refreshScenarioOptions();
}

function refreshVehicleTypeOptions() {
  google.script.run.withSuccessHandler(safeHandler(types => {
    renderVehicleTypeOptions(types || [], currentVehicleTypeId);
  })).getVehicleTypes();
}

function refreshScenarioOptions(preferredId) {
  google.script.run.withSuccessHandler(safeHandler(scenarios => {
    renderScenarioOptions(scenarios, preferredId);
  })).getScenarios(currentVehicleTypeId);
}

/* ---- 情境設定：以既有情境為基礎建立 / 把既有情境的資料帶進目前情境 ---- */
function scenarioToolbarHtml() {
  const existing = (entityRows.scenarios || []).filter(s => s.__existing);
  const sourceOptions = existing
    .map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const partChecks = SCENARIO_COPY_PARTS.map(p => `

function selectedCopyParts() {
  return SCENARIO_COPY_PARTS
    .filter(p => { const el = document.getElementById('copy-part-' + p.key); return el && el.checked; })
    .map(p => p.key);
}

/** 「新增情境」表單：情境性質改變時，名稱欄位還是空白或還是上次自動帶入的值，就重新帶一次(性質+今天MMDD) */
let newScenarioNameAuto_ = '';
function autoFillNewScenarioName_() {
  const nameEl = document.getElementById('new-scenario-name');
  const typeEl = document.getElementById('new-scenario-type');
  if (!nameEl || !typeEl) return;
  const auto = (typeEl.value || '') + dateToMMDD_(today());
  if (!nameEl.value || nameEl.value === newScenarioNameAuto_) {
    nameEl.value = auto;
    newScenarioNameAuto_ = auto;
  }
}

function createScenario() {
  const name = val('new-scenario-name');
  if (!name) { setStatus('scenarios', '請輸入情境名稱', 'err'); return; }
  const source = val('new-scenario-source');
  const parts = selectedCopyParts();
  if (source && !parts.length) {
    setStatus('scenarios', '請至少勾選一項要帶入的資料，或把來源情境改成「不帶入」', 'err');
    return;
  }
  setStatus('scenarios', '建立中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      pendingStatus = { key: 'scenarios', text: source ? '已建立情境，並帶入來源情境的資料' : '已建立情境', cls: 'ok' };
      loadEntityData('scenarios');
      refreshScenarioOptions(saved && saved.ScenarioID);
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .createScenarioFrom({
      ScenarioID: '',
      Gate: val('new-scenario-gate'),
      ScenarioName: name,
      ScenarioType: val('new-scenario-type'),
      VehicleTypeID: currentVehicleTypeId,
      CreatedDate: today(),
      Notes: ''
    }, source, parts);
}

function importIntoCurrentScenario() {
  const source = val('import-scenario-source');
  if (!currentScenarioId) { setStatus('scenarios', '請先在上方選擇要帶入的目標情境', 'err'); return; }
  if (!source) { setStatus('scenarios', '請選擇來源情境', 'err'); return; }
  const parts = selectedCopyParts();
  if (!parts.length) { setStatus('scenarios', '請至少勾選一項要帶入的資料', 'err'); return; }
  confirmModal('帶入到目前情境？', '會先清掉目前情境所勾選類別的資料，再整批複製來源情境的內容。', '帶入', true).then(ok => {
  if (!ok) return;
  setStatus('scenarios', '帶入中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      setStatus('scenarios', '已帶入來源情境的資料（開發總投的挑戰低減目標已清空，請重新填寫）', 'ok');
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .copyScenarioData(source, currentScenarioId, parts);
  });
}

function today() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ================= 銷售構成（依車系自動列出，台數/構成比動態連動） ================= */
let salesMixRows = [];

function renderSalesMixPanel() {
  if (!requireScope('salesmix', true)) return;
  const panel = document.getElementById('panel-salesmix');
  panel.innerHTML = gridShell('salesmix', '銷售構成與售價',
    '每個車系一列。<b>台數與構成比會自動互相連動</b>：改台數 → 構成比重算；改構成比 → 依車型月總台數反推台數。售價欄位是售價結構(P1~P9)公式的來源。');
  const cacheKey = panelCacheKey_('salesmix');
  if (panelDataCache_[cacheKey]) { salesMixRows = panelDataCache_[cacheKey].rows || []; drawSalesMixGrid(); }
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      panelDataCache_[cacheKey] = data;
      if (isDirty_()) return;
      salesMixRows = data.rows || [];
      drawSalesMixGrid();
    }))
    .withFailureHandler(showGlobalError)
    .getSalesMixGrid(currentScenarioId, currentVehicleTypeId);
}

function drawSalesMixGrid() {
  const grid = document.getElementById('grid-salesmix');
  if (!salesMixRows.length) {
    document.getElementById('toolbar-salesmix').innerHTML = '';
    grid.innerHTML = emptyStateHtml('📋', '這個車型還沒有車系', '銷售構成依車系逐列輸入，請先建立車系。', `<button class="btn" onclick="switchTab('vehicles')">前往車系設定</button>`);
    return;
  }
  const totalUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);

  document.getElementById('toolbar-salesmix').innerHTML = `
    <label>車型月總台數
      <input id="sm-total" type="number" step="any" style="width:120px;" value="${totalUnits || ''}"
             oninput="onSalesMixTotalInput()">
    </label>
    <span class="muted" style="align-self:flex-end;padding-bottom:8px;">LIFE CYCLE 總台數 = 月台數 × 12 × LC年限</span>
    <span class="spacer"></span>
    <button type="button" class="btn secondary" onclick="saveSalesMixGrid()">儲存</button>
  `;

  grid.innerHTML = `
    <div class="grid-scroll">
    <table class="grid-table sticky-head-col">
      <thead><tr>
        <th>車系</th><th>構成比%</th><th>月台數</th><th>LC年限</th><th>LC總台數</th>
        <th>建議零售價<br>(含稅)</th><th>強配件<br>售價</th><th>廢車<br>處理費</th><th>稅別</th>
        <th title="計算貨物稅完稅價格時，從廠價扣除這個金額">水平配件外移<br>調降廠價</th>
        <th>備註</th>
      </tr></thead>
      <tbody>
        ${salesMixRows.map((r, i) => `
          <tr>
            <td class="row-head">${esc(r.VehicleID)}${r.VehicleCode ? ' - ' + esc(r.VehicleCode) : ''}</td>
            <td><input type="number" step="any" value="${esc(r.SalesMixPct)}" oninput="onSalesMixPctInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MonthlyVolume)}" oninput="onSalesMixVolumeInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.LifeCycleYears)}" oninput="onSalesMixField(${i}, 'LifeCycleYears', this.value)"></td>
            <td class="calc" id="sm-lc-${i}">${fmt(num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears))}</td>
            <td><input type="number" step="any" value="${esc(r.ListPriceTaxIncl)}" oninput="onSalesMixField(${i}, 'ListPriceTaxIncl', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MandatoryAccessoryPrice)}" oninput="onSalesMixField(${i}, 'MandatoryAccessoryPrice', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.ScrapFee)}" oninput="onSalesMixField(${i}, 'ScrapFee', this.value)"></td>
            <td><select onchange="onSalesMixField(${i}, 'ScrapFeeTaxStatus', this.value)">
              ${['含稅', '未稅'].map(o => `<option value="${o}"${r.ScrapFeeTaxStatus === o ? ' selected' : ''}>${o}</option>`).join('')}
            </select></td>
            <td><input type="number" step="any" value="${esc(r.HorizontalPartsPriceAdj)}" oninput="onSalesMixField(${i}, 'HorizontalPartsPriceAdj', this.value)"></td>
            <td><input type="text" class="note-input" value="${esc(r.Notes)}" oninput="onSalesMixField(${i}, 'Notes', this.value)"></td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td class="row-head">合計</td>
        <td id="sm-sum-pct" class="calc"></td>
        <td id="sm-sum-units" class="calc"></td>
        <td></td><td id="sm-sum-lc" class="calc"></td>
        <td colspan="6"></td>
      </tr></tfoot>
    </table>
    </div>`;
  updateSalesMixTotals();
}

function smDirty_() { markDirty('salesmix', saveSalesMixGrid, () => { clearDirty(); renderSalesMixPanel(); }); }
function onSalesMixField(i, field, value) { salesMixRows[i][field] = value; updateSalesMixTotals(); smDirty_(); }

/** 改台數：總台數 = 各車系台數加總，所有構成比依台數重算 */
function onSalesMixVolumeInput(i, value) {
  salesMixRows[i].MonthlyVolume = value === '' ? '' : num(value);
  smDirty_();
  const total = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  salesMixRows.forEach(r => { r.SalesMixPct = total > 0 ? round2(num(r.MonthlyVolume) / total * 100) : ''; });
  document.getElementById('sm-total').value = total || '';
  syncSalesMixInputs({ skipVolumeIndex: i });
}

/** 改構成比：以車型月總台數為基準反推該車系台數，其餘車系的構成比再依台數回算 */
function onSalesMixPctInput(i, value) {
  salesMixRows[i].SalesMixPct = value === '' ? '' : num(value);
  smDirty_();
  const total = num(val('sm-total'));
  if (total > 0) {
    // 台數保留小數：構成比 5% × 365 台 = 18.25 台，四捨五入會讓構成比對不回去
    salesMixRows[i].MonthlyVolume = round2(num(value) / 100 * total);
  }
  syncSalesMixInputs({ skipPctIndex: i });
}

/** 改車型月總台數：各車系依目前構成比重新分配台數 */
function onSalesMixTotalInput() {
  smDirty_();
  const total = num(val('sm-total'));
  if (total > 0) {
    salesMixRows.forEach(r => { r.MonthlyVolume = round2(num(r.SalesMixPct) / 100 * total); });
  }
  syncSalesMixInputs({});
}

function round2(n) { return Math.round(n * 100) / 100; }

/** 把 salesMixRows 的值寫回輸入框（跳過使用者正在輸入的那一格，避免游標跳動） */
function syncSalesMixInputs(opts) {
  const rows = document.querySelectorAll('#grid-salesmix tbody tr');
  salesMixRows.forEach((r, i) => {
    const tr = rows[i];
    if (!tr) return;
    const pctInput = tr.children[1].querySelector('input');
    const volInput = tr.children[2].querySelector('input');
    if (opts.skipPctIndex !== i) pctInput.value = r.SalesMixPct === '' ? '' : r.SalesMixPct;
    if (opts.skipVolumeIndex !== i) volInput.value = r.MonthlyVolume === '' ? '' : r.MonthlyVolume;
  });
  updateSalesMixTotals();
}

function updateSalesMixTotals() {
  const sumPct = salesMixRows.reduce((s, r) => s + num(r.SalesMixPct), 0);
  const sumUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  let sumLc = 0;
  salesMixRows.forEach((r, i) => {
    const lc = num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears);
    sumLc += lc;
    const cell = document.getElementById('sm-lc-' + i);
    if (cell) cell.textContent = fmt(lc);
  });
  const pctCell = document.getElementById('sm-sum-pct');
  if (pctCell) {
    pctCell.textContent = fmt(sumPct, 2) + '%';
    // 構成比合計不是 100% 時標紅，避免加權平均被算錯還沒發現
    pctCell.className = 'calc' + (Math.abs(sumPct - 100) > 0.01 && sumPct !== 0 ? ' negative' : '');
  }
  const unitCell = document.getElementById('sm-sum-units');
  if (unitCell) unitCell.textContent = fmt(sumUnits);
  const lcCell = document.getElementById('sm-sum-lc');
  if (lcCell) lcCell.textContent = fmt(sumLc);
}

function saveSalesMixGrid() {
  setStatus('salesmix', '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      clearDirty();
      panelDataCache_[panelCacheKey_('salesmix')] = data;
      salesMixRows = data.rows || [];
      drawSalesMixGrid();
      setStatus('salesmix', '已儲存', 'ok');
    }))
    .withFailureHandler(err => setStatus('salesmix', '錯誤：' + err.message, 'err'))
    .saveSalesMixGrid(currentScenarioId, currentVehicleTypeId, salesMixRows);
}

/** 公式/攤提的計算過程文字(hover 用)：公式換成看得懂的名稱，再列出每個引用到的值 */
function traceText_(trace, codeNameMap) {
  if (!trace) return '';
  if (trace.kind === 'dev') {
    return `開發總投攤提\n投資總額(低減後) ${fmt(trace.total)} ÷ 攤提台數 ${fmt(trace.units)}\n= 全車系分攤 ${fmt(trace.total && trace.units ? trace.total / trace.units : 0)}\n本車系合計 ${fmt(trace.perUnit)}（含只攤給部分車系的金額）`;
  }
  const lines = ['= ' + humanizeFormula_(trace.formula, codeNameMap)];
  Object.keys(trace.refs || {}).forEach(k => {
    let label = k;
    if (/^[A-Za-z][A-Za-z0-9_]*$/.test(k)) label = codeNameMap[k] ? `${codeNameMap[k]}(${k})` : k;
    else if (k === 'CHILDREN()') label = 'Σ子科目';
    else if (k === 'TAXDEDUCT()') label = 'Σ可扣除貨物稅的科目';
    lines.push(`${label}：${fmt(trace.refs[k], 4)}`);
  });
  return lines.join('\n');
}

function drawMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const data = matrixData[key];
  const grid = document.getElementById('grid-' + key);
  if (!grid) return;

  const parentSelect = cfg.parentOptions
    ? `<select id="${key}-new-parent">${cfg.parentOptions.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`
    : '';
  document.getElementById('toolbar-' + key).innerHTML = `
    ${parentSelect}
    <input id="${key}-new-name" type="text" placeholder="新增項目名稱" style="width:180px;"
      onkeydown="if(event.key==='Enter'){addMatrixLine('${key}')}">
    <button type="button" class="btn secondary" onclick="addMatrixLine('${key}')">＋ 新增項目</button>
    <span class="spacer"></span>
    <button type="button" class="btn ghost" onclick="switchTab('lineitems')" data-tip="改科目的計算來源/公式、調整科目順序">科目與公式 →</button>
    <button type="button" class="btn secondary" onclick="saveMatrix('${key}')">儲存</button>
  `;

  if (!data.vehicles.length) {
    grid.innerHTML = emptyStateHtml('📋', '這個車型還沒有車系', '請先到「車系設定」建立車系。', `<button class="btn" onclick="switchTab('vehicles')">前往車系設定</button>`);

  const currencyCell = line => {
    if (!cfg.hasCurrency) return '';

    const opts = (data.currencies || ['TWD']).slice();
    if (opts.indexOf(cur) === -1) opts.push(cur);
    return `<td><select id="${key}-cur-${esc(line.value)}" onchange="matrixDirty_('${key}')">
      ${opts.map(c => `<option value="${c}"${c === cur ? ' selected' : ''}>${c}</option>`).join('')}
    </select></td>`;
  };
  const noteOf = code => (data.lineNotes && data.lineNotes[code] !== undefined) ? data.lineNotes[code] : firstCellProp(data, code, 'Notes');

  const mixTotal = data.vehicles.reduce((sum, v) => sum + num(v.SalesMixPct), 0);
  grid.innerHTML = `
    ${mixTotal ? '' : '<div class="callout warn">這個情境還沒有銷售構成比，加權平均無法計算，請先到「銷售構成」頁填構成比。</div>'}
    ${data.vehicles.length > 1 ? `<div class="order-strip"><span class="muted">車系順序</span>
      <div class="chip-list" id="${key}-vorder">${data.vehicles.map(v =>
        `<span class="chip" data-key="${esc(v.VehicleID)}">${dragHandleHtml('拖曳調整車系順序')}${esc(v.VehicleCode || v.VehicleID)}</span>`).join('')}</div>
      <span class="muted" style="font-weight:400;">拖曳調整，放開立即套用到所有頁面</span></div>` : ''}
    <div class="grid-scroll">
    <table class="grid-table sticky-head-col">
      <thead><tr>
        <th>項目</th>
        ${cfg.hasCurrency ? '<th>幣別</th>' : ''}
        ${data.vehicles.map(v => `<th>${esc(v.VehicleCode || v.VehicleID)}<div class="th-sub">構成比 ${fmt(num(v.SalesMixPct), 1)}%</div></th>`).join('')}
        <th>加權平均</th><th>說明（帶到報告）</th><th></th>
      </tr></thead>
      <tbody>
        ${data.lines.length ? '' : `<tr><td colspan="${data.vehicles.length + 5}" class="muted" style="text-align:center;padding:18px;">還沒有手動輸入的項目，用上方「新增項目」新增</td></tr>`}
        ${data.lines.map(line => `
          <tr data-line="${esc(line.value)}">
            <td class="row-head">${esc(matrixLineName(line))}</td>
            ${currencyCell(line)}
            ${data.vehicles.map(v => {
              const cell = (data.values[line.value] || {})[v.VehicleID] || {};
              return `<td><input type="number" step="any" value="${esc(cell.Amount)}"
                data-line="${esc(line.value)}" data-vehicle="${esc(v.VehicleID)}" data-rowid="${esc(cell.RowID)}"
                oninput="updateMatrixTotals('${key}'); matrixDirty_('${key}')"></td>`;
            }).join('')}
            <td class="calc" id="${key}-sum-${esc(line.value)}"></td>
            <td><input type="text" class="note-input wide" id="${key}-note-${esc(line.value)}" value="${esc(noteOf(line.value))}"

            <td class="row-actions"><button type="button" class="btn ghost sm" onclick="deleteMatrixLine('${key}', '${esc(line.value)}')" data-tip="刪除這個項目">✕</button></td>

        ${(data.autoLines || []).length ? `<tr><td class="row-head" colspan="${data.vehicles.length + (cfg.hasCurrency ? 5 : 4)}"

/** 公式/攤提科目的格子：唯讀，滑鼠移過去看計算過程 */
function autoLineCellHtml(data, lineCode, vehicleId, codeNameMap) {
  const amt = (data.autoValues[lineCode] || {})[vehicleId];
  if (amt === undefined) return '<td class="calc muted">—</td>';
  const trace = ((data.autoTraces || {})[lineCode] || {})[vehicleId];
  const err = ((data.autoErrors || {})[lineCode] || {})[vehicleId];
  const tipText = (err ? '⚠ 公式錯誤：' + err + '\n' : '') + traceText_(trace, codeNameMap || {});
  const tip = tipText ? ` tabindex="0" data-tip="${esc(tipText)}"` : '';
  return `<td class="calc${err ? ' negative' : ''}"${tip}>${err ? '⚠ ' : ''}${fmt(amt)}</td>`;
}

/** 同一列(科目)的幣別/備註是列層級設定，讀取時取該列第一個有值的格子 */
function firstCellProp(data, lineCode, prop) {
  const row = data.values[lineCode] || {};
  const key = Object.keys(row).filter(k => row[k] && row[k][prop])[0];
  return key ? row[key][prop] : '';
}

/**
 * 右邊那一欄是「加權平均」而不是合計：一列是同一個成本項目在各車系的單台金額，相加沒有意義。
 * 表尾則是各車系自己的科目合計（同一車系各科目相加是有意義的）。
 */
function updateMatrixTotals(key) {
  const data = matrixData[key];
  const mix = {};
  let mixTotal = 0;
  data.vehicles.forEach(v => { mix[v.VehicleID] = num(v.SalesMixPct); mixTotal += num(v.SalesMixPct); });

  const colSum = {};
  let weightedGrand = 0;
  data.lines.forEach(line => {
    let weighted = 0;
    document.querySelectorAll(`#grid-${key} input[data-line="${line.value}"]`).forEach(inp => {
      const v = num(inp.value);
      colSum[inp.dataset.vehicle] = (colSum[inp.dataset.vehicle] || 0) + v;
      weighted += v * (mix[inp.dataset.vehicle] || 0);
    });
    weighted = mixTotal ? weighted / mixTotal : 0;
    weightedGrand += weighted;
    const cell = document.getElementById(`${key}-sum-${line.value}`);
    if (cell) cell.textContent = mixTotal ? fmt(weighted) : '—';
  });

  const autoSum = {};
  (data.autoLines || []).forEach(line => {
    data.vehicles.forEach(v => {
      const amt = (data.autoValues[line.value] || {})[v.VehicleID];
      if (amt !== undefined) autoSum[v.VehicleID] = (autoSum[v.VehicleID] || 0) + amt;
    });
  });

  data.vehicles.forEach(v => {
    const cell = document.getElementById(`${key}-colsum-${v.VehicleID}`);
    if (cell) cell.textContent = fmt(colSum[v.VehicleID] || 0);
    const withAutoCell = document.getElementById(`${key}-colsum-withauto-${v.VehicleID}`);
    if (withAutoCell) withAutoCell.textContent = fmt((colSum[v.VehicleID] || 0) + (autoSum[v.VehicleID] || 0));
  });
  const g = document.getElementById(`${key}-grandsum`);
  if (g) g.textContent = mixTotal ? fmt(weightedGrand) : '—';
}

function saveMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const cells = [], lineNotes = {};
  document.querySelectorAll(`#grid-${key} input[data-line]`).forEach(inp => {
    const line = inp.dataset.line;
    const cell = {
      RowID: inp.dataset.rowid || '',
      VehicleID: inp.dataset.vehicle,
      LineCode: line,
      Amount: inp.value === '' ? '' : num(inp.value),
      Notes: ''
    };
    if (cfg.hasCurrency) cell.Currency = val(`${key}-cur-${line}`) || 'TWD';
    cells.push(cell);
    lineNotes[line] = val(`${key}-note-${line}`);
  });

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(() => { clearDirty(); setStatus(key, '已儲存', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveFn](currentScenarioId, cells, lineNotes);
}

function addMatrixLine(key) {
  const cfg = MATRIX_CONFIG[key];
  const name = val(`${key}-new-name`).trim();
  if (!name) { toast('請先輸入項目名稱', 'warn'); return; }
  const parent = cfg.parentOptions ? val(`${key}-new-parent`) : cfg.parentLine;
  const go = () => {
    setStatus(key, '新增中...');
    google.script.run
      .withSuccessHandler(() => { clearDirty(); delete panelDataCache_[panelCacheKey_('lineitems', 'vehicleType')]; setStatus(key, `已在 ${currentVehicleTypeId} 新增項目「${name}」`, 'ok'); renderMatrixPanel(key); })
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
      .addLineItemInline(parent, name, currentVehicleTypeId);
  };
  if (isDirty_()) { toast('先儲存目前的修改再新增項目', 'warn'); return; }
  go();
}

function deleteMatrixLine(key, lineCode) {
  const line = (matrixData[key].lines || []).find(l => l.value === lineCode);
  confirmModal('刪除項目「' + (line ? matrixLineName(line) : lineCode) + '」？',

      .withSuccessHandler(() => { clearDirty(); setStatus(key, '已刪除項目', 'ok'); renderMatrixPanel(key); })
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))

    google.script.run
      .withSuccessHandler(preview => {
        if (!devSummary) return;

        const box = document.getElementById('dev-targets-box');

/** 低減後金額 = 金額 × (1 - 低減目標%/100)，四捨五入到整數方便對數字 */
function devReducedAmount(r) {
  return Math.round(num(r.Amount) * (1 - num(r.ChallengeReductionPct) / 100));
}
function syncDevReduced_(i) {
  const cell = document.getElementById('dev-reduced-' + i);
  if (cell) cell.value = devReducedAmount(devRows[i]);
}

  devRows[i].ChallengeReductionPct = value;

  scheduleDevTargetsPreview_();
  devDirty_();
}
/** 雙向試算：直接輸入「低減後金額」時反推低減目標% */
function onDevReducedInput(i, value) {
  const amount = num(devRows[i].Amount);
  const reduced = num(value);
  devRows[i].ChallengeReductionPct = amount ? Math.round((1 - reduced / amount) * 10000) / 100 : 0;
  const pctInput = document.getElementById('dev-pct-' + i);
  if (pctInput) pctInput.value = devRows[i].ChallengeReductionPct;
  scheduleDevTargetsPreview_();
  devDirty_();
}

function loadChartEditor_(keepSelection) {
  const cacheKey = panelCacheKey_('lineitems', 'both');
  const apply = data => {
    chartEditor = data;

      if (!keepSelection) { chartSelected = chartSelected && data.lines.some(l => l.LineCode === chartSelected) ? chartSelected : ''; }
    }
    if (chartSelected && chartSelected !== '__new__') {
      const line = data.lines.find(l => l.LineCode === chartSelected);
      chartDraft = line ? JSON.parse(JSON.stringify(line)) : null;
      if (!line) chartSelected = '';
    }
    drawChartEditor_();
  };
  if (panelDataCache_[cacheKey] && !isDirty_()) apply(panelDataCache_[cacheKey]);
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      panelDataCache_[cacheKey] = data;
      if (isDirty_() && chartEditor) { chartEditor.problems = data.problems; chartEditor.preview = data.preview; return; }
      apply(data);
    }))

/** 科目樹：售價結構一段、損益一段；父科目底下的子科目縮排，可以各自在同一層拖曳排序 */
function drawChartTreeBody_() {
  const body = document.getElementById('chart-tree-body');
  if (!body) return;
  const lines = chartEditor.lines;
  const kids = {};
  const codes = {};
  lines.forEach(l => { codes[l.LineCode] = true; });
  lines.forEach(l => { const p = l.ParentLine && codes[l.ParentLine] ? l.ParentLine : ''; (kids[p] = kids[p] || []).push(l); });
  const problemsOf = {};
  chartEditor.problems.forEach(p => { (problemsOf[p.code] = problemsOf[p.code] || []).push(p); });
  const q = chartFilter.trim().toLowerCase();
  const matches = l => !q || l.LineName.toLowerCase().indexOf(q) !== -1 || l.LineCode.toLowerCase() === q;
  const subtreeMatches = l => matches(l) || (kids[l.LineCode] || []).some(subtreeMatches);

  const rowHtml = (l, depth) => {
    const probs = problemsOf[l.LineCode] || [];
    const hasErr = probs.some(p => p.level === 'error'), hasWarn = probs.some(p => p.level === 'warning');
    const isGroup = (kids[l.LineCode] || []).length > 0;
    const cls = ['tree-row', isGroup ? 'group' : '', l.isProtected ? 'subtotal-row' : '', chartSelected === l.LineCode ? 'selected' : '', q && !matches(l) ? 'dimmed' : ''].filter(c => c).join(' ');
    const tag = l.CalcType === 'INPUT' ? '輸入' : l.CalcType === 'DEV_AMORT' ? '攤提' : (l.isDefaultFormula ? '公式' : '公式*');
    return `<div class="${cls}" style="padding-left:${8 + depth * 18}px;" onclick="selectChartLine('${esc(l.LineCode)}')">
      ${q ? '<span style="width:22px;"></span>' : dragHandleHtml('拖曳調整「' + l.LineName + '」的順序')}
      <span class="tree-name" title="${esc(l.LineName)}">${esc(l.LineName)}</span>
      ${hasErr ? '<span class="tree-err" data-tip="公式有錯誤">!</span>' : hasWarn ? '<span class="tree-warn" data-tip="沒有被算進營業淨利">?</span>' : ''}
      <span class="ct-badge ct-${esc(l.CalcType)}" data-tip="${esc(CALC_TYPE_INFO[l.CalcType][0] + (l.CalcType === 'FORMULA' ? '：' + l.Formula : '') + (l.CalcType === 'FORMULA' && !l.isDefaultFormula && DEFAULT_FORMULA_HINT_[l.LineCode] ? '\n（已改過預設公式）' : ''))}">${tag}</span>
      <span class="tree-code">${esc(l.LineCode)}</span>
    </div>`;
  };
  const blockHtml = (l, depth) => {
    if (q && !subtreeMatches(l)) return '';
    const children = kids[l.LineCode] || [];
    return `<div class="tree-block" data-key="${esc(l.LineCode)}">${rowHtml(l, depth)}${children.length ? `<div class="tree-children" data-parent="${esc(l.LineCode)}">${children.map(c => blockHtml(c, depth + 1)).join('')}</div>` : ''}</div>`;
  };
  const top = kids[''] || [];
  const price = top.filter(l => l.Category === '售價結構');
  const pl = top.filter(l => l.Category !== '售價結構');
  body.innerHTML = `
    ${price.length ? `<div class="tree-section">售價結構</div><div class="tree-top" data-parent="" data-section="price">${price.map(l => blockHtml(l, 0)).join('')}</div>` : ''}
    <div class="tree-section">損益</div><div class="tree-top" data-parent="" data-section="pl">${pl.map(l => blockHtml(l, 0)).join('')}</div>`;
  if (q) return;
  body.querySelectorAll('.tree-top, .tree-children').forEach(container => {
    makeSortable(container, { items: '.tree-block', direct: true, onEnd: () => saveChartOrderFromDom_() });
  });
}

/** 拖曳放開後：依畫面上的樹狀順序組出完整順序(含父科目)一次送後端 */
function saveChartOrderFromDom_() {
  const items = [];
  const walk = (container, parent) => {
    Array.from(container.children).forEach(block => {
      if (!block.classList.contains('tree-block')) return;
      items.push({ LineCode: block.getAttribute('data-key'), ParentLine: parent });
      const childBox = block.querySelector(':scope > .tree-children');
      if (childBox) walk(childBox, block.getAttribute('data-key'));
    });
  };
  document.querySelectorAll('#chart-tree-body .tree-top').forEach(top => walk(top, ''));
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      toast('已更新科目順序', 'ok', 1400);
      loadChartEditor_(true);
    }))
    .withFailureHandler(err => { toast(err.message, 'err'); loadChartEditor_(true); })
    .setLineOrder(currentVehicleTypeId, items);
}

/** 父科目選項：公式裡有 CHILDREN() 的科目(會把子科目加總起來的才適合當父科目)，或目前已經有子科目的科目 */
function chartParentOptions_(selfCode) {
  const lines = chartEditor.lines;
  const descendants = {};
  const mark = code => lines.filter(l => l.ParentLine === code).forEach(l => { descendants[l.LineCode] = true; mark(l.LineCode); });
  if (selfCode) mark(selfCode);
  const opts = lines.filter(l => l.LineCode !== selfCode && !descendants[l.LineCode] &&
    ((l.CalcType === 'FORMULA' && /CHILDREN\s*\(/i.test(l.Formula || '')) || lines.some(x => x.ParentLine === l.LineCode)));
  return [['', '（頂層，不屬於任何小計）']].concat(opts.map(l => [l.LineCode, l.LineName + '（' + l.LineCode + '）']));
}

function insertFormulaText(text) {
  const ta = document.getElementById('ce-formula');
  if (!ta) return;
  const start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
  const v = ta.value;
  const needSpace = start > 0 && /[\w\]\)]$/.test(v.slice(0, start)) && /^[\w\[]/.test(text);
  const ins = (needSpace ? ' ' : '') + text;
  ta.value = v.slice(0, start) + ins + v.slice(end);
  const pos = start + ins.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  chartDraft.Formula = ta.value;
  chartDirty_();
  updateFormulaReadable_();
  schedulePreview_();
}

/** 公式的可讀版本：代碼換成科目名稱、[名稱] 與函式上色，讓不熟代碼的人也看得懂 */
function formulaReadableHtml_(formula) {
  if (!formula || !String(formula).trim()) return '<span class="muted">（輸入公式後，這裡會用科目名稱顯示）</span>';
  const map = chartCodeNameMap_();
  const refLabels = {};
  (chartEditor.referenceScenarios || []).forEach(r => { refLabels[r.ScenarioID] = r.label; });
  const src = String(formula);
  let out = '', i = 0;
  while (i < src.length) {
    const rest = src.slice(i);
    let m;
    if ((m = /^\[[^\]]*\]/.exec(rest))) { out += `<span class="fx-tok-name">${esc(m[0].slice(1, -1))}</span>`; i += m[0].length; continue; }
    if ((m = /^"[^"]*"/.exec(rest))) { const inner = m[0].slice(1, -1); out += esc(refLabels[inner] ? '「' + refLabels[inner] + '」' : m[0]); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_][A-Za-z0-9_]*(?=\s*\()/.exec(rest))) {
      const fnLabel = { CHILDREN: 'Σ子科目', TAXDEDUCT: 'Σ可扣除貨物稅科目' }[m[0].toUpperCase()];
      out += `<span class="fx-tok-fn">${esc(fnLabel || m[0].toUpperCase())}</span>`;
      i += m[0].length;
      if (fnLabel) { const close = /^\s*\(\s*\)/.exec(src.slice(i)); if (close) i += close[0].length; }
      continue;
    }
    if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
      out += map[m[0]] ? `<span class="fx-tok-code">${esc(map[m[0]])}</span>` : `<span class="negative">${esc(m[0])}</span>`;
      i += m[0].length; continue;
    }
    out += esc(rest[0].replace('*', '×').replace('/', '÷'));
    i++;
  }
  return '= ' + out;
}

/** 邊打公式邊試算：debounce 後送「還沒存的這一個科目」給後端算，不寫入任何資料 */
function schedulePreview_(immediate) {
  if (chartPreviewTimer_) clearTimeout(chartPreviewTimer_);
  chartPreviewTimer_ = setTimeout(() => {
    if (!chartDraft) return;
    const payload = chartDraftPayload_();
    if (chartSelected === '__new__') { renderChartPreview_(); return; }
    google.script.run
      .withSuccessHandler(res => { chartPreview = res; renderChartPreview_(); })
      .withFailureHandler(err => { chartPreview = { problems: [{ message: err.message }] }; renderChartPreview_(); })
      .previewLineFormula(currentVehicleTypeId, currentScenarioId, payload);
  }, immediate ? 0 : 350);
}
function renderChartPreview_() {
  const box = document.getElementById('ce-preview');
  if (box) box.innerHTML = chartPreviewHtml_();
  const st = document.getElementById('ce-status');
  if (st && chartDraft && chartDraft.CalcType === 'FORMULA') {
    const probs = chartPreview && chartPreview.problems || [];
    if (!String(chartDraft.Formula || '').trim()) { st.className = 'formula-status'; st.textContent = ''; }
    else if (probs.length) { st.className = 'formula-status err'; st.textContent = '✘ ' + probs.map(p => p.message).join('；'); }
    else if (chartPreview) { st.className = 'formula-status ok'; st.textContent = '✔ 公式正確'; }
  }
}
function chartPreviewHtml_() {
  if (!currentScenarioId) return '<p class="muted">右上角選一個情境就能看到試算結果。</p>';
  if (chartSelected === '__new__') return '<p class="muted">新增科目後就能試算。</p>';
  const cur = chartEditor.preview;
  const next = chartPreview && chartPreview.preview;
  const probs = (chartPreview && chartPreview.problems) || [];
  if (!cur && !next) return '<p class="muted">這個情境還沒有銷售構成資料，無法試算。</p>';
  const vehicles = (chartEditor.vehicles || []).filter(v => (cur && cur.values[v.VehicleID]) || (next && next.values[v.VehicleID]));
  if (!vehicles.length) return '<p class="muted">這個情境還沒有銷售構成資料，無法試算。</p>';
  const code = chartDraft.LineCode;
  const watch = [code, 'K'].filter((c, i, a) => a.indexOf(c) === i);
  const map = chartCodeNameMap_();
  return `${probs.length ? `<div class="callout err">${probs.map(p => esc(p.message)).join('<br>')}</div>` : ''}
    <div class="grid-scroll"><table class="grid-table preview-table">
      <thead><tr><th>車系</th>${watch.map(c => `<th>${esc(map[c] || c)}<div class="th-sub">目前</div></th><th>${esc(map[c] || c)}<div class="th-sub">修改後</div></th>`).join('')}<th>計算過程(修改後)</th></tr></thead>
      <tbody>${vehicles.map(v => {
        const a = cur && cur.values[v.VehicleID] || {}, b = next && next.values[v.VehicleID] || null;
        const err = next && next.errors[v.VehicleID] && (next.errors[v.VehicleID][code] || next.errors[v.VehicleID]['*']);
        const trace = next && next.traces[v.VehicleID] && next.traces[v.VehicleID][code];
        return `<tr><td class="row-head">${esc(v.VehicleCode || v.VehicleID)}</td>
          ${watch.map(c => {
            const av = a[c], bv = b ? b[c] : undefined;
            const changed = b && av !== undefined && bv !== undefined && Math.abs(av - bv) > 0.5;
            return `<td class="calc">${av === undefined ? '—' : fmt(av)}</td><td class="calc${changed ? ' ' + ((c === 'K' ? bv > av : bv < av) ? 'good' : 'bad') : ''}" style="${changed ? 'font-weight:700;' : ''}">${bv === undefined ? '—' : fmt(bv)}</td>`;
          }).join('')}
          <td class="${err ? 'err' : 'muted'}" style="text-align:left;white-space:pre-line;font-size:11.5px;max-width:420px;">${err ? '⚠ ' + esc(err) : esc(traceText_(trace, map))}</td></tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

function saveChartLineUi() {
  if (!chartDraft) return;
  const payload = chartDraftPayload_();
  if (!String(payload.LineName || '').trim()) { toast('請輸入科目名稱', 'warn'); return; }
  payload.__scenarioId = currentScenarioId;
  google.script.run
    .withSuccessHandler(safeHandler(res => {
      clearDirty();
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      chartEditor = res.editor;
      chartSelected = res.line.LineCode;
      chartDraft = JSON.parse(JSON.stringify(chartEditor.lines.find(l => l.LineCode === chartSelected) || res.line));

/* ================= GATE 審議報告(簡報)：現況與目標的差距、作法、說明 ================= */
let reportData = null;
let reportSel = { target: '', base: '', prev: '' };
let reportUnit = 1;              // 1 元 / 1000 千元
let reportActions = [];          // 編輯中的作法(目標情境)
let reportNoteEdits = {};        // { scenarioId: { LineCode: 說明 } } 還沒存的說明
let reportShowPrice = false;
const REPORT_PREFS_KEY_ = 'plReport.prefs.v1';

function loadReportPrefs_() {
  try {
    const p = JSON.parse(localStorage.getItem(REPORT_PREFS_KEY_) || 'null') || {};
    if (p.sel && p.sel[currentVehicleTypeId]) reportSel = Object.assign({ target: '', base: '', prev: '' }, p.sel[currentVehicleTypeId]);
    else reportSel = { target: '', base: '', prev: '' };
    if (p.unit === 1000 || p.unit === 1) reportUnit = p.unit;
    if (typeof p.showPrice === 'boolean') reportShowPrice = p.showPrice;
  } catch (e) { /* 沒有就用預設 */ }
}
function saveReportPrefs_() {
  try {
    const p = JSON.parse(localStorage.getItem(REPORT_PREFS_KEY_) || 'null') || {};
    p.sel = p.sel || {};
    p.sel[currentVehicleTypeId] = reportSel;
    p.unit = reportUnit; p.showPrice = reportShowPrice;
    localStorage.setItem(REPORT_PREFS_KEY_, JSON.stringify(p));
  } catch (e) { /* 存不了就算了 */ }
}

/** 沒選過時的預設：目標 = 目前情境(若是目標情境)或最後一個目標情境；現況 = 同一個 GATE 的現況情境 */
function defaultReportSel_() {
  const scs = scenarioCache;
  const ids = scs.map(s => s.ScenarioID);
  const valid = id => id && ids.indexOf(id) !== -1;
  if (!valid(reportSel.target)) {
    const cur = scs.find(s => s.ScenarioID === currentScenarioId);
    const targets = scs.filter(s => s.ScenarioType === '目標');
    reportSel.target = cur && cur.ScenarioType === '目標' ? cur.ScenarioID : (targets.length ? targets[targets.length - 1].ScenarioID : (cur ? cur.ScenarioID : (ids[0] || '')));
  }
  if (reportSel.base && !valid(reportSel.base)) reportSel.base = '';
  if (reportSel.prev && !valid(reportSel.prev)) reportSel.prev = '';
  if (!reportSel.base) {
    const t = scs.find(s => s.ScenarioID === reportSel.target);
    const base = scs.find(s => s.ScenarioType !== '目標' && t && s.Gate === t.Gate && s.ScenarioID !== t.ScenarioID) ||
      scs.find(s => s.ScenarioType !== '目標' && s.ScenarioID !== reportSel.target);
    reportSel.base = base ? base.ScenarioID : '';
  }
}

function renderReportPanel() {
  const panel = document.getElementById('panel-report');
  if (!requireScope('report', false)) return;
  if (!scenarioCache.length) {
    panel.innerHTML = emptyStateHtml('🗂', '這個車型還沒有情境', '報告比較「現況」與「目標」兩個情境，請先建立情境。', `<button class="btn" onclick="switchTab('scenarios')">前往情境設定</button>`);
    return;
  }
  loadReportPrefs_();
  defaultReportSel_();
  const opt = (id, allowEmpty, emptyText) => (allowEmpty ? `<option value="">${emptyText}</option>` : '') +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === id ? ' selected' : ''}>${esc(scenarioLabel(s))}（${esc(s.ScenarioType || '現況')}）</option>`).join('');
  panel.innerHTML = `
    <div class="card no-print">
      <div class="report-controls">
        <label class="field"><span>目標 / 本回</span><select onchange="setReportSel('target', this.value)">${opt(reportSel.target)}</select></label>
        <label class="field"><span>現況（差距的比較基準）</span><select onchange="setReportSel('base', this.value)">${opt(reportSel.base, true, '（不比較）')}</select></label>
        <label class="field"><span>前回（選填）</span><select onchange="setReportSel('prev', this.value)">${opt(reportSel.prev, true, '（不比較）')}</select></label>
        <label class="field"><span>金額單位</span><div class="seg">
          <button type="button" class="seg-btn${reportUnit === 1 ? ' active' : ''}" onclick="setReportUnit(1)">元/台</button>
          <button type="button" class="seg-btn${reportUnit === 1000 ? ' active' : ''}" onclick="setReportUnit(1000)">千元/台</button></div></label>
        <label class="chk" style="align-self:center;"><input type="checkbox" ${reportShowPrice ? 'checked' : ''} onchange="reportShowPrice=this.checked;saveReportPrefs_();drawReport_()"> 顯示售價結構</label>
        <span style="flex:1"></span>
        <button type="button" class="btn secondary" onclick="loadReport_()">重新計算</button>
        <button type="button" class="btn" onclick="printReport_()">列印 / 存成 PDF</button>
      </div>
      <p class="help" style="margin:10px 0 0;">每一張卡片是一頁 16:9 投影片，列印時每頁一張。「說明」欄可以直接點進去改（會存回該情境的科目說明，銷貨成本頁的說明欄也是同一份）；作法清單可以拖曳 ⠿ 排序。每張右上角的「複製」可以把表格貼進 PowerPoint / Excel。</p>
    </div>
    <div id="report-body"><p class="muted">計算中...</p></div>`;
  loadReport_();
}

function setReportSel(field, value) {
  const go = () => {
    reportSel[field] = value;
    saveReportPrefs_();
    loadReport_();
  };
  if (isDirty_()) confirmLeave_().then(ok => { if (ok) go(); }); else go();
}
function setReportUnit(u) {
  reportUnit = u;
  saveReportPrefs_();
  document.querySelectorAll('#panel-report .report-controls .seg-btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && u === 1) || (i === 1 && u === 1000)));
  drawReport_();
}

function loadReport_() {
  const body = document.getElementById('report-body');
  if (!reportSel.target) { if (body) body.innerHTML = '<p class="muted">請選擇目標情境。</p>'; return; }
  if (body && !reportData) body.innerHTML = '<p class="muted">計算中...</p>';
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      clearDirty();
      reportData = data;
      reportActions = (data.actions || []).map(a => Object.assign({}, a));
      reportNoteEdits = {};
      drawReport_();
    }))
    .withFailureHandler(err => { if (body) body.innerHTML = `<div class="callout err">報告計算失敗：${esc(err.message)}</div>`; })
    .getGateReport(reportSel.target === reportSel.base ? '' : reportSel.base, reportSel.target, reportSel.prev === reportSel.target ? '' : reportSel.prev);
}

/* ---- 報告用的小工具 ---- */
function rAmt_(v) { return v === undefined || v === null ? '' : fmt(Number(v) / reportUnit, reportUnit === 1000 ? 1 : 0); }
function rSigned_(v) { return v === undefined || v === null ? '' : signed_(Number(v) / reportUnit, reportUnit === 1000 ? 1 : 0); }
function rUnit_() { return reportUnit === 1000 ? '千元/台' : '元/台'; }
function rPct_(v, base) { return base ? (Number(v) / base * 100).toFixed(1) + '%' : ''; }
function reportLineName_(code) { const l = reportData.lines.find(x => x.LineCode === code); return l ? shortLineName(l.LineName) : code; }
function reportCodeNameMap_() { const m = {}; reportData.lines.forEach(l => { m[l.LineCode] = shortLineName(l.LineName); }); return m; }
function noteFor_(block, code) {
  const sid = block.meta.ScenarioID;
  if (reportNoteEdits[sid] && reportNoteEdits[sid][code] !== undefined) return reportNoteEdits[sid][code];
  return (block.notes || {})[code] || '';
}
function noteCellHtml_(block, code) {
  const sid = block.meta.ScenarioID;
  const dirty = reportNoteEdits[sid] && reportNoteEdits[sid][code] !== undefined;
  return `<td class="note${dirty ? ' dirty' : ''}" contenteditable="true" data-sc="${esc(sid)}" data-code="${esc(code)}" oninput="onReportNote(this)">${esc(noteFor_(block, code))}</td>`;
}
function onReportNote(el) {
  const sid = el.getAttribute('data-sc'), code = el.getAttribute('data-code');
  reportNoteEdits[sid] = reportNoteEdits[sid] || {};
  reportNoteEdits[sid][code] = el.innerText.replace(/\n+$/, '');
  el.classList.add('dirty');
  markDirty('report', saveReport_, () => { clearDirty(); loadReport_(); });
}
/** 科目對營業淨利的方向：收入類(A 底下或 A 本身) +1；成本/費用類 -1；小計與售價結構不算 */
function profitSign_(line) {
  if (line.isPriceStructure) return 0;
  if (line.LineCode === 'A') return 1;
  if (line.isSubtotal) return 0;
  let cur = line, guard = 0;
  while (cur && cur.ParentLine && guard++ < 20) {
    if (cur.ParentLine === 'A') return 1;
    cur = reportData.lines.find(l => l.LineCode === cur.ParentLine);
  }
  return -1;
}
function slideHtml_(no, title, sub, inner, copyId) {
  const t = reportData.target.meta;
  return `<section class="slide">
    <div class="slide-actions no-print">${copyId ? `<button type="button" class="btn secondary sm" onclick="copyReportTable('${copyId}')">複製表格</button>` : ''}</div>
    <div class="slide-head"><span class="slide-no">${esc(no)}</span><h2>${esc(title)}</h2><div class="slide-sub">${sub || ''}</div></div>
    ${inner}
    <div class="slide-foot"><span>${esc(reportData.vehicleTypeId)} 車型 ${esc(t.Gate)} 審議 · F/S 試算與目標成本作法說明</span><span>機密 · 單位：${esc(rUnit_())}</span></div>
  </section>`;
}

function drawReport_() {
  const body = document.getElementById('report-body');
  if (!body || !reportData) return;
  const R = reportData, T = R.target, B = R.base, P = R.prev;
  const slides = [];
  let n = 0;
  const no = () => String(++n).padStart(2, '0');
  slides.push(slideHtml_(no(), '損益目標與差距摘要', `${esc(R.vehicleTypeId)}　${esc(T.meta.label)}${B ? ' vs ' + esc(B.meta.label) : ''}`, reportSummaryHtml_()));
  if (B) slides.push(slideHtml_(no(), '現況 → 目標：營業淨利差距拆解', '每一根長條 = 該科目讓營業淨利增加(綠)或減少(紅)多少', reportBridgeHtml_()));
  if (B) slides.push(slideHtml_(no(), '現況與目標對照（加權平均）', '差距 = 目標 − 現況；對淨利影響已依科目方向換算', reportCompareHtml_(), 'rpt-compare'));
  slides.push(slideHtml_(no(), '目標成本作法', '差距由哪些作法補起來、擔當單位與進度', reportActionsHtml_(), 'rpt-actions'));
  slides.push(slideHtml_(no(), `細車型 FS 損益狀況（${T.meta.label}）`, `${esc(T.meta.ScenarioType)}情境`, reportFsHtml_(T, 'rpt-fs-target'), 'rpt-fs-target'));
  if (B) slides.push(slideHtml_(no(), `細車型 FS 損益狀況（${B.meta.label}）`, `${esc(B.meta.ScenarioType)}情境，供參`, reportFsHtml_(B, 'rpt-fs-base'), 'rpt-fs-base'));
  if (P) slides.push(slideHtml_(no(), '前回 vs 本回', `${esc(P.meta.label)} → ${esc(T.meta.label)}`, reportPrevHtml_(), 'rpt-prev'));
  slides.push(slideHtml_(no(), '開發總投（by 部門）', `攤提台數 ${fmt(T.dev.lifeCycleUnits)} 台`, reportDevHtml_(), 'rpt-dev'));
  const errCodes = Object.keys(T.errors || {});
  body.innerHTML = (errCodes.length ? `<div class="callout err no-print">目標情境有公式錯誤（以 0 計）：${errCodes.map(c => esc(reportLineName_(c)) + '：' + esc(T.errors[c])).join('；')}</div>` : '') + slides.join('');
  makeSortable(document.getElementById('rpt-actions-body'), {
    items: 'tr[data-key]',
    onEnd: keys => {
      const old = reportActions;
      reportActions = keys.map(k => old[Number(k)]);
      redrawReportActions_();
      markDirty('report', saveReport_, () => { clearDirty(); loadReport_(); });
    }
  });
}

function reportSummaryHtml_() {
  const R = reportData, T = R.target, B = R.base;
  const tK = T.weighted.K || 0, bK = B ? (B.weighted.K || 0) : null;
  const tRev = T.weighted.P8 || T.weighted.A || 0, bRev = B ? (B.weighted.P8 || B.weighted.A || 0) : 0;
  const tVol = T.volume.monthlyVolume || 0;
  const gap = B ? tK - bK : null;
  const effect = reportActions.reduce((s, a) => s + num(a.Effect), 0);
  const cover = gap && gap > 0 ? effect / gap : null;
  const byStatus = {};
  reportActions.forEach(a => { byStatus[a.Status] = (byStatus[a.Status] || 0) + num(a.Effect); });
  const statusColors = { '已結案': '#6a3dbd', '已確認': '#1c8a59', '進行中': '#3157d5', '規劃中': '#a3acc0' };
  const hero = (cls, label, numV, sub) => `<div class="hero ${cls}"><div class="hero-label">${label}</div><div class="hero-num${numV < 0 ? ' negative' : ''}">${rAmt_(numV)}</div><div class="hero-sub">${sub}</div></div>`;
  const keyCodes = ['A', 'B', 'C', 'E', 'G', 'I', 'K'].filter(c => T.weighted[c] !== undefined);
  return `
    <div class="kpi-hero">
      ${B ? hero('base', '現況 營業淨利/台', bK, `淨利率 ${rPct_(bK, bRev)}・月 ${fmt((B.volume.monthlyVolume || 0))} 台・月淨利 ${fmt(bK * (B.volume.monthlyVolume || 0) / 10000, 0)} 萬`) : ''}
      ${hero('target', '目標 營業淨利/台', tK, `淨利率 ${rPct_(tK, tRev)}・月 ${fmt(tVol)} 台・月淨利 ${fmt(tK * tVol / 10000, 0)} 萬`)}
      ${B ? `<div class="hero gap"><div class="hero-label">差距（目標 − 現況）</div><div class="hero-num${gap < 0 ? ' negative' : ''}">${rSigned_(gap)}</div>
        <div class="hero-sub">月效益 ${signed_(gap * tVol / 10000, 0)} 萬・LC ${fmt(T.lifeCycleUnits)} 台合計 ${signed_(gap * T.lifeCycleUnits / 1e8, 2)} 億</div></div>` : ''}
      <div class="hero cover"><div class="hero-label">作法覆蓋率</div>
        <div class="hero-num">${cover === null ? '—' : (cover * 100).toFixed(0) + '%'}</div>
        <div class="hero-sub">作法效果合計 ${rAmt_(effect)}${gap ? `・尚待補足 ${rAmt_(Math.max(0, gap - effect))}` : ''}</div>
        ${gap > 0 ? `<div class="cover-bar">${Object.keys(statusColors).map(st => byStatus[st] ? `<i style="width:${Math.min(100, byStatus[st] / gap * 100)}%;background:${statusColors[st]};" data-tip="${esc(st)} ${fmt(byStatus[st])}"></i>` : '').join('')}</div>` : ''}
      </div>
    </div>
    <div class="grid-scroll"><table class="rpt-table">
      <thead><tr><th style="text-align:left;">重點科目（加權平均）</th>${B ? '<th>現況</th><th>%</th>' : ''}<th>目標</th><th>%</th>${B ? '<th>差距</th>' : ''}<th style="text-align:left;">說明</th></tr></thead>
      <tbody>${keyCodes.map(c => {
        const line = R.lines.find(l => l.LineCode === c) || { LineCode: c };
        const d = B ? (T.weighted[c] || 0) - (B.weighted[c] || 0) : 0;
        const good = (c === 'B' ? -d : d) > 0.5, bad = (c === 'B' ? -d : d) < -0.5;
        return `<tr class="${c === 'K' ? 'key' : 'subtotal'}"><td class="name">${esc(reportLineName_(c))}</td>
          ${B ? `<td>${rAmt_(B.weighted[c])}</td><td class="pct">${rPct_(B.weighted[c], bRev)}</td>` : ''}
          <td>${rAmt_(T.weighted[c])}</td><td class="pct">${rPct_(T.weighted[c], tRev)}</td>
          ${B ? `<td class="${good ? 'gap-good' : bad ? 'gap-bad' : ''}">${rSigned_(d)}</td>` : ''}
          ${noteCellHtml_(T, c)}</tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="help">月銷 ${fmt(tVol)} 台・LC ${esc(String(T.volume.lifeCycleYears || ''))} 年・攤提台數 ${fmt(T.lifeCycleUnits)} 台；車系構成：${(T.vehicles || []).map(v => `${esc(v.VehicleCode)} ${fmt(v.salesMixPct, 1)}%`).join('・')}</p>`;
}

/** 差距拆解(瀑布圖)：現況營業淨利 → 各科目的影響 → 目標營業淨利。影響最大的 10 個科目單獨列，其他合併 */
function reportBridgeHtml_() {
  const R = reportData, T = R.target, B = R.base;
  const contribs = R.lines.map(l => {
    const sign = profitSign_(l);
    if (!sign) return null;
    if (R.lines.some(x => x.ParentLine === l.LineCode)) return null;   // 有子科目的群組不重複算
    const d = ((T.weighted[l.LineCode] || 0) - (B.weighted[l.LineCode] || 0)) * sign;
    return Math.abs(d) >= 0.5 ? { code: l.LineCode, label: shortLineName(l.LineName), value: d } : null;
  }).filter(x => x).sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
  const start = B.weighted.K || 0, end = T.weighted.K || 0;
  const top = contribs.slice(0, 10);
  const rest = contribs.slice(10).reduce((s, c) => s + c.value, 0);
  const explained = top.reduce((s, c) => s + c.value, 0) + rest;
  const other = (end - start) - explained;
  const steps = top.slice();
  if (Math.abs(rest) >= 0.5) steps.push({ label: `其他 ${contribs.length - 10} 個科目`, value: rest });
  if (Math.abs(other) >= 1) steps.push({ label: '公式/取整差異', value: other });
  const actionsByCode = {};
  reportActions.forEach(a => { if (a.LineCode) (actionsByCode[a.LineCode] = actionsByCode[a.LineCode] || []).push(a); });
  return `
    <div class="bridge-legend"><span><i style="display:inline-block;width:10px;height:10px;background:#3157d5;border-radius:2px;"></i> 營業淨利</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#1c8a59;border-radius:2px;"></i> 改善</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#d23c3c;border-radius:2px;"></i> 惡化</span></div>
    ${bridgeSvg_(start, steps, end)}
    <div class="two-col" style="margin-top:10px;">
      <div><b style="font-size:13px;">改善最多</b><ul class="problem-list">${contribs.filter(c => c.value > 0).slice(0, 5).map(c =>
