/**
 * 第一次使用時，在 Apps Script 編輯器手動執行一次 setupSpreadsheet()，
 * 會自動建立所有分頁、寫入標題列，並灌入固定的損益科目表(PLLineItems)。
 * 重複執行是安全的（已存在的分頁/資料不會被清空）。
 */
function setupSpreadsheet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  Object.keys(SCHEMA).forEach(function (sheetName) {
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
    }
    var headers = SCHEMA[sheetName];
    sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    sheet.setFrozenRows(1);
  });

  // AuditLog 為選配表，獨立處理（欄位固定，不放進主要 SCHEMA 迴圈）
  var auditSheet = ss.getSheetByName('AuditLog');
  if (!auditSheet) {
    auditSheet = ss.insertSheet('AuditLog');
    auditSheet.getRange(1, 1, 1, 6).setValues([['Timestamp', 'User', 'SheetName', 'RowID', 'Action', 'Payload']]);
    auditSheet.setFrozenRows(1);
  }

  invalidateSheetCache_();   // 分頁/標題列剛建立，清掉可能已快取的空結果
  seedPLLineItems_();

  // 移除當初建立 Sheet 時自動附帶的空白預設分頁。
  // 不同語系的 Google Sheet 預設分頁名稱不同(英文 Sheet1、中文 工作表1...)，
  // 所以不比對名稱，只要是「完全空白(0列0欄)」且不在我們預期的分頁清單裡，就視為可清除的預設分頁。
  var expectedNames = Object.keys(SCHEMA).concat(['AuditLog']);
  ss.getSheets().forEach(function (sheet) {
    var name = sheet.getName();
    if (expectedNames.indexOf(name) === -1 && sheet.getLastRow() === 0 && sheet.getLastColumn() === 0) {
      ss.deleteSheet(sheet);
    }
  });

  var summary = '資料庫初始化完成，共建立 ' + ss.getSheets().length + ' 個分頁。';
  try {
    SpreadsheetApp.getUi().alert(summary);
  } catch (e) {
    // 從 Apps Script 編輯器直接執行(而非透過 Sheets 選單)時 getUi() 可能無法使用，
    // 這不影響初始化本身是否成功，改用記錄檔輸出即可。
    Logger.log(summary);
  }
}

/**
 * 灌入預設損益科目。已存在的科目不覆蓋（使用者可能已在「科目設定」頁面改過名稱或排序），
 * 但自動計算科目的 AutoSource 一律以程式碼為準補寫回去，避免使用者誤刪標記後
 * 該科目變成可手動輸入、跟自動計算的金額重複計列。
 */
function seedPLLineItems_() {
  var sheet = getSheet_(SHEETS.PL_LINE_ITEMS);
  // 本函式直接用 appendRow/setValue 寫入(沒走 upsertRow_)，所以要自己負責讓讀取快取失效

  var existing = sheetToObjects_(SHEETS.PL_LINE_ITEMS);
  var existingCodes = existing.map(function (r) { return r.LineCode; });

  var codeCol = SCHEMA.PLLineItems.indexOf('LineCode') + 1;
  var autoCol = SCHEMA.PLLineItems.indexOf('AutoSource') + 1;
  // 直接掃 LineCode 欄取得實際列號（sheetToObjects_ 會濾掉空白列，索引不能拿來當列號用）
  var lastRow = sheet.getLastRow();
  var codeRows = lastRow >= 2 ? sheet.getRange(2, codeCol, lastRow - 1, 1).getValues() : [];

  PL_LINE_ITEMS.forEach(function (line) {
    if (existingCodes.indexOf(line.LineCode) === -1) {
      sheet.appendRow(SCHEMA.PLLineItems.map(function (h) { return line[h] !== undefined ? line[h] : ''; }));
      return;
    }
    if (!line.AutoSource) return;
    for (var i = 0; i < codeRows.length; i++) {
      if (codeRows[i][0] === line.LineCode) {
        if (sheet.getRange(i + 2, autoCol).getValue() !== line.AutoSource) {
          sheet.getRange(i + 2, autoCol).setValue(line.AutoSource);
        }
        break;
      }
    }
  });
  invalidateSheetCache_(SHEETS.PL_LINE_ITEMS);
}

}

 * 目前唯一的對象是舊版的「集團預算匯率」：換算銷貨成本與開發總投一律用現況匯率，

  var known = TAX_RATE_PARAM_NAMES.concat(FX_PARAM_NAMES);
  var removed = withLock_(function () {
    var stale = (sheetToObjects_(SHEETS.PARAMETERS) || []).filter(function (r) {

    });
    stale.forEach(function (r) { deleteRow_(SHEETS.PARAMETERS, 'ParamID', r.ParamID); });
    return stale.length;
  });
  reportMaintenance_(removed
    ? '已刪除 ' + removed + ' 筆未使用的參數（如舊版的「集團預算匯率」）。'
    : '沒有未使用的參數需要清除。');
}

function reportMaintenance_(message) {

  } catch (e) {
    Logger.log(message);
  }
}

<script>
/**
 * 地端版開機：在前端 script.html 執行之前，把後端主機架好、換上 google.script.run 替身。
 * 這段一定要比 script.html 早執行(build-local.js 把它放在 <body> 最前面)，
 * 前端 DOMContentLoaded 一開場就會呼叫 getBootstrap()。
 */
(function () {
  'use strict';
  var USER_KEY = 'fsLocal.user.v1';

  // 瀏覽器暫存可能整個不能用(無痕模式、公司政策封鎖)，每一次存取都要包 try/catch
  var storage = {
    getItem: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    setItem: function (k, v) { window.localStorage.setItem(k, v); }   // 寫入失敗要讓主機知道，不在這裡吞掉
  };

  function getUser() {
    var name = storage.getItem(USER_KEY);
    return name || '本機使用者';
  }

  var host = FSHost.createHost({
    factory: FSBackendFactory, shim: FSGasShim, pack: FSPack,
    storage: storage, getUser: getUser
  });
  host.start();

  window.FSLocal = {
    host: host,
    USER_KEY: USER_KEY,
    getUser: getUser,
    setUser: function (name) { try { window.localStorage.setItem(USER_KEY, name); } catch (e) { /* 存不了就只在這次有效 */ } },
    demoPack: function () {
      var el = document.getElementById('fs-demo-pack');
      return el ? FSPack.parsePack(el.textContent) : null;
    }
  };

  window.google = window.google || {};
  window.google.script = {
    run: FSHost.createScriptRun(host),
    host: { close: function () { } }
  };

  // 同一個檔案開了兩個分頁(或兩份副本，Chrome 的 file:// 共用同一份暫存)：另一邊存檔時，這邊手上的資料就過期了，
  // 再存就會把對方剛改的蓋掉。偵測到就停止寫入、請使用者重新整理。
  window.addEventListener('storage', function (e) {
    if (e.key === host.STORAGE_KEY) host.markStale();
  });
}());

</script>

  <script>
/* ---------------------------------------------------------------
 * 前端分成兩種頁面：
 *   1. ENTITIES  — 單純的主檔維護(車型/車系/情境/科目)，沿用「表單 + 列表」通用元件。
 *   2. 表格編輯頁 — 銷售構成、銷貨成本、營業費用、開發總投、費率、匯率，
 *      改成一次看到全部、直接在格子裡改、最後按一次「儲存」的表格式介面。
 * ------------------------------------------------------------- */
const GATE_OPTIONS = ['GATE F', 'GATE E', 'GATE D', 'GATE C', 'GATE B', 'GATE A', 'GATE Z'];
const SCENARIO_TYPES = ['現況', '目標'];
// 結構科目與自動計算科目不能刪、父科目也不能改，否則損益鏈會接錯段（後端也會擋，這裡只是不畫按鈕）
const PROTECTED_LINE_CODES = ['A', 'B', 'C', 'E', 'G', 'I', 'K'];
const PL_LINE_PARENT_OPTIONS = [
  ['B', 'B 銷貨成本'],
  ['E', 'E 銷售費用(銷貨毛利前)'],
  ['G', 'G 產品貢獻前費用'],
  ['I', 'I 固定營業費用']
];
const LINE_PARENT_OPTIONS = [['', '(結構科目，不可改)']].concat(PL_LINE_PARENT_OPTIONS);
// 開發總投填寫流程：部門 -> 設備/模具/費用大類 -> 實際攤提落點。大類只是用來分組/篩選
// 攤提落點選單，避免自己新增的攤提落點越加越多之後全部混在同一個下拉選單裡不好找。
const DEV_AMORT_CATEGORIES = ['設備', '模具', '費用'];
// 建立新情境時可以整批帶入的資料類別
const SCENARIO_COPY_PARTS = [
  { key: 'salesmix', label: '銷售構成' },
  { key: 'costofsales', label: '銷貨成本' },
  { key: 'devinvestment', label: '開發總投' },
  { key: 'operatingexpense', label: '營業費用' },
  { key: 'parameters', label: '費率/匯率' }
];

const ENTITIES = {
  vehicletypes: {
    label: '車型主檔', pk: 'VehicleTypeID',
    getFn: 'getVehicleTypes', saveGridFn: 'saveVehicleTypeGrid', deleteFn: 'deleteVehicleType',
    renameFn: 'renameVehicleType', scopedBy: null,
    columns: [
      { name: 'VehicleTypeID', label: '車型代號', lockAfterCreate: true, width: 140 },
      { name: 'Notes', label: '備註', width: 360 }
    ]
  },
  vehicles: {
    label: '車系設定', pk: 'VehicleID',
    getFn: 'getVehicles', saveGridFn: 'saveVehicleGrid', deleteFn: 'deleteVehicle',
    renameFn: 'renameVehicle', scopedBy: 'vehicleType',
    columns: [
      { name: 'VehicleID', label: '車系代號', lockAfterCreate: true, width: 140 },
      { name: 'VehicleCode', label: '車系名稱', width: 220 },
      { name: 'SortOrder', label: '排序', type: 'number', width: 70 },
      { name: 'Notes', label: '備註', width: 320 }
    ]
  },
  scenarios: {
    label: '情境設定', pk: 'ScenarioID',
    getFn: 'getScenarios', saveGridFn: 'saveScenarioGrid', deleteFn: 'deleteScenario',
    scopedBy: 'vehicleType', createUi: 'scenario',
    columns: [
      { name: 'Gate', label: 'GATE 別', type: 'select', options: GATE_OPTIONS, width: 110 },
      { name: 'ScenarioName', label: '情境名稱', width: 200 },
      { name: 'ScenarioType', label: '情境性質', type: 'select', options: SCENARIO_TYPES, width: 90 },
      { name: 'CreatedDate', label: '建立日期', type: 'date', width: 140 },
      { name: 'Notes', label: '備註', width: 280 }
    ]
  },
  lineitems: {
    label: '科目設定', pk: 'LineCode',
    getFn: 'getPLLineItems', saveGridFn: 'savePLLineItemGrid', deleteFn: 'deletePLLineItem',
    scopedBy: null,
    restorable: true,
    columns: [
      { name: 'LineCode', label: '科目代碼', auto: true, width: 80 },
      // 自動計算科目與結構科目的名稱寫的就是它的公式，由程式決定；改了只會讓名稱跟數字對不起來
      { name: 'LineName', label: '科目名稱', width: 280, lockIf: r => r.__existing && isFixedLineItem(r) },
      { name: 'ParentLine', label: '父科目', type: 'select', options: LINE_PARENT_OPTIONS, width: 190,
        lockIf: r => r.__existing && isFixedLineItem(r) },
      { name: 'Category', label: '分類', width: 110 },
      { name: 'SortOrder', label: '排序值', type: 'number', width: 80 },
      { name: 'AutoSource', label: '自動計算來源', readOnly: true, width: 150 }
    ]
  }
};

/** 結構科目或自動計算科目：父科目固定、名稱不可改 */
function isFixedLineItem(row) {
  return PROTECTED_LINE_CODES.indexOf(row.LineCode) !== -1 || !!row.AutoSource;
}
/**
 * DEV_AMORT 是使用者自己在「開發總投」頁面新增的攤提落點，跟其他內建的自動計算科目
 * (售價結構、貨物稅、季Margin、模具/設備/CMC/BASE廠開發費攤提)不一樣：那些是程式定義、
 * 名稱代表固定公式；DEV_AMORT 是使用者自訂的科目，理當跟其他手動科目一樣可以刪除
 * （後端 deletePLLineItem 仍會擋住「還有開發總投資料指到這裡」的情況，不會憑空弄丟資料）。
 */
function isDeletableAutoLineItem(row) {
  return row.AutoSource === 'DEV_AMORT';
}

// 表格編輯頁：key -> 渲染函式名稱
const GRID_PANELS = {
  salesmix: 'renderSalesMixPanel',
  costofsales: 'renderCostOfSalesPanel',
  operatingexpense: 'renderOperatingExpensePanel',
  devinvestment: 'renderDevInvestmentPanel',
  paramrates: 'renderRatePanel',
  paramfx: 'renderFxPanel'
};

let currentVehicleTypeId = '';
let currentScenarioId = '';
let currentScenario = null;      // 目前情境的完整資料(含 Gate / ScenarioType)
let scenarioCache = [];
let currentTab = 'vehicletypes';

/**
 * 表格編輯頁的資料快取：切分頁很常常常是「切回剛剛看過的那頁」，
 * 每次都重新跟後端要資料會讓畫面先空白一下才畫出來，感覺卡頓。
 * 有快取就先用快取立刻畫出來，同時仍照常在背景重新取一次最新資料、拿到後才重畫，
 * 兩次畫面之間使用者已經看得到內容，不再面對空白等待。
 */
const panelDataCache_ = {};
/**
 * scope 決定這個快取鍵要不要跟著車型/情境變動：
 * 'none' 兩者都跟資料無關（如車型主檔、科目設定 —— 全系統共用一份）、
 * 'vehicleType' 只跟車型有關（如車系設定 —— 情境換了不影響）、
 * 'scenario' 只跟情境有關（如開發總投 —— 車型換了情境也會跟著清空，不必重複區分）、
 * 省略或 'both' 則兩者都要區分（如銷售構成、銷貨成本）。
 * 沒分清楚的話，資料明明沒變，換一下情境或車型就會讓不相關頁面的快取失效，
 * 切回去時又要空等一次伺服器回應，感覺像整頁重新載入。
 */
function panelCacheKey_(prefix, scope) {
  const vt = (scope === 'none' || scope === 'scenario') ? '' : currentVehicleTypeId;
  const sc = (scope === 'none' || scope === 'vehicleType') ? '' : currentScenarioId;
  return prefix + '::' + vt + '::' + sc;
}
// 靜默模式：初始化(或切換車型)時會連續設定車型/情境，每一步都重繪會造成
// 同一個分頁被畫三、四次、也重複打伺服器。開啟後只更新狀態不渲染，最後統一渲染一次。
let silent = false;

/* ---------------- 共用工具 ---------------- */
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(v, digits) {
  if (v === '' || v === null || v === undefined) return '';
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: digits === undefined ? 0 : digits });
}
/** 科目名稱/備註等使用者輸入會被塞進 HTML，& < > " 都要轉義，否則表格會被破壞 */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function showGlobalError(err) {
  const box = document.getElementById('global-error');
  const msg = '發生錯誤：' + (err && err.message ? err.message : err);
  console.error(err);
  if (!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}
function clearGlobalError() {
  const box = document.getElementById('global-error');
  if (box) box.style.display = 'none';
}
/** 包住 success handler：伺服器呼叫成功後前端渲染若丟例外，也要顯示在畫面上 */
function safeHandler(fn) {
  return function () {
    try { clearGlobalError(); return fn.apply(null, arguments); }
    catch (e) { showGlobalError(e); }
  };
}
function setStatus(key, text, cls) {
  const el = document.getElementById('status-' + key);
  if (el) { el.textContent = text; el.className = 'status-msg' + (cls ? ' ' + cls : ''); }
}
/** 表格編輯頁的共用外框：標題 + 工具列 + 狀態 + 內容 */
function gridShell(key, title) {
  return `
    <h3>${title}</h3>
    <div id="toolbar-${key}" class="toolbar"></div>
    <div id="status-${key}" class="status-msg"></div>
    <div id="grid-${key}"></div>
  `;
}
function scenarioLabel(s) {
  return [s.Gate, s.ScenarioName].filter(v => v).join(' ') || s.ScenarioID;
}
function requireScope(key, needScenario) {
  const panel = document.getElementById('panel-' + key);
  if (!currentVehicleTypeId) { panel.innerHTML = '<p class="muted">請先在上方選擇車型</p>'; return false; }
  if (needScenario && !currentScenarioId) { panel.innerHTML = '<p class="muted">請先在上方選擇情境</p>'; return false; }
  return true;
}

/* ---------------- 頁籤 / 上方選單 ---------------- */
function switchTab(key) {
  currentTab = key;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  saveAppState_();
  renderTab(key);
}

/**
 * 記住「目前在哪一頁、選了哪個車型/情境」，讓整頁重新載入後能回到原本的位置。
 * 地端版匯入資料包、載入示範資料後都會整頁重新載入，使用者自己按 F5 也是；沒有這層記憶的話，
 * 畫面每次都會跳回「車型主檔」分頁、車型/情境選單也重設成第一筆。存最基本的三個狀態就好，
 * 表格編輯頁裡「還沒存檔的修改」本來就無法安全地跨頁面重新載入還原，不在這裡處理。
 */
const APP_STATE_KEY_ = 'plApp.state.v1';
function saveAppState_() {
  try {
    localStorage.setItem(APP_STATE_KEY_, JSON.stringify({
      tab: currentTab, vehicleTypeId: currentVehicleTypeId, scenarioId: currentScenarioId
    }));
  } catch (e) { /* 無痕模式等情況存不了就算了，不影響功能 */ }
}
function loadAppState_() {
  try {
    const s = JSON.parse(localStorage.getItem(APP_STATE_KEY_) || 'null');
    if (s && typeof s === 'object') return s;
  } catch (e) { /* 壞掉的資料當作沒有 */ }
  return {};
}

function renderTab(key) {
  if (silent) return;
  if (key === 'dashboard') loadComparisonPicker();
  else if (GRID_PANELS[key]) window[GRID_PANELS[key]]();
  else if (ENTITIES[key]) renderEntityPanel(key);
}

/** 開場：車型 + 情境一次取回，期間不重繪，最後只渲染一次目前分頁 */
function loadVehicleTypeSelector(preferredId, preferredScenarioId) {
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      renderVehicleTypeOptions(data.vehicleTypes || [], data.vehicleTypeId);
      currentVehicleTypeId = data.vehicleTypeId || '';
      renderScenarioOptions(data.scenarios || [], preferredScenarioId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); renderTab(currentTab); })
    .getBootstrap(preferredId || currentVehicleTypeId);
}

function renderVehicleTypeOptions(types, pick) {
  const sel = document.getElementById('vehicletype-selector');
  sel.innerHTML = '<option value="">-- 選擇車型 --</option>' +
    types.map(t => `<option value="${esc(t.VehicleTypeID)}">${esc(t.VehicleTypeID)}</option>`).join('');
  sel.value = pick || '';
}

/** 把情境選單畫出來並決定選哪一個，不觸發伺服器呼叫 */
function renderScenarioOptions(scenarios, preferredId) {
  scenarioCache = scenarios || [];
  const sel = document.getElementById('scenario-selector');
  sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const ids = scenarioCache.map(s => s.ScenarioID);
  const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
    : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
    : ids[0] || '';
  sel.value = pick;
  setCurrentScenario(pick);
}

/** 只更新目前情境狀態與標籤，渲染交給呼叫端決定 */
function setCurrentScenario(value) {
  currentScenarioId = value;
  currentScenario = scenarioCache.filter(s => s.ScenarioID === value)[0] || null;
  const badge = document.getElementById('scenario-type-badge');
  if (badge) {
    badge.textContent = currentScenario ? (currentScenario.ScenarioType || '現況') : '';
    badge.style.display = currentScenario ? 'inline-block' : 'none';
  }
  saveAppState_();
}

function onVehicleTypeChange(value) {
  currentVehicleTypeId = value;
  currentScenarioId = '';
  currentScenario = null;
  saveAppState_();
  // 車型換了之後情境清單也要換，換完才渲染一次，避免同一個分頁畫兩遍
  loadScenarioSelector();
}

function loadScenarioSelector(preferredId) {
  const sel = document.getElementById('scenario-selector');
  if (!currentVehicleTypeId) {
    sel.innerHTML = '<option value="">-- 請先選車型 --</option>';
    scenarioCache = [];
    setCurrentScenario('');
    renderTab(currentTab);
    return;
  }
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      renderScenarioOptions(scenarios, preferredId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); })
    .getScenarios(currentVehicleTypeId);
}

function onScenarioChange(value) {
  setCurrentScenario(value);
  renderTab(currentTab);
}

/* ---------------- 主檔維護（表格直接編輯，不需要先按「編輯」） ---------------- */
let entityRows = {};        // key -> 目前表格上的資料列（__existing 標記是否已存在於後端）
let pendingStatus = null;   // 重畫表格後才顯示的訊息（例如建立情境後整個面板會被重繪）

function renderEntityPanel(key) {
  const cfg = ENTITIES[key];
  const panel = document.getElementById('panel-' + key);
  if (cfg.scopedBy === 'vehicleType' && !currentVehicleTypeId) {
    panel.innerHTML = '<p class="muted">請先在上方選擇車型</p>';
    return;
  }
  panel.innerHTML = gridShell(key, cfg.label);
  loadEntityData(key);
}

/** ENTITIES 的 scopedBy 只有 'vehicleType' 或 null，剛好對應到快取鍵要區分到什麼程度 */
function entityCacheScope_(cfg) { return cfg.scopedBy === 'vehicleType' ? 'vehicleType' : 'none'; }

function loadEntityData(key) {
  const cfg = ENTITIES[key];
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId] : [];
  const cacheKey = panelCacheKey_(key, entityCacheScope_(cfg));
  const apply = rows => { entityRows[key] = (rows || []).map(r => Object.assign({}, r, { __existing: true })); drawEntityGrid(key); };
  if (panelDataCache_[cacheKey]) apply(panelDataCache_[cacheKey]);
  google.script.run
    .withSuccessHandler(safeHandler(rows => { panelDataCache_[cacheKey] = rows; apply(rows); }))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function drawEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = entityRows[key] || [];

  document.getElementById('toolbar-' + key).innerHTML = `
    <button type="button" class="btn" onclick="saveEntityGrid('${key}')">儲存</button>
    ${cfg.createUi === 'scenario' ? '' :
      `<button type="button" class="btn secondary" onclick="addEntityRow('${key}')">新增一列</button>`}
    ${cfg.restorable ? '<button type="button" class="btn secondary" onclick="restoreBuiltInLines()">恢復內建科目預設值</button>' : ''}
  ` + (cfg.createUi === 'scenario' ? scenarioToolbarHtml() : '');

  const body = rows.length
    ? rows.map((r, i) => `<tr${r.__existing ? '' : ' class="new-row"'}>
        ${cfg.columns.map(col => entityCellHtml(key, i, col, r)).join('')}
        <td class="row-actions">${entityRowActionHtml(key, i, r, rows.length)}</td>
      </tr>`).join('')
    : `<tr><td class="muted" colspan="${cfg.columns.length + 1}">尚無資料</td></tr>`;

  document.getElementById('grid-' + key).innerHTML = `
    <div class="grid-scroll">
      <table class="grid-table entity-table">
        <thead><tr>${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th>操作</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;

  if (key === 'scenarios') autoFillNewScenarioName_();

  if (pendingStatus && pendingStatus.key === key) {
    setStatus(key, pendingStatus.text, pendingStatus.cls);
    pendingStatus = null;
  }
}

function entityCellHtml(key, i, col, row) {
  const value = row[col.name] === undefined || row[col.name] === null ? '' : row[col.name];
  const locked = col.readOnly || col.auto ||
    (col.lockAfterCreate && row.__existing) ||
    (col.lockIf && col.lockIf(row));
  const style = col.width ? ` style="width:${col.width}px;"` : '';

  if (locked) {
    // 新增列的自動編號欄位還沒有值，先讓使用者知道存檔時系統會配號
    const shown = col.auto && !value ? '(儲存時自動編號)' : value;
    return `<td class="row-head calc">${esc(shown)}</td>`;
  }
  if (col.type === 'select') {
    const options = col.options.map(o => {
      const [v, text] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}"${String(value) === String(v) ? ' selected' : ''}>${esc(text)}</option>`;
    }).join('');
    return `<td><select${style} onchange="onEntityField('${key}', ${i}, '${col.name}', this.value)">${options}</select></td>`;
  }
  return `<td><input type="${col.type || 'text'}" step="any" value="${esc(value)}"${style}
    oninput="onEntityField('${key}', ${i}, '${col.name}', this.value)"></td>`;
}

function entityHasSortOrder(key) {
  return ENTITIES[key].columns.some(c => c.name === 'SortOrder');
}

/** 有排序值(SortOrder)的表格才給上下移動鈕：直接跟前/後一列交換排序值，比自己打數字調順序直覺 */
function moveButtonsHtml(key, i, total) {
  if (!entityHasSortOrder(key)) return '';
  return `<button type="button" class="btn secondary row-move" title="往上移" ${i === 0 ? 'disabled' : ''}
      onclick="moveEntityRow('${key}', ${i}, -1)">▲</button>` +
    `<button type="button" class="btn secondary row-move" title="往下移" ${i === total - 1 ? 'disabled' : ''}
      onclick="moveEntityRow('${key}', ${i}, 1)">▼</button>`;
}

/**
 * 上下移動：交換這一列跟相鄰列的排序值(SortOrder)與陣列位置，畫面馬上照新順序重排，
 * 不必先按儲存才看得到效果；跟其他修改一樣，最後按「儲存」才會真的送出。
 * 新增列(還沒存檔、沒有既有 SortOrder)只搬陣列位置，跟已存在列的排序值互換沒有意義。
 */
function moveEntityRow(key, i, dir) {
  const rows = entityRows[key];
  const j = i + dir;
  if (j < 0 || j >= rows.length) return;
  const a = rows[i], b = rows[j];
  if (a.SortOrder !== '' && a.SortOrder !== undefined && a.SortOrder !== null &&
      b.SortOrder !== '' && b.SortOrder !== undefined && b.SortOrder !== null) {
    const tmp = a.SortOrder; a.SortOrder = b.SortOrder; b.SortOrder = tmp;
  }
  rows[i] = b; rows[j] = a;
  drawEntityGrid(key);
}

function entityRowActionHtml(key, i, row, total) {
  const move = moveButtonsHtml(key, i, total);
  if (!row.__existing) {
    return move + `<button type="button" class="btn secondary" onclick="removeEntityRow('${key}', ${i})">移除</button>`;
  }
  const cfg = ENTITIES[key];
  const renameBtn = cfg.renameFn
    ? `<button type="button" class="btn secondary" onclick="renameEntityRow('${key}', ${i})">重新命名</button>` : '';
  if (key === 'lineitems' && isFixedLineItem(row) && !isDeletableAutoLineItem(row)) {
    return move + renameBtn + '<span class="muted">不可刪除</span>';
  }
  return move + renameBtn + `<button type="button" class="btn danger" onclick="deleteEntityRow('${key}', ${i})">刪除</button>`;
}

/**
 * 車型/車系代號重新命名：不能直接在格子裡改代號 —— 代號是其他表格的外鍵(車系記著車型代號、
 * 銷售構成/成本記著車系代號)，直接改字串只會讓那些資料的鍵值對不到，變成孤兒資料。
 * 改用後端的 rename 函式，一次把所有引用該代號的地方都更新過去。
 */
function renameEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const oldId = row[cfg.pk];
  const newId = (prompt('新的代號：', oldId) || '').trim();
  if (!newId || newId === oldId) return;
  const args = key === 'vehicles' ? [currentVehicleTypeId, oldId, newId] : [oldId, newId];
  setStatus(key, '重新命名中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      // 改名會牽動其他表格裡引用這個代號的資料(銷售構成/成本/費用...)，這些頁面的快取一併清掉，
      // 不然切分頁時會先看到還記得舊代號的畫面。
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      // 目前選取的車型代號如果剛好是被改名的那個，選單跟後續呼叫都要跟著改用新代號
      if (key === 'vehicletypes' && currentVehicleTypeId === oldId) currentVehicleTypeId = newId;
      pendingStatus = { key: key, text: `已將「${oldId}」改名為「${newId}」`, cls: 'ok' };
      loadEntityData(key);
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.renameFn](...args);
}

function onEntityField(key, i, field, value) {
  entityRows[key][i][field] = value;
  if (key === 'scenarios' && (field === 'CreatedDate' || field === 'ScenarioType')) {
    autoFillScenarioName_(i);
  }
}

/** yyyy-MM-dd -> "MMDD"，用來組情境名稱的日期後綴 */
function dateToMMDD_(dateStr) {
  const m = String(dateStr || '').match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? m[1] + m[2] : '';
}

/**
 * 情境名稱自動帶入：選了建立日期(或改了情境性質)後，把名稱補成「情境性質+MMDD」(如「現況0901」)。
 * 只在名稱是空白、或還是上一次自動帶入的值時才覆蓋 —— 使用者手動打過的名稱不會被蓋掉，
 * 蓋掉之後再打的字仍算「手動」，之後就算又改日期也不會再被自動帶入的值覆蓋。
 */
function autoFillScenarioName_(i) {
  const row = entityRows.scenarios[i];
  const suffix = dateToMMDD_(row.CreatedDate);
  if (!suffix) return;
  const auto = (row.ScenarioType || '') + suffix;
  if (!row.ScenarioName || row.ScenarioName === row.__scenarioNameAuto) {
    row.ScenarioName = auto;
    row.__scenarioNameAuto = auto;
    drawEntityGrid('scenarios');
  }
}

function addEntityRow(key) {
  const cfg = ENTITIES[key];
  const row = { __existing: false };
  cfg.columns.forEach(c => { row[c.name] = ''; });
  if (cfg.pk) row[cfg.pk] = '';
  entityRows[key].push(row);
  drawEntityGrid(key);
}

/** 還沒存進後端的新增列，直接從畫面上拿掉就好 */
function removeEntityRow(key, i) {
  entityRows[key].splice(i, 1);
  drawEntityGrid(key);
}

function deleteEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  if (!confirm('確定要刪除這筆資料嗎？')) return;
  setStatus(key, '刪除中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      pendingStatus = { key: key, text: '已刪除', cls: 'ok' };
      loadEntityData(key);
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.deleteFn](row[cfg.pk]);
}

function saveEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = (entityRows[key] || []).map(r => {
    // 只送出後端 schema 認得的欄位，__existing 這類前端旗標不要一起送過去
    const copy = {};
    cfg.columns.forEach(c => { copy[c.name] = r[c.name] === undefined ? '' : r[c.name]; });
    if (cfg.pk) copy[cfg.pk] = r[cfg.pk] === undefined ? '' : r[cfg.pk];
    return copy;
  });
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId, rows] : [rows];

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
      entityRows[key] = (saved || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid(key);
      setStatus(key, '已儲存', 'ok');
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveGridFn](...args);
}

/**
 * 把內建科目的名稱、父科目、分類、排序整個回復成程式預設值。
 * 自動計算科目的名稱平常就會自動對回程式碼（開頁時 getBootstrap 會同步），
 * 這顆按鈕是給明細科目的名稱與排序被改亂之後用的。
 */
function restoreBuiltInLines() {
  if (!confirm('會把所有內建科目的名稱、父科目、分類與排序回復成系統預設值（自己新增的科目不受影響），確定嗎？')) return;
  setStatus('lineitems', '回復中...');
  google.script.run
    .withSuccessHandler(safeHandler(rows => {
      entityRows.lineitems = (rows || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid('lineitems');
      setStatus('lineitems', '已回復內建科目的預設名稱與排序', 'ok');
    }))
    .withFailureHandler(err => setStatus('lineitems', '錯誤：' + err.message, 'err'))
    .restoreBuiltInLineItems();
}

/** 車型/情境改動後，上方的選單也要跟著更新（但不要重畫目前這個分頁，會蓋掉剛顯示的訊息） */
function afterEntityChange(key) {
  if (key === 'vehicletypes') refreshVehicleTypeOptions();
  if (key === 'scenarios') refreshScenarioOptions();
}

function refreshVehicleTypeOptions() {
  google.script.run.withSuccessHandler(safeHandler(types => {
    renderVehicleTypeOptions(types || [], currentVehicleTypeId);
  })).getVehicleTypes();
}

function refreshScenarioOptions(preferredId) {
  google.script.run.withSuccessHandler(safeHandler(scenarios => {
    renderScenarioOptions(scenarios, preferredId);
  })).getScenarios(currentVehicleTypeId);
}

/* ---- 情境設定：以既有情境為基礎建立 / 把既有情境的資料帶進目前情境 ---- */
function scenarioToolbarHtml() {
  const existing = (entityRows.scenarios || []).filter(s => s.__existing);
  const sourceOptions = existing
    .map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const partChecks = SCENARIO_COPY_PARTS.map(p => `
    <label class="chk"><input type="checkbox" id="copy-part-${p.key}" checked> ${p.label}</label>`).join('');

  return `
    <div class="toolbar-block">
      <div class="toolbar-block-title">新增情境</div>
      <div class="toolbar">
        <label>GATE 別
          <select id="new-scenario-gate">${GATE_OPTIONS.map(g => `<option value="${g}">${g}</option>`).join('')}</select>
        </label>
        <label>情境名稱
          <input id="new-scenario-name" type="text" style="width:170px;" placeholder="例：現況0901">
        </label>
        <label>情境性質
          <select id="new-scenario-type" onchange="autoFillNewScenarioName_()">${SCENARIO_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
        </label>
        <label>以既有情境為基礎
          <select id="new-scenario-source">
            <option value="">(不帶入，建立空白情境)</option>${sourceOptions}
          </select>
        </label>
        <button type="button" class="btn" onclick="createScenario()">建立情境</button>
      </div>
      <div class="toolbar">
        <span class="muted">要帶入的資料：</span>${partChecks}
      </div>
      <div class="toolbar">
        <span class="muted">或把既有情境的資料帶進目前選取的情境（${esc(currentScenario ? scenarioLabel(currentScenario) : '尚未選擇情境')}）：</span>
        <select id="import-scenario-source">
          <option value="">-- 選擇來源情境 --</option>${sourceOptions}
        </select>
        <button type="button" class="btn secondary" onclick="importIntoCurrentScenario()">帶入目前情境</button>
      </div>

function selectedCopyParts() {
  return SCENARIO_COPY_PARTS
    .filter(p => { const el = document.getElementById('copy-part-' + p.key); return el && el.checked; })
    .map(p => p.key);
}

/** 「新增情境」表單：情境性質改變時，名稱欄位還是空白或還是上次自動帶入的值，就重新帶一次(性質+今天MMDD) */
let newScenarioNameAuto_ = '';
function autoFillNewScenarioName_() {
  const nameEl = document.getElementById('new-scenario-name');
  const typeEl = document.getElementById('new-scenario-type');
  if (!nameEl || !typeEl) return;
  const auto = (typeEl.value || '') + dateToMMDD_(today());
  if (!nameEl.value || nameEl.value === newScenarioNameAuto_) {
    nameEl.value = auto;
    newScenarioNameAuto_ = auto;
  }
}

function createScenario() {
  const name = val('new-scenario-name');
  if (!name) { setStatus('scenarios', '請輸入情境名稱', 'err'); return; }
  const source = val('new-scenario-source');
  const parts = selectedCopyParts();
  if (source && !parts.length) {
    setStatus('scenarios', '請至少勾選一項要帶入的資料，或把來源情境改成「不帶入」', 'err');
    return;
  }
  setStatus('scenarios', '建立中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      pendingStatus = { key: 'scenarios', text: source ? '已建立情境，並帶入來源情境的資料' : '已建立情境', cls: 'ok' };
      loadEntityData('scenarios');
      refreshScenarioOptions(saved && saved.ScenarioID);
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .createScenarioFrom({
      ScenarioID: '',
      Gate: val('new-scenario-gate'),
      ScenarioName: name,
      ScenarioType: val('new-scenario-type'),
      VehicleTypeID: currentVehicleTypeId,
      CreatedDate: today(),
      Notes: ''
    }, source, parts);
}

function importIntoCurrentScenario() {
  const source = val('import-scenario-source');
  if (!currentScenarioId) { setStatus('scenarios', '請先在上方選擇要帶入的目標情境', 'err'); return; }
  if (!source) { setStatus('scenarios', '請選擇來源情境', 'err'); return; }
  const parts = selectedCopyParts();
  if (!parts.length) { setStatus('scenarios', '請至少勾選一項要帶入的資料', 'err'); return; }
  if (!confirm('帶入會先清掉目前情境所勾選類別的資料，再整批複製來源情境的內容，確定嗎？')) return;

  setStatus('scenarios', '帶入中...');
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      setStatus('scenarios', '已帶入來源情境的資料（開發總投的挑戰低減目標已清空，請重新填寫）', 'ok');
    }))
    .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
    .copyScenarioData(source, currentScenarioId, parts);
}

function today() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ================= 銷售構成（依車系自動列出，台數/構成比動態連動） ================= */
let salesMixRows = [];

function renderSalesMixPanel() {
  if (!requireScope('salesmix', true)) return;
  const panel = document.getElementById('panel-salesmix');
  panel.innerHTML = gridShell('salesmix', '銷售構成與售價');
  const cacheKey = panelCacheKey_('salesmix');
  if (panelDataCache_[cacheKey]) { salesMixRows = panelDataCache_[cacheKey].rows || []; drawSalesMixGrid(); }
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      panelDataCache_[cacheKey] = data;
      salesMixRows = data.rows || [];
      drawSalesMixGrid();
    }))
    .withFailureHandler(showGlobalError)
    .getSalesMixGrid(currentScenarioId, currentVehicleTypeId);
}

function drawSalesMixGrid() {
  const grid = document.getElementById('grid-salesmix');
  if (!salesMixRows.length) {
    document.getElementById('toolbar-salesmix').innerHTML = '';
    grid.innerHTML = '<p class="muted">這個車型還沒有車系，請先到「車系設定」建立車系。</p>';
    return;
  }
  const totalUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);

  document.getElementById('toolbar-salesmix').innerHTML = `
    <label style="display:flex;align-items:center;gap:6px;">車型月總台數：
      <input id="sm-total" type="number" step="any" style="width:110px;" value="${totalUnits || ''}"
             oninput="onSalesMixTotalInput()">
    </label>
    <button type="button" class="btn" onclick="saveSalesMixGrid()">儲存</button>
    <span class="muted">LIFE CYCLE 總台數 = 月台數 × 12 × LC年限</span>
  `;

  grid.innerHTML = `
    <div class="grid-scroll">
    <table class="grid-table sticky-head-col">
      <thead><tr>
        <th>車系</th><th>構成比%</th><th>月台數</th><th>LC年限</th><th>LC總台數</th>
        <th>建議零售價<br>(含稅)</th><th>強配件<br>售價</th><th>廢車<br>處理費</th><th>稅別</th>
        <th title="計算貨物稅完稅價格時，從廠價扣除這個金額">水平配件外移<br>調降廠價</th>
        <th>備註</th>
      </tr></thead>
      <tbody>
        ${salesMixRows.map((r, i) => `
          <tr>
            <td class="row-head">${esc(r.VehicleID)}${r.VehicleCode ? ' - ' + esc(r.VehicleCode) : ''}</td>
            <td><input type="number" step="any" value="${esc(r.SalesMixPct)}" oninput="onSalesMixPctInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MonthlyVolume)}" oninput="onSalesMixVolumeInput(${i}, this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.LifeCycleYears)}" oninput="onSalesMixField(${i}, 'LifeCycleYears', this.value)"></td>
            <td class="calc" id="sm-lc-${i}">${fmt(num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears))}</td>
            <td><input type="number" step="any" value="${esc(r.ListPriceTaxIncl)}" oninput="onSalesMixField(${i}, 'ListPriceTaxIncl', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.MandatoryAccessoryPrice)}" oninput="onSalesMixField(${i}, 'MandatoryAccessoryPrice', this.value)"></td>
            <td><input type="number" step="any" value="${esc(r.ScrapFee)}" oninput="onSalesMixField(${i}, 'ScrapFee', this.value)"></td>
            <td><select onchange="onSalesMixField(${i}, 'ScrapFeeTaxStatus', this.value)">
              ${['含稅', '未稅'].map(o => `<option value="${o}"${r.ScrapFeeTaxStatus === o ? ' selected' : ''}>${o}</option>`).join('')}
            </select></td>
            <td><input type="number" step="any" value="${esc(r.HorizontalPartsPriceAdj)}" oninput="onSalesMixField(${i}, 'HorizontalPartsPriceAdj', this.value)"></td>
            <td><input type="text" class="note-input" value="${esc(r.Notes)}" oninput="onSalesMixField(${i}, 'Notes', this.value)"></td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td class="row-head">合計</td>
        <td id="sm-sum-pct" class="calc"></td>
        <td id="sm-sum-units" class="calc"></td>
        <td></td><td id="sm-sum-lc" class="calc"></td>
        <td colspan="6"></td>
      </tr></tfoot>
    </table>
    </div>`;
  updateSalesMixTotals();
}

function onSalesMixField(i, field, value) { salesMixRows[i][field] = value; updateSalesMixTotals(); }

/** 改台數：總台數 = 各車系台數加總，所有構成比依台數重算 */
function onSalesMixVolumeInput(i, value) {
  salesMixRows[i].MonthlyVolume = value === '' ? '' : num(value);
  const total = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  salesMixRows.forEach(r => { r.SalesMixPct = total > 0 ? round2(num(r.MonthlyVolume) / total * 100) : ''; });
  document.getElementById('sm-total').value = total || '';
  syncSalesMixInputs({ skipVolumeIndex: i });
}

/** 改構成比：以車型月總台數為基準反推該車系台數，其餘車系的構成比再依台數回算 */
function onSalesMixPctInput(i, value) {
  salesMixRows[i].SalesMixPct = value === '' ? '' : num(value);
  const total = num(val('sm-total'));
  if (total > 0) {
    // 台數保留小數：構成比 5% × 365 台 = 18.25 台，四捨五入會讓構成比對不回去
    salesMixRows[i].MonthlyVolume = round2(num(value) / 100 * total);
  }
  syncSalesMixInputs({ skipPctIndex: i });
}

/** 改車型月總台數：各車系依目前構成比重新分配台數 */
function onSalesMixTotalInput() {
  const total = num(val('sm-total'));
  if (total > 0) {
    salesMixRows.forEach(r => { r.MonthlyVolume = round2(num(r.SalesMixPct) / 100 * total); });
  }
  syncSalesMixInputs({});
}

function round2(n) { return Math.round(n * 100) / 100; }

/** 把 salesMixRows 的值寫回輸入框（跳過使用者正在輸入的那一格，避免游標跳動） */
function syncSalesMixInputs(opts) {
  const rows = document.querySelectorAll('#grid-salesmix tbody tr');
  salesMixRows.forEach((r, i) => {
    const tr = rows[i];
    if (!tr) return;
    const pctInput = tr.children[1].querySelector('input');
    const volInput = tr.children[2].querySelector('input');
    if (opts.skipPctIndex !== i) pctInput.value = r.SalesMixPct === '' ? '' : r.SalesMixPct;
    if (opts.skipVolumeIndex !== i) volInput.value = r.MonthlyVolume === '' ? '' : r.MonthlyVolume;
  });
  updateSalesMixTotals();
}

function updateSalesMixTotals() {
  const sumPct = salesMixRows.reduce((s, r) => s + num(r.SalesMixPct), 0);
  const sumUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  let sumLc = 0;
  salesMixRows.forEach((r, i) => {
    const lc = num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears);
    sumLc += lc;
    const cell = document.getElementById('sm-lc-' + i);
    if (cell) cell.textContent = fmt(lc);
  });
  const pctCell = document.getElementById('sm-sum-pct');
  if (pctCell) {
    pctCell.textContent = fmt(sumPct, 2) + '%';
    // 構成比合計不是 100% 時標紅，避免加權平均被算錯還沒發現
    pctCell.className = 'calc' + (Math.abs(sumPct - 100) > 0.01 && sumPct !== 0 ? ' negative' : '');
  }
  const unitCell = document.getElementById('sm-sum-units');
  if (unitCell) unitCell.textContent = fmt(sumUnits);
  const lcCell = document.getElementById('sm-sum-lc');
  if (lcCell) lcCell.textContent = fmt(sumLc);
}

function drawMatrix(key) {

  const data = matrixData[key];
  const grid = document.getElementById('grid-' + key);

  const parentSelect = cfg.parentOptions
    ? `<select id="${key}-new-parent">${cfg.parentOptions.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`

    <button type="button" class="btn" onclick="saveMatrix('${key}')">儲存</button>
    <span class="toolbar-sep"></span>
    ${parentSelect}
    <input id="${key}-new-name" type="text" placeholder="新增項目名稱" style="width:160px;">
    <button type="button" class="btn secondary" onclick="addMatrixLine('${key}')">新增項目</button>
  `;

  if (!data.vehicles.length) {
    grid.innerHTML = '<p class="muted">這個車型還沒有車系，請先到「車系設定」建立車系。</p>';
    return;
  }

  const currencyCell = line => {
    if (!cfg.hasCurrency) return '';
    const cur = firstCellProp(data, line.value, 'Currency') || 'TWD';
    const opts = (data.currencies || ['TWD']).slice();
    if (opts.indexOf(cur) === -1) opts.push(cur);

    </select></td>`;
  };

  // 欄標題直接標出銷售構成比，才看得出右邊那欄「加權平均」是用什麼權重算出來的
  const mixTotal = data.vehicles.reduce((sum, v) => sum + num(v.SalesMixPct), 0);
  grid.innerHTML = `
    ${mixTotal ? '' : '<p class="status-msg err">這個情境還沒有銷售構成比，加權平均無法計算，請先到「銷售構成」頁填構成比。</p>'}
    <div class="grid-scroll">
    <table class="grid-table sticky-head-col">
      <thead><tr>
        <th>項目</th>
        ${cfg.hasCurrency ? '<th>幣別</th>' : ''}
        ${data.vehicles.map((v, i) => `<th>
          <div class="col-move">
            <button type="button" class="btn secondary row-move" title="往左移" ${i === 0 ? 'disabled' : ''}
              onclick="reorderMatrixVehicle('${key}', '${esc(v.VehicleID)}', -1)">◀</button>
            <button type="button" class="btn secondary row-move" title="往右移" ${i === data.vehicles.length - 1 ? 'disabled' : ''}
              onclick="reorderMatrixVehicle('${key}', '${esc(v.VehicleID)}', 1)">▶</button>
          </div>
          ${esc(v.VehicleCode || v.VehicleID)}
          <div class="th-sub">構成比 ${fmt(num(v.SalesMixPct), 1)}%</div></th>`).join('')}
        <th>加權平均</th><th>備註</th><th></th>
      </tr></thead>
      <tbody>
        ${data.lines.map(line => `
          <tr data-line="${esc(line.value)}">
            <td class="row-head">${esc(matrixLineName(line))}</td>
            ${currencyCell(line)}
            ${data.vehicles.map(v => {
              const cell = (data.values[line.value] || {})[v.VehicleID] || {};
              return `<td><input type="number" step="any" value="${esc(cell.Amount)}"
                data-line="${esc(line.value)}" data-vehicle="${esc(v.VehicleID)}" data-rowid="${esc(cell.RowID)}"
                oninput="updateMatrixTotals('${key}')"></td>`;
            }).join('')}
            <td class="calc" id="${key}-sum-${esc(line.value)}"></td>
            <td><input type="text" id="${key}-note-${esc(line.value)}" value="${esc(firstCellProp(data, line.value, 'Notes'))}"></td>
            <td><button type="button" class="btn danger" onclick="deleteMatrixLine('${key}', '${esc(line.value)}')">刪除</button></td>
          </tr>`).join('')}

    </table>

/** 自動計算科目的格子：唯讀，貨物稅(b13)滑鼠移過去可以看到完整計算過程 */
function autoLineCellHtml(data, lineCode, vehicleId) {
  const amt = (data.autoValues[lineCode] || {})[vehicleId];
  if (amt === undefined) return '<td class="calc muted">—</td>';
  const detail = data.commodityTaxDetail && data.commodityTaxDetail[vehicleId];
  // 跟儀表板一樣用 data-tip 提示(原生 title 在會橫向捲動的表格裡常被裁掉)
  const tip = (lineCode === 'b13' && detail) ? ` tabindex="0" data-tip="${esc('貨物稅計算過程\n' + commodityTaxDetailText(detail))}"` : '';
  return `<td class="calc"${tip}>${fmt(amt)}</td>`;
}
/** 把貨物稅的計算過程攤開成文字，滑鼠移到金額上就看得到每一步是怎麼來的 */
function commodityTaxDetailText(d) {
  const pct = n => (n * 100).toFixed(1) + '%';
  return [
    `廠價(未稅) ${fmt(d.exFactoryPrice)}`,
    `− 水平配件外移調降廠價 ${fmt(d.horizontalPartsAdj)}`,
    `− 廣宣+促銷+批標售+季Margin ${fmt(d.deductTotal)}`,
    `= 完稅價格基礎 ${fmt(d.dutiableBase / (d.calcRate || 1))}`,
    `× 完稅價格計算率 ${pct(d.calcRate)} = ${fmt(d.dutiableBase)}`,
    `÷ (1+貨物稅率${pct(d.taxRate)}) × 貨物稅率 = 貨物稅 ${fmt(d.tax)}`
  ].join('\n');
}

/** 同一列(科目)的幣別/備註是列層級設定，讀取時取該列第一個有值的格子 */
function firstCellProp(data, lineCode, prop) {
  const row = data.values[lineCode] || {};
  const key = Object.keys(row).filter(k => row[k] && row[k][prop])[0];
  return key ? row[key][prop] : '';
}

/**
 * 右邊那一欄是「加權平均」而不是合計：一列是同一個成本項目在各車系的單台金額，
 * 把它們相加只會得到一個沒有意義的數字。改成用銷售構成比加權，跟儀表板的加權平均欄位一致。
 * 表尾則是各車系自己的科目合計（同一車系各科目相加是有意義的）。
 */
function updateMatrixTotals(key) {
  const data = matrixData[key];
  const mix = {};
  let mixTotal = 0;
  data.vehicles.forEach(v => { mix[v.VehicleID] = num(v.SalesMixPct); mixTotal += num(v.SalesMixPct); });

  const colSum = {};
  let weightedGrand = 0;
  data.lines.forEach(line => {
    let weighted = 0;
    document.querySelectorAll(`#grid-${key} input[data-line="${line.value}"]`).forEach(inp => {
      const v = num(inp.value);
      colSum[inp.dataset.vehicle] = (colSum[inp.dataset.vehicle] || 0) + v;
      weighted += v * (mix[inp.dataset.vehicle] || 0);
    });
    weighted = mixTotal ? weighted / mixTotal : 0;
    weightedGrand += weighted;
    const cell = document.getElementById(`${key}-sum-${line.value}`);
    if (cell) cell.textContent = mixTotal ? fmt(weighted) : '—';
  });

  const autoSum = {};
  (data.autoLines || []).forEach(line => {
    data.vehicles.forEach(v => {
      const amt = (data.autoValues[line.value] || {})[v.VehicleID];
      if (amt !== undefined) autoSum[v.VehicleID] = (autoSum[v.VehicleID] || 0) + amt;
    });
  });

  data.vehicles.forEach(v => {
    const cell = document.getElementById(`${key}-colsum-${v.VehicleID}`);
    if (cell) cell.textContent = fmt(colSum[v.VehicleID] || 0);
    const withAutoCell = document.getElementById(`${key}-colsum-withauto-${v.VehicleID}`);
    if (withAutoCell) withAutoCell.textContent = fmt((colSum[v.VehicleID] || 0) + (autoSum[v.VehicleID] || 0));
  });
  const g = document.getElementById(`${key}-grandsum`);
  if (g) g.textContent = mixTotal ? fmt(weightedGrand) : '—';
}

function saveMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const cells = [];
  document.querySelectorAll(`#grid-${key} input[data-line]`).forEach(inp => {
    const line = inp.dataset.line;
    const cell = {
      RowID: inp.dataset.rowid || '',
      VehicleID: inp.dataset.vehicle,
      LineCode: line,
      Amount: inp.value === '' ? '' : num(inp.value),
      Notes: val(`${key}-note-${line}`)
    };
    if (cfg.hasCurrency) cell.Currency = val(`${key}-cur-${line}`) || 'TWD';
    cells.push(cell);
  });

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已儲存', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveFn](currentScenarioId, cells);
}

function addMatrixLine(key) {
  const cfg = MATRIX_CONFIG[key];
  const name = val(`${key}-new-name`);
  if (!name) { setStatus(key, '請先輸入項目名稱', 'err'); return; }
  const parent = cfg.parentOptions ? val(`${key}-new-parent`) : cfg.parentLine;
  setStatus(key, '新增中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已新增項目', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .addLineItemInline(parent, name);
}

function deleteMatrixLine(key, lineCode) {
  if (!confirm('科目表是全域共用的：刪除這個項目會一併清掉它在「所有情境」各車系已輸入的金額，確定嗎？')) return;
  setStatus(key, '刪除中...');
  google.script.run
    .withSuccessHandler(() => { setStatus(key, '已刪除項目', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .deleteLineItemInline(lineCode);
}

/**
 * 車系欄位順序：直接在矩陣頁面用左右移動鈕調整，不必切去「車系設定」頁。
 * 車系順序是全車型共用的設定（跟儀表板、車系設定頁看到的是同一份），
 * 立即存檔生效，其他頁面的快取要一併清掉，不然切分頁時會先看到還沒更新的舊順序。
 */
function reorderMatrixVehicle(key, vehicleId, direction) {

      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);

    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    .reorderVehicle(currentVehicleTypeId, vehicleId, direction);
}
