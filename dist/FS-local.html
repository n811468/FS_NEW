<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>車型損益試算系統（地端版）</title>
<style>
/* 地端版工具列：放在頁首下方的細條，跟 v2 版面同一套配色，不搶主畫面 */
#fs-local-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 28px; background: #fff; color: #475069;
  font-size: 12.5px; border-bottom: 1px solid #e3e7ef; }
#fs-local-bar .fsl-badge { background: #fff1c9; color: #7a4c02; font-weight: 700; font-size: 11px; padding: 2px 9px; border-radius: 999px; }
#fs-local-bar .fsl-spacer { flex: 1; }
#fs-local-bar .fsl-status { color: #8a93a8; }
#fs-local-bar .fsl-warn { color: #b9770e; font-weight: 700; }
#fs-local-bar .fsl-link { background: none; border: none; color: #3157d5; text-decoration: underline dotted; cursor: pointer; font-size: 12.5px; padding: 0; font-weight: 600; }
#fs-local-bar .fsl-more { width: auto; flex: none; padding: 4px 8px; font-size: 12.5px; border-radius: 6px; border: 1px solid #cdd4e1; background: #fff; color: #18213a; }
.fsl-btn { background: #fff; color: #18213a; border: 1px solid #cdd4e1; padding: 4px 11px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
.fsl-btn:hover { background: #eef1f7; }
.fsl-menu { position: relative; }
.fsl-menu > summary { list-style: none; display: inline-block; }
.fsl-menu > summary::-webkit-details-marker { display: none; }
.fsl-menu-list { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; background: #fff; border: 1px solid #cdd4e1; border-radius: 8px;
  box-shadow: 0 8px 24px -10px rgba(16,27,51,.3); padding: 4px; min-width: 190px; display: flex; flex-direction: column; }
.fsl-menu-item { background: none; border: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #18213a; }
.fsl-menu-item:hover { background: #eef1f7; }
.fsl-btn.primary { background: #3157d5; color: #fff; border-color: transparent; }
.fsl-btn.primary:hover { background: #2445b4; }
.fsl-btn.danger { background: #d23c3c; color: #fff; border-color: transparent; }
.fsl-btn.danger:hover { background: #a92b2b; }
#fs-local-banner { align-items: center; gap: 12px; padding: 9px 28px; font-size: 13px; }
#fs-local-banner.fsl-banner-info { background: #edf1fe; color: #213c91; }
#fs-local-banner.fsl-banner-danger { background: #fdeeee; color: #8b1f1f; }
#fs-local-dialog { border: none; border-radius: 14px; padding: 22px 24px; max-width: 640px; width: calc(100% - 32px); box-shadow: 0 10px 30px -12px rgba(16,27,51,.35); }
#fs-local-dialog::backdrop { background: rgba(16,27,51,.42); }
#fs-local-dialog h3 { margin: 0 0 12px; font-size: 16px; }
#fs-local-dialog .fsl-pre { white-space: pre-wrap; background: #f8f9fc; border: 1px solid #e3e7ef; border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: 13px; line-height: 1.6; max-height: 50vh; overflow: auto; }
#fs-local-dialog .fsl-help { font-size: 12px; color: #475069; padding-left: 18px; line-height: 1.7; }
#fs-local-dialog .fsl-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
@media print { #fs-local-bar, #fs-local-banner { display: none !important; } }

</style>
  
  <style>
  /* =====================================================================
   * 車型損益試算系統 v2 — 設計系統
   * 所有顏色/間距都走 :root 的變數；元件名稱沿用舊版(grid-table、pl-table、btn…)，
   * 各頁面的產生程式不必跟著改名，只是長相統一換新。
   * 完全離線：只用系統字型，不載入任何外部資源。
   * ===================================================================== */
  :root {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --surface-3: #eef1f7;
    --border: #e3e7ef;
    --border-strong: #cdd4e1;
    --text: #18213a;
    --text-2: #475069;
    --muted: #8a93a8;
    --primary: #3157d5;
    --primary-hover: #2445b4;
    --primary-weak: #edf1fe;
    --primary-line: #b9c8f6;
    --success: #1c8a59;
    --success-weak: #e8f6ef;
    --danger: #d23c3c;
    --danger-weak: #fdeeee;
    --warning: #b9770e;
    --warning-weak: #fff6e2;
    --subtotal: #fff8e4;
    --subtotal-hl: #f8ecc0;
    --sidebar: #101b33;
    --sidebar-2: #1a2847;
    --sidebar-text: #aeb9d3;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-1: 0 1px 2px rgba(16, 27, 51, .06), 0 1px 1px rgba(16, 27, 51, .04);
    --shadow-2: 0 10px 30px -12px rgba(16, 27, 51, .28);
    --font: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--font); margin: 0; background: var(--bg); color: var(--text); font-size: 14px;
    -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; }

  /* ---------------- App 外框：左側導覽 + 右側內容 ---------------- */
  .app { display: flex; min-height: 100vh; background: linear-gradient(to right, var(--sidebar) 232px, transparent 232px); }
  .sidebar { width: 232px; flex: none; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 20; transition: width .18s; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #4f7cff, #2541b2);
    display: grid; place-items: center; font-weight: 700; font-size: 15px; box-shadow: 0 4px 12px -4px rgba(79, 124, 255, .7); }
  .brand-text b { display: block; font-size: 14px; letter-spacing: .02em; }
  .brand-text span { font-size: 11px; color: var(--sidebar-text); }
  .nav-group { padding: 6px 10px 4px; }
  .nav-group-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #6d7ba0; padding: 10px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; color: var(--sidebar-text);
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; text-align: left; white-space: nowrap; }
  .nav-item svg { width: 17px; height: 17px; flex: none; opacity: .85; }
  .nav-item:hover { background: var(--sidebar-2); color: #fff; }
  .nav-item.active { background: #fff; color: var(--sidebar); font-weight: 600; box-shadow: 0 6px 16px -10px rgba(0, 0, 0, .6); }
  .nav-item.active svg { opacity: 1; color: var(--primary); }
  .nav-item .nav-badge { margin-left: auto; font-size: 10px; background: #e9b949; color: #1b1300; border-radius: 10px; padding: 1px 6px; font-weight: 700; }
  .sidebar-toggle { display: none; }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 16px; padding: 12px 28px;
    background: rgba(243, 245, 250, .86); backdrop-filter: saturate(160%) blur(10px); border-bottom: 1px solid var(--border); }
  .page-title { display: flex; flex-direction: column; min-width: 0; }
  .page-title .crumb { font-size: 11.5px; color: var(--muted); }
  .page-title h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .context-bar { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .ctx-picker { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow-1); }
  .ctx-picker label { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .ctx-picker select { border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text); padding: 4px 6px;
    min-width: 90px; cursor: pointer; outline: none; }
  .ctx-picker select:focus-visible { box-shadow: 0 0 0 3px var(--primary-weak); border-radius: 999px; }
  .type-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700;
    background: var(--surface-3); color: var(--text-2); }
  .type-badge.t-現況 { background: #e6f0ff; color: #2347b0; }
  .type-badge.t-目標 { background: #e8f6ef; color: #146c45; }

  #global-error { margin: 12px 28px 0; background: var(--danger-weak); color: #8b1f1f; padding: 10px 14px; border-radius: var(--radius-sm);
    font-size: 13px; border: 1px solid #f5c2c2; white-space: pre-line; }
  #local-bar-slot:empty { display: none; }

  main { padding: 22px 28px 120px; max-width: 1880px; width: 100%; }
  .panel { display: none; animation: fadeIn .16s ease-out; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* ---------------- 卡片/區塊 ---------------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 18px 20px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; gap: 12px; margin: -2px 0 12px; flex-wrap: wrap; }
  .card-head h3, .card-head h4 { margin: 0; font-size: 15px; }
  .card-head .muted { font-size: 12px; }
  .card-head .spacer { flex: 1; }
  .panel > h3, .grid-title { font-size: 16px; margin: 0 0 12px; font-weight: 700; }
  .page-intro { color: var(--text-2); font-size: 13px; margin: -4px 0 16px; line-height: 1.7; }
  .page-intro b { color: var(--text); }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-state .empty-icon { font-size: 34px; margin-bottom: 8px; opacity: .6; }
  .empty-state h4 { color: var(--text); margin: 0 0 6px; font-size: 15px; }
  .callout { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  .callout.info { background: var(--primary-weak); color: #213c91; border: 1px solid var(--primary-line); }
  .callout.warn { background: var(--warning-weak); color: #7a4c02; border: 1px solid #f0d49a; }
  .callout.err { background: var(--danger-weak); color: #8b1f1f; border: 1px solid #f5c2c2; }
  .callout.ok { background: var(--success-weak); color: #0f5a39; border: 1px solid #b3e2cb; }

  /* ---------------- 表單元件 ---------------- */
  select, input[type=text], input[type=number], input[type=date], input[type=search], textarea {
    padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 13px; background: #fff; color: var(--text);
    transition: border-color .12s, box-shadow .12s; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
  input::placeholder { color: #a5adbe; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-2); font-weight: 600; }
  .field > span { letter-spacing: .02em; }
  .field input, .field select, .field textarea { font-weight: 400; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .help { font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.6; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--primary); color: #fff; border: 1px solid transparent;
    padding: 7px 15px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap;
    transition: background .12s, box-shadow .12s, transform .05s; }
  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary-line); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn.secondary:hover { background: var(--surface-3); }
  .btn.ghost { background: transparent; color: var(--text-2); border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-3); color: var(--text); }
  .btn.danger { background: var(--surface); color: var(--danger); border-color: #f0c4c4; }
  .btn.danger:hover { background: var(--danger-weak); }
  .btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  .btn.icon { padding: 5px 7px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn svg { width: 15px; height: 15px; }
  .link-btn { appearance: none; border: none; background: transparent; color: var(--primary); font-size: 12px; cursor: pointer; padding: 0; font-weight: 600; }
  .link-btn:hover { text-decoration: underline; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); gap: 4px; }
  .toolbar label.chk, label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  .toolbar-sep { border-left: 1px solid var(--border-strong); height: 24px; margin: 0 2px; }
  .toolbar .spacer { flex: 1; }
  .toolbar-block { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 8px; background: var(--surface-2); }
  .toolbar-block-title { font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; letter-spacing: .03em; }
  .toolbar-block .toolbar { margin-bottom: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .status-msg { font-size: 12.5px; padding: 2px 0; min-height: 0; }
  .status-msg:empty { display: none; }
  .status-msg.ok { color: var(--success); }
  .status-msg.err { color: var(--danger); }
  .negative { color: var(--danger); }

  .seg { display: inline-flex; background: var(--surface-3); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg-btn { appearance: none; border: none; background: transparent; color: var(--text-2); font-size: 12.5px; padding: 5px 12px; cursor: pointer; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active { background: #fff; color: var(--text); box-shadow: var(--shadow-1); }

  /* ---------------- 表格(輸入) ---------------- */
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  .grid-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .grid-scroll table { min-width: max-content; }
  table.grid-table th, table.grid-table td { border-bottom: 1px solid var(--border); border-right: 1px solid #eef1f6; padding: 6px 8px; text-align: right; }
  table.grid-table th:last-child, table.grid-table td:last-child { border-right: none; }
  table.grid-table thead th { background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 12px; text-align: center; white-space: nowrap;
    position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--border-strong); }
  table.grid-table tbody tr:hover > td { background: #fafbff; }
  table.grid-table tbody tr:last-child > td { border-bottom: none; }
  table.grid-table td.row-head { text-align: left; white-space: nowrap; background: var(--surface-2); font-weight: 600; color: var(--text); }
  table.grid-table td.calc { background: #f9fafc; color: var(--text-2); font-variant-numeric: tabular-nums; }
  table.grid-table tfoot td { font-weight: 700; background: var(--surface-3); border-top: 1px solid var(--border-strong); border-bottom: none; }
  table.grid-table input, table.grid-table select { border-color: transparent; background: transparent; border-radius: 5px; font-size: 13px; padding: 5px 7px; }
  table.grid-table input:hover, table.grid-table select:hover { border-color: var(--border-strong); background: #fff; }
  table.grid-table input:focus, table.grid-table select:focus { border-color: var(--primary); background: #fff; }
  table.grid-table input[type=number] { width: 96px; }
  table.grid-table input[type=text] { width: 130px; }
  table.grid-table input.note-input { width: 160px; }
  table.grid-table input.wide { width: 260px; }
  table.grid-table td:has(> input[type=text]), table.grid-table td:has(> input[type=date]), table.grid-table td:has(> select),
  table.grid-table input[type=text], table.grid-table input[type=date], table.grid-table select { text-align: left; }
  table.sticky-head-col td.row-head, table.sticky-head-col thead th:first-child { position: sticky; left: 0; z-index: 2; }
  table.sticky-head-col thead th:first-child { z-index: 3; }
  th .th-sub, .th-sub { font-weight: 500; font-size: 11px; color: var(--muted); }
  table.entity-table tr.new-row td { background: #fffcf2; }
  td.row-actions { white-space: nowrap; text-align: center !important; }
  .row-move { padding: 3px 7px; font-size: 11px; line-height: 1; }
  .auto-tag { font-size: 10.5px; color: var(--primary); background: var(--primary-weak); border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-weight: 600; }
  tr.auto-line td { color: var(--text-2); }
  tr.auto-line td.row-head { font-weight: 500; }
  .summary-box { display: flex; flex-wrap: wrap; gap: 28px; margin: 14px 0; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .summary-box div { display: flex; flex-direction: column; gap: 2px; }
  .summary-box strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .csv-box { width: 100%; height: 160px; font-family: var(--mono); font-size: 12px; margin-bottom: 10px; }

  /* ---------------- 存檔列：有未儲存的修改時固定在畫面底部 ---------------- */
  .savebar { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%); z-index: 40; display: flex; align-items: center; gap: 14px;
    background: var(--sidebar); color: #fff; padding: 10px 12px 10px 18px; border-radius: 12px; box-shadow: var(--shadow-2);
    transition: transform .22s cubic-bezier(.2, .9, .3, 1.2), visibility .22s; font-size: 13px; visibility: hidden; }
  .savebar.show { transform: translate(-50%, 0); visibility: visible; }
  .savebar .dot { width: 8px; height: 8px; border-radius: 50%; background: #f5b942; box-shadow: 0 0 0 4px rgba(245, 185, 66, .2); }
  .savebar .btn.secondary { background: transparent; color: #cfd8ee; border-color: #3a4a6e; }
  .savebar .btn.secondary:hover { background: var(--sidebar-2); }
  .savebar kbd { font-family: var(--mono); font-size: 11px; background: #22325a; padding: 1px 5px; border-radius: 4px; color: #cfd8ee; }

  /* ---------------- Toast ---------------- */
  .toasts { position: fixed; right: 22px; top: 70px; z-index: 60; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; min-width: 240px; max-width: 420px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--primary);
    border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow-2); font-size: 13px; line-height: 1.55; white-space: pre-line;
    animation: toastIn .2s ease-out; }
  .toast.ok { border-left-color: var(--success); }
  .toast.err { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warning); }
  .toast.hide { opacity: 0; transform: translateX(10px); transition: all .2s; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

  /* ---------------- Modal ---------------- */
  dialog.modal { border: none; border-radius: 14px; padding: 0; width: min(560px, calc(100% - 32px)); box-shadow: var(--shadow-2); color: var(--text); }
  dialog.modal.wide { width: min(860px, calc(100% - 32px)); }
  dialog.modal::backdrop { background: rgba(16, 27, 51, .42); backdrop-filter: blur(2px); }
  .modal-head { padding: 18px 22px 6px; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-body { padding: 8px 22px 6px; font-size: 13.5px; line-height: 1.65; color: var(--text-2); max-height: 65vh; overflow: auto; }
  .modal-body .field { margin-bottom: 12px; }
  .modal-body .field input, .modal-body .field select, .modal-body .field textarea { width: 100%; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; }

  /* ---------------- 拖曳排序(共用) ---------------- */
  .drag-handle { cursor: grab; color: #a3acc0; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 24px;
    border-radius: 5px; user-select: none; touch-action: none; font-size: 14px; letter-spacing: -2px; }
  .drag-handle:hover { color: var(--text-2); background: var(--surface-3); }
  .drag-handle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--primary-line); color: var(--primary); }
  .sort-dragging { opacity: .95; background: #fff !important; box-shadow: 0 10px 24px -8px rgba(16, 27, 51, .35); position: relative; z-index: 5; }
  .sort-dragging > td { background: #fff !important; }
  body.sorting, body.sorting * { cursor: grabbing !important; user-select: none !important; }

  .dash-toolbar { row-gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }

  /* 標題固定兩行(車型/情境、車系)，太長就截斷加 …(hover 看完整名稱)，每張卡片高度一致、數字對齊 */
  .kpi-title { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "type star" "veh star"; column-gap: 6px; row-gap: 2px; margin-bottom: 8px; }

  .kpi-bar { height: 5px; background: var(--surface-3); border-radius: 3px; margin: 8px 0 8px; overflow: hidden; }

  .kpi-row { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--text-2); line-height: 1.75; }
  .kpi-row span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-num { font-variant-numeric: tabular-nums; }
  .kpi-pct { width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kpi-vs { margin-top: 6px; font-size: 11.5px; font-weight: 700; }

  /* 損益表 */

  .pl-table thead th { text-align: center; white-space: nowrap; background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border-strong); }

  .pl-table td.best { background: #f0fbf5; }

  .auto-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); vertical-align: middle; margin-left: 6px; cursor: help; box-shadow: 0 0 0 3px var(--primary-weak); }
  .auto-dot.dev { background: #7c4bd6; box-shadow: 0 0 0 3px #f1e9ff; }
  .err-dot { display: inline-block; color: var(--danger); font-weight: 800; margin-left: 5px; cursor: help; }
  /* 瀑布圖工具 */
  .field .inline { display: flex; gap: 6px; }
  .field.grow { flex: 1; min-width: 220px; }
  .field.grow input { width: 100%; }
  .wf-opts { margin-top: 12px; }

  .row-toggle { appearance: none; border: none; background: transparent; padding: 0; margin-right: 4px; cursor: pointer; color: inherit; display: inline-flex; align-items: center;
    justify-content: center; width: 16px; height: 16px; vertical-align: middle; border-radius: 4px; }

  .check-box { background: var(--warning-weak); border: 1px solid #f0d49a; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #7a4c02; margin: 10px 0; }
  .check-box ul { margin: 6px 0 0; padding-left: 20px; }

    border-radius: 8px; white-space: pre-line; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .45); pointer-events: none; font-variant-numeric: tabular-nums; }

  /* 圖表 */
  .chart-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; background: var(--surface); box-shadow: var(--shadow-1); }
  .chart-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 10px; }

  .chart-area { flex: 3 1 520px; min-width: 0; }
  .chart-svg { display: block; width: 100%; height: auto; font-family: inherit; }
  .chart-svg rect.bar { cursor: pointer; transition: opacity .1s; }

  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 6px 4px; font-size: 12px; color: var(--text-2); }
  .legend-chip { display: inline-flex; align-items: center; gap: 5px; }

  .waterfall-row { display: flex; flex-wrap: wrap; gap: 12px; }

  .waterfall-title { font-size: 12.5px; font-weight: 700; color: var(--text); margin: 2px 0 4px 4px; cursor: default; }
  .chart-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
  .chart-picker-box { flex: 1 1 230px; min-width: 210px; max-width: 320px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }

  .legend-item.subtotal .legend-name { font-weight: 700; color: var(--text); }
  .legend-item.detail { padding-left: 18px; }
  .legend-item.on { background: var(--primary-weak); }
  .chip-picker { display: flex; flex-wrap: wrap; gap: 2px 14px; max-height: 110px; overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }

  .diff-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .diff-card-title .diff-arrow { color: var(--muted); margin: 0 4px; }
  .diff-table { margin-top: 0; font-size: 12.5px; }
  .diff-table th, .diff-table td { padding: 5px 8px; border-bottom: 1px solid #eef1f6; text-align: right; }
  .diff-table th:first-child, .diff-table td:first-child { text-align: left; }
  .diff-table tr.subtotal { background: var(--subtotal); font-weight: 700; }
  .diff-table td.negative, .diff-table th.negative { color: var(--danger); }

  .diff-chart-box { margin-top: 10px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; }

  /* ---------------- GATE 報告(簡報) ---------------- */
  .report-controls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .report-controls .field select { min-width: 200px; }
  /* 選單跟下方卡片同色：藍 = 現況(比較基準)、綠 = 目標/本回，由左到右就是 現況 → 目標 */
  .rpt-pick > span { display: flex; align-items: center; gap: 6px; }
  .rpt-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .rpt-pick.base .rpt-dot { background: #3157d5; }
  .rpt-pick.target .rpt-dot { background: #1c8a59; }
  .rpt-pick.base select { border-color: #b9c9f5; background-color: #f6f8ff; }
  .rpt-pick.target select { border-color: #a9dcc0; background-color: #f4fbf7; }
  .rpt-arrow { align-self: flex-end; padding-bottom: 9px; font-size: 18px; font-weight: 700; color: var(--muted); }
  .slide { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-1); margin: 0 auto 22px; max-width: 1280px;
    padding: 26px 32px 22px; position: relative; }
  .slide-head { display: flex; align-items: flex-end; gap: 14px; border-bottom: 3px solid var(--sidebar); padding-bottom: 10px; margin-bottom: 16px; }
  .slide-head .slide-no { font-size: 11px; font-weight: 800; color: #fff; background: var(--sidebar); border-radius: 6px; padding: 3px 8px; letter-spacing: .06em; }
  .slide-head h2 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  .slide-head .slide-sub { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
  .slide-foot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--border); padding-top: 6px; }
  .slide-actions { position: absolute; top: 14px; right: 16px; display: flex; gap: 6px; }
  .slide-actions .btn { opacity: .0; transition: opacity .15s; }
  .slide:hover .slide-actions .btn { opacity: 1; }
  .kpi-hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .hero { border-radius: 12px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); }
  .hero .hero-label { font-size: 12px; color: var(--text-2); font-weight: 700; }
  .hero .hero-num { font-size: 26px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .hero .hero-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hero .hero-name { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero.base { background: #f1f5ff; border-color: #d3defc; }
  .hero.target { background: #eefaf3; border-color: #c4ead6; }
  .hero.gap { background: #fff8e8; border-color: #f2dda8; }
  .hero.cover { background: #f6f0ff; border-color: #ddd0f6; }
  .cover-bar { height: 10px; border-radius: 6px; background: #eee6fb; overflow: hidden; margin-top: 8px; display: flex; }
  .cover-bar i { display: block; height: 100%; }
  .rpt-table { font-size: 12.5px; }
  .rpt-table th, .rpt-table td { padding: 5px 8px; border-bottom: 1px solid #edf0f5; text-align: right; font-variant-numeric: tabular-nums; }
  .rpt-table thead th { background: var(--sidebar); color: #fff; font-weight: 600; font-size: 12px; text-align: center; border: none; position: sticky; top: 0; }
  .rpt-table thead tr.sub th { background: #2a3a62; font-weight: 500; font-size: 11px; }
  .rpt-table td.name { text-align: left; white-space: nowrap; }
  .rpt-table td.note { text-align: left; color: var(--text-2); font-size: 11.5px; min-width: 220px; max-width: 420px; white-space: normal; line-height: 1.5; }
  .rpt-table td.note[contenteditable="true"] { cursor: text; outline: none; }
  .rpt-table td.note[contenteditable="true"]:hover { background: #fffbea; box-shadow: inset 0 0 0 1px #f0d49a; }
  .rpt-table td.note[contenteditable="true"]:focus { background: #fffbea; box-shadow: inset 0 0 0 2px var(--warning); }
  .rpt-table td.note.dirty { background: #fff6d6; }
  .rpt-table tr.subtotal td { background: var(--subtotal); font-weight: 700; }
  .rpt-table tr.section td { background: var(--surface-3); font-weight: 700; text-align: left; font-size: 11.5px; color: var(--text-2); }
  .rpt-table tr.key td { background: #fff1c9; font-weight: 800; }

  .rpt-table td.gap-bad { color: var(--danger); font-weight: 700; }
  .rpt-table td.pct { color: var(--text-2); font-size: 11.5px; }

  .action-table td { vertical-align: middle; }

  #dev-body input[type=number] { width: 132px; }
  .action-table td select { width: 150px; }
  .action-table td input[type=date] { width: 140px; }
  .action-table tr.total td { background: var(--surface-3); font-weight: 800; }
  .status-pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .st-規劃中 { background: #eef1f7; color: #4a5470; }
  .st-進行中 { background: #e9efff; color: #2a4cc4; }
  .st-已確認 { background: #e8f6ef; color: #146c45; }
  .st-已結案 { background: #f1e9ff; color: #6a3dbd; }
  .bridge-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
  .bridge-legend { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }

  }

  /* ---------------- 列印：GATE 報告每一張投影片一頁(16:9 橫式) ---------------- */
  @media print {
    @page { size: 297mm 167mm; margin: 8mm; }
    body { background: #fff; }

    .panel.active { display: block !important; animation: none; }

    .slide:last-child { page-break-after: auto; }
    .rpt-table thead th { position: static; }
    /* 一張投影片一頁：長表格(40~50 個科目)要擠得進 16:9 的頁面 */
    .slide-head { padding-bottom: 4px; margin-bottom: 6px; border-bottom-width: 2px; }
    .slide-head h2 { font-size: 15px; }
    .slide-foot { margin-top: 4px; padding-top: 3px; font-size: 8px; }
    .rpt-table { font-size: 7.6px; }
    .rpt-table th, .rpt-table td { padding: 0.6px 4px; line-height: 1.25; }
    .rpt-table thead th, .rpt-table thead tr.sub th { font-size: 7.6px; }
    .rpt-table td.note { font-size: 7.2px; min-width: 0; max-width: 300px; }
    .kpi-hero { gap: 8px; margin-bottom: 8px; }
    .hero { padding: 8px 10px; }
    .hero .hero-num { font-size: 20px; }
    .help { font-size: 9px; }
    .action-table td input, .action-table td select { font-size: 9px; padding: 1px 3px; border: none; }

   * 不需要再逐一比對、改號。舊版資料包(只有一份全域科目表)的科目表，視為資料包裡每個車型各自的科目表。
   * 自訂參數(ParamDefs)是全域共用的：本機沒有的參數才加進來，同名參數保留本機的設定。
   */
  function mergePack(localTables, incomingTables, ctx, scope) {
    var local = clone_(localTables);
    var incoming = clone_(incomingTables);
    PACK_TABLES.concat([AUDIT_TABLE]).forEach(function (n) { local[n] = local[n] || []; incoming[n] = incoming[n] || []; });
    var byScenario = !!(scope && scope.kind === 'scenarios');

    var types = set_([].concat(
      incoming.VehicleTypes.map(function (r) { return r.VehicleTypeID; }),
      incoming.Vehicles.map(function (r) { return r.VehicleTypeID; }),
      incoming.Scenarios.map(function (r) { return r.VehicleTypeID; })
    ).filter(function (id) { return str_(id); }));
    var typeIds = Object.keys(types);
    var localTypes = set_(local.VehicleTypes.map(function (r) { return r.VehicleTypeID; })
      .concat(local.Scenarios.map(function (r) { return r.VehicleTypeID; })));

    var report = {
      mode: byScenario ? 'scenarios' : 'vehicleTypes',
      replacedTypes: [], addedTypes: [], chartsReplaced: [], paramDefsAdded: [],
      globalParamsAdded: 0, globalParamsKept: [], rowIdsReassigned: 0,
      replacedScenarios: [], addedScenarios: [], vehiclesAdded: [], linesAdded: [], lineNameConflicts: []
    };
    var localSummary = summarize(local);
    var incomingSummary = summarize(incoming);
    typeIds.forEach(function (id) {
      var entry = { VehicleTypeID: id, local: localSummary[id] || null, incoming: incomingSummary[id] || { vehicles: 0, scenarios: 0 } };
      (localSummary[id] ? report.replacedTypes : report.addedTypes).push(entry);
    });

    // ---- 衝突檢查：車系代號/情境代號是全域唯一的，不能跟本機「其他車型」的撞在一起 ----
    var localVehicleType = {};
    local.Vehicles.forEach(function (r) { localVehicleType[str_(r.VehicleID)] = str_(r.VehicleTypeID); });
    incoming.Vehicles.forEach(function (r) {
      var owner = localVehicleType[str_(r.VehicleID)];
      if (owner && owner !== str_(r.VehicleTypeID) && (byScenario || !types[owner])) {
        throw new Error('車系代號「' + r.VehicleID + '」在本機屬於車型 ' + owner + '，資料包裡卻屬於車型 ' +
          r.VehicleTypeID + '。請先在其中一邊把車系改名後再合併。');
      }
    });
    var localScenarioType = {};
    local.Scenarios.forEach(function (r) { localScenarioType[str_(r.ScenarioID)] = str_(r.VehicleTypeID); });
    incoming.Scenarios.forEach(function (r) {
      var owner = localScenarioType[str_(r.ScenarioID)];
      if (owner && owner !== str_(r.VehicleTypeID) && (byScenario || !types[owner])) {
        throw new Error('情境代號「' + r.ScenarioID + '」同時出現在本機車型 ' + owner + ' 與資料包車型 ' + r.VehicleTypeID + '，無法合併。');
      }
    });

    // ---- 科目表、車型主檔、車系，以及要拿掉的本機情境 ----
    var incomingCharts = chartsByType_(incoming.PLLineItems, typeIds);
    var localTemplateEmpty = !local.PLLineItems.some(function (r) { return !str_(r.VehicleTypeID) && str_(r.LineID); });
    var dropScenarios;
    if (!byScenario) {
      // 車型資料包：這幾個車型整個換成資料包的
      local.PLLineItems = local.PLLineItems.filter(function (r) { return !types[str_(r.VehicleTypeID)]; });
      typeIds.forEach(function (id) {
        if (incomingCharts[id].length) report.chartsReplaced.push(id);
        local.PLLineItems = local.PLLineItems.concat(incomingCharts[id]);
      });
      dropScenarios = set_(local.Scenarios.filter(function (r) { return types[str_(r.VehicleTypeID)]; })
        .map(function (r) { return r.ScenarioID; }));
      local.VehicleTypes = local.VehicleTypes.filter(function (r) { return !types[str_(r.VehicleTypeID)]; });
      local.Vehicles = local.Vehicles.filter(function (r) { return !types[str_(r.VehicleTypeID)]; });
      local.VehicleTypes = local.VehicleTypes.concat(incoming.VehicleTypes);
      local.Vehicles = local.Vehicles.concat(incoming.Vehicles);
    } else {
      // 情境資料包：本機沒有的車型整個新增；本機已有的車型只補本機缺的車系、科目
      var localCharts = chartsByType_(local.PLLineItems, typeIds.filter(function (id) { return localTypes[id]; }));
      typeIds.forEach(function (id) {
        if (!localTypes[id]) {
          local.VehicleTypes = local.VehicleTypes.concat(incoming.VehicleTypes.filter(function (r) { return str_(r.VehicleTypeID) === id; }));
          local.Vehicles = local.Vehicles.concat(incoming.Vehicles.filter(function (r) { return str_(r.VehicleTypeID) === id; }));
          local.PLLineItems = local.PLLineItems.concat(incomingCharts[id]);
          return;
        }
        // 本機這個車型還在沿用範本(沒有自己的一份)：先把範本複製成它自己的，才補得進科目
        if (!local.PLLineItems.some(function (r) { return str_(r.VehicleTypeID) === id; })) local.PLLineItems = local.PLLineItems.concat(localCharts[id]);
        var byCode = {};
        localCharts[id].forEach(function (r) { byCode[str_(r.LineCode)] = r; });
        incomingCharts[id].forEach(function (r) {
          var mine = byCode[str_(r.LineCode)];
          if (!mine) {
            local.PLLineItems.push(r);
            report.linesAdded.push({ VehicleTypeID: id, LineCode: str_(r.LineCode), LineName: str_(r.LineName) });
          } else if (str_(mine.LineName) !== str_(r.LineName)) {
            report.lineNameConflicts.push({ VehicleTypeID: id, LineCode: str_(r.LineCode), local: str_(mine.LineName), incoming: str_(r.LineName) });
          }
        });
        var haveVehicle = set_(local.Vehicles.map(function (r) { return r.VehicleID; }));
        incoming.Vehicles.filter(function (r) { return str_(r.VehicleTypeID) === id && !haveVehicle[str_(r.VehicleID)]; }).forEach(function (r) {
          local.Vehicles.push(r);
          report.vehiclesAdded.push({ VehicleTypeID: id, VehicleID: str_(r.VehicleID), VehicleCode: str_(r.VehicleCode) });
        });
      });
      dropScenarios = set_(incoming.Scenarios.map(function (r) { return r.ScenarioID; }));
      incoming.Scenarios.forEach(function (r) {
        var entry = { VehicleTypeID: str_(r.VehicleTypeID), ScenarioID: str_(r.ScenarioID), label: scenarioLabel_(r) };
        (localScenarioType[str_(r.ScenarioID)] ? report.replacedScenarios : report.addedScenarios).push(entry);
      });
    }
    // 本機還是全新資料庫(沒有範本)時，順便把資料包的範本帶進來
    if (localTemplateEmpty) {
      incoming.PLLineItems.filter(function (r) { return !str_(r.VehicleTypeID) && str_(r.LineID); })
        .forEach(function (r) { local.PLLineItems.push(r); });
    }
    var localParams = set_(local.ParamDefs.map(function (r) { return r.ParamName; }));
    incoming.ParamDefs.forEach(function (r) {
      if (localParams[str_(r.ParamName)]) return;
      localParams[str_(r.ParamName)] = true;
      local.ParamDefs.push(r);
      report.paramDefsAdded.push(str_(r.ParamName));
    });

    // ---- 情境：拿掉本機要被取代的，放進資料包的 ----
    local.Scenarios = local.Scenarios.filter(function (r) { return !dropScenarios[str_(r.ScenarioID)]; }).concat(incoming.Scenarios);
    Object.keys(SCENARIO_TABLES).forEach(function (name) {
      local[name] = local[name].filter(function (r) { return !dropScenarios[str_(r.ScenarioID)]; });
    });
    Object.keys(SCENARIO_TABLES).forEach(function (name) {
      var pk = SCENARIO_TABLES[name];
      var usedPk = set_(local[name].map(function (r) { return r[pk]; }));
      incoming[name].forEach(function (r) {
        if (name === 'Parameters' && !str_(r.ScenarioID)) {
          // 全域參數(沒掛情境)：本機已有同一個參數就保留本機的值，不默默蓋掉別人的設定
          var exists = local.Parameters.filter(function (p) {
            return !str_(p.ScenarioID) && str_(p.ParamName) === str_(r.ParamName) &&
              str_(p.VehicleID) === str_(r.VehicleID) && str_(p.Currency) === str_(r.Currency);
          })[0];
          if (exists) {
            if (str_(exists.Value) !== str_(r.Value)) report.globalParamsKept.push({ ParamName: str_(r.ParamName), local: exists.Value, incoming: r.Value });
            return;
          }
          report.globalParamsAdded++;
        }
        // 主鍵理論上是隨機產生、不會撞；真的撞了就換一個，否則之後存檔時一列會蓋掉另一列
        if (usedPk[str_(r[pk])]) {
          var base = str_(r[pk]), k = 1;
          while (usedPk[base + '-m' + k]) k++;
          r[pk] = base + '-m' + k;
          report.rowIdsReassigned++;
        }
        usedPk[str_(r[pk])] = true;
        local[name].push(r);
      });
    });

    // ---- 情境快照是歷史紀錄：兩邊都留(同一個快照代號只留一份)，不因為換掉車型資料就消失 ----
    var snapIds = set_(local.Snapshots.map(function (r) { return r.SnapshotID; }));
    report.snapshotsAdded = 0;
    incoming.Snapshots.forEach(function (r) {
      if (snapIds[str_(r.SnapshotID)]) return;
      snapIds[str_(r.SnapshotID)] = true;
      local.Snapshots.push(r);
      report.snapshotsAdded++;
    });

    // ---- 稽核紀錄：兩邊都留，去掉完全相同的列 ----
    var seen = set_(local[AUDIT_TABLE].map(function (r) { return JSON.stringify(r); }));
    incoming[AUDIT_TABLE].forEach(function (r) {
      var key = JSON.stringify(r);
      if (!seen[key]) { seen[key] = true; local[AUDIT_TABLE].push(r); }
    });

    return { tables: local, report: report };
  }
  function scenarioLabel_(r) {
    return [str_(r.Gate), str_(r.ScenarioName)].filter(function (x) { return x; }).join(' ') + (str_(r.ScenarioType) ? '（' + str_(r.ScenarioType) + '）' : '');
  }

  /** 合併結果寫成給使用者確認的文字 */
  function describeMerge(report) {
    var lines = [];
    function counts(s) { return s ? s.vehicles + ' 個車系、' + s.scenarios + ' 個情境' : '無資料'; }
    if (report.mode === 'scenarios') {
      report.replacedScenarios.forEach(function (s) {
        lines.push('・車型 ' + s.VehicleTypeID + ' 的情境「' + s.label + '」：本機已有，會被資料包的版本取代');
      });
      report.addedScenarios.forEach(function (s) {
        lines.push('・車型 ' + s.VehicleTypeID + ' 的情境「' + s.label + '」：新增');
      });
      report.addedTypes.forEach(function (t) {
        lines.push('・車型 ' + t.VehicleTypeID + '：本機沒有這個車型，連同車型、' + t.incoming.vehicles + ' 個車系與科目表一起新增');
      });
      if (report.replacedTypes.length) lines.push('・本機同車型的其他情境、車系、科目表都不動');
      if (report.vehiclesAdded.length) {
        lines.push('・補上本機沒有的車系：' + report.vehiclesAdded.map(function (v) { return v.VehicleTypeID + ' ' + (v.VehicleCode || v.VehicleID); }).join('、'));
      }
      if (report.linesAdded.length) {
        lines.push('・補上本機科目表沒有的科目：' + report.linesAdded.map(function (l) { return l.VehicleTypeID + ' ' + l.LineName + '(' + l.LineCode + ')'; }).join('、'));
      }
      report.lineNameConflicts.forEach(function (c) {
        lines.push('・⚠ 車型 ' + c.VehicleTypeID + ' 的科目代碼 ' + c.LineCode + ' 兩邊名稱不同（本機「' + c.local + '」、資料包「' + c.incoming +
          '」），這一列的數字會記在本機的「' + c.local + '」');
      });
    } else {
      report.replacedTypes.forEach(function (t) {
        lines.push('・車型 ' + t.VehicleTypeID + '：本機的資料（' + counts(t.local) + '）會被資料包（' + counts(t.incoming) + '）取代');
      });
      report.addedTypes.forEach(function (t) {
        lines.push('・車型 ' + t.VehicleTypeID + '：新增（' + counts(t.incoming) + '）');
      });
      if (report.chartsReplaced.length) {
        lines.push('・科目表跟著車型一起換成資料包的版本：' + report.chartsReplaced.join('、') + '（其他車型的科目表不受影響）');
      }
    }
    if (report.snapshotsAdded) lines.push('・新增 ' + report.snapshotsAdded + ' 份情境快照（本機原有的快照保留）');
    if (report.paramDefsAdded.length) {
      lines.push('・新增自訂參數：' + report.paramDefsAdded.join('、'));
    }
    report.globalParamsKept.forEach(function (p) {
      lines.push('・全域參數「' + p.ParamName + '」兩邊不同，保留本機的值 ' + p.local + '（資料包是 ' + p.incoming + '）');
    });
    return lines.join('\n');
  }

  return {
    FORMAT: FORMAT, FORMAT_VERSION: FORMAT_VERSION, PACK_TABLES: PACK_TABLES,
    AUDIT_TABLE: AUDIT_TABLE, AUDIT_HEADERS: AUDIT_HEADERS,
    buildPack: buildPack, parsePack: parsePack, filterByVehicleTypes: filterByVehicleTypes, filterByScenarios: filterByScenarios,
    scenarioLabel: scenarioLabel_,
    mergePack: mergePack, describeMerge: describeMerge, summarize: summarize
  };
}));

/* 由 tools/build-local.js 從 src/*.gs 產生，請勿直接修改 */

var SCHEMA = {

/** 共用工具函式 */

function getSheet_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  if (!sheet) throw new Error('找不到分頁：' + name + '，請先執行 setupSpreadsheet()');
  return sheet;
}

// 同一次執行內的流水號：整批寫入(如一次存下整張表格)會連續產生很多 ID，
// 只取 UUID 前 8 碼有機會撞號，撞號的後果是後一列直接覆蓋前一列、而且不會報錯。
var ID_SEQ_ = 0;

function generateId_(prefix) {
  return prefix + '-' + Utilities.getUuid().slice(0, 8) + '-' + (++ID_SEQ_);
}

/**
 * google.script.run 序列化巢狀 Date 物件時不穩定（陣列包物件、物件裡又包 Date，
 * 有機會整包回傳值直接變成 null，且不會丟出任何錯誤）。
 * Sheet 的日期欄位讀出來就是 JS Date，所以一律在這裡轉成 yyyy-MM-dd 字串再往外傳。
 */
function normalizeCellValue_(v) {
  if (Object.prototype.toString.call(v) === '[object Date]') {
    return Utilities.formatDate(v, Session.getScriptTimeZone() || 'Asia/Taipei', 'yyyy-MM-dd');
  }
  return v;
}

/**
 * 分頁讀取快取，分兩層：
 *   1. 單次執行內的記憶體快取(SHEET_CACHE_) —— 一次損益計算會重複讀同一張表很多次
 *      （光是科目表 PLLineItems，每算一個車系就會被讀 5 次以上），這層省掉同一次執行內的重複讀取。
 *   2. 跨執行的 CacheService 快取 —— 每一次 google.script.run 呼叫都是全新的執行，
 *      第 1 層每次都會是空的，切分頁、開儀表板等於每次都重新把用到的表整個讀一遍，
 *      這是介面感覺卡頓的主因之一。這層把讀到的結果多存一份到 CacheService，
 *      有效期內(SHEET_CACHE_TTL_)其他次執行可以直接用，不必再打一次 Sheets API。
 * 任何寫入都會兩層一起清掉，所以不會讀到過期資料；資料太大存不進 CacheService(單筆上限 100KB)
 * 就直接跳過快取，退回每次都讀 Sheet，不影響正確性，只是那張表沒有快取效果。
 * 注意：繞過 upsertRow_/deleteRow_ 直接寫 Sheet 的地方(SetupSheets、writePLResult_)
 * 必須自己呼叫 invalidateSheetCache_()。
 */
var SHEET_CACHE_ = {};
var SHEET_CACHE_TTL_SECONDS_ = 300; // 5 分鐘；資料一有異動就會主動清掉，這個 TTL 只是保險

function sheetCacheKey_(sheetName) { return 'sheet_' + sheetName; }

function invalidateSheetCache_(sheetName) {
  var names = sheetName ? [sheetName] : Object.keys(SCHEMA);
  var cache = CacheService.getScriptCache();
  names.forEach(function (name) {
    delete SHEET_CACHE_[name];
    cache.remove(sheetCacheKey_(name));
  });
  if (!sheetName) SHEET_CACHE_ = {};
  resetCalcMemo_();
}

/**
 * 清掉「單次執行內」的計算結果記憶(見 CalcEngine.gs 的 PL_CORE_MEMO_)。
 * 任何一張表有寫入就整個清掉：損益計算跨好幾張表，逐表判斷影響範圍不值得，重算就對了。
 * 本機預覽伺服器(tools/dev-server.js)在每次模擬的 google.script.run 呼叫前也會呼叫，
 * 模擬 Apps Script 每次呼叫都是全新執行的行為。
 */
function resetCalcMemo_() {
  if (typeof PL_CORE_MEMO_ !== 'undefined') PL_CORE_MEMO_ = {};
  if (typeof SNAPSHOT_MEMO_ !== 'undefined') SNAPSHOT_MEMO_ = {};
}

/** 把整張表讀成 [{欄位:值,...}, ...]，第一列為標題 */
function sheetToObjects_(sheetName) {
  if (SHEET_CACHE_[sheetName]) return SHEET_CACHE_[sheetName];

  var cache = CacheService.getScriptCache();
  var cached = cache.get(sheetCacheKey_(sheetName));
  if (cached) {
    var fromCache = JSON.parse(cached);
    SHEET_CACHE_[sheetName] = fromCache;
    return fromCache;
  }

  var rows = readSheetObjects_(sheetName);
  SHEET_CACHE_[sheetName] = rows;
  try {
    var json = JSON.stringify(rows);
    // CacheService 單筆快取上限 100KB，留點餘裕；超過就不快取這張表，讀 Sheet 的正確性不受影響
    if (json.length < 90000) cache.put(sheetCacheKey_(sheetName), json, SHEET_CACHE_TTL_SECONDS_);
  } catch (e) {
    // 序列化失敗(理論上不會，資料都是純值)也不影響功能，只是這次沒快取到
  }
  return rows;
}

function readSheetObjects_(sheetName) {
  var sheet = getSheet_(sheetName);
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < 2) return [];
  var headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0];
  var values = sheet.getRange(2, 1, lastRow - 1, lastCol).getValues();
  return values
    .filter(function (row) { return row.some(function (v) { return v !== '' && v !== null; }); })
    .map(function (row) {
      var obj = {};
      headers.forEach(function (h, i) { obj[h] = normalizeCellValue_(row[i]); });
      return obj;
    });
}

/**
 * 主鍵比對：Sheet 讀回來的值可能是 Number(例如純數字的代號)，
 * 而前端傳來的一律是 String，直接用 === 會永遠不相等 → 變成重複新增、刪不掉。
 */
function samePk_(a, b) {
  if (a === null || a === undefined || a === '') return false;
  return String(a) === String(b);
}

/** 把一組列依 PK 轉成「PK字串 -> 列物件」的對照表，整批寫入前先查表用 */
function indexByPk_(rows, pkField) {
  var map = {};
  (rows || []).forEach(function (r) {
    if (r[pkField] !== undefined && r[pkField] !== null && r[pkField] !== '') map[String(r[pkField])] = r;
  });
  return map;
}

/**
 * upsertRowMerge_ 的整批版：用預先讀好的 existingByPk(見 indexByPk_) 補齊 rowObj 沒送出的欄位，
 * 不必為了合併就每一列各自重新讀一次整張表。呼叫端把回傳值收集起來一次交給 batchWriteRows_。
 */
function mergeRowForBatch_(sheetName, pkField, rowObj, existingByPk) {
  var existing = rowObj[pkField] ? existingByPk[String(rowObj[pkField])] : undefined;
  if (existing) {
    SCHEMA[sheetName].forEach(function (h) {
      if (rowObj[h] === undefined) rowObj[h] = existing[h];
    });
  }
  return rowObj;
}

/**
 * 只更新有帶到的欄位，其餘沿用既有值。
 * 表單只送出畫面上有的欄位，若直接 upsert，沒出現在表單上的欄位(如情境的攤提基準台數、
 * 科目的自動計算標記)會被寫成空字串，等於靜靜地把設定清掉。
 */
function upsertRowMerge_(sheetName, pkField, rowObj) {
  var existing = sheetToObjects_(sheetName).filter(function (r) {
    return samePk_(r[pkField], rowObj[pkField]);
  })[0];
  if (existing) {
    SCHEMA[sheetName].forEach(function (h) {
      if (rowObj[h] === undefined) rowObj[h] = existing[h];
    });
  }
  return upsertRow_(sheetName, pkField, rowObj);
}

/** 依 PK 欄位(通常是第一欄) upsert 一列；找不到就新增 */
function upsertRow_(sheetName, pkField, rowObj) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField) + 1;

  if (!rowObj[pkField]) {
    rowObj[pkField] = generateId_(rowIdPrefix_(sheetName));
  }

  var lastRow = sheet.getLastRow();
  var targetRow = -1;
  if (lastRow >= 2) {
    var pkValues = sheet.getRange(2, pkCol, lastRow - 1, 1).getValues();
    for (var i = 0; i < pkValues.length; i++) {
      if (samePk_(pkValues[i][0], rowObj[pkField])) {
        targetRow = i + 2;
        break;
      }
    }
  }

  var rowArray = headers.map(function (h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
  var writeRow = targetRow === -1 ? lastRow + 1 : targetRow;
  var range = sheet.getRange(writeRow, 1, 1, rowArray.length);
  applyTextColumnFormats_(range, headers, sheetName);
  range.setValues([rowArray]);
  invalidateSheetCache_(sheetName);
  logAudit_(sheetName, rowObj[pkField], targetRow === -1 ? 'INSERT' : 'UPDATE', rowObj);
  return rowObj;
}

/**
 * 在寫入前把純文字欄位(TEXT_COLUMNS)的儲存格格式設成純文字('@')，
 * 避免 Sheet 把「0901」這種看起來像數字的字串自動轉成 901。
 * 用 getNumberFormats() 先讀出目前格式，只覆蓋純文字欄位那幾格，其餘欄位(金額/比率)維持原狀，
 * 且只在格式真的需要改變時才寫入，避免每次存檔都多一次 API 呼叫。
 * range 可以是一列(單筆 upsertRow_)也可以是很多列(batchWriteRows_ 整批寫入)：
 * getNumberFormats()/setNumberFormats() 本來就是回傳/接受二維陣列，不特別假設列數。
 */
function applyTextColumnFormats_(range, headers, sheetName) {
  var textCols = TEXT_COLUMNS[sheetName];
  if (!textCols || !textCols.length) return;
  var current = range.getNumberFormats();
  var changed = false;
  var next = current.map(function (rowFormats) {
    return headers.map(function (h, i) {
      if (textCols.indexOf(h) !== -1 && rowFormats[i] !== '@') { changed = true; return '@'; }
      return rowFormats[i];
    });
  });
  if (changed) range.setNumberFormats(next);
}

function deleteRow_(sheetName, pkField, pkValue) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField) + 1;
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return false;
  var pkValues = sheet.getRange(2, pkCol, lastRow - 1, 1).getValues();
  for (var i = 0; i < pkValues.length; i++) {
    if (samePk_(pkValues[i][0], pkValue)) {
      sheet.deleteRow(i + 2);
      invalidateSheetCache_(sheetName);
      logAudit_(sheetName, pkValue, 'DELETE', {});
      return true;
    }
  }
  return false;
}

/**
 * 整批新增/更新/刪除同一張分頁的很多列，取代「每一列各自呼叫 upsertRow_/deleteRow_」。
 *
 * 逐列處理的問題：每一列各自要「掃 PK 欄找列號 → 讀寫格式 → 寫入 → 寫稽核」，
 * 一次矩陣式的整批存檔(銷貨成本/營業費用/開發總投/科目設定…隨便一頁動輒十幾到上百格)
 * 就會在同一次執行裡打出對應數量的 Sheets API 呼叫，是存檔感覺卡的主因
 * （實測 55 格：逐列寫入約 330 次 API 呼叫，整批寫入後降到個位數，見
 * tools/verify-write-batching.js）。
 *
 * 做法跟 CalcEngine.gs 的 writePLResult_ 一樣：整段資料只讀一次、只寫一次 ——
 *   1. 把現有資料整塊讀出來(1 次 getValues)
 *   2. 在記憶體裡套用這一批的新增/更新(找不到 PK 就當新增)與刪除
 *   3. 整段一次寫回(先 clearContent 再 setValues，避免列數變少時留下舊資料的殘影)
 * 呼叫端仍然一次只描述「這一批要 upsert 哪些列、要刪除哪些 PK」，不需要知道列號，
 * 跟原本呼叫 upsertRow_/deleteRow_ 的介面一樣簡單。
 *
 * upserts：要新增或更新的列物件陣列，沒有 pkField 值的視為新增(自動產生 ID)，
 *          其餘欄位比照 upsertRow_ 的語意整列覆蓋(不是 merge，畫面沒送出的欄位會變空白，
 *          呼叫端要跟原本一樣自己決定是否先用 upsertRowMerge_ 那種模式取現有資料補齊)。
 * deletePks：要刪除的 PK 值陣列；跟同一批 upserts 撞到同一個 PK 時，以 upserts 為準
 *            (先刪除清單、後面又被 upsert 加回來，理當視為「留下」而不是「刪除」)。
 */
function batchWriteRows_(sheetName, pkField, upserts, deletePks) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField);
  var width = headers.length;
  var lastRow = sheet.getLastRow();

  var existing = lastRow >= 2 ? sheet.getRange(2, 1, lastRow - 1, width).getValues() : [];

  var deleteSet = {};
  (deletePks || []).forEach(function (pk) { if (pk !== '' && pk !== null && pk !== undefined) deleteSet[String(pk)] = true; });

  // pk(字串) -> existing 陣列的索引，只收有值的 PK；空白列(理論上不會有，防禦一下)不參與比對
  var pkIndex = {};
  existing.forEach(function (row, i) {
    if (row[pkCol] !== '' && row[pkCol] !== null && row[pkCol] !== undefined) pkIndex[String(row[pkCol])] = i;
  });

  var auditEntries = [];
  var now = new Date();
  var user = Session.getActiveUser().getEmail();

  (upserts || []).forEach(function (rowObj) {
    if (!rowObj[pkField]) rowObj[pkField] = generateId_(rowIdPrefix_(sheetName));
    var pk = String(rowObj[pkField]);
    var rowArray = headers.map(function (h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    var isNew = pkIndex[pk] === undefined;
    if (isNew) { pkIndex[pk] = existing.length; existing.push(rowArray); }
    else existing[pkIndex[pk]] = rowArray;
    auditEntries.push([now, user, sheetName, rowObj[pkField], isNew ? 'INSERT' : 'UPDATE', JSON.stringify(rowObj)]);
    delete deleteSet[pk];   // 同一批裡先列進刪除清單、又被 upsert 加回來的，以加回來為準
  });

  var survivors = Object.keys(deleteSet).length ? existing.filter(function (row) {
    var pk = String(row[pkCol]);
    if (!deleteSet[pk]) return true;
    auditEntries.push([now, user, sheetName, row[pkCol], 'DELETE', '{}']);
    return false;
  }) : existing;

  // 整段資料一次寫回；先清掉舊範圍再寫，列數變少(刪除多於新增)時才不會留下舊列的殘影
  if (lastRow >= 2) sheet.getRange(2, 1, lastRow - 1, width).clearContent();
  if (survivors.length) {
    var range = sheet.getRange(2, 1, survivors.length, width);
    applyTextColumnFormats_(range, headers, sheetName);
    range.setValues(survivors);
  }
  invalidateSheetCache_(sheetName);
  logAuditBatch_(auditEntries);
  return true;
}

function rowIdPrefix_(sheetName) {
  var map = {
    SalesMix: 'SM', CostOfSales: 'CS', DevInvestment: 'DI',
    OperatingExpense: 'OE', Parameters: 'PM', PLResult: 'PR',
    VehicleTypes: 'VT', Vehicles: 'VH', Scenarios: 'SC'
  };
  return map[sheetName] || 'RW';
}

function logAudit_(sheetName, rowId, action, payload) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AuditLog');
  if (!sheet) return; // AuditLog 為選配表，不存在就略過
  sheet.appendRow([new Date(), Session.getActiveUser().getEmail(), sheetName, rowId, action, JSON.stringify(payload)]);
}

/** logAudit_ 的整批版本：entries 是 [[Timestamp, User, SheetName, RowID, Action, Payload], ...]，
 *  一次 setValues() 寫完，不像逐筆 appendRow() 一列一次呼叫。 */
function logAuditBatch_(entries) {
  if (!entries || !entries.length) return;
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AuditLog');
  if (!sheet) return; // AuditLog 為選配表，不存在就略過
  var lastRow = sheet.getLastRow();
  sheet.getRange(lastRow + 1, 1, entries.length, 6).setValues(entries);
}

function toNumber_(v) {
  var n = Number(v);
  return isNaN(n) ? 0 : n;
}

/** 依某個排序欄位排序，留白視為排在最後面；相對順序穩定，不會因為排序值相同就跳來跳去 */
function sortByOrder_(rows, field) {
  var withIndex = rows.map(function (r, i) { return { row: r, i: i }; });
  withIndex.sort(function (a, b) {
    var av = a.row[field] === '' || a.row[field] === undefined || a.row[field] === null ? Infinity : toNumber_(a.row[field]);
    var bv = b.row[field] === '' || b.row[field] === undefined || b.row[field] === null ? Infinity : toNumber_(b.row[field]);
    return av !== bv ? av - bv : a.i - b.i;
  });
  return withIndex.map(function (x) { return x.row; });
}


// ===== src/FormulaEngine.gs =====
/**
 * 公式引擎：讓每個損益科目的「計算來源」可以用公式自由設定，不再寫死在 CalcEngine 裡。
 *
 * 語法（刻意貼近 Excel，財務同仁不必另外學）：
 *   數字       1000、0.5、15%（= 0.15）
 *   科目代碼   P8、b1、B、K（直接打代碼）
 *   [名稱]     中括號裡放：系統變數(如 [建議零售價]、[LC總台數])、參數(如 [營業稅率]、自訂參數)、
 *              或同一張科目表裡的科目名稱(如 [材料成本-LP])。比率參數取出來就是小數(5% → 0.05)。
 *   運算子     + - * / ^ ( )，比較 < > <= >= = <>（成立為 1、不成立為 0）
 *              也接受全形與數學符號：× ÷ − （ ），方便直接從簡報/Excel 貼上
 *   函式       SUM(a,b,...)、ROUND(x[,位數])、ROUNDUP、ROUNDDOWN、MIN、MAX、ABS、IF(條件,成立,不成立)
 *              CHILDREN()    這個科目底下所有子科目的合計(小計用)
 *              TAXDEDUCT()   勾選「貨物稅完稅價格可扣除」的科目合計
 *              REF("情境ID","科目代碼"[,"車系ID"])  引用另一個情境(可以是別的車型)的科目金額，
 *                            例如「一般材料以 DE 為 BASE × 1.2」：REF("SC-xxx","b4") * 1.2
 *                            沒指定車系時：該情境有同一個車系就取那個車系，否則取加權平均
 *
 * 安全性：自己寫的遞迴下降解析器，不用 eval / new Function —— 公式來自使用者輸入、也會跟著
 * 資料包在同事之間交換，不能讓它有機會執行任意程式碼。
 *
 * 除以 0 的結果為 0（不是錯誤）：試算初期常常台數還沒填，整張損益表因此全部變成錯誤訊息
 * 反而看不出其他數字對不對。
 */

var FORMULA_FUNCTIONS = ['SUM', 'ROUND', 'ROUNDUP', 'ROUNDDOWN', 'MIN', 'MAX', 'ABS', 'IF', 'CHILDREN', 'TAXDEDUCT', 'REF'];

/** 解析結果快取（同一段公式字串只解析一次） */
var FORMULA_AST_CACHE_ = {};

function formulaError_(message, pos) {
  var e = new Error(message + (pos !== undefined && pos !== null ? '（第 ' + (pos + 1) + ' 個字附近）' : ''));
  e.isFormulaError = true;
  return e;
}

/** 全形/數學符號 → 半形運算子 */
function normalizeFormulaText_(src) {
  return String(src === undefined || src === null ? '' : src)
    .replace(/[×＊]/g, '*').replace(/[÷／]/g, '/').replace(/[−–—－]/g, '-').replace(/＋/g, '+')
    .replace(/（/g, '(').replace(/）/g, ')').replace(/，/g, ',').replace(/［/g, '[').replace(/］/g, ']')
    .replace(/％/g, '%').replace(/＝/g, '=').replace(/[＜]/g, '<').replace(/[＞]/g, '>')
    .replace(/[“”]/g, '"').replace(/^\s*=/, '');
}

function tokenizeFormula_(src) {
  var s = normalizeFormulaText_(src);
  var tokens = [];
  var i = 0;
  while (i < s.length) {
    var ch = s.charAt(i);
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      var m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(s.slice(i));
      if (!m) throw formulaError_('數字格式不正確', i);
      var n = Number(m[0]);
      i += m[0].length;
      tokens.push({ t: 'num', v: n, pos: i - m[0].length });
      continue;
    }
    if (ch === '[') {
      var end = s.indexOf(']', i);
      if (end === -1) throw formulaError_('中括號 [ 沒有對應的 ]', i);
      var name = s.slice(i + 1, end).trim();
      if (!name) throw formulaError_('中括號裡沒有名稱', i);
      tokens.push({ t: 'name', v: name, pos: i });
      i = end + 1;
      continue;
    }
    if (ch === '"' || ch === "'") {
      var close = s.indexOf(ch, i + 1);
      if (close === -1) throw formulaError_('字串缺少結尾的引號', i);
      tokens.push({ t: 'str', v: s.slice(i + 1, close), pos: i });
      i = close + 1;
      continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      var id = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i))[0];
      tokens.push({ t: 'id', v: id, pos: i });
      i += id.length;
      continue;
    }
    var two = s.substr(i, 2);
    if (two === '<=' || two === '>=' || two === '<>' || two === '!=') {
      tokens.push({ t: 'op', v: two === '!=' ? '<>' : two, pos: i });
      i += 2;
      continue;
    }
    if ('+-*/^(),%<>='.indexOf(ch) !== -1) {
      tokens.push({ t: 'op', v: ch, pos: i });
      i++;
      continue;
    }
    throw formulaError_('看不懂的字元「' + ch + '」', i);
  }
  tokens.push({ t: 'end', pos: s.length });
  return tokens;
}

/**
 * 遞迴下降解析：
 *   compare := additive ( (< > <= >= = <>) additive )*
 *   additive := term ( (+|-) term )*
 *   term := unary ( (*|/) unary )*
 *   unary := (+|-) unary | power
 *   power := postfix ( ^ unary )?
 *   postfix := primary %*
 */
function parseFormula_(src) {
  var key = String(src === undefined || src === null ? '' : src);
  if (FORMULA_AST_CACHE_[key]) return FORMULA_AST_CACHE_[key];
  var tokens = tokenizeFormula_(key);
  var p = 0;
  function peek() { return tokens[p]; }
  function isOp(v) { var t = tokens[p]; return t.t === 'op' && t.v === v; }
  function expectOp(v) {
    if (!isOp(v)) throw formulaError_('這裡應該是「' + v + '」', tokens[p].pos);
    p++;
  }
  function compare() {
    var left = additive();
    while (peek().t === 'op' && ['<', '>', '<=', '>=', '=', '<>'].indexOf(peek().v) !== -1) {
      var op = tokens[p++].v;
      left = { t: 'bin', op: op, a: left, b: additive() };
    }
    return left;
  }
  function additive() {
    var left = term();
    while (isOp('+') || isOp('-')) {
      var op = tokens[p++].v;
      left = { t: 'bin', op: op, a: left, b: term() };
    }
    return left;
  }
  function term() {
    var left = unary();
    while (isOp('*') || isOp('/')) {
      var op = tokens[p++].v;
      left = { t: 'bin', op: op, a: left, b: unary() };
    }
    return left;
  }
  function unary() {
    if (isOp('-')) { p++; return { t: 'neg', a: unary() }; }
    if (isOp('+')) { p++; return unary(); }
    return power();
  }
  function power() {
    var base = postfix();
    if (isOp('^')) { p++; return { t: 'bin', op: '^', a: base, b: unary() }; }
    return base;
  }
  function postfix() {
    var node = primary();
    while (isOp('%')) { p++; node = { t: 'bin', op: '/', a: node, b: { t: 'num', v: 100 } }; }
    return node;
  }
  function primary() {
    var tok = tokens[p];
    if (tok.t === 'num') { p++; return { t: 'num', v: tok.v }; }
    if (tok.t === 'str') { p++; return { t: 'str', v: tok.v }; }
    if (tok.t === 'name') { p++; return { t: 'name', v: tok.v, pos: tok.pos }; }
    if (tok.t === 'id') {
      p++;
      if (isOp('(')) {
        var fname = tok.v.toUpperCase();
        if (FORMULA_FUNCTIONS.indexOf(fname) === -1) throw formulaError_('沒有「' + tok.v + '」這個函式', tok.pos);
        p++;
        var args = [];
        if (!isOp(')')) {
          args.push(compare());
          while (isOp(',')) { p++; args.push(compare()); }
        }
        expectOp(')');
        return { t: 'call', name: fname, args: args, pos: tok.pos };
      }
      return { t: 'code', v: tok.v, pos: tok.pos };
    }
    if (isOp('(')) {
      p++;
      var inner = compare();
      expectOp(')');
      return inner;
    }
    if (tok.t === 'end') throw formulaError_('公式不完整', tok.pos);
    throw formulaError_('這裡不應該出現「' + tok.v + '」', tok.pos);
  }
  if (peek().t === 'end') throw formulaError_('公式是空的');
  var ast = compare();
  if (peek().t !== 'end') throw formulaError_('多出了「' + peek().v + '」', peek().pos);
  FORMULA_AST_CACHE_[key] = ast;
  return ast;
}

/** 走訪 AST 收集引用：科目代碼、[名稱]、用到的函式 */
function formulaRefs_(ast) {
  var refs = { codes: [], names: [], calls: [], refCalls: [] };
  function add(list, v) { if (list.indexOf(v) === -1) list.push(v); }
  (function walk(n) {
    if (!n) return;
    if (n.t === 'code') add(refs.codes, n.v);
    else if (n.t === 'name') add(refs.names, n.v);
    else if (n.t === 'call') {
      add(refs.calls, n.name);
      if (n.name === 'REF') refs.refCalls.push(n);
      n.args.forEach(walk);
    } else if (n.t === 'bin') { walk(n.a); walk(n.b); }
    else if (n.t === 'neg') walk(n.a);
  })(ast);
  return refs;
}

/**
 * 計算 AST。env 提供：
 *   code(c)       → 科目金額(會觸發相依科目先算)
 *   name(n)       → [名稱] 的值(變數/參數/科目名稱)
 *   children()    → 子科目合計
 *   taxDeduct()   → 可扣除貨物稅的科目合計
 *   ref(sid, code, vid) → 跨情境引用
 */
function evalFormulaAst_(n, env) {
  switch (n.t) {
    case 'num': return n.v;
    case 'str': return n.v;
    case 'code': return toNumber_(env.code(n.v, n.pos));
    case 'name': return toNumber_(env.name(n.v, n.pos));
    case 'neg': return -num_(evalFormulaAst_(n.a, env));
    case 'bin': {
      var a = evalFormulaAst_(n.a, env), b = evalFormulaAst_(n.b, env);
      switch (n.op) {
        case '+': return num_(a) + num_(b);
        case '-': return num_(a) - num_(b);
        case '*': return num_(a) * num_(b);
        case '/': return num_(b) === 0 ? 0 : num_(a) / num_(b);
        case '^': return Math.pow(num_(a), num_(b));
        case '<': return num_(a) < num_(b) ? 1 : 0;
        case '>': return num_(a) > num_(b) ? 1 : 0;
        case '<=': return num_(a) <= num_(b) ? 1 : 0;
        case '>=': return num_(a) >= num_(b) ? 1 : 0;
        case '=': return (typeof a === 'string' || typeof b === 'string') ? (String(a) === String(b) ? 1 : 0) : (num_(a) === num_(b) ? 1 : 0);
        case '<>': return (typeof a === 'string' || typeof b === 'string') ? (String(a) !== String(b) ? 1 : 0) : (num_(a) !== num_(b) ? 1 : 0);
      }
      break;
    }
    case 'call': return evalFormulaCall_(n, env);
  }
  throw formulaError_('無法計算的公式片段');
}

function num_(v) { return typeof v === 'number' ? (isFinite(v) ? v : 0) : toNumber_(v); }

function evalFormulaCall_(n, env) {
  var args = n.args;
  var vals = function () { return args.map(function (a) { return num_(evalFormulaAst_(a, env)); }); };
  var need = function (min, max) {
    if (args.length < min || (max !== undefined && args.length > max)) {
      throw formulaError_(n.name + '() 的參數個數不正確', n.pos);
    }
  };
  var roundTo = function (x, digits, mode) {
    var f = Math.pow(10, digits || 0);
    var v = x * f;
    // 跟 Excel 一樣：ROUND 是「四捨五入、遠離 0」，負數 -2.5 → -3（JS 的 Math.round 會變 -2）
    if (mode === 'up') v = v < 0 ? -Math.ceil(-v - 1e-9) : Math.ceil(v - 1e-9);
    else if (mode === 'down') v = v < 0 ? -Math.floor(-v + 1e-9) : Math.floor(v + 1e-9);
    else v = v < 0 ? -Math.round(-v) : Math.round(v);
    return v / f;
  };
  switch (n.name) {
    case 'SUM': return vals().reduce(function (s, x) { return s + x; }, 0);
    case 'MIN': need(1); return Math.min.apply(null, vals());
    case 'MAX': need(1); return Math.max.apply(null, vals());
    case 'ABS': need(1, 1); return Math.abs(vals()[0]);
    case 'ROUND': need(1, 2); var r = vals(); return roundTo(r[0], r[1] || 0);
    case 'ROUNDUP': need(1, 2); var u = vals(); return roundTo(u[0], u[1] || 0, 'up');
    case 'ROUNDDOWN': need(1, 2); var d = vals(); return roundTo(d[0], d[1] || 0, 'down');
    case 'IF':
      need(2, 3);
      // 只算被選到的那一支：沒選到的分支裡可能引用了這個車系沒有的資料
      return num_(evalFormulaAst_(args[0], env)) ? evalFormulaAst_(args[1], env) : (args[2] ? evalFormulaAst_(args[2], env) : 0);
    case 'CHILDREN': need(0, 0); return env.children(n.pos);
    case 'TAXDEDUCT': need(0, 0); return env.taxDeduct(n.pos);
    case 'REF': {
      need(2, 3);
      var parts = args.map(function (a) { return evalFormulaAst_(a, env); });
      return env.ref(String(parts[0]), String(parts[1]), parts[2] === undefined ? '' : String(parts[2]), n.pos);
    }
  }
  throw formulaError_('沒有「' + n.name + '」這個函式', n.pos);
}

/**
 * 檢查公式語法並回傳引用清單；語法錯誤時回傳 { ok:false, error }，不丟例外。
 * 給「科目設定」頁面即時檢查用。
 */
function inspectFormula_(src) {
  try {
    var ast = parseFormula_(src);
    return { ok: true, ast: ast, refs: formulaRefs_(ast) };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/** 公式文字的標準化（存檔前用）：去掉開頭的 = 與多餘空白，全形符號轉半形 */
function cleanFormulaText_(src) {
  return normalizeFormulaText_(src).replace(/\s+/g, ' ').trim();
}


// ===== src/DataService.gs =====
/**
 * 資料存取層：每張表提供 get / save / delete。
 * 個人使用版本，仍用 LockService 避免同一個瀏覽器分頁快速連點造成資料錯亂。
 */

// 可重入：有些整批作業(如刪科目連帶刪金額)會呼叫其他同樣上鎖的函式，
// 巢狀時只由最外層真正取得/釋放鎖，避免自己卡住自己。
var LOCK_DEPTH_ = 0;

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  // 30 秒：车型/车系重新命名要连带改好几张表，资料多的时候比一般存档慢，
  // 10 秒常常等不到就先丢「鎖定逾時」，改成比照 Apps Script 常见值调宽松一点。
  if (LOCK_DEPTH_ === 0) lock.waitLock(30000);
  LOCK_DEPTH_++;
  try {
    return fn();
  } finally {
    LOCK_DEPTH_--;
    if (LOCK_DEPTH_ === 0) lock.releaseLock();
  }
}

/**
 * 開場資料：車型清單 + 預設選到的車型與它底下的情境，一次取回。
 * 前端載入時原本要分別呼叫 getVehicleTypes / getScenarios 並各觸發一次重繪，
 * 每趟 google.script.run 往返都是數百毫秒，合併成一次可以明顯縮短開場等待。
 */
function getBootstrap(preferredVehicleTypeId) {
  // 開頁時順手把「由程式定義的科目名稱」對回來。做成自動修復而不是維護選單，
  // 是因為名稱對不上數字的畫面看起來就是「系統算錯了」，不該要使用者先知道有這支維護功能。
  // 只有真的對不上時才寫入，之後每次開頁都只是一次讀取。
  // 開頁時順手做資料模型升級(舊版全域科目表 → 每個車型各一份、補公式欄位)。已升級過的資料只會讀、不會寫。
  withLock_(function () { return migrateDataModel_(true); });

  var types = getVehicleTypes();
  var ids = types.map(function (t) { return t.VehicleTypeID; });
  var pick = (preferredVehicleTypeId && ids.indexOf(preferredVehicleTypeId) !== -1)
    ? preferredVehicleTypeId : (ids[0] || '');
  return {
    vehicleTypes: types,
    vehicleTypeId: pick,
    scenarios: pick ? getScenarios(pick) : []
  };
}

// ---- VehicleTypes（車型主檔，如 DA/DE/DH/DX，需先建立才能在底下新增車系） ----
function getVehicleTypes() {
  return sheetToObjects_(SHEETS.VEHICLE_TYPES) || [];
}
function saveVehicleType(rowObj) {
  return withLock_(function () { return upsertRowMerge_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', rowObj); });
}
function deleteVehicleType(vehicleTypeId) {
  return withLock_(function () {
    // 車型自己的那份科目表一起刪掉(科目表是跟著車型走的)
    var chart = (sheetToObjects_(SHEETS.PL_LINE_ITEMS) || []).filter(function (r) { return r.VehicleTypeID === vehicleTypeId; })
      .map(function (r) { return r.LineID; });
    if (chart.length) batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', [], chart);
    return deleteRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', vehicleTypeId);
  });
}
/** 車型主檔整批儲存：整張表直接編輯、按一次儲存（沒填代號的空白新增列會被略過） */
function saveVehicleTypeGrid(rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(getVehicleTypes(), 'VehicleTypeID');
    var upserts = (rows || []).filter(function (r) { return r.VehicleTypeID; })
      .map(function (r) { return mergeRowForBatch_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', r, existingByPk); });
    batchWriteRows_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', upserts, []);
    return getVehicleTypes();
  });
}

/**
 * 車型代號重新命名：新增一列新代號、把所有引用舊代號的資料(車系、情境)一併改成新代號，
 * 最後刪掉舊代號那一列。車型代號是車系/情境的外鍵，只改主檔那一列會讓底下的車系跟情境
 * 全部找不到自己屬於哪個車型(等於資料還在、畫面上卻消失)，所以一定要連動更新。
 */
function renameVehicleType(oldId, newId) {
  return withLock_(function () {
    newId = String(newId || '').trim();
    if (!oldId || !newId) throw new Error('車型代號不能為空');
    if (oldId === newId) return getVehicleTypes();
    var existing = getVehicleTypes();
    var row = existing.filter(function (t) { return t.VehicleTypeID === oldId; })[0];
    if (!row) throw new Error('找不到車型：' + oldId);
    if (existing.some(function (t) { return t.VehicleTypeID === newId; })) {
      throw new Error('車型代號「' + newId + '」已經存在');
    }

    row.VehicleTypeID = newId;
    upsertRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', row);
    deleteRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', oldId);

    [[SHEETS.VEHICLES, 'VehicleID'], [SHEETS.SCENARIOS, 'ScenarioID'], [SHEETS.ACTIONS, 'ActionID']].forEach(function (pair) {
      var sheetName = pair[0], pk = pair[1];
      var rows = (sheetToObjects_(sheetName) || []).filter(function (r) { return r.VehicleTypeID === oldId; });
      rows.forEach(function (r) { r.VehicleTypeID = newId; });
      if (rows.length) batchWriteRows_(sheetName, pk, rows, []);
    });
    // 科目表的主鍵含車型代號，要整份換成新代號
    var chart = (sheetToObjects_(SHEETS.PL_LINE_ITEMS) || []).filter(function (r) { return r.VehicleTypeID === oldId; });
    if (chart.length) {
      var oldPks = chart.map(function (r) { return r.LineID; });
      var moved = chart.map(function (r) {
        var copy = {};
        SCHEMA.PLLineItems.forEach(function (h) { copy[h] = r[h] === undefined ? '' : r[h]; });
        copy.VehicleTypeID = newId;
        copy.LineID = lineIdOf_(newId, r.LineCode);
        return copy;
      });
      batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', moved, oldPks);
    }
    return getVehicleTypes();
  });
}

// ---- Vehicles（車系，如 3人貨車/9人客貨車，隸屬某個 VehicleType） ----
/**
 * 車系清單依 SortOrder 排序：這個順序會帶到所有用車系排欄位的地方
 * （銷貨成本/營業費用矩陣的欄位、儀表板的車系選單...），車系設定頁可以直接改「排序」欄位調整。
 * 沒填排序值的車系排在最後面(用 Infinity)，相對順序仍照 Sheet 上的原始順序(穩定排序)。
 */
function getVehicles(vehicleTypeId) {
  var rows = sheetToObjects_(SHEETS.VEHICLES) || [];
  rows = vehicleTypeId ? rows.filter(function (r) { return r.VehicleTypeID === vehicleTypeId; }) : rows;
  return sortByOrder_(rows, 'SortOrder');
}
function saveVehicle(rowObj) {
  return withLock_(function () { return upsertRowMerge_(SHEETS.VEHICLES, 'VehicleID', rowObj); });
}
function deleteVehicle(vehicleId) {
  return withLock_(function () { return deleteRow_(SHEETS.VEHICLES, 'VehicleID', vehicleId); });
}
/** 車系設定整批儲存 */
function saveVehicleGrid(vehicleTypeId, rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(sheetToObjects_(SHEETS.VEHICLES), 'VehicleID');
    var upserts = (rows || []).filter(function (r) { return r.VehicleID; })
      .map(function (r) {
        r.VehicleTypeID = vehicleTypeId;
        return mergeRowForBatch_(SHEETS.VEHICLES, 'VehicleID', r, existingByPk);
      });
    batchWriteRows_(SHEETS.VEHICLES, 'VehicleID', upserts, []);
    return getVehicles(vehicleTypeId);
  });
}

/**
 * 車系順序：跟目標某一列交換排序值(SortOrder)，立即生效並回傳最新順序。
 * 讓「銷貨成本」「營業費用」矩陣頁面也能直接調車系順序，不必特地切去「車系設定」頁。
 * 交換前先把目前顯示順序整批依序編號，確保每一列都有明確的 SortOrder 可以交換
 * （原本留白的舊資料靠 sortByOrder_ 排在最後、彼此順序不定，直接互換空白值沒有意義）。
 */
function reorderVehicle(vehicleTypeId, vehicleId, direction) {
  return withLock_(function () {
    var vehicles = getVehicles(vehicleTypeId);
    var idx = -1;
    vehicles.forEach(function (v, i) { if (v.VehicleID === vehicleId) idx = i; });
    if (idx === -1) throw new Error('找不到車系：' + vehicleId);
    var targetIdx = idx + (direction < 0 ? -1 : 1);
    if (targetIdx < 0 || targetIdx >= vehicles.length) return vehicles;
    vehicles.forEach(function (v, i) { v.SortOrder = i; });
    var tmp = vehicles[idx].SortOrder;
    vehicles[idx].SortOrder = vehicles[targetIdx].SortOrder;
    vehicles[targetIdx].SortOrder = tmp;
    vehicles.forEach(function (v) { upsertRow_(SHEETS.VEHICLES, 'VehicleID', v); });
    return getVehicles(vehicleTypeId);
  });
}

/**
 * 車系代號重新命名：新增一列新代號、把所有引用舊代號的資料(銷售構成、銷貨成本、營業費用、
 * 費率覆寫、損益快照)一併改成新代號，最後刪掉舊代號那一列。開發總投是情境層級，不記車系，
 * 不受影響。
 */
function renameVehicle(vehicleTypeId, oldId, newId) {
  return withLock_(function () {
    newId = String(newId || '').trim();
    if (!oldId || !newId) throw new Error('車系代號不能為空');
    if (oldId === newId) return getVehicles(vehicleTypeId);
    var existing = getVehicles();
    var row = existing.filter(function (v) { return v.VehicleID === oldId; })[0];
    if (!row) throw new Error('找不到車系：' + oldId);
    if (existing.some(function (v) { return v.VehicleID === newId; })) {
      throw new Error('車系代號「' + newId + '」已經存在');
    }

    row.VehicleID = newId;
    upsertRow_(SHEETS.VEHICLES, 'VehicleID', row);
    deleteRow_(SHEETS.VEHICLES, 'VehicleID', oldId);

    [[SHEETS.SALES_MIX, 'RowID'], [SHEETS.COST_OF_SALES, 'RowID'],
      [SHEETS.OPERATING_EXPENSE, 'RowID'], [SHEETS.PARAMETERS, 'ParamID'],
      [SHEETS.PL_RESULT, 'ResultID'], [SHEETS.LINE_NOTES, 'RowID']].forEach(function (pair) {
      var sheetName = pair[0], pk = pair[1];
      var rows = (sheetToObjects_(sheetName) || []).filter(function (r) { return r.VehicleID === oldId; });
      rows.forEach(function (r) { r.VehicleID = newId; });
      if (rows.length) batchWriteRows_(sheetName, pk, rows, []);
    });
    // 開發總投的「分攤車系」與科目的車系個別公式也記著車系代號
    var devRows = (sheetToObjects_(SHEETS.DEV_INVESTMENT) || []).filter(function (r) {
      return parseVehicleScope_(r.VehicleScope).indexOf(oldId) !== -1;
    });
    devRows.forEach(function (r) {
      r.VehicleScope = parseVehicleScope_(r.VehicleScope).map(function (id) { return id === oldId ? newId : id; }).join(',');
    });
    if (devRows.length) batchWriteRows_(SHEETS.DEV_INVESTMENT, 'RowID', devRows, []);
    var lines = (sheetToObjects_(SHEETS.PL_LINE_ITEMS) || []).filter(function (r) {
      return parseVehicleFormulas_(r.VehicleFormulas)[oldId] !== undefined;
    });
    lines.forEach(function (r) {
      var vf = parseVehicleFormulas_(r.VehicleFormulas);
      vf[newId] = vf[oldId];
      delete vf[oldId];
      r.VehicleFormulas = JSON.stringify(vf);
    });
    if (lines.length) batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', lines, []);
    return getVehicles(vehicleTypeId);
  });
}

// ---- Scenarios（隸屬某個 VehicleType，同一車型可有多個情境版本並排比較） ----
function getScenarios(vehicleTypeId) {
  var rows = sheetToObjects_(SHEETS.SCENARIOS) || [];
  rows = vehicleTypeId ? rows.filter(function (r) { return r.VehicleTypeID === vehicleTypeId; }) : rows;
  // 情境順序可以在情境設定頁拖曳調整；沒排過的照建立順序
  return sortByOrder_(rows, 'SortOrder');
}
// 情境代號改用 GATE 別，情境名稱自訂；同一個 GATE 下可以有多個情境(GATE F 現況 / GATE F 目標)，
// 所以 ScenarioID 只是系統內部鍵值，由 upsertRow_ 自動產生，不需使用者自行編碼。
function validateScenarioRow_(rowObj) {
  if (!rowObj.Gate) throw new Error('請選擇 GATE 別');
  if (GATE_OPTIONS.indexOf(rowObj.Gate) === -1) throw new Error('GATE 別不正確：' + rowObj.Gate);
}
function saveScenario(rowObj) {
  return withLock_(function () {
    validateScenarioRow_(rowObj);
    // 用合併式 upsert：情境表單沒有攤提基準台數欄位，直接覆寫會把開發總投頁設定的值清掉
    return upsertRowMerge_(SHEETS.SCENARIOS, 'ScenarioID', rowObj);
  });
}
function deleteScenario(scenarioId) {
  return withLock_(function () { return deleteRow_(SHEETS.SCENARIOS, 'ScenarioID', scenarioId); });
}

/** 情境設定整批儲存（既有情境直接在表格上改名/改性質，按一次儲存） */
function saveScenarioGrid(vehicleTypeId, rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(sheetToObjects_(SHEETS.SCENARIOS), 'ScenarioID');
    var upserts = [];
    (rows || []).forEach(function (r) {
      if (!r.ScenarioID && !r.Gate && !r.ScenarioName) return;
      r.VehicleTypeID = vehicleTypeId;
      validateScenarioRow_(r);
      upserts.push(mergeRowForBatch_(SHEETS.SCENARIOS, 'ScenarioID', r, existingByPk));
    });
    batchWriteRows_(SHEETS.SCENARIOS, 'ScenarioID', upserts, []);
    return getScenarios(vehicleTypeId);
  });
}

/**
 * 以既有情境為基礎建立新情境。
 * 實務上新情境幾乎都是既有情境的變形（「GATE F 目標」通常就是「GATE F 現況」改幾個數字，
 * 而下一版的目標又是以上一版目標為底），從頭把銷售構成、成本、開發總投重打一次很不合理。
 * sourceScenarioId 留空就是建立一個空白情境。
 */
function createScenarioFrom(rowObj, sourceScenarioId, parts) {
  return withLock_(function () {
    var saved = saveScenario(rowObj);
    if (sourceScenarioId) {
      copyScenarioData(sourceScenarioId, saved.ScenarioID, parts);
    }
    return saved;
  });
}

// ---- SalesMix ----
function getSalesMix(scenarioId) {
  var rows = sheetToObjects_(SHEETS.SALES_MIX) || [];
  return scenarioId ? rows.filter(function (r) { return r.ScenarioID === scenarioId; }) : rows;
}
function saveSalesMixRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.SALES_MIX, 'RowID', rowObj); });
}
function deleteSalesMixRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.SALES_MIX, 'RowID', rowId); });
}

/**
 * 銷售構成表格：一定會依「車系設定」把該車型底下每個車系各列一列，
 * 已存在的 SalesMix 資料合併進去，沒有的就是空白列，使用者不需要自己一列一列新增。
 */
function getSalesMixGrid(scenarioId, vehicleTypeId) {
  var existing = getSalesMix(scenarioId);
  var rows = getVehicles(vehicleTypeId).map(function (v) {
    var row = existing.filter(function (r) { return r.VehicleID === v.VehicleID; })[0] || {};
    return {
      VehicleID: v.VehicleID,
      VehicleCode: v.VehicleCode || '',
      RowID: row.RowID || '',
      SalesMixPct: row.SalesMixPct === undefined || row.SalesMixPct === '' ? '' : toNumber_(row.SalesMixPct),
      MonthlyVolume: row.MonthlyVolume === undefined || row.MonthlyVolume === '' ? '' : toNumber_(row.MonthlyVolume),
      LifeCycleYears: row.LifeCycleYears === undefined || row.LifeCycleYears === '' ? '' : toNumber_(row.LifeCycleYears),
      ListPriceTaxIncl: row.ListPriceTaxIncl === undefined || row.ListPriceTaxIncl === '' ? '' : toNumber_(row.ListPriceTaxIncl),
      MandatoryAccessoryPrice: row.MandatoryAccessoryPrice === undefined || row.MandatoryAccessoryPrice === '' ? '' : toNumber_(row.MandatoryAccessoryPrice),
      ScrapFee: row.ScrapFee === undefined || row.ScrapFee === '' ? '' : toNumber_(row.ScrapFee),
      ScrapFeeTaxStatus: row.ScrapFeeTaxStatus || '含稅',
      HorizontalPartsPriceAdj: row.HorizontalPartsPriceAdj === undefined || row.HorizontalPartsPriceAdj === '' ? '' : toNumber_(row.HorizontalPartsPriceAdj),
      Notes: row.Notes || ''
    };
  });
  return { rows: rows, scrapFeeTaxStatusOptions: SCRAP_FEE_TAX_STATUS };
}

/** 銷售構成整批儲存（表格一次送出，不必逐列存檔） */
function saveSalesMixGrid(scenarioId, vehicleTypeId, rows) {
