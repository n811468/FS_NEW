        var amt = devAmount(code);
        // 使用者自訂的攤提落點只有這個情境真的有開發總投列指到這裡才列出來，
        // 否則試用過一次的攤提落點會永遠以 0 留在每一份損益表上
        if (amt === undefined && d.AutoSource === AUTO_SOURCE.DEV_AMORT) excluded[code] = true;
        v = (amt || 0) * overrideDevScale_(scenarioId);
        traces[code] = { kind: 'dev', total: dev.totalsByLine[code] || 0, units: dev.totalUnits, perUnit: v };
      } else {
        v = inputs[code] || 0;
      }
    } catch (e) {
      if (!e.isFormulaError) throw e;
      errors[code] = e.message;
      v = 0;
    }
    visiting[code] = false;
    v = v * overrideLineScale_(scenarioId, code);
    values[code] = typeof v === 'number' && isFinite(v) ? v : 0;
    return values[code];
  }

  function evalLineFormula_(code, formula) {
    var ast = parseFormula_(formula);
    var refs = {};
    var v = evalFormulaAst_(ast, formulaEnv_(code, refs));
    traces[code] = { kind: 'formula', formula: formula, refs: refs };
    return num_(v);
  }

  function formulaEnv_(code, refs) {
    return {
      code: function (c) { var x = valueOf(c); refs[c] = x; return x; },
      name: function (n) {
        var x;
        if (vars.hasOwnProperty(n)) x = vars[n];
        else if (paramDefs[n]) x = paramValueForFormula_(params, paramDefs[n], vehicleId);
        else if (/^[A-Za-z]{3}匯率$/.test(n)) x = fxRateFor_(params, n.slice(0, 3).toUpperCase(), vehicleId);
        else if (byName[n]) x = valueOf(byName[n].LineCode);
        else throw formulaError_('找不到 [' + n + ']');
        refs['[' + n + ']'] = x;
        return x;
      },
      children: function () {
        var sum = (children[code] || []).reduce(function (s, c) { return s + valueOf(c); }, 0);
        refs['CHILDREN()'] = sum;
        return sum;
      },
      taxDeduct: function () {
        var sum = taxDeductCodes.reduce(function (s, c) { return s + valueOf(c); }, 0);
        refs['TAXDEDUCT()'] = sum;
        return sum;
      },
      ref: function (sid, c, vid) {
        var x = referenceValue_(sid, c, vid, vehicleId);
        refs['REF(' + sid + ',' + c + (vid ? ',' + vid : '') + ')'] = x;
        return x;
      }
    };
  }

  var probes = null;
  REF_STACK_.push(String(scenarioId) + '|' + String(vehicleId));
  try {
    defs.forEach(function (d) { valueOf(d.LineCode); });
    if (probe && probe.formulas) {
      probes = probe.formulas.map(function (f) {
        try { return num_(evalFormulaAst_(parseFormula_(f), formulaEnv_(probe.code, {}))); } catch (e) { return null; }
      });
    }
  } finally {
    REF_STACK_.pop();
  }

  var lineValues = {};
  defs.forEach(function (d) { if (!excluded[d.LineCode]) lineValues[d.LineCode] = values[d.LineCode]; });
  var revenue = lineValues.A || 0, exFactory = lineValues.P8 || 0;

  return {
    scenarioId: scenarioId,
    vehicleId: vehicleId,
    revenue: revenue,
    exFactoryPrice: exFactory,
    lineValues: lineValues,
    errors: errors,
    traces: traces,
    probes: probes,
    lines: buildResultLines_(lineValues, revenue, exFactory, defs)
  };
}

/**
 * REF("情境","科目"[,"車系"])：引用另一個情境(可以是別的車型)的科目金額。
 * 情境可以填 ScenarioID，也可以填「車型 GATE 情境名稱」(如 "DE GATE F 現況")。
 * 沒指定車系時：那個情境有同一個車系就取同一個車系，否則取加權平均。
 */
function referenceValue_(scenarioRef, lineCode, vehicleRef, currentVehicleId) {
  var scenarios = getScenarios();
  var target = scenarios.filter(function (s) { return s.ScenarioID === scenarioRef; })[0] ||
    scenarios.filter(function (s) {
      return [s.VehicleTypeID, s.Gate, s.ScenarioName].filter(function (x) { return x; }).join(' ') === scenarioRef;
    })[0];
  if (!target) throw formulaError_('REF 找不到情境「' + scenarioRef + '」');
  var mix = calcSalesMix_(target.ScenarioID);
  var vid = vehicleRef || (mix.some(function (r) { return r.VehicleID === currentVehicleId; }) ? currentVehicleId : '');
  if (vehicleRef && !mix.some(function (r) { return r.VehicleID === vehicleRef; })) {
    throw formulaError_('REF 的情境沒有車系「' + vehicleRef + '」');
  }
  var keys = vid ? [target.ScenarioID + '|' + vid] : mix.map(function (r) { return target.ScenarioID + '|' + r.VehicleID; });
  keys.forEach(function (k) {
    if (REF_STACK_.indexOf(k) !== -1) throw formulaError_('REF 循環引用：引用的情境又引用回來');
  });
  if (vid) {
    var res = calculatePLCore_(target.ScenarioID, vid);
    if (res.lineValues[lineCode] === undefined) throw formulaError_('REF 的情境沒有科目 ' + lineCode);
    return res.lineValues[lineCode];
  }
  var weighted = calculateScenarioWeighted(target.ScenarioID);
  var line = weighted.filter(function (l) { return l.LineCode === lineCode; })[0];
  if (!line) throw formulaError_('REF 的情境沒有科目 ' + lineCode);
  return line.Amount;
}

/**
 * 某情境(= 某車型)底下所有車系的損益，外加以銷售構成比加權的平均列。
 * 儀表板/報告只是「看」，一律用不寫入快照的 calculatePLCore_()。
 */
function calculatePLAllVehicles(scenarioId) {
  var salesMix = calcSalesMix_(scenarioId);
  var results = salesMix.map(function (row) { return calculatePLCore_(scenarioId, row.VehicleID); });

  // 加權平均列（以 SalesMixPct 加權）
  var totalPct = salesMix.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0) || 1;
  var weighted = {};
  results.forEach(function (res, idx) {
    var pct = toNumber_(salesMix[idx].SalesMixPct) / totalPct;
    res.lines.forEach(function (line) {
      weighted[line.LineCode] = (weighted[line.LineCode] || 0) + line.Amount * pct;
    });
  });

  return {
    scenarioId: scenarioId,
    vehicles: results,
    weightedAverage: buildResultLines_(weighted, weighted.A || 0, weighted.P8 || 0, lineDefsForScenario_(scenarioId))
  };
}

/** 單獨取某情境的加權平均損益（儀表板比較欄位用） */
function calculateScenarioWeighted(scenarioId) {
  return calculatePLAllVehicles(scenarioId).weightedAverage;
}

/**
 * 多個科目表合併成一份(比較欄位可能來自不同車型，科目表不同)：
 * 依代碼取聯集，名稱/位置以先出現的車型為準，依呈現順序(displayOrderDefs_，跟 Excel 一樣)排列。
 */
function unionLineDefs_(defLists) {
  var seen = {}, out = [];
  defLists.forEach(function (defs) {
    defs.forEach(function (d) {
      if (seen[d.LineCode]) return;
      seen[d.LineCode] = true;
      out.push(d);
    });
  });
  return displayOrderDefs_(out);
}

/**
 * 多車型/多情境比較：儀表板的核心 API。
 * selections = [{ ScenarioID, VehicleID }]，VehicleID 留空代表該情境的「加權平均」。
 *
 * 回傳的 lines 是所有欄位實際出現過科目的聯集(依呈現順序：扣減型小計排在明細後面，同 Excel)，並且帶上 ParentLine，
 * 讓前端可以把明細科目縮排在它的小計底下。某欄位沒有該科目時值為 null，前端顯示空白而不是 0。
 *
 * 每個欄位另外附 checks(小計驗算)、errors(公式錯誤)、traces(每個公式科目的計算過程，hover 用)。
 */
function calculateComparison(selections) {
  selections = selections || [];
  var vehicleTypes = getVehicleTypes();
  var scenarios = getScenarios();
  var vehicles = getVehicles();
  var defsByType = {};
  var defsOf = function (typeId) {
    if (!defsByType[typeId]) defsByType[typeId] = getPLLineItems(typeId);
    return defsByType[typeId];
  };

  var columns = selections.map(function (sel) {
    if (isSnapshotId_(sel.ScenarioID)) return snapshotColumn_(sel);
    var scenario = scenarios.filter(function (s) { return s.ScenarioID === sel.ScenarioID; })[0] || {};
    var vehicle = vehicles.filter(function (v) { return v.VehicleID === sel.VehicleID; })[0];
    var vehicleType = vehicleTypes.filter(function (t) { return t.VehicleTypeID === scenario.VehicleTypeID; })[0] || {};
    var lineDefs = defsOf(scenario.VehicleTypeID || '');

    var vehicleCalc = sel.VehicleID ? calculatePLCore_(sel.ScenarioID, sel.VehicleID) : null;
    var lines = vehicleCalc ? vehicleCalc.lines : calculateScenarioWeighted(sel.ScenarioID);
    var errors = {};
    if (vehicleCalc) errors = vehicleCalc.errors;
    else {
      calcSalesMix_(sel.ScenarioID).forEach(function (r) {
        var res = calculatePLCore_(sel.ScenarioID, r.VehicleID);
        Object.keys(res.errors).forEach(function (c) { if (!errors[c]) errors[c] = res.errors[c]; });
      });
    }

    var amounts = {};
    lines.forEach(function (l) { amounts[l.LineCode] = l.Amount; });

    return {
      scenarioId: sel.ScenarioID,
      vehicleId: sel.VehicleID || '',
      vehicleTypeId: scenario.VehicleTypeID || '',
      vehicleTypeLabel: scenario.VehicleTypeID || vehicleType.VehicleTypeID || '',
      scenarioLabel: [scenario.Gate || '', scenario.ScenarioName || ''].filter(function (p) { return p; }).join(' '),
      scenarioType: scenario.ScenarioType || '',
      scenarioNotes: scenario.Notes || '',
      vehicleLabel: sel.VehicleID ? ((vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均',
      isWeighted: !sel.VehicleID,
      // 銷量資訊：儀表板用來 (1) hover 欄位標題時顯示這一欄的台數基礎 (2) 把單台金額換算成年度/LC 總額
      volume: columnVolumeInfo_(sel.ScenarioID, sel.VehicleID, vehicles),
      traces: vehicleCalc ? vehicleCalc.traces : null,
      errors: errors,
      label: [
        scenario.VehicleTypeID || vehicleType.VehicleTypeID || '',
        scenario.Gate || '',
        scenario.ScenarioName || '',
        sel.VehicleID ? ((vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均'
      ].filter(function (p) { return p; }).join(' / '),
      amounts: amounts,
      revenue: amounts.A || 0,
      exFactoryPrice: amounts.P8 || 0,
      checks: subtotalChecks_(amounts, lineDefs),
      profitCode: profitLineCode_(lineDefs)
    };
  });

  var allDefs = unionLineDefs_(columns.map(function (c) { return c.snapshotLines || defsOf(c.vehicleTypeId); }));
  columns.forEach(function (c) {
    if (c.snapshotLines) c.profitCode = profitLineCode_(c.snapshotLines);
    delete c.snapshotLines;
  });
  var profitCodes = {};
  columns.forEach(function (c) { if (c.profitCode) profitCodes[c.profitCode] = true; });
  var depth = lineDepths_(allDefs);
  // 只列出至少有一個比較欄位真的算出數字的科目(不同車型科目不同時，表格才不會塞滿空列)
  var usedLines = allDefs.filter(function (def) {
    return columns.some(function (col) { return col.amounts[def.LineCode] !== undefined; });
  }).map(function (def) {
    return {
      LineCode: def.LineCode,
      LineName: def.LineName,
      Category: def.Category,
      ParentLine: def.ParentLine || '',
      SortOrder: toNumber_(def.SortOrder),
      CalcType: def.CalcType,
      Formula: def.CalcType === CALC_TYPES.FORMULA ? def.Formula : '',
      AutoSource: resultAutoSource_(def),
      Depth: depth[def.LineCode] || 0,
      isSubtotal: PROTECTED_LINE_CODES.indexOf(def.LineCode) !== -1 || !!profitCodes[def.LineCode] || isGroupLine_(def, allDefs),
      isProfit: !!profitCodes[def.LineCode],
      isPriceStructure: String(def.Category || '') === '售價結構'
    };
  });

  return { columns: columns, lines: usedLines, subtotalCodes: PROTECTED_LINE_CODES };
}

/**
 * 哪一個科目是「營業淨利」：預設是 K。K 被刪掉時(例如另外新增一個淨利科目、再把原本的刪掉)，
 * 改用損益表最底下的總計：頂層、不是售價結構、用公式算、而且沒有被其他科目的公式引用的科目，
 * 有好幾個就取損益表上最後一個。不看位置挑「最後一行」，否則最後一行是手動輸入的費用(例如前瞻費用)
 * 時會把費用當成淨利。儀表板重點指標、GATE 報告、損益兩平、目標反推的預設指標都看這裡，不寫死 K。
 */
function profitLineCode_(defs) {
  defs = defs || [];
  if (defs.some(function (d) { return d.LineCode === 'K'; })) return 'K';
  var top = displayOrderDefs_(defs.slice()).filter(function (d) {
    return !d.ParentLine && String(d.Category || '') !== '售價結構';
  });
  if (!top.length) return '';
  var referenced = {};
  defs.forEach(function (d) {
    var formulas = [];
    if (d.CalcType === CALC_TYPES.FORMULA && d.Formula) formulas.push(d.Formula);
    var vf = parseVehicleFormulas_(d.VehicleFormulas);
    Object.keys(vf).forEach(function (k) { if (vf[k]) formulas.push(vf[k]); });
    formulas.forEach(function (f) {
      var info = inspectFormula_(f);
      if (!info.ok) return;
      info.refs.codes.forEach(function (c) { if (c !== d.LineCode) referenced[c] = true; });
      info.refs.names.forEach(function (n) {
        defs.forEach(function (x) { if (x.LineName === n && x.LineCode !== d.LineCode) referenced[x.LineCode] = true; });
      });
    });
  });
  var isFormula = function (d) { return d.CalcType === CALC_TYPES.FORMULA; };
  var pick = top.filter(function (d) { return isFormula(d) && !referenced[d.LineCode]; });
  if (!pick.length) pick = top.filter(isFormula);
  if (!pick.length) pick = top;
  return pick[pick.length - 1].LineCode;
}

/** 科目的縮排層級(父科目鏈長度) */
function lineDepths_(defs) {
  var byCode = {};
  defs.forEach(function (d) { byCode[d.LineCode] = d; });
  var depth = {};
  defs.forEach(function (d) {
    var n = 0, cur = d, guard = 0;
    while (cur && cur.ParentLine && byCode[cur.ParentLine] && guard++ < 20) { n++; cur = byCode[cur.ParentLine]; }
    depth[d.LineCode] = n;
  });
  return depth;
}

/** 有子科目的科目(小計群組) */
function isGroupLine_(def, defs) {
  return defs.some(function (d) { return d.ParentLine === def.LineCode; });
}

/**
 * 給畫面用的「自動計算標記」：沿用舊欄位名稱 AutoSource，讓儀表板的圓點/hover 提示照舊運作。
 * 手動輸入 = 空白；結構小計 = 空白(看名稱就知道)；其餘公式 = FORMULA；開發總投攤提 = DEV_AMORT 類。
 */
function resultAutoSource_(def) {
  if (def.CalcType === CALC_TYPES.DEV_AMORT) return def.AutoSource || AUTO_SOURCE.DEV_AMORT;
  if (def.CalcType === CALC_TYPES.FORMULA) {
    if (PROTECTED_LINE_CODES.indexOf(def.LineCode) !== -1) return '';
    return 'FORMULA';
  }
  return '';
}

/**
 * 比較欄位的銷量基礎。
 * 單一車系：該車系在銷售構成表上的月銷量、LC 年限、構成比，總台數 = 月銷量 × 12 × LC年限。
 * 加權平均：月銷量/總台數是該情境所有車系加總，並附上各車系的構成比(mix)。
 */
function columnVolumeInfo_(scenarioId, vehicleId, vehicles) {
  var rows = calcSalesMix_(scenarioId);
  var nameOf = function (id) {
    var v = vehicles.filter(function (x) { return x.VehicleID === id; })[0];
    return (v && v.VehicleCode) || id;
  };
  var unitsOf = function (r) { return toNumber_(r.MonthlyVolume) * 12 * toNumber_(r.LifeCycleYears); };
  if (vehicleId) {
    var row = rows.filter(function (r) { return r.VehicleID === vehicleId; })[0] || {};
    return {
      monthlyVolume: toNumber_(row.MonthlyVolume),
      lifeCycleYears: toNumber_(row.LifeCycleYears),
      units: unitsOf(row),
      salesMixPct: toNumber_(row.SalesMixPct),
      mix: []
    };
  }
  var totalPct = rows.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0);
  var years = rows.map(function (r) { return toNumber_(r.LifeCycleYears); }).filter(function (y) { return y > 0; });
  return {
    monthlyVolume: rows.reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0),
    lifeCycleYears: years.length ? Math.min.apply(null, years) : 0,
    lifeCycleYearsMax: years.length ? Math.max.apply(null, years) : 0,
    units: rows.reduce(function (s, r) { return s + unitsOf(r); }, 0),
    salesMixPct: totalPct,
    mix: rows.map(function (r) {
      return { vehicleLabel: nameOf(r.VehicleID), pct: toNumber_(r.SalesMixPct), monthlyVolume: toNumber_(r.MonthlyVolume) };
    })
  };
}

/**
 * 小計驗算：把損益鏈上的線性等式用畫面上要顯示的同一組數字重算一次，回傳對不起來的項目。
 * 只驗「還是預設公式」的結構科目 —— 使用者改過公式的科目，等式本來就不同，驗了只會誤報。
 * (加權平均欄位是逐科目加權，非線性的公式(取整、乘費率)本來就不會剛好相等，所以只驗加減式。)
 */
function subtotalChecks_(amounts, lineDefs) {
  var v = function (code) { return Number(amounts[code]) || 0; };
  var byCode = {};
  lineDefs.forEach(function (d) { byCode[d.LineCode] = d; });
  var sumChildren = function (parent) {
    return lineDefs.filter(function (d) { return d.ParentLine === parent; })
      .reduce(function (sum, d) { return sum + v(d.LineCode); }, 0);
  };
  var nameOf = function (code) { return byCode[code] ? byCode[code].LineName : code; };

  var equations = [
    { code: 'A', label: 'A ' + nameOf('A') + ' = P8 + P9', expected: v('P8') + v('P9') },
    { code: 'B', label: 'B ' + nameOf('B') + ' = Σ 成本明細', expected: sumChildren('B') },
    { code: 'C', label: 'C ' + nameOf('C') + ' = A - B', expected: v('A') - v('B') },
    { code: 'E', label: 'E ' + nameOf('E') + ' = C - Σ 銷售費用', expected: v('C') - sumChildren('E') },
    { code: 'G', label: 'G ' + nameOf('G') + ' = E - Σ 產品貢獻前費用', expected: v('E') - sumChildren('G') },
    { code: 'I', label: 'I ' + nameOf('I') + ' = G - Σ 固定營業費用', expected: v('G') - sumChildren('I') },
    { code: 'K', label: 'K ' + nameOf('K') + ' = I - J', expected: v('I') - v('J') }
  ];

  return equations.filter(function (eq) {
    var d = byCode[eq.code];
    if (!d || amounts[eq.code] === undefined) return false;
    if (d.CalcType !== CALC_TYPES.FORMULA || cleanFormulaText_(d.Formula) !== cleanFormulaText_(DEFAULT_FORMULAS[eq.code])) return false;
    // 容差 0.5 元：營業稅/佣金有四捨五入，差幾角不是錯誤
    return Math.abs(eq.expected - v(eq.code)) > 0.5;
  }).map(function (eq) {
    return { code: eq.code, label: eq.label, expected: eq.expected, actual: v(eq.code), diff: v(eq.code) - eq.expected };
  });
}

/** 儀表板比較欄位選擇器用：一次回傳車型 -> 情境/車系的完整選項樹 */
function getComparisonOptions() {
  var scenarios = getScenarios();
  var vehicles = getVehicles();
  return getVehicleTypes().map(function (t) {
    return {
      VehicleTypeID: t.VehicleTypeID,
      scenarios: scenarios.filter(function (s) { return s.VehicleTypeID === t.VehicleTypeID; })
        .map(function (s) {
          return { ScenarioID: s.ScenarioID, Gate: s.Gate || '', ScenarioName: s.ScenarioName || '', ScenarioType: s.ScenarioType || '' };
        }),
      vehicles: vehicles.filter(function (v) { return v.VehicleTypeID === t.VehicleTypeID; })
        .map(function (v) { return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' }; })
    };
  }).map(function (t) {
    // 情境快照當成「唯讀情境」一起列出(代號 snap:xxx)，儀表板、瀑布圖工具就能直接拿來比較
    t.scenarios = t.scenarios.concat(snapshotScenarioOptions_(t.VehicleTypeID));
    return t;
  });
}

/** 開發總投「分攤車系」：逗號分隔的車系代號，留白 = 全車系 */
function parseVehicleScope_(v) {
  if (!v) return [];
  return String(v).split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
}

/**
 * 各車系的攤提台數：情境有填攤提基準時，依構成比分配基準總台數；沒填就用該車系的 月銷量×12×LC年限。
 * 「只攤給部分車系」的投資(如中低規式樣、TNCAP 只有部分車系要)用這組台數當分母。
 */
function vehicleAmortUnits_(scenarioId) {
  var mix = calcSalesMix_(scenarioId);
  var total = getLifeCycleUnits(scenarioId);
  var basisSet = (function () {
    var s = getScenarios().filter(function (r) { return r.ScenarioID === scenarioId; })[0];
    return s && toNumber_(s.AmortMonthlyVolume) > 0 && toNumber_(s.AmortLifeCycleYears) > 0;
  })();
  var totalPct = mix.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0);
  var units = {};
  mix.forEach(function (r) {
    units[r.VehicleID] = basisSet
      ? (totalPct ? total * toNumber_(r.SalesMixPct) / totalPct : 0)
      : toNumber_(r.MonthlyVolume) * 12 * toNumber_(r.LifeCycleYears);
  });
  return units;
}

/**
 * 依 DevInvestment 攤提出單台開發成本，依每一列自選的攤提落點科目(TargetLineCode)分組加總。
 *   - 全車系分攤的列：÷ LIFE CYCLE 總台數，結果放在 perUnit(每個車系都一樣)
 *   - 只分攤給部分車系的列(VehicleScope)：÷ 那幾個車系的攤提台數合計，結果只加在那幾個車系(perVehicle)
 * totalsByLine 是每個落點科目的投資總額(低減後)，含兩種分攤方式。
 *
 * overrideRows 可選：開發總投頁面「先試算、還沒儲存」用。
 */
function amortizeDevInvestmentPerUnit_(scenarioId, overrideRows) {
  var devRows = overrideRows || getDevInvestment(scenarioId);
  var totalUnits = getLifeCycleUnits(scenarioId);
  var empty = { perUnit: {}, perVehicle: {}, totalsByLine: {}, totalUnits: totalUnits };
  if (totalUnits <= 0) return empty;

  // 現況情境沒有挑戰低減目標，一律用原始金額；目標情境才套用低減率。
  var isBaseline = isBaselineScenario_(scenarioId);
  var params = calcParameters_(scenarioId);
  var vUnits = null;

  var totals = {}, shared = {}, perVehicle = {};
  devRows.forEach(function (r) {
    var target = devAmortTargetOf_(r);
    if (!target) return;   // 沒選攤提落點的列不攤提(儲存時已擋下有金額卻沒選的情形)
    // 投入金額可用外幣登打(如 BASE廠開發費以 CNY 計)，換算方式與銷貨成本一致
    var amount = toNumber_(r.Amount) * fxRateFor_(params, r.Currency, '');
    // ChallengeReductionPct 以 0~100 的百分比數值儲存(如 15 代表 15%)
    var reduced = amount * (isBaseline ? 1 : 1 - pct_(r.ChallengeReductionPct));
    totals[target] = (totals[target] || 0) + reduced;
    var scope = parseVehicleScope_(r.VehicleScope);
    if (!scope.length) {
      shared[target] = (shared[target] || 0) + reduced;
      return;
    }
    vUnits = vUnits || vehicleAmortUnits_(scenarioId);
    var scopeUnits = scope.reduce(function (s, id) { return s + (vUnits[id] || 0); }, 0);
    if (scopeUnits <= 0) return;
    scope.forEach(function (id) {
      if (!vUnits[id]) return;
      perVehicle[id] = perVehicle[id] || {};
      perVehicle[id][target] = (perVehicle[id][target] || 0) + reduced / scopeUnits;
    });
  });

  var perUnit = {};
  Object.keys(shared).forEach(function (code) { perUnit[code] = shared[code] / totalUnits; });
  // 只攤給部分車系的落點：其他車系也要看得到這個科目(值 0)，所以 perUnit 補 0
  Object.keys(perVehicle).forEach(function (id) {
    Object.keys(perVehicle[id]).forEach(function (code) { if (perUnit[code] === undefined) perUnit[code] = 0; });
  });

  return { perUnit: perUnit, perVehicle: perVehicle, totalsByLine: totals, totalUnits: totalUnits };
}

/** 是否為現況情境（現況沒有挑戰低減目標） */
function isBaselineScenario_(scenarioId) {
  var s = getScenarios().filter(function (r) { return r.ScenarioID === scenarioId; })[0];
  return !s || !s.ScenarioType || s.ScenarioType === SCENARIO_TYPE_BASELINE;
}

/**
 * 開發總投攤提用的 LIFE CYCLE 總台數。
 * 情境若有填「攤提基準台數」(AmortMonthlyVolume × 12 × AmortLifeCycleYears)就以它為準，
 * 因為實務上開發投資的攤提基準台數常與銷售構成的預估台數不同。沒填就用銷售構成推算。
 */
function getLifeCycleUnits(scenarioId) {
  var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
  if (scenario) {
    var o = overridesFor_(scenarioId);
    var vol = toNumber_(scenario.AmortMonthlyVolume) * (o && o.volume ? o.volume : 1);
    var years = toNumber_(scenario.AmortLifeCycleYears);
    if (vol > 0 && years > 0) return vol * 12 * years;
  }
  return getSalesMixLifeCycleUnits(scenarioId);
}

/** 銷售構成推算的 LIFE CYCLE 總台數 = Σ(預估銷售台數(月) × 12 × LC年限) */
function getSalesMixLifeCycleUnits(scenarioId) {
  return calcSalesMix_(scenarioId).reduce(function (sum, r) {
    return sum + toNumber_(r.MonthlyVolume) * 12 * toNumber_(r.LifeCycleYears);
  }, 0);
}

/**
 * 開發總投頁面用：回傳低減後金額與單台攤提，讓使用者直接看到攤提結果。
 * overrideRows 可選：見 amortizeDevInvestmentPerUnit_ 的說明，用來在還沒儲存前先試算彙總數字。
 */
function getDevInvestmentSummary(scenarioId, overrideRows) {
  var typeId = vehicleTypeOfScenario_(scenarioId);
  var perUnit = amortizeDevInvestmentPerUnit_(scenarioId, overrideRows);
  var isBaseline = isBaselineScenario_(scenarioId);
  var lineNames = {};
  getPLLineItems(typeId).forEach(function (d) { lineNames[d.LineCode] = d.LineName; });
  var targetOptions = getDevAmortTargetOptions(typeId);
  var vehicles = getVehicles(typeId).map(function (v) { return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' }; });

  // 部門列的呈現順序使用者可以自己在畫面上拖曳調整，留白排最後、相對順序穩定
  var rows = sortByOrder_(getDevInvestment(scenarioId), 'SortOrder').map(function (r) {
    var pctValue = isBaseline ? 0 : toNumber_(r.ChallengeReductionPct);
    var target = devAmortTargetOf_(r);
    return {
      RowID: r.RowID,
      Department: r.Department,
      Currency: r.Currency || BASE_CURRENCY,
      Notes: r.Notes || '',
      Amount: toNumber_(r.Amount),
      ChallengeReductionPct: pctValue,
      ReducedAmount: toNumber_(r.Amount) * (1 - pctValue / 100),
      TargetLineCode: target,
      TargetLineName: target ? (lineNames[target] || target) : '',
      VehicleScope: parseVehicleScope_(r.VehicleScope).join(','),
      SortOrder: r.SortOrder === undefined || r.SortOrder === '' ? '' : r.SortOrder
    };
  });
  var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0] || {};
  return {
    lifeCycleUnits: perUnit.totalUnits,
    salesMixLifeCycleUnits: getSalesMixLifeCycleUnits(scenarioId),
    targetOptions: targetOptions,
    vehicles: vehicles,
    // 每個落點科目的投資總額(低減後)與單台攤提(加權平均)，讓「開發總投 → 損益科目」對得起來
    targets: targetOptions.map(function (opt) {
      var code = opt.value;
      var perVehicle = {};
      vehicles.forEach(function (v) {
        perVehicle[v.VehicleID] = (perUnit.perUnit[code] || 0) + ((perUnit.perVehicle[v.VehicleID] || {})[code] || 0);
      });
      return {
        LineCode: code, LineName: opt.label,
        Total: perUnit.totalsByLine[code] || 0,
        PerUnit: perUnit.totalUnits ? (perUnit.totalsByLine[code] || 0) / perUnit.totalUnits : 0,
        PerVehicle: perVehicle
      };
    }),
    amortMonthlyVolume: scenario.AmortMonthlyVolume === undefined ? '' : scenario.AmortMonthlyVolume,
    amortLifeCycleYears: scenario.AmortLifeCycleYears === undefined ? '' : scenario.AmortLifeCycleYears,
    currencies: getConfiguredCurrencies(scenarioId),
    perUnit: perUnit, isBaseline: isBaseline, rows: rows
  };
}

/** 開發總投頁面：還沒存檔的編輯內容先試算彙總表(唯讀) */
function previewDevInvestmentSummary(scenarioId, rows) {
  var summary = getDevInvestmentSummary(scenarioId, rows || []);
  return { targets: summary.targets, lifeCycleUnits: summary.lifeCycleUnits };
}

function sumValues_(obj) {
  return Object.keys(obj).reduce(function (s, k) { return s + obj[k]; }, 0);
}

/**
 * 寫入損益快照：先清掉該 scenario+vehicle 的舊快照再寫新的(整張重寫，避免逐列刪除)。
 */
function writePLResult_(scenarioId, vehicleId, lineValues, revenue, exFactoryPrice, timestamp) {
  var sheet = getSheet_(SHEETS.PL_RESULT);
  var width = SCHEMA.PLResult.length;
  var lastRow = sheet.getLastRow();

  var kept = [];
  if (lastRow >= 2) {
    kept = sheet.getRange(2, 1, lastRow - 1, width).getValues().filter(function (row) {
      var isBlank = row.every(function (v) { return v === '' || v === null; });
      return !isBlank && !(samePk_(row[1], scenarioId) && String(row[2] || '') === String(vehicleId || ''));
    });
    sheet.getRange(2, 1, lastRow - 1, width).clearContent();
  }

  var rows = Object.keys(lineValues).map(function (code) {
    var amount = lineValues[code];
    return [generateId_('PR'), scenarioId, vehicleId, code, amount,
      revenue ? amount / revenue : 0, exFactoryPrice ? amount / exFactoryPrice : 0, timestamp];
  });

  var all = kept.concat(rows);
  if (all.length) sheet.getRange(2, 1, all.length, width).setValues(all);
  invalidateSheetCache_(SHEETS.PL_RESULT);
}

/**
 * 把計算結果攤成畫面用的列。每一列同時給兩個百分比基準：
 *   PctOfRevenue     — 對 A 收入(未稅,含強配)，就是 Gate F Excel 上那一欄 %
 *   PctOfExFactory   — 對 P8 廠價(未稅)
 */
function buildResultLines_(lineValues, revenue, exFactoryPrice, lineDefs) {
  return (lineDefs || getPLLineItems())
    .filter(function (def) { return lineValues[def.LineCode] !== undefined; })
    .map(function (def) {
      var amount = lineValues[def.LineCode];
      return {
        LineCode: def.LineCode,
        LineName: def.LineName,
        Category: def.Category,
        ParentLine: def.ParentLine || '',
        AutoSource: resultAutoSource_(def),
        CalcType: def.CalcType,
        Amount: amount,
        PctOfRevenue: revenue ? amount / revenue : 0,
        PctOfExFactory: exFactoryPrice ? amount / exFactoryPrice : 0
      };
    });
}

/**
 * 「銷貨成本」「營業費用」矩陣頁面用：非手動輸入的科目(公式、開發總投攤提)依車系算出實際金額，
 * 讓這兩頁能把完整的損益明細攤開顯示(唯讀)，不必再跑去儀表板才看得到。
 * costSection = true：銷貨成本段(B 底下)；false：B 段以外的費用科目(不含結構小計與售價結構)。
 */
function buildAutoLines_(scenarioId, vehicles, costSection) {
  var defs = lineDefsForScenario_(scenarioId);
  var candidates = defs.filter(function (d) {
    if (d.CalcType === CALC_TYPES.INPUT || !d.ParentLine) return false;
    if (isGroupLine_(d, defs)) return false;
    return isCostSectionLine_(d, defs) === costSection;
  });
  var result = { lines: [], values: {}, traces: {}, errors: {} };
  if (!candidates.length) return result;

  var salesMixIds = {};
  calcSalesMix_(scenarioId).forEach(function (r) { salesMixIds[r.VehicleID] = true; });
  var shown = {};
  vehicles.forEach(function (v) {
    if (!salesMixIds[v.VehicleID]) return;
    var pl;
    try { pl = calculatePLCore_(scenarioId, v.VehicleID); } catch (e) { return; }
    candidates.forEach(function (d) {
      if (pl.lineValues[d.LineCode] === undefined) return;
      shown[d.LineCode] = true;
      (result.values[d.LineCode] = result.values[d.LineCode] || {})[v.VehicleID] = pl.lineValues[d.LineCode];
      (result.traces[d.LineCode] = result.traces[d.LineCode] || {})[v.VehicleID] = pl.traces[d.LineCode] || null;
      if (pl.errors[d.LineCode]) (result.errors[d.LineCode] = result.errors[d.LineCode] || {})[v.VehicleID] = pl.errors[d.LineCode];
    });
  });
  result.lines = candidates.filter(function (d) { return shown[d.LineCode]; }).map(function (d) {
    return { value: d.LineCode, label: d.LineName, calcType: d.CalcType, formula: d.CalcType === CALC_TYPES.FORMULA ? d.Formula : '' };
  });
  return result;
}

/** 銷貨成本頁用：B 段底下非手動輸入的科目(開發攤提、貨物稅…)及計算過程 */
function getCostOfSalesAutoLines(scenarioId, vehicles) {
  return buildAutoLines_(scenarioId, vehicles, true);
}
/** 營業費用頁用：B 段以外非手動輸入的費用科目(季Margin、開發總投費用類…) */
function getOperatingExpenseAutoLines(scenarioId, vehicles) {
  return buildAutoLines_(scenarioId, vehicles, false);
}

function getPLResult(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.PL_RESULT);
  return rows.filter(function (r) { return r.ScenarioID === scenarioId && r.VehicleID === (vehicleId || ''); });
}


// ===== src/ReportService.gs =====
/**
 * GATE 審議報告(簡報)用的資料。
 *
 * 對應 GATE F 審議會簡報「伍、F/S試算與目標成本作法說明」那幾頁：
 *   - 細車型 FS 損益(現況 / 目標)，每個科目附「說明」
 *   - 現況與目標的差距：哪些科目差多少、合計差多少
 *   - 作法：差距靠哪些改善作法補起來、各負責單位、目前還差多少
 *   - 前回 vs 本回(可選)
 *   - 開發總投 by 部門(模具/設備/費用 + 挑戰低減目標)
 * 這裡只負責把數字一次算好交給前端，排版、差距瀑布圖、列印成簡報都在前端做。
 */

function scenarioMeta_(scenarioId) {
  var s = getScenarios().filter(function (r) { return r.ScenarioID === scenarioId; })[0];
  if (!s) throw new Error('找不到情境：' + scenarioId);
  return {
    ScenarioID: s.ScenarioID, VehicleTypeID: s.VehicleTypeID || '', Gate: s.Gate || '',
    ScenarioName: s.ScenarioName || '', ScenarioType: s.ScenarioType || '現況', Notes: s.Notes || '',
    label: [s.Gate, s.ScenarioName].filter(function (x) { return x; }).join(' ')
  };
}

/** 一個情境的完整損益：各車系 + 加權平均 + 銷量 + 說明 + 開發總投彙總 */
function reportScenarioBlock_(scenarioId) {
  var meta = scenarioMeta_(scenarioId);
  var all = calculatePLAllVehicles(scenarioId);
  var vehiclesById = {};
  getVehicles(meta.VehicleTypeID).forEach(function (v) { vehiclesById[v.VehicleID] = v; });
  var mix = getSalesMix(scenarioId);
  var order = getVehicles(meta.VehicleTypeID).map(function (v) { return v.VehicleID; });
  var vehicleResults = all.vehicles.slice().sort(function (a, b) {
    return order.indexOf(a.vehicleId) - order.indexOf(b.vehicleId);
  });

  var errors = {};
  vehicleResults.forEach(function (res) {
    Object.keys(res.errors).forEach(function (c) { if (!errors[c]) errors[c] = res.errors[c]; });
  });
  var weighted = {};
  all.weightedAverage.forEach(function (l) { weighted[l.LineCode] = l.Amount; });

  return {
    meta: meta,
    vehicles: vehicleResults.map(function (res) {
      var row = mix.filter(function (r) { return r.VehicleID === res.vehicleId; })[0] || {};
      var v = vehiclesById[res.vehicleId] || {};
      return {
        VehicleID: res.vehicleId, VehicleCode: v.VehicleCode || res.vehicleId,
        salesMixPct: toNumber_(row.SalesMixPct), monthlyVolume: toNumber_(row.MonthlyVolume),
        lifeCycleYears: toNumber_(row.LifeCycleYears),
        amounts: res.lineValues
      };
    }),
    weighted: weighted,
    volume: columnVolumeInfo_(scenarioId, '', getVehicles()),
    lifeCycleUnits: getLifeCycleUnits(scenarioId),
    notes: getLineNotes(scenarioId),
    errors: errors,
    dev: devByDepartment_(scenarioId)
  };
}

/**
 * 開發總投 by 部門：模具/設備/費用三大類 + 挑戰低減目標 + 低減後小計(對應簡報附件那一頁)。
 * 大類看攤提落點科目的 DevAmortCategory；BASE廠開發費等費用類一起算在「費用」。
 */
function devByDepartment_(scenarioId) {
  var typeId = vehicleTypeOfScenario_(scenarioId);
  var categoryOf = {};
  getPLLineItems(typeId).forEach(function (d) { categoryOf[d.LineCode] = d.DevAmortCategory || ''; });
  var params = getParameters(scenarioId);
  var isBaseline = isBaselineScenario_(scenarioId);
  var depts = {}, order = [];
  sortByOrder_(getDevInvestment(scenarioId), 'SortOrder').forEach(function (r) {
    var target = devAmortTargetOf_(r);
    var amount = toNumber_(r.Amount) * fxRateFor_(params, r.Currency, '');
    var pct = isBaseline ? 0 : toNumber_(r.ChallengeReductionPct);
    var name = r.Department || '(未填部門)';
    if (!depts[name]) {
      depts[name] = { Department: name, mold: 0, equip: 0, expense: 0, other: 0, total: 0, reduced: 0, notes: [] };
      order.push(name);
    }
    var d = depts[name];
    var cat = categoryOf[target] || '';
    if (cat === '模具') d.mold += amount;
    else if (cat === '設備') d.equip += amount;
    else if (cat === '費用') d.expense += amount;
    else d.other += amount;
    d.total += amount;
    d.reduced += amount * (1 - pct / 100);
    if (r.Notes) d.notes.push(String(r.Notes));
  });
  var rows = order.map(function (n) {
    var d = depts[n];
    d.pct = d.total ? (1 - d.reduced / d.total) * 100 : 0;
    d.notes = d.notes.join('；');
    return d;
  });
  var sum = function (f) { return rows.reduce(function (s, r) { return s + r[f]; }, 0); };
  return {
    rows: rows,
    total: { mold: sum('mold'), equip: sum('equip'), expense: sum('expense'), other: sum('other'), total: sum('total'), reduced: sum('reduced') },
    lifeCycleUnits: getLifeCycleUnits(scenarioId)
  };
}

/**
 * 報告資料：target(目標/本回)必填；base(現況)、prev(前回)可選。
 * 差距一律用「目標 − 現況」，對營業淨利來說正數 = 改善。
 */
function getGateReport(baseScenarioId, targetScenarioId, prevScenarioId) {
  if (!targetScenarioId) throw new Error('請選擇目標情境');
  var target = reportScenarioBlock_(targetScenarioId);
  var base = baseScenarioId ? reportScenarioBlock_(baseScenarioId) : null;
  var prev = prevScenarioId ? reportScenarioBlock_(prevScenarioId) : null;
  // 損益兩平月銷量：月銷量要多少台營業淨利才會是 0(攤提台數跟著變)
  target.breakEvenVolume = breakEvenVolume_(targetScenarioId);
  if (base) base.breakEvenVolume = breakEvenVolume_(baseScenarioId);

  var types = [target.meta.VehicleTypeID];
  if (base) types.push(base.meta.VehicleTypeID);
  if (prev) types.push(prev.meta.VehicleTypeID);
  var defs = unionLineDefs_(types.map(function (t) { return getPLLineItems(t); }));
  // 每個情境看自己車型的營業淨利科目(現況/前回可能是別的車型，K 還在或已經換成別的科目)
  [target, base, prev].forEach(function (b) { if (b) b.profitCode = profitLineCode_(getPLLineItems(b.meta.VehicleTypeID)); });
  var profitCode = target.profitCode;
  var profitCodes = {};
  [target, base, prev].forEach(function (b) { if (b) profitCodes[b.profitCode] = true; });
  var depth = lineDepths_(defs);
  var used = function (code) {
    return [target, base, prev].some(function (b) { return b && b.weighted[code] !== undefined; });
  };

  return {
    vehicleTypeId: target.meta.VehicleTypeID,
    profitCode: profitCode,
    target: target, base: base, prev: prev,
    lines: defs.filter(function (d) { return used(d.LineCode); }).map(function (d) {
      return {
        LineCode: d.LineCode, LineName: d.LineName, ParentLine: d.ParentLine || '', Category: d.Category || '',
        CalcType: d.CalcType, Formula: d.CalcType === CALC_TYPES.FORMULA ? d.Formula : '',
        Depth: depth[d.LineCode] || 0,
        isSubtotal: PROTECTED_LINE_CODES.indexOf(d.LineCode) !== -1 || !!profitCodes[d.LineCode] || isGroupLine_(d, defs),
        isProfit: !!profitCodes[d.LineCode],
        isPriceStructure: d.Category === '售價結構'
      };
    }),
    actions: getActions(targetScenarioId),
    actionStatuses: ACTION_STATUSES,
    generatedAt: new Date().toISOString()
  };
}

/* ---------------------------------------------------------------
 * 情境快照(版本紀錄)
 * 審議前後數字常常改：存一份快照，之後就能比較「現在跟審議那一版差在哪」。
 * 快照存的是計算結果(不是輸入資料)，所以科目表、公式、輸入資料之後怎麼改都不會影響它。
 * 在比較功能裡，快照用代號 snap:<SnapshotID> 當成唯讀情境，儀表板/瀑布圖工具直接可用。
 * --------------------------------------------------------------- */
var SNAPSHOT_PREFIX = 'snap:';
var SNAPSHOT_MEMO_ = {};
function isSnapshotId_(id) { return String(id || '').indexOf(SNAPSHOT_PREFIX) === 0; }

/** 舊的試算表沒有 Snapshots 分頁：第一次用到時補建 */
function ensureSnapshotSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (ss.getSheetByName(SHEETS.SNAPSHOTS)) return;
  var sheet = ss.insertSheet(SHEETS.SNAPSHOTS);
  sheet.getRange(1, 1, 1, SCHEMA.Snapshots.length).setValues([SCHEMA.Snapshots]);
  sheet.setFrozenRows(1);
  invalidateSheetCache_();
}
function snapshotRows_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss.getSheetByName(SHEETS.SNAPSHOTS)) return [];
  return sheetToObjects_(SHEETS.SNAPSHOTS) || [];
}
function snapshotMeta_(r) {
  return {
    SnapshotID: r.SnapshotID, VehicleTypeID: r.VehicleTypeID || '', ScenarioID: r.ScenarioID || '',
    SnapshotName: r.SnapshotName || '', CreatedAt: r.CreatedAt ? String(r.CreatedAt) : '', CreatedBy: r.CreatedBy || '', Notes: r.Notes || ''
  };
}

/** 某車型的快照清單(新到舊)，含快照當時的情境名稱與加權營業淨利 */
function getSnapshots(vehicleTypeId) {
  return snapshotRows_().filter(function (r) { return !vehicleTypeId || r.VehicleTypeID === vehicleTypeId; })
    .map(function (r) {
      var m = snapshotMeta_(r);
      var d = snapshotData_(r.SnapshotID);
      m.scenarioLabel = d ? [d.scenario.Gate, d.scenario.ScenarioName].filter(function (x) { return x; }).join(' ') : '';
      m.scenarioType = d ? d.scenario.ScenarioType || '' : '';
      var w = d ? d.columns.filter(function (c) { return !c.vehicleId; })[0] : null;
      var pc = d && d.lines ? profitLineCode_(d.lines) : 'K';
      m.K = w && w.amounts[pc] !== undefined ? w.amounts[pc] : null;
      m.scenarioExists = getScenarios().some(function (s) { return s.ScenarioID === r.ScenarioID; });
      return m;
    })
    .sort(function (a, b) { return String(b.CreatedAt).localeCompare(String(a.CreatedAt)); });
}

function snapshotData_(snapshotId) {
  if (SNAPSHOT_MEMO_[snapshotId]) return SNAPSHOT_MEMO_[snapshotId];
  var r = snapshotRows_().filter(function (x) { return x.SnapshotID === snapshotId; })[0];
  if (!r) return null;
  var d = null;
  try { d = JSON.parse(r.Data); } catch (e) { d = null; }
  if (!d || !d.columns) return null;
  d.meta = snapshotMeta_(r);
  SNAPSHOT_MEMO_[snapshotId] = d;
  return d;
}

/** 建立快照：加權平均 + 銷售構成裡每個車系，各存一份完整的損益金額 */
function createSnapshot(scenarioId, name, notes) {
  if (!scenarioId || isSnapshotId_(scenarioId)) throw new Error('請選擇要存快照的情境');
  name = String(name || '').trim();
  if (!name) throw new Error('請輸入快照名稱');
  var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
  if (!scenario) throw new Error('找不到情境：' + scenarioId);
  var sels = [{ ScenarioID: scenarioId, VehicleID: '' }].concat(calcSalesMix_(scenarioId).map(function (r) { return { ScenarioID: scenarioId, VehicleID: r.VehicleID }; }));
  var cmp = calculateComparison(sels);
  var round = function (v) { return typeof v === 'number' ? Math.round(v * 100) / 100 : v; };
  var data = {
    v: 1,
    scenario: { Gate: scenario.Gate || '', ScenarioName: scenario.ScenarioName || '', ScenarioType: scenario.ScenarioType || '', VehicleTypeID: scenario.VehicleTypeID || '' },
    lines: cmp.lines.map(function (l) {
      return { LineCode: l.LineCode, LineName: l.LineName, Category: l.Category, ParentLine: l.ParentLine, SortOrder: l.SortOrder,
        CalcType: l.CalcType, Formula: l.Formula, AutoSource: l.AutoSource };
    }),
    columns: cmp.columns.map(function (c) {
      var amounts = {};
      Object.keys(c.amounts).forEach(function (k) { amounts[k] = round(c.amounts[k]); });
      return { vehicleId: c.vehicleId, vehicleLabel: c.vehicleLabel, isWeighted: c.isWeighted, amounts: amounts,
        revenue: round(c.revenue), exFactoryPrice: round(c.exFactoryPrice),
        volume: { monthlyVolume: c.volume.monthlyVolume, lifeCycleYears: c.volume.lifeCycleYears, units: c.volume.units, salesMixPct: c.volume.salesMixPct, mix: c.volume.mix || [] } };
    })
  };
  var json = JSON.stringify(data);
  if (json.length > 48000) throw new Error('這個情境的資料太多，超過單一快照可以存的大小（' + json.length + ' 字）');
  return withLock_(function () {
    ensureSnapshotSheet_();
    var user = '';
    try { user = Session.getActiveUser().getEmail(); } catch (e) { user = ''; }
    var row = { SnapshotID: generateId_('SNAP'), VehicleTypeID: scenario.VehicleTypeID || '', ScenarioID: scenarioId, SnapshotName: name,
      CreatedAt: new Date().toISOString(), CreatedBy: user, Notes: notes || '', Data: json };
    batchWriteRows_(SHEETS.SNAPSHOTS, 'SnapshotID', [row], []);
    SNAPSHOT_MEMO_ = {};
    return snapshotMeta_(row);
  });
}
function renameSnapshot(snapshotId, name, notes) {
  name = String(name || '').trim();
  if (!name) throw new Error('請輸入快照名稱');
  return withLock_(function () {
    var r = snapshotRows_().filter(function (x) { return x.SnapshotID === snapshotId; })[0];
    if (!r) throw new Error('找不到快照');
    var c = {};
    SCHEMA.Snapshots.forEach(function (h) { c[h] = r[h]; });
    c.SnapshotName = name;
    if (notes !== undefined) c.Notes = notes;
    batchWriteRows_(SHEETS.SNAPSHOTS, 'SnapshotID', [c], []);
    SNAPSHOT_MEMO_ = {};
    return snapshotMeta_(c);
  });
}
function deleteSnapshot(snapshotId) {
  return withLock_(function () {
    if (!snapshotRows_().some(function (x) { return x.SnapshotID === snapshotId; })) return true;
    batchWriteRows_(SHEETS.SNAPSHOTS, 'SnapshotID', [], [snapshotId]);
    SNAPSHOT_MEMO_ = {};
    return true;
  });
}

function snapshotLabel_(d) {
  var day = String(d.meta.CreatedAt || '').slice(5, 10).replace('-', '/');
  return [d.scenario.Gate, d.scenario.ScenarioName].filter(function (x) { return x; }).join(' ') + '［快照 ' + d.meta.SnapshotName + (day ? ' ' + day : '') + '］';
}
/** 比較選單用：快照當成唯讀情境 */
function snapshotScenarioOptions_(vehicleTypeId) {
  return snapshotRows_().filter(function (r) { return r.VehicleTypeID === vehicleTypeId; })
    .map(function (r) { return snapshotData_(r.SnapshotID); })
    .filter(function (d) { return d; })
    .sort(function (a, b) { return String(b.meta.CreatedAt).localeCompare(String(a.meta.CreatedAt)); })
    .map(function (d) {
      var label = snapshotLabel_(d);
      return { ScenarioID: SNAPSHOT_PREFIX + d.meta.SnapshotID, Gate: '', ScenarioName: label, ScenarioType: d.scenario.ScenarioType || '', isSnapshot: true };
    });
}
/** calculateComparison 用：快照的一欄(跟一般欄位同樣的欄位，另帶 snapshotLines 給科目聯集) */
function snapshotColumn_(sel) {
  var id = String(sel.ScenarioID).slice(SNAPSHOT_PREFIX.length);
  var d = snapshotData_(id);
  if (!d) throw new Error('找不到快照（可能已被刪除）');
  var col = d.columns.filter(function (c) { return (c.vehicleId || '') === (sel.VehicleID || ''); })[0];
  var vehicle = getVehicles().filter(function (v) { return v.VehicleID === sel.VehicleID; })[0];
  var label = snapshotLabel_(d);
  var vehicleLabel = sel.VehicleID ? ((col && col.vehicleLabel) || (vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均';
  var amounts = col ? col.amounts : {};
  return {
    scenarioId: sel.ScenarioID, vehicleId: sel.VehicleID || '', vehicleTypeId: d.scenario.VehicleTypeID,
    vehicleTypeLabel: d.scenario.VehicleTypeID, scenarioLabel: label, scenarioType: d.scenario.ScenarioType || '',
    scenarioNotes: d.meta.Notes || '', vehicleLabel: vehicleLabel, isWeighted: !sel.VehicleID, isSnapshot: true,
    volume: col ? col.volume : { monthlyVolume: 0, units: 0, mix: [] }, traces: null, errors: {},
    label: [d.scenario.VehicleTypeID, label, vehicleLabel].filter(function (p) { return p; }).join(' / '),
    amounts: amounts, revenue: amounts.A || 0, exFactoryPrice: amounts.P8 || 0, checks: [],
    snapshotLines: d.lines.map(function (l) { var c = {}; Object.keys(l).forEach(function (k) { c[k] = l[k]; }); c.SortOrder = toNumber_(l.SortOrder); return c; })
  };
}


// ===== src/WhatIfService.gs =====
/**
 * 目標反推(Goal Seek)與敏感度分析。
 *
 * 審議會最常被問的：「月銷要多少台才損益兩平？」「材料成本要再降多少才達標？」「匯率變動影響多少？」
 * 這些都是「改一個假設、看營業淨利怎麼變」。這裡用 CalcEngine 的假設覆寫(CALC_OVERRIDES_，只在記憶體)
 * 重算損益，存檔的資料完全不動。
 *
 * 驅動因子(driver)，值一律用畫面上看得懂的單位：
 *   { type: 'volume' }               月總銷量(台/月)，各車系依構成比等比例放大縮小(攤提台數一起變)
 *   { type: 'price' }                建議零售價(加權平均，元)，各車系等比例調整
 *   { type: 'line', code: 'b1' }     某科目的單台金額(加權平均，元)，各車系等比例調整
 *   { type: 'dev' }                  開發總投攤提(加權單台合計，元)，所有攤提科目等比例調整
 *   { type: 'param', name: '營業稅率' } 參數值(依參數單位，% 參數填 5 = 5%)，全車系套用
 *   { type: 'fx', currency: 'CNY' }   匯率(1 外幣 = ? 元)
 * 衡量指標(metric)：{ code: 'K', basis: 'unit' | 'month' }，code 空白 = 營業淨利(K 被刪掉時是損益表最後一行總計)
 *   unit  = 加權平均單台金額；month = 月總額(各車系單台 × 月銷量 加總)
 */

/** 在覆寫底下執行 fn，結束後一定拿掉覆寫並清掉計算記憶 */
function withOverrides_(overrides, fn) {
  var prev = CALC_OVERRIDES_;
  CALC_OVERRIDES_ = overrides;
  resetCalcMemo_();
  try { return fn(); } finally {
    CALC_OVERRIDES_ = prev;
    resetCalcMemo_();
  }
}

/** 算一個情境的指標值(加權單台或月總額)與重點科目 */
function whatIfMetric_(scenarioId, metric) {
  var all = calculatePLAllVehicles(scenarioId);
  var code = (metric && metric.code) || '';
  // 空白或 K = 營業淨利；K 被刪掉、另外建了淨利科目時，自動改看那個科目(存下來的設定還是 K 也照樣能用)
  if (!code || code === 'K') code = profitLineCode_(lineDefsForScenario_(scenarioId));
  var line = all.weightedAverage.filter(function (l) { return l.LineCode === code; })[0];
  if (metric && metric.basis === 'month') {
    var mix = calcSalesMix_(scenarioId);
    var sum = 0;
    all.vehicles.forEach(function (res) {
      var row = mix.filter(function (r) { return r.VehicleID === res.vehicleId; })[0];
      sum += (res.lineValues[code] || 0) * toNumber_(row && row.MonthlyVolume);
    });
    return sum;
  }
  return line ? line.Amount : 0;
}

function weightedLineOf_(scenarioId, code) {
  var line = calculatePLAllVehicles(scenarioId).weightedAverage.filter(function (l) { return l.LineCode === code; })[0];
  return line ? line.Amount : 0;
}

/** 驅動因子目前的值(基準)與顯示名稱 */
function driverBase_(scenarioId, driver) {
  var t = driver && driver.type;
  if (t === 'volume') {
    return { value: getSalesMix(scenarioId).reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0), label: '月總銷量', unit: '台/月' };
  }
  if (t === 'price') return { value: weightedLineOf_(scenarioId, 'P1'), label: '建議零售價(加權)', unit: '元' };
  if (t === 'line') {
    var def = lineDefsForScenario_(scenarioId).filter(function (d) { return d.LineCode === driver.code; })[0];
    if (!def) throw new Error('找不到科目：' + driver.code);
    return { value: weightedLineOf_(scenarioId, driver.code), label: def.LineName, unit: '元/台' };
  }
  if (t === 'dev') {
    var defs = lineDefsForScenario_(scenarioId).filter(function (d) { return d.CalcType === CALC_TYPES.DEV_AMORT; });
    var w = calculatePLAllVehicles(scenarioId).weightedAverage;
    var sum = 0;
    defs.forEach(function (d) { var l = w.filter(function (x) { return x.LineCode === d.LineCode; })[0]; if (l) sum += l.Amount; });
    return { value: sum, label: '開發總投攤提(單台合計)', unit: '元/台' };
  }
  if (t === 'param') {
    var pdef = getParamDefs().filter(function (p) { return p.ParamName === driver.name; })[0];
    if (!pdef) throw new Error('找不到參數：' + driver.name);
    var params = getParameters(scenarioId);
    var has = params.some(function (p) { return p.ParamName === driver.name; });
    var v = has ? lookupParam_(params, driver.name, '') : (pdef.DefaultValue !== '' && pdef.DefaultValue !== undefined ? toNumber_(pdef.DefaultValue) : (DEFAULT_PARAMS[driver.name] || 0));
    return { value: v, label: driver.name, unit: pdef.Unit === '%' ? '%' : '' };
  }
  if (t === 'fx') return { value: fxRateFor_(getParameters(scenarioId), driver.currency, ''), label: driver.currency + ' 匯率', unit: '元' };
  throw new Error('不支援的假設項目');
}

/** 驅動因子設成 value 時的覆寫 */
function driverOverrides_(scenarioId, driver, value, base) {
  var o = { scenarioId: scenarioId };
  var factor = function () {
    if (!base) throw new Error('「' + driverLabel_(driver) + '」目前是 0，無法用等比例調整');
    return value / base;
  };
  switch (driver.type) {
    case 'volume': o.volume = factor(); break;
    case 'price': o.price = factor(); break;
    case 'line': o.lineScale = {}; o.lineScale[driver.code] = factor(); break;
    case 'dev': o.dev = factor(); break;
    case 'param': o.params = {}; o.params[driver.name] = value; break;
    case 'fx': o.fx = {}; o.fx[driver.currency] = value; break;
  }
  return o;
}
function driverLabel_(d) {
  return d.type === 'volume' ? '月總銷量' : d.type === 'price' ? '建議零售價' : d.type === 'line' ? d.code :
    d.type === 'dev' ? '開發總投攤提' : d.type === 'param' ? d.name : d.type === 'fx' ? d.currency + '匯率' : d.type;
}

/** 假設分析頁的選項：可以調的項目(含目前值)與可以看的指標 */
function getWhatIfOptions(scenarioId) {
  if (!scenarioId) throw new Error('請先選擇情境');
  var defs = lineDefsForScenario_(scenarioId);
  var weighted = {};
  calculatePLAllVehicles(scenarioId).weightedAverage.forEach(function (l) { weighted[l.LineCode] = l.Amount; });
  var drivers = [
    { type: 'volume' }, { type: 'price' }, { type: 'dev' }
  ].map(function (d) { var b = driverBase_(scenarioId, d); return { driver: d, label: b.label, unit: b.unit, base: b.value }; });
  defs.filter(function (d) { return (d.CalcType === CALC_TYPES.INPUT || d.CalcType === CALC_TYPES.DEV_AMORT) && Math.abs(weighted[d.LineCode] || 0) > 0.5; })
    .forEach(function (d) { drivers.push({ driver: { type: 'line', code: d.LineCode }, label: d.LineName, unit: '元/台', base: weighted[d.LineCode], group: '科目' }); });
  getParamDefs().forEach(function (p) {
    var b = driverBase_(scenarioId, { type: 'param', name: p.ParamName });
    drivers.push({ driver: { type: 'param', name: p.ParamName }, label: p.ParamName, unit: b.unit, base: b.value, group: '參數' });
  });
  getConfiguredCurrencies(scenarioId).filter(function (c) { return c !== BASE_CURRENCY; }).forEach(function (c) {
    drivers.push({ driver: { type: 'fx', currency: c }, label: c + ' 匯率', unit: '元', base: fxRateFor_(getParameters(scenarioId), c, ''), group: '匯率' });
  });
  return {
    drivers: drivers,
    metrics: defs.filter(function (d) { return weighted[d.LineCode] !== undefined && d.Category !== '售價結構'; })
      .map(function (d) { return { code: d.LineCode, label: d.LineName, value: weighted[d.LineCode] }; }),
    monthlyVolume: driverBase_(scenarioId, { type: 'volume' }).value,
    profitCode: profitLineCode_(defs)
  };
}

/**
 * 目標反推：driver 要調到多少，metric 才會等於 target。
 * 先在基準值附近往兩邊找一個「結果跨過目標」的區間，再二分法逼近(公式裡有取整、IF，不能假設是平滑的)。
 * 找不到(例如怎麼調都不會損益兩平)就回傳 feasible:false 與試過的範圍。
 */
function solveGoal(scenarioId, metric, target, driver) {
  if (!scenarioId) throw new Error('請先選擇情境');
  metric = metric || { code: '', basis: 'unit' };   // 空白 = 營業淨利(profitLineCode_)
  target = toNumber_(target);
  var base = driverBase_(scenarioId, driver);
  var evalAt = function (x) {
    return withOverrides_(driverOverrides_(scenarioId, driver, x, base.value), function () { return whatIfMetric_(scenarioId, metric); });
  };
  var f0 = whatIfMetric_(scenarioId, metric);
  var positiveOnly = ['volume', 'price', 'fx', 'line', 'dev'].indexOf(driver.type) !== -1;
  var g = function (x) { return evalAt(x) - target; };
  var x0 = base.value;
  if (Math.abs(f0 - target) < 0.5) {
    return { feasible: true, value: x0, base: x0, label: base.label, unit: base.unit, metricBase: f0, achieved: f0, iterations: 0 };
  }
  // 找區間：從基準值往上、往下各擴大，直到結果跨過目標
  var g0 = f0 - target;
  var step = Math.abs(x0) > 1e-9 ? Math.abs(x0) * 0.05 : 1;
  var lo = null, hi = null, gLo, gHi, tries = 0;
  [1, -1].some(function (dir) {
    var prevX = x0, prevG = g0, s = step;
    for (var k = 0; k < 22; k++) {
      var x = x0 + dir * s;
      if (positiveOnly && x < 0) x = 0;
      var gx = g(x); tries++;
      if ((gx > 0) !== (prevG > 0) || gx === 0) { lo = prevX; gLo = prevG; hi = x; gHi = gx; return true; }
      if (positiveOnly && x === 0) break;
      prevX = x; prevG = gx; s *= 2;
    }
    return false;
  });
  if (lo === null) {
    return { feasible: false, base: x0, label: base.label, unit: base.unit, metricBase: f0, iterations: tries,
      message: '只調整「' + base.label + '」達不到這個目標（往上、往下都試過了，結果都沒有跨過目標值）。' +
        (driver.type === 'volume' ? '通常是單台的變動成本已經高於售價，賣越多虧越多，要先改善售價或成本。' : '') };
  }
  for (var i = 0; i < 60; i++) {
    var mid = (lo + hi) / 2;
    var gm = g(mid); tries++;
    if (Math.abs(gm) < 0.5 || Math.abs(hi - lo) < Math.max(1e-6, Math.abs(mid) * 1e-9)) { lo = hi = mid; gLo = gm; break; }
    if ((gm > 0) === (gLo > 0)) { lo = mid; gLo = gm; } else { hi = mid; gHi = gm; }
  }
  var value = (lo + hi) / 2;
  var achieved = evalAt(value);
  return { feasible: true, value: value, base: x0, label: base.label, unit: base.unit, metricBase: f0, achieved: achieved, iterations: tries };
}

/**
 * 敏感度表：rowDriver 取 rowValues、colDriver 取 colValues，每一格算一次 metric。
 * 值是驅動因子的實際值(前端用 基準 × (1 + %) 算好再送來)。
 */
function sensitivityTable(scenarioId, metric, rowDriver, rowValues, colDriver, colValues) {
  if (!scenarioId) throw new Error('請先選擇情境');
  metric = metric || { code: '', basis: 'unit' };   // 空白 = 營業淨利(profitLineCode_)
  if ((rowValues || []).length * (colValues || []).length > 121) throw new Error('敏感度表最多 11 × 11 格');
  var rb = driverBase_(scenarioId, rowDriver), cb = colDriver ? driverBase_(scenarioId, colDriver) : null;
  var cells = (rowValues || []).map(function (rv) {
    return (colDriver ? colValues : [null]).map(function (cv) {
      var o = driverOverrides_(scenarioId, rowDriver, rv, rb.value);
      if (colDriver) o = mergeOverrides_(o, driverOverrides_(scenarioId, colDriver, cv, cb.value));
      return withOverrides_(o, function () { return whatIfMetric_(scenarioId, metric); });
    });
  });
  return {
    rowLabel: rb.label, rowUnit: rb.unit, rowBase: rb.value, rowValues: rowValues,
    colLabel: cb ? cb.label : '', colUnit: cb ? cb.unit : '', colBase: cb ? cb.value : null, colValues: colDriver ? colValues : [],
    metricBase: whatIfMetric_(scenarioId, metric), cells: cells
  };
}

/** 損益兩平月銷量(GATE 報告摘要用)：營業淨利(月總額) = 0 時的月總銷量；算不出來回傳 null */
function breakEvenVolume_(scenarioId) {
  try {
    var r = solveGoal(scenarioId, { code: '', basis: 'unit' }, 0, { type: 'volume' });
    return r.feasible ? r.value : null;
  } catch (e) { return null; }
}

/** 兩組覆寫合併(多個假設同時成立)；同一個倍數因子調兩次 = 倍數相乘 */
function mergeOverrides_(a, b) {
  var o = { scenarioId: a.scenarioId || b.scenarioId };
  [a, b].forEach(function (src) {
    Object.keys(src).forEach(function (k) {
      if (k === 'scenarioId') return;
      var v = src[k];
      if (v && typeof v === 'object') {
        o[k] = o[k] || {};
        Object.keys(v).forEach(function (kk) {
          o[k][kk] = typeof o[k][kk] === 'number' && k === 'lineScale' ? o[k][kk] * v[kk] : v[kk];
        });
      } else if (typeof v === 'number' && typeof o[k] === 'number') o[k] = o[k] * v;
      else o[k] = v;
    });
  });
  return o;
}

/**
 * 找 x 使 g(x) = 0：從 x0 往兩邊擴大找到變號區間，再二分法。找不到回傳 null。
 * (公式裡有取整、IF，不假設平滑)
 */
function solveScalar_(g, x0, step, lowerBound) {
  var g0 = g(x0);
  if (Math.abs(g0) < 0.5) return x0;
  var lo = null, hi = null, gLo;
  [1, -1].some(function (dir) {
    var prevX = x0, prevG = g0, st = step;
    for (var k = 0; k < 22; k++) {
      var x = x0 + dir * st;
      if (lowerBound !== null && lowerBound !== undefined && x < lowerBound) x = lowerBound;
      var gx = g(x);
      if ((gx > 0) !== (prevG > 0) || gx === 0) { lo = prevX; gLo = prevG; hi = x; return true; }
      if (lowerBound !== null && lowerBound !== undefined && x === lowerBound) break;
      prevX = x; prevG = gx; st *= 2;
    }
    return false;
  });
  if (lo === null) return null;
  for (var i = 0; i < 60; i++) {
    var mid = (lo + hi) / 2;
    var gm = g(mid);
    if (Math.abs(gm) < 0.5 || Math.abs(hi - lo) < Math.max(1e-6, Math.abs(mid) * 1e-9)) return mid;
    if ((gm > 0) === (gLo > 0)) { lo = mid; gLo = gm; } else hi = mid;
  }
  return (lo + hi) / 2;
}

/**
 * 目標反推(組合拳)：照會議上實際的講法，每一個調整項目選一種方式 ——
 *
 * levers = [{ driver, mode, by, known, amount, capPct }]
 *   mode 'known'  已知調整：已經談好、或想試試看的調整，直接套用
 *                 by 'pct' 調 known %(−3 = 降 3%) / 'abs' 加減 known(−5000 = 少 5,000) / 'to' 調到 known(銷量就是 120 台)
 *   mode 'amount' 負責金額：這一項要讓結果往目標的方向改善 amount(單台或月總額，跟 metric.basis 一樣)，
 *                 例：採購負責 8,000 元/台 → 算出材料成本要降到多少
 *   mode 'fill'   補足缺口：剩下的缺口依列表順序補，前一項碰到上限(capPct)才輪到下一項
 *   capPct        負責金額、補足缺口的上限：最多只能調 ±幾 %(空白 = 不限)
 *
 * 計算順序：先套用所有「已知調整」→ 依列表順序算「負責金額」→ 剩下的缺口由「補足缺口」依序補。
 * 已知調整與負責金額就已經達到(或超過)目標時，補足項目不動。「變好」的方向看指標：成本/費用越低越好，其他越高越好。
 * 回傳每一項的 目前值 → 調整後、變動 %、是否碰到上限，以及「依列表順序逐項加入」的貢獻(加總剛好等於總改善，可以直接畫瀑布圖)。
 */
/** 這個指標往哪個方向算「變好」：成本/費用越低越好(-1)，其他(營業淨利、毛利、收入…)越高越好(+1) */
function metricGoodDir_(scenarioId, metric) {
  var code = (metric && metric.code) || '';
  if (!code || code === 'K') return 1;
  var def = lineDefsForScenario_(scenarioId).filter(function (d) { return d.LineCode === code; })[0];
  return def && ['成本', '成本明細', '費用', '費用明細', '模具', '設備'].indexOf(def.Category) !== -1 ? -1 : 1;
}

function solveGoalPlan(scenarioId, metric, target, levers) {
  if (!scenarioId) throw new Error('請先選擇情境');
  metric = metric || { code: '', basis: 'unit' };   // 空白 = 營業淨利(profitLineCode_)
  target = toNumber_(target);
  levers = (levers || []).filter(function (l) { return l && l.driver && l.driver.type; });
  if (!levers.length) throw new Error('請至少選一個調整項目');
  var seen = {};
  levers.forEach(function (l) {
    var k = JSON.stringify(l.driver);
    if (seen[k]) throw new Error('「' + driverLabel_(l.driver) + '」重複選了兩次');
    seen[k] = true;
  });
  var blank = function (v) { return v === '' || v === null || v === undefined || isNaN(Number(v)); };
  var positiveTypes = ['volume', 'price', 'fx', 'line', 'dev'];
  var items = levers.map(function (l) {
    var b = driverBase_(scenarioId, l.driver);
    var mode = l.mode === 'known' || l.mode === 'amount' ? l.mode : 'fill';
    var it = {
      driver: l.driver, label: b.label, unit: b.unit, base: b.value, mode: mode,
      cap: blank(l.capPct) || mode === 'known' ? null : Math.abs(Number(l.capPct)),
      lower: positiveTypes.indexOf(l.driver.type) !== -1 ? 0 : null,
      amount: mode === 'amount' ? Math.abs(toNumber_(l.amount)) : 0
    };
    if (mode === 'known') {
      if (blank(l.known)) throw new Error('「' + b.label + '」是已知調整，請填要調多少');
      var k = Number(l.known);
      it.value = l.by === 'to' ? k : l.by === 'abs' ? b.value + k : b.value * (1 + k / 100);
      if (it.lower !== null && it.value < it.lower) it.value = it.lower;
    } else it.value = b.value;
    return it;
  });
  var overridesFor = function (values) {
    var o = { scenarioId: scenarioId };
    items.forEach(function (it, i) {
      if (values[i] === it.base) return;
      o = mergeOverrides_(o, driverOverrides_(scenarioId, it.driver, values[i], it.base));

  };
  var metricAt = function (values) {
    return withOverrides_(overridesFor(values), function () { return whatIfMetric_(scenarioId, metric); });
  };
  var boundsOf = function (it) {
    var lo = -Infinity, hi = Infinity;
    if (it.cap !== null) { var room = Math.abs(it.base) * it.cap / 100; lo = it.base - room; hi = it.base + room; }

  };
  /**
   * 只動第 i 項，讓結果 = goal(其他項目維持 values)。上限內做不到時停在最接近的那一端。
   * 回傳 { value, reached }
   */
  var solveOne = function (values, i, goal) {
    var it = items[i];
    var at = function (x) { var v = values.slice(); v[i] = x; return metricAt(v) - goal; };
    var bd = boundsOf(it);
    if (bd.lo === -Infinity && bd.hi === Infinity) {
      var x = solveScalar_(at, it.base, Math.abs(it.base) > 1e-9 ? Math.abs(it.base) * 0.05 : 1, it.lower);
      return x === null ? { value: it.base, reached: false } : { value: x, reached: true };
    }
    var g0 = at(it.base);
    if (Math.abs(g0) < 0.5) return { value: it.base, reached: true };

    var ends = [bd.lo, bd.hi].map(function (e) {
      if (isFinite(e)) return e;

      for (var k = 0; k < 22; k++) { x = it.base + dir * stp; if ((at(x) > 0) !== (g0 > 0)) return x; stp *= 2; }

        var mid = (lo + hi) / 2, gm = at(mid);
        if (Math.abs(gm) < 0.5 || Math.abs(hi - lo) < Math.max(1e-6, Math.abs(mid) * 1e-9)) return { value: mid, reached: true };
        if ((gm > 0) === (gLo > 0)) { lo = mid; gLo = gm; } else hi = mid;

    var best = Math.abs(at(ends[0])) <= Math.abs(at(ends[1])) ? ends[0] : ends[1];

  var baseValues = items.map(function (it) { return it.base; });
  var metricBase = whatIfMetric_(scenarioId, metric);

  var notes = items.map(function () { return ''; });

  // 負責金額：依列表順序，每一項讓結果往目標方向改善 amount
  items.forEach(function (it, i) {
    if (it.mode !== 'amount' || !it.amount) return;
    var now = metricAt(values);
    var r = solveOne(values, i, now + dir * it.amount);
    values[i] = r.value;
    if (!r.reached) {
      var got = (metricAt(values) - now) * dir;
      capped[i] = it.cap !== null;
      notes[i] = '只做得到 ' + Math.round(got);
      warnings.push('「' + it.label + '」負責 ' + Math.round(it.amount) + '，' + (it.cap !== null ? '在上限 ±' + it.cap + '% 內' : '') + '只做得到 ' + Math.round(got) + '，差額留給補足缺口的項目');
    }
  });

  // 補足缺口：剩下的缺口依列表順序補；已經達到或超過目標就不動
  var fills = items.map(function (it, i) { return it.mode === 'fill' ? i : -1; }).filter(function (i) { return i >= 0; });
  var before = metricAt(values);
  var remaining = target - before;
  // 已經達到(或超過)目標：補足項目不動，不會為了「剛好等於目標」把結果往壞的方向調
  var reachedByKnown = Math.abs(remaining) < 0.5 || (remaining > 0 ? 1 : -1) !== dir;
  var feasible = true, message = '';
  if (!reachedByKnown) {
    var done = false;
    fills.some(function (i) {
      var r = solveOne(values, i, target);
      values[i] = r.value;
      if (r.reached) { done = true; return true; }
      capped[i] = items[i].cap !== null;
      return false;
    });
    if (!done) {
      feasible = false;
      var achievedNow = metricAt(values);
      var only = fills.length === 1 && items[fills[0]].cap === null && items[fills[0]].driver.type === 'volume';
      var short = Math.round(Math.abs(target - achievedNow));
      if (!fills.length) message = '照這樣調整做到 ' + Math.round(achievedNow) + '，離目標還差 ' + short + '。要算剩下的缺口怎麼補，加一個「補足缺口」的項目。';
      else message = '補足缺口的項目' + (fills.some(function (i) { return items[i].cap !== null; }) ? '在上限內' : '') + '補不滿，最多做到 ' +
        Math.round(achievedNow) + '，離目標還差 ' + short + '。' +
        (only ? '只靠台數補不起來，通常是單台的變動成本已經高於售價，賣越多虧越多，要先改善售價或成本。' : '可以放寬上限、再加一個補足的項目，或調整已知調整。');
    }
  }

  // 依列表順序逐項加入，算每一項的貢獻(加總 = 總改善)
  var running = baseValues.slice(), prevMetric = metricBase;
  var out = items.map(function (it, i) {
    running[i] = values[i];
    var m = metricAt(running);
    var contribution = m - prevMetric;
    prevMetric = m;
    return {
      driver: it.driver, label: it.label, unit: it.unit, base: it.base, value: values[i], mode: it.mode,
      pct: it.base ? (values[i] / it.base - 1) * 100 : null,
      capped: capped[i], note: notes[i], contribution: contribution
    };
  });
  return {
    feasible: feasible, metricBase: metricBase, achieved: prevMetric, target: target,
    reachedByKnown: reachedByKnown && fills.length > 0 && Math.abs(remaining) >= 0.5,
    alreadyMet: (target - metricBase) * dir <= 0.5,
    levers: out, warnings: warnings, message: message
  };
}

/**
 * 目標反推的結果另存成新情境：複製來源情境的全部資料，再把反推出來的假設「寫實」到新情境的資料上 ——
 *   月總銷量  各車系月銷量(與攤提基準月台數)等比例調整
 *   建議零售價 各車系建議零售價等比例調整
 *   某科目    該科目的輸入金額(各車系、各幣別)等比例調整；開發攤提科目則調整攤提到它的開發總投金額
 *   開發總投  全部開發總投金額等比例調整
 *   參數/匯率 新情境直接設成反推出來的值(全車系)
 * 寫完重算一次，回傳新情境的營業淨利與試算值，兩者應該相同(科目有車系個別公式時才可能有差，會一併回報)。
 * levers = [{ driver, value }]，meta = { Gate, ScenarioName, ScenarioType, Notes }
 */
function saveWhatIfAsScenario(scenarioId, levers, meta) {
  if (!scenarioId) throw new Error('請先選擇情境');
  meta = meta || {};
  if (!String(meta.ScenarioName || '').trim()) throw new Error('請輸入新情境名稱');
  var src = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
  if (!src) throw new Error('找不到情境：' + scenarioId);
  var o = { scenarioId: scenarioId };
  var notes = [];
  var dg = function (v) { return Math.abs(v) < 100 ? Math.round(v * 100) / 100 : Math.round(v); };
  (levers || []).forEach(function (l) {
    if (!l || !l.driver || l.value === '' || l.value === null || l.value === undefined) return;
    var b = driverBase_(scenarioId, l.driver);
    var v = toNumber_(l.value);
    if (Math.abs(v - b.value) < 1e-9) return;
    o = mergeOverrides_(o, driverOverrides_(scenarioId, l.driver, v, b.value));
    notes.push(b.label + ' ' + dg(b.value) + ' → ' + dg(v) + (b.unit ? ' ' + b.unit : '') +
      (b.value ? '（' + (v / b.value - 1 >= 0 ? '+' : '') + (Math.round((v / b.value - 1) * 1000) / 10) + '%）' : ''));
  });
  if (!notes.length) throw new Error('沒有任何調整，不需要另存');
  var expected = withOverrides_(o, function () { return whatIfMetric_(scenarioId, { code: '', basis: 'unit' }); });

  return withLock_(function () {
    var row = {
      ScenarioID: '', Gate: meta.Gate || src.Gate, ScenarioName: String(meta.ScenarioName).trim(),
      ScenarioType: meta.ScenarioType || src.ScenarioType || '目標', VehicleTypeID: src.VehicleTypeID,
      Notes: (meta.Notes ? meta.Notes + '\n' : '') + '由「' + [src.Gate, src.ScenarioName].join(' ') + '」目標反推：' + notes.join('；')
    };
    if (toNumber_(src.AmortMonthlyVolume) > 0) row.AmortMonthlyVolume = toNumber_(src.AmortMonthlyVolume) * (o.volume || 1);
    if (src.AmortLifeCycleYears !== undefined && src.AmortLifeCycleYears !== '') row.AmortLifeCycleYears = src.AmortLifeCycleYears;
    var saved = saveScenario(row);
    var newId = saved.ScenarioID;
    copyScenarioData(scenarioId, newId, ['salesmix', 'costofsales', 'devinvestment', 'operatingexpense', 'parameters', 'linenotes', 'actions'], { keepChallenge: true });

    var scaleRows = function (sheetName, pk, fieldFactor) {
      var ups = [];
      (sheetToObjects_(sheetName) || []).filter(function (r) { return r.ScenarioID === newId; }).forEach(function (r) {
        var changed = fieldFactor(r);
        if (!changed) return;
        var c = {};
        SCHEMA[sheetName].forEach(function (h) { c[h] = r[h]; });
        Object.keys(changed).forEach(function (k) { c[k] = changed[k]; });
        ups.push(c);
      });
      if (ups.length) batchWriteRows_(sheetName, pk, ups, []);
    };
    var lineScale = o.lineScale || {};
    if (o.volume || o.price) {
      scaleRows(SHEETS.SALES_MIX, 'RowID', function (r) {
        var c = {};
        if (o.volume && r.MonthlyVolume !== '' && r.MonthlyVolume !== undefined) c.MonthlyVolume = toNumber_(r.MonthlyVolume) * o.volume;
        if (o.price && r.ListPriceTaxIncl !== '' && r.ListPriceTaxIncl !== undefined) c.ListPriceTaxIncl = toNumber_(r.ListPriceTaxIncl) * o.price;
        return Object.keys(c).length ? c : null;
      });
    }
    if (Object.keys(lineScale).length) {
      [[SHEETS.COST_OF_SALES, 'RowID'], [SHEETS.OPERATING_EXPENSE, 'RowID']].forEach(function (t) {
        scaleRows(t[0], t[1], function (r) {
          return lineScale[r.LineCode] !== undefined ? { Amount: toNumber_(r.Amount) * lineScale[r.LineCode] } : null;
        });
      });
    }
    if (o.dev || Object.keys(lineScale).length) {
      scaleRows(SHEETS.DEV_INVESTMENT, 'RowID', function (r) {
        var f = (o.dev || 1) * (lineScale[r.TargetLineCode] !== undefined ? lineScale[r.TargetLineCode] : 1);
        return f !== 1 ? { Amount: toNumber_(r.Amount) * f } : null;
      });
    }
    if (o.params || o.fx) {
      var p = o.params || {}, fx = o.fx || {};
      var dels = (sheetToObjects_(SHEETS.PARAMETERS) || []).filter(function (r) {
        return r.ScenarioID === newId && (p[r.ParamName] !== undefined || (r.ParamName === COST_FX_PARAM_NAME && fx[r.Currency] !== undefined));
      }).map(function (r) { return r.ParamID; });
      var adds = Object.keys(p).map(function (name) { return { ParamID: '', ScenarioID: newId, VehicleID: '', ParamName: name, Currency: '', Value: p[name], EffectiveDate: '' }; })
        .concat(Object.keys(fx).map(function (cur) { return { ParamID: '', ScenarioID: newId, VehicleID: '', ParamName: COST_FX_PARAM_NAME, Currency: cur, Value: fx[cur], EffectiveDate: '' }; }));
      batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', adds, dels);
    }
    resetCalcMemo_();
    var actual = whatIfMetric_(newId, { code: '', basis: 'unit' });
    return { scenario: getScenarios().filter(function (s) { return s.ScenarioID === newId; })[0], expected: expected, actual: actual, notes: notes };
  });
}

/**
 * 第一次使用時，在 Apps Script 編輯器手動執行一次 setupSpreadsheet()，
 * 會自動建立所有分頁、寫入標題列，並灌入固定的損益科目表(PLLineItems)。
 * 重複執行是安全的（已存在的分頁/資料不會被清空）。
 */
function setupSpreadsheet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  Object.keys(SCHEMA).forEach(function (sheetName) {
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
    }
    var headers = SCHEMA[sheetName];
    sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    sheet.setFrozenRows(1);
  });

  // AuditLog 為選配表，獨立處理（欄位固定，不放進主要 SCHEMA 迴圈）
  var auditSheet = ss.getSheetByName('AuditLog');
  if (!auditSheet) {
    auditSheet = ss.insertSheet('AuditLog');
    auditSheet.getRange(1, 1, 1, 6).setValues([['Timestamp', 'User', 'SheetName', 'RowID', 'Action', 'Payload']]);
    auditSheet.setFrozenRows(1);
  }

  invalidateSheetCache_();   // 分頁/標題列剛建立，清掉可能已快取的空結果
  seedPLLineItems_();
  migrateDataModel_(false);

  // 移除當初建立 Sheet 時自動附帶的空白預設分頁。
  // 不同語系的 Google Sheet 預設分頁名稱不同(英文 Sheet1、中文 工作表1...)，
  // 所以不比對名稱，只要是「完全空白(0列0欄)」且不在我們預期的分頁清單裡，就視為可清除的預設分頁。
  var expectedNames = Object.keys(SCHEMA).concat(['AuditLog']);
  ss.getSheets().forEach(function (sheet) {
    var name = sheet.getName();
    if (expectedNames.indexOf(name) === -1 && sheet.getLastRow() === 0 && sheet.getLastColumn() === 0) {
      ss.deleteSheet(sheet);
    }
  });

  var summary = '資料庫初始化完成，共建立 ' + ss.getSheets().length + ' 個分頁。';
  try {
    SpreadsheetApp.getUi().alert(summary);
  } catch (e) {
    // 從 Apps Script 編輯器直接執行(而非透過 Sheets 選單)時 getUi() 可能無法使用，
    // 這不影響初始化本身是否成功，改用記錄檔輸出即可。
    Logger.log(summary);
  }
}

<script>
/**
 * 地端版開機：在前端 前端程式(src/ui) 執行之前，把後端主機架好、換上 google.script.run 替身。
 * 這段一定要比 前端程式(src/ui) 早執行(build-local.js 把它放在 <body> 最前面)，
 * 前端 DOMContentLoaded 一開場就會呼叫 getBootstrap()。
 */
(function () {
  'use strict';
  var USER_KEY = 'fsLocal.user.v1';

  // 瀏覽器暫存可能整個不能用(無痕模式、公司政策封鎖)，每一次存取都要包 try/catch
  var storage = {
    getItem: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    setItem: function (k, v) { window.localStorage.setItem(k, v); }   // 寫入失敗要讓主機知道，不在這裡吞掉
  };

  function getUser() {
    var name = storage.getItem(USER_KEY);
    return name || '本機使用者';
  }

  var host = FSHost.createHost({
    factory: FSBackendFactory, shim: FSGasShim, pack: FSPack,
    storage: storage, getUser: getUser
  });
  host.start();

  window.FSLocal = {
    host: host,
    USER_KEY: USER_KEY,
    getUser: getUser,
    setUser: function (name) { try { window.localStorage.setItem(USER_KEY, name); } catch (e) { /* 存不了就只在這次有效 */ } },
    demoPack: function () {
      var el = document.getElementById('fs-demo-pack');
      return el ? FSPack.parsePack(el.textContent) : null;
    }
  };

  window.google = window.google || {};
  window.google.script = {
    run: FSHost.createScriptRun(host),
    host: { close: function () { } }
  };

  // 同一個檔案開了兩個分頁(或兩份副本，Chrome 的 file:// 共用同一份暫存)：另一邊存檔時，這邊手上的資料就過期了，
  // 再存就會把對方剛改的蓋掉。偵測到就停止寫入、請使用者重新整理。
  window.addEventListener('storage', function (e) {
    if (e.key === host.STORAGE_KEY) host.markStale();
  });
}());

</script>

/**
 * 對話框：取代瀏覽器的 prompt()/confirm()（那兩個長得很突兀、不能放說明、也不能一次問好幾個欄位）。
 * openModal({ title, body(HTML), okText, danger, wide, fields:[{name,label,value,type,options,help,placeholder}] })

 */
function openModal(opts) {
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'modal' + (opts.wide ? ' wide' : '');
    const fields = opts.fields || [];
    const fieldHtml = fields.map((f, i) => {
      const id = 'mf-' + i;
      let input;
      if (f.type === 'select') {
        input = `<select id="${id}">${(f.options || []).map(o => {
          const [v, t] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(v)}"${String(v) === String(f.value || '') ? ' selected' : ''}>${esc(t)}</option>`;
        }).join('')}</select>`;
      } else if (f.type === 'textarea') {
        input = `<textarea id="${id}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`;
      } else if (f.type === 'checks') {
        input = `<div class="chip-list" id="${id}">${(f.options || []).map(o => `<label class="chk"><input type="checkbox" value="${esc(o[0])}"${(f.value || []).indexOf(o[0]) !== -1 ? ' checked' : ''}> ${esc(o[1])}</label>`).join('')}</div>`;
      } else {
        input = `<input id="${id}" type="${f.type || 'text'}" step="any" value="${esc(f.value === undefined ? '' : f.value)}" placeholder="${esc(f.placeholder || '')}">`;
      }
      return `<label class="field"><span>${esc(f.label)}</span>${input}${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</label>`;
    }).join('');
    dlg.innerHTML = `
      <form method="dialog">
        <div class="modal-head"><h3>${esc(opts.title || '')}</h3></div>
        <div class="modal-body">${opts.body || ''}${fieldHtml}</div>
        <div class="modal-foot">
          ${opts.noCancel ? '' : `<button type="button" class="btn secondary" value="cancel">${esc(opts.cancelText || '取消')}</button>`}
          <button type="submit" class="btn${opts.danger ? ' danger solid' : ''}" value="ok">${esc(opts.okText || '確定')}</button>
        </div>
      </form>`;
    document.body.appendChild(dlg);
    let done = false;
    const finish = val => { if (done) return; done = true; dlg.close(); dlg.remove(); resolve(val); };
    dlg.querySelector('button[value=cancel]') && dlg.querySelector('button[value=cancel]').addEventListener('click', () => finish(null));
    dlg.addEventListener('cancel', e => { e.preventDefault(); finish(null); });
    dlg.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      if (!fields.length && !opts.collect) { finish(true); return; }
      const out = opts.collect ? opts.collect(dlg) : {};
      fields.forEach((f, i) => {
        const el = dlg.querySelector('#mf-' + i);
        out[f.name] = f.type === 'checks' ? Array.from(el.querySelectorAll('input:checked')).map(x => x.value) : el.value;
      });
      if (opts.validate) {
        const msg = opts.validate(out);
        if (msg) { toast(msg, 'err'); return; }
      }
      finish(out);
    });
    dlg.showModal();
    const first = dlg.querySelector('input,select,textarea');
    if (first) { first.focus(); if (first.select) first.select(); }
  });
}

/**
 * 拖曳排序(全系統共用)：取代一次只能移一格的 ▲▼/◀▶ 按鈕。
 *   - 抓住 ⠿ 把手拖到想要的位置放開(滑鼠、觸控都可以)，拖曳中其他列即時讓位
 *   - 鍵盤：把手取得焦點後 Alt+↑/↓(或 ←/→) 一次移一格
 * makeSortable(container, { items: '選擇器', handle: '選擇器', onEnd(keys, moved) })
 *   items 要有 data-key；放開後依畫面順序回傳 key 陣列，由呼叫端決定要不要立即存檔。
 *   group(item) 可選：回傳群組鍵，只允許在同一群組內移動(科目樹的同一個父科目底下)。
 */
function makeSortable(container, opts) {
  if (!container || !container.addEventListener || container.__sortable) return;
  container.__sortable = true;
  const itemSel = opts.items, handleSel = opts.handle || '.drag-handle';
  // direct：只管直接子元素(巢狀清單如科目樹，每一層各自排序，互不干擾)
  const itemsNow = () => Array.from(container.querySelectorAll(itemSel)).filter(el => !opts.direct || el.parentNode === container);
  const keysNow = () => itemsNow().map(el => el.getAttribute('data-key'));
  let drag = null;
  const groupOf = el => opts.group ? opts.group(el) : '';

  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest(handleSel);
    if (!handle || !container.contains(handle) || e.button > 0) return;
    const item = handle.closest(itemSel);
    if (!item || (opts.direct && item.parentNode !== container)) return;
    e.preventDefault();
    drag = { item, startY: e.clientY, startX: e.clientX, before: keysNow().join('\u0001'), group: groupOf(item), moved: false };
    item.classList.add('sort-dragging');
    document.body.classList.add('sorting');
    hideTooltip_ && hideTooltip_();
    handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if (!drag) return;
    const horizontal = !!opts.horizontal;
    const siblings = itemsNow().filter(el => el !== drag.item && groupOf(el) === drag.group);
    const pos = horizontal ? e.clientX : e.clientY;
    for (const sib of siblings) {
      const r = sib.getBoundingClientRect();
      const mid = horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
      const isAfterDrag = drag.item.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING;
      if (isAfterDrag && pos > mid) { insertAfterGroupBlock_(sib, drag.item, opts); drag.moved = true; break; }
      if (!isAfterDrag && pos < mid) { sib.parentNode.insertBefore(drag.item, sib); moveTrailing_(drag.item, opts); drag.moved = true; break; }
    }
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    d.item.classList.remove('sort-dragging');
    document.body.classList.remove('sorting');
    const after = keysNow();
    if (after.join('\u0001') !== d.before) {
      d.item.classList.add('sort-flash');
      setTimeout(() => d.item.classList.remove('sort-flash'), 900);
      opts.onEnd(after, d.item.getAttribute('data-key'));
    }
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('keydown', e => {
    const handle = e.target.closest && e.target.closest(handleSel);
    if (!handle || !e.altKey) return;
    const dir = (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : 0;
    if (!dir) return;
    e.preventDefault();
    const item = handle.closest(itemSel);
    if (!item || (opts.direct && item.parentNode !== container)) return;
    const g = groupOf(item);
    const peers = itemsNow().filter(el => groupOf(el) === g);
    const idx = peers.indexOf(item), j = idx + dir;
    if (j < 0 || j >= peers.length) return;
    // 真的把 DOM 搬過去(有些呼叫端是照畫面順序讀，如科目樹)，再回傳新順序
    const ref = peers[j];
    if (dir < 0) ref.parentNode.insertBefore(item, ref);
    else ref.parentNode.insertBefore(item, ref.nextSibling);
    const key = item.getAttribute('data-key');
    opts.onEnd(keysNow(), key, true);
    // 重畫之後把焦點放回同一個把手，可以連續按 Alt+↑↓
    setTimeout(() => {
      const box = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
      const again = box && Array.from(box.querySelectorAll(handleSel)).find(h => h.closest(itemSel) === box);
      if (again) again.focus();
    }, 700);
  });
}
/** 科目樹拖曳：一個父科目連同它底下的子科目要一起搬(items 用 data-block 標出區塊成員) */
function insertAfterGroupBlock_(sib, item, opts) {
  let ref = sib;
  if (opts.blockOf) { const tail = opts.blockOf(sib); if (tail) ref = tail; }
  ref.parentNode.insertBefore(item, ref.nextSibling);
  moveTrailing_(item, opts);
}
function moveTrailing_(item, opts) {
  if (!opts.trailingOf) return;
  const trail = opts.trailingOf(item);
  let ref = item;
  trail.forEach(el => { ref.parentNode.insertBefore(el, ref.nextSibling); ref = el; });
}
/** ⠿ 拖曳把手的 HTML(可以用鍵盤 Alt+↑↓ 操作) */
function dragHandleHtml(label) {
  return `<span class="drag-handle" tabindex="0" role="button" aria-label="${esc(label || '拖曳調整順序')}" data-tip="拖曳調整順序（或 Alt+↑↓）">⠿</span>`;
}

  salesmix: ['輸入資料', '銷售構成與售價'], costs: ['輸入資料', '成本與費用'], devinvestment: ['輸入資料', '開發總投'],
