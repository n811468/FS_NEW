// ===== src/Utils.gs =====
/** 共用工具函式 */

function getSheet_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  if (!sheet) throw new Error('找不到分頁：' + name + '，請先執行 setupSpreadsheet()');
  return sheet;
}

// 同一次執行內的流水號：整批寫入(如一次存下整張表格)會連續產生很多 ID，
// 只取 UUID 前 8 碼有機會撞號，撞號的後果是後一列直接覆蓋前一列、而且不會報錯。
var ID_SEQ_ = 0;

function generateId_(prefix) {
  return prefix + '-' + Utilities.getUuid().slice(0, 8) + '-' + (++ID_SEQ_);
}

/**
 * google.script.run 序列化巢狀 Date 物件時不穩定（陣列包物件、物件裡又包 Date，
 * 有機會整包回傳值直接變成 null，且不會丟出任何錯誤）。
 * Sheet 的日期欄位讀出來就是 JS Date，所以一律在這裡轉成 yyyy-MM-dd 字串再往外傳。
 */
function normalizeCellValue_(v) {
  if (Object.prototype.toString.call(v) === '[object Date]') {
    return Utilities.formatDate(v, Session.getScriptTimeZone() || 'Asia/Taipei', 'yyyy-MM-dd');
  }
  return v;
}

/**
 * 分頁讀取快取，分兩層：
 *   1. 單次執行內的記憶體快取(SHEET_CACHE_) —— 一次損益計算會重複讀同一張表很多次
 *      （光是科目表 PLLineItems，每算一個車系就會被讀 5 次以上），這層省掉同一次執行內的重複讀取。
 *   2. 跨執行的 CacheService 快取 —— 每一次 google.script.run 呼叫都是全新的執行，
 *      第 1 層每次都會是空的，切分頁、開儀表板等於每次都重新把用到的表整個讀一遍，
 *      這是介面感覺卡頓的主因之一。這層把讀到的結果多存一份到 CacheService，
 *      有效期內(SHEET_CACHE_TTL_)其他次執行可以直接用，不必再打一次 Sheets API。
 * 任何寫入都會兩層一起清掉，所以不會讀到過期資料；資料太大存不進 CacheService(單筆上限 100KB)
 * 就直接跳過快取，退回每次都讀 Sheet，不影響正確性，只是那張表沒有快取效果。
 * 注意：繞過 upsertRow_/deleteRow_ 直接寫 Sheet 的地方(SetupSheets、writePLResult_)
 * 必須自己呼叫 invalidateSheetCache_()。
 */
var SHEET_CACHE_ = {};
var SHEET_CACHE_TTL_SECONDS_ = 300; // 5 分鐘；資料一有異動就會主動清掉，這個 TTL 只是保險

function sheetCacheKey_(sheetName) { return 'sheet_' + sheetName; }

function invalidateSheetCache_(sheetName) {
  var names = sheetName ? [sheetName] : Object.keys(SCHEMA);
  var cache = CacheService.getScriptCache();
  names.forEach(function (name) {
    delete SHEET_CACHE_[name];
    cache.remove(sheetCacheKey_(name));
  });
  if (!sheetName) SHEET_CACHE_ = {};
  resetCalcMemo_();
}

/**
 * 清掉「單次執行內」的計算結果記憶(見 CalcEngine.gs 的 PL_CORE_MEMO_)。
 * 任何一張表有寫入就整個清掉：損益計算跨好幾張表，逐表判斷影響範圍不值得，重算就對了。
 * 本機預覽伺服器(tools/dev-server.js)在每次模擬的 google.script.run 呼叫前也會呼叫，
 * 模擬 Apps Script 每次呼叫都是全新執行的行為。
 */
function resetCalcMemo_() {
  if (typeof PL_CORE_MEMO_ !== 'undefined') PL_CORE_MEMO_ = {};
}

/** 把整張表讀成 [{欄位:值,...}, ...]，第一列為標題 */
function sheetToObjects_(sheetName) {
  if (SHEET_CACHE_[sheetName]) return SHEET_CACHE_[sheetName];

  var cache = CacheService.getScriptCache();
  var cached = cache.get(sheetCacheKey_(sheetName));
  if (cached) {
    var fromCache = JSON.parse(cached);
    SHEET_CACHE_[sheetName] = fromCache;
    return fromCache;
  }

  var rows = readSheetObjects_(sheetName);
  SHEET_CACHE_[sheetName] = rows;
  try {
    var json = JSON.stringify(rows);
    // CacheService 單筆快取上限 100KB，留點餘裕；超過就不快取這張表，讀 Sheet 的正確性不受影響
    if (json.length < 90000) cache.put(sheetCacheKey_(sheetName), json, SHEET_CACHE_TTL_SECONDS_);
  } catch (e) {
    // 序列化失敗(理論上不會，資料都是純值)也不影響功能，只是這次沒快取到
  }
  return rows;
}

function readSheetObjects_(sheetName) {
  var sheet = getSheet_(sheetName);
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow < 2) return [];
  var headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0];
  var values = sheet.getRange(2, 1, lastRow - 1, lastCol).getValues();
  return values
    .filter(function (row) { return row.some(function (v) { return v !== '' && v !== null; }); })
    .map(function (row) {
      var obj = {};
      headers.forEach(function (h, i) { obj[h] = normalizeCellValue_(row[i]); });
      return obj;
    });
}

/**
 * 主鍵比對：Sheet 讀回來的值可能是 Number(例如純數字的代號)，
 * 而前端傳來的一律是 String，直接用 === 會永遠不相等 → 變成重複新增、刪不掉。
 */
function samePk_(a, b) {
  if (a === null || a === undefined || a === '') return false;
  return String(a) === String(b);
}

/** 把一組列依 PK 轉成「PK字串 -> 列物件」的對照表，整批寫入前先查表用 */
function indexByPk_(rows, pkField) {
  var map = {};
  (rows || []).forEach(function (r) {
    if (r[pkField] !== undefined && r[pkField] !== null && r[pkField] !== '') map[String(r[pkField])] = r;
  });
  return map;
}

/**
 * upsertRowMerge_ 的整批版：用預先讀好的 existingByPk(見 indexByPk_) 補齊 rowObj 沒送出的欄位，
 * 不必為了合併就每一列各自重新讀一次整張表。呼叫端把回傳值收集起來一次交給 batchWriteRows_。
 */
function mergeRowForBatch_(sheetName, pkField, rowObj, existingByPk) {
  var existing = rowObj[pkField] ? existingByPk[String(rowObj[pkField])] : undefined;
  if (existing) {
    SCHEMA[sheetName].forEach(function (h) {
      if (rowObj[h] === undefined) rowObj[h] = existing[h];
    });
  }
  return rowObj;
}

/**
 * 只更新有帶到的欄位，其餘沿用既有值。
 * 表單只送出畫面上有的欄位，若直接 upsert，沒出現在表單上的欄位(如情境的攤提基準台數、
 * 科目的自動計算標記)會被寫成空字串，等於靜靜地把設定清掉。
 */
function upsertRowMerge_(sheetName, pkField, rowObj) {
  var existing = sheetToObjects_(sheetName).filter(function (r) {
    return samePk_(r[pkField], rowObj[pkField]);
  })[0];
  if (existing) {
    SCHEMA[sheetName].forEach(function (h) {
      if (rowObj[h] === undefined) rowObj[h] = existing[h];
    });
  }
  return upsertRow_(sheetName, pkField, rowObj);
}

/** 依 PK 欄位(通常是第一欄) upsert 一列；找不到就新增 */
function upsertRow_(sheetName, pkField, rowObj) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField) + 1;

  if (!rowObj[pkField]) {
    rowObj[pkField] = generateId_(rowIdPrefix_(sheetName));
  }

  var lastRow = sheet.getLastRow();
  var targetRow = -1;
  if (lastRow >= 2) {
    var pkValues = sheet.getRange(2, pkCol, lastRow - 1, 1).getValues();
    for (var i = 0; i < pkValues.length; i++) {
      if (samePk_(pkValues[i][0], rowObj[pkField])) {
        targetRow = i + 2;
        break;
      }
    }
  }

  var rowArray = headers.map(function (h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
  var writeRow = targetRow === -1 ? lastRow + 1 : targetRow;
  var range = sheet.getRange(writeRow, 1, 1, rowArray.length);
  applyTextColumnFormats_(range, headers, sheetName);
  range.setValues([rowArray]);
  invalidateSheetCache_(sheetName);
  logAudit_(sheetName, rowObj[pkField], targetRow === -1 ? 'INSERT' : 'UPDATE', rowObj);
  return rowObj;
}

/**
 * 在寫入前把純文字欄位(TEXT_COLUMNS)的儲存格格式設成純文字('@')，
 * 避免 Sheet 把「0901」這種看起來像數字的字串自動轉成 901。
 * 用 getNumberFormats() 先讀出目前格式，只覆蓋純文字欄位那幾格，其餘欄位(金額/比率)維持原狀，
 * 且只在格式真的需要改變時才寫入，避免每次存檔都多一次 API 呼叫。
 * range 可以是一列(單筆 upsertRow_)也可以是很多列(batchWriteRows_ 整批寫入)：
 * getNumberFormats()/setNumberFormats() 本來就是回傳/接受二維陣列，不特別假設列數。
 */
function applyTextColumnFormats_(range, headers, sheetName) {
  var textCols = TEXT_COLUMNS[sheetName];
  if (!textCols || !textCols.length) return;
  var current = range.getNumberFormats();
  var changed = false;
  var next = current.map(function (rowFormats) {
    return headers.map(function (h, i) {
      if (textCols.indexOf(h) !== -1 && rowFormats[i] !== '@') { changed = true; return '@'; }
      return rowFormats[i];
    });
  });
  if (changed) range.setNumberFormats(next);
}

function deleteRow_(sheetName, pkField, pkValue) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField) + 1;
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return false;
  var pkValues = sheet.getRange(2, pkCol, lastRow - 1, 1).getValues();
  for (var i = 0; i < pkValues.length; i++) {
    if (samePk_(pkValues[i][0], pkValue)) {
      sheet.deleteRow(i + 2);
      invalidateSheetCache_(sheetName);
      logAudit_(sheetName, pkValue, 'DELETE', {});
      return true;
    }
  }
  return false;
}

/**
 * 整批新增/更新/刪除同一張分頁的很多列，取代「每一列各自呼叫 upsertRow_/deleteRow_」。
 *
 * 逐列處理的問題：每一列各自要「掃 PK 欄找列號 → 讀寫格式 → 寫入 → 寫稽核」，
 * 一次矩陣式的整批存檔(銷貨成本/營業費用/開發總投/科目設定…隨便一頁動輒十幾到上百格)
 * 就會在同一次執行裡打出對應數量的 Sheets API 呼叫，是存檔感覺卡的主因
 * （實測 55 格：逐列寫入約 330 次 API 呼叫，整批寫入後降到個位數，見
 * tools/verify-write-batching.js）。
 *
 * 做法跟 CalcEngine.gs 的 writePLResult_ 一樣：整段資料只讀一次、只寫一次 ——
 *   1. 把現有資料整塊讀出來(1 次 getValues)
 *   2. 在記憶體裡套用這一批的新增/更新(找不到 PK 就當新增)與刪除
 *   3. 整段一次寫回(先 clearContent 再 setValues，避免列數變少時留下舊資料的殘影)
 * 呼叫端仍然一次只描述「這一批要 upsert 哪些列、要刪除哪些 PK」，不需要知道列號，
 * 跟原本呼叫 upsertRow_/deleteRow_ 的介面一樣簡單。
 *
 * upserts：要新增或更新的列物件陣列，沒有 pkField 值的視為新增(自動產生 ID)，
 *          其餘欄位比照 upsertRow_ 的語意整列覆蓋(不是 merge，畫面沒送出的欄位會變空白，
 *          呼叫端要跟原本一樣自己決定是否先用 upsertRowMerge_ 那種模式取現有資料補齊)。
 * deletePks：要刪除的 PK 值陣列；跟同一批 upserts 撞到同一個 PK 時，以 upserts 為準
 *            (先刪除清單、後面又被 upsert 加回來，理當視為「留下」而不是「刪除」)。
 */
function batchWriteRows_(sheetName, pkField, upserts, deletePks) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var pkCol = headers.indexOf(pkField);
  var width = headers.length;
  var lastRow = sheet.getLastRow();

  var existing = lastRow >= 2 ? sheet.getRange(2, 1, lastRow - 1, width).getValues() : [];

  var deleteSet = {};
  (deletePks || []).forEach(function (pk) { if (pk !== '' && pk !== null && pk !== undefined) deleteSet[String(pk)] = true; });

  // pk(字串) -> existing 陣列的索引，只收有值的 PK；空白列(理論上不會有，防禦一下)不參與比對
  var pkIndex = {};
  existing.forEach(function (row, i) {
    if (row[pkCol] !== '' && row[pkCol] !== null && row[pkCol] !== undefined) pkIndex[String(row[pkCol])] = i;
  });

  var auditEntries = [];
  var now = new Date();
  var user = Session.getActiveUser().getEmail();

  (upserts || []).forEach(function (rowObj) {
    if (!rowObj[pkField]) rowObj[pkField] = generateId_(rowIdPrefix_(sheetName));
    var pk = String(rowObj[pkField]);
    var rowArray = headers.map(function (h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    var isNew = pkIndex[pk] === undefined;
    if (isNew) { pkIndex[pk] = existing.length; existing.push(rowArray); }
    else existing[pkIndex[pk]] = rowArray;
    auditEntries.push([now, user, sheetName, rowObj[pkField], isNew ? 'INSERT' : 'UPDATE', JSON.stringify(rowObj)]);
    delete deleteSet[pk];   // 同一批裡先列進刪除清單、又被 upsert 加回來的，以加回來為準
  });

  var survivors = Object.keys(deleteSet).length ? existing.filter(function (row) {
    var pk = String(row[pkCol]);
    if (!deleteSet[pk]) return true;
    auditEntries.push([now, user, sheetName, row[pkCol], 'DELETE', '{}']);
    return false;
  }) : existing;

  // 整段資料一次寫回；先清掉舊範圍再寫，列數變少(刪除多於新增)時才不會留下舊列的殘影
  if (lastRow >= 2) sheet.getRange(2, 1, lastRow - 1, width).clearContent();
  if (survivors.length) {
    var range = sheet.getRange(2, 1, survivors.length, width);
    applyTextColumnFormats_(range, headers, sheetName);
    range.setValues(survivors);
  }
  invalidateSheetCache_(sheetName);
  logAuditBatch_(auditEntries);
  return true;
}

function rowIdPrefix_(sheetName) {
  var map = {
    SalesMix: 'SM', CostOfSales: 'CS', DevInvestment: 'DI',
    OperatingExpense: 'OE', Parameters: 'PM', PLResult: 'PR',
    VehicleTypes: 'VT', Vehicles: 'VH', Scenarios: 'SC'
  };
  return map[sheetName] || 'RW';
}

function logAudit_(sheetName, rowId, action, payload) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AuditLog');
  if (!sheet) return; // AuditLog 為選配表，不存在就略過
  sheet.appendRow([new Date(), Session.getActiveUser().getEmail(), sheetName, rowId, action, JSON.stringify(payload)]);
}

/** logAudit_ 的整批版本：entries 是 [[Timestamp, User, SheetName, RowID, Action, Payload], ...]，
 *  一次 setValues() 寫完，不像逐筆 appendRow() 一列一次呼叫。 */
function logAuditBatch_(entries) {
  if (!entries || !entries.length) return;
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AuditLog');
  if (!sheet) return; // AuditLog 為選配表，不存在就略過
  var lastRow = sheet.getLastRow();
  sheet.getRange(lastRow + 1, 1, entries.length, 6).setValues(entries);
}

function toNumber_(v) {
  var n = Number(v);
  return isNaN(n) ? 0 : n;
}

/** 依某個排序欄位排序，留白視為排在最後面；相對順序穩定，不會因為排序值相同就跳來跳去 */
function sortByOrder_(rows, field) {
  var withIndex = rows.map(function (r, i) { return { row: r, i: i }; });
  withIndex.sort(function (a, b) {
    var av = a.row[field] === '' || a.row[field] === undefined || a.row[field] === null ? Infinity : toNumber_(a.row[field]);
    var bv = b.row[field] === '' || b.row[field] === undefined || b.row[field] === null ? Infinity : toNumber_(b.row[field]);
    return av !== bv ? av - bv : a.i - b.i;
  });
  return withIndex.map(function (x) { return x.row; });
}


// ===== src/DataService.gs =====
/**
 * 資料存取層：每張表提供 get / save / delete。
 * 個人使用版本，仍用 LockService 避免同一個瀏覽器分頁快速連點造成資料錯亂。
 */

// 可重入：有些整批作業(如刪科目連帶刪金額)會呼叫其他同樣上鎖的函式，
// 巢狀時只由最外層真正取得/釋放鎖，避免自己卡住自己。
var LOCK_DEPTH_ = 0;

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  // 30 秒：车型/车系重新命名要连带改好几张表，资料多的时候比一般存档慢，
  // 10 秒常常等不到就先丢「鎖定逾時」，改成比照 Apps Script 常见值调宽松一点。
  if (LOCK_DEPTH_ === 0) lock.waitLock(30000);
  LOCK_DEPTH_++;
  try {
    return fn();
  } finally {
    LOCK_DEPTH_--;
    if (LOCK_DEPTH_ === 0) lock.releaseLock();
  }
}

/**
 * 開場資料：車型清單 + 預設選到的車型與它底下的情境，一次取回。
 * 前端載入時原本要分別呼叫 getVehicleTypes / getScenarios 並各觸發一次重繪，
 * 每趟 google.script.run 往返都是數百毫秒，合併成一次可以明顯縮短開場等待。
 */
function getBootstrap(preferredVehicleTypeId) {
  // 開頁時順手把「由程式定義的科目名稱」對回來。做成自動修復而不是維護選單，
  // 是因為名稱對不上數字的畫面看起來就是「系統算錯了」，不該要使用者先知道有這支維護功能。
  // 只有真的對不上時才寫入，之後每次開頁都只是一次讀取。
  withLock_(function () { return syncCodeOwnedLineItems_(); });

  var types = getVehicleTypes();
  var ids = types.map(function (t) { return t.VehicleTypeID; });
  var pick = (preferredVehicleTypeId && ids.indexOf(preferredVehicleTypeId) !== -1)
    ? preferredVehicleTypeId : (ids[0] || '');
  return {
    vehicleTypes: types,
    vehicleTypeId: pick,
    scenarios: pick ? getScenarios(pick) : []
  };
}

// ---- VehicleTypes（車型主檔，如 DA/DE/DH/DX，需先建立才能在底下新增車系） ----
function getVehicleTypes() {
  return sheetToObjects_(SHEETS.VEHICLE_TYPES) || [];
}
function saveVehicleType(rowObj) {
  return withLock_(function () { return upsertRowMerge_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', rowObj); });
}
function deleteVehicleType(vehicleTypeId) {
  return withLock_(function () { return deleteRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', vehicleTypeId); });
}
/** 車型主檔整批儲存：整張表直接編輯、按一次儲存（沒填代號的空白新增列會被略過） */
function saveVehicleTypeGrid(rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(getVehicleTypes(), 'VehicleTypeID');
    var upserts = (rows || []).filter(function (r) { return r.VehicleTypeID; })
      .map(function (r) { return mergeRowForBatch_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', r, existingByPk); });
    batchWriteRows_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', upserts, []);
    return getVehicleTypes();
  });
}

/**
 * 車型代號重新命名：新增一列新代號、把所有引用舊代號的資料(車系、情境)一併改成新代號，
 * 最後刪掉舊代號那一列。車型代號是車系/情境的外鍵，只改主檔那一列會讓底下的車系跟情境
 * 全部找不到自己屬於哪個車型(等於資料還在、畫面上卻消失)，所以一定要連動更新。
 */
function renameVehicleType(oldId, newId) {
  return withLock_(function () {
    newId = String(newId || '').trim();
    if (!oldId || !newId) throw new Error('車型代號不能為空');
    if (oldId === newId) return getVehicleTypes();
    var existing = getVehicleTypes();
    var row = existing.filter(function (t) { return t.VehicleTypeID === oldId; })[0];
    if (!row) throw new Error('找不到車型：' + oldId);
    if (existing.some(function (t) { return t.VehicleTypeID === newId; })) {
      throw new Error('車型代號「' + newId + '」已經存在');
    }

    row.VehicleTypeID = newId;
    upsertRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', row);
    deleteRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', oldId);

    [[SHEETS.VEHICLES, 'VehicleID'], [SHEETS.SCENARIOS, 'ScenarioID']].forEach(function (pair) {
      var sheetName = pair[0], pk = pair[1];
      (sheetToObjects_(sheetName) || []).forEach(function (r) {
        if (r.VehicleTypeID !== oldId) return;
        r.VehicleTypeID = newId;
        upsertRow_(sheetName, pk, r);
      });
    });
    return getVehicleTypes();
  });
}

// ---- Vehicles（車系，如 3人貨車/9人客貨車，隸屬某個 VehicleType） ----
/**
 * 車系清單依 SortOrder 排序：這個順序會帶到所有用車系排欄位的地方
 * （銷貨成本/營業費用矩陣的欄位、儀表板的車系選單...），車系設定頁可以直接改「排序」欄位調整。
 * 沒填排序值的車系排在最後面(用 Infinity)，相對順序仍照 Sheet 上的原始順序(穩定排序)。
 */
function getVehicles(vehicleTypeId) {
  var rows = sheetToObjects_(SHEETS.VEHICLES) || [];
  rows = vehicleTypeId ? rows.filter(function (r) { return r.VehicleTypeID === vehicleTypeId; }) : rows;
  return sortByOrder_(rows, 'SortOrder');
}
function saveVehicle(rowObj) {
  return withLock_(function () { return upsertRowMerge_(SHEETS.VEHICLES, 'VehicleID', rowObj); });
}
function deleteVehicle(vehicleId) {
  return withLock_(function () { return deleteRow_(SHEETS.VEHICLES, 'VehicleID', vehicleId); });
}
/** 車系設定整批儲存 */
function saveVehicleGrid(vehicleTypeId, rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(sheetToObjects_(SHEETS.VEHICLES), 'VehicleID');
    var upserts = (rows || []).filter(function (r) { return r.VehicleID; })
      .map(function (r) {
        r.VehicleTypeID = vehicleTypeId;
        return mergeRowForBatch_(SHEETS.VEHICLES, 'VehicleID', r, existingByPk);
      });
    batchWriteRows_(SHEETS.VEHICLES, 'VehicleID', upserts, []);
    return getVehicles(vehicleTypeId);
  });
}

/**
 * 車系順序：跟目標某一列交換排序值(SortOrder)，立即生效並回傳最新順序。
 * 讓「銷貨成本」「營業費用」矩陣頁面也能直接調車系順序，不必特地切去「車系設定」頁。
 * 交換前先把目前顯示順序整批依序編號，確保每一列都有明確的 SortOrder 可以交換
 * （原本留白的舊資料靠 sortByOrder_ 排在最後、彼此順序不定，直接互換空白值沒有意義）。
 */
function reorderVehicle(vehicleTypeId, vehicleId, direction) {
  return withLock_(function () {
    var vehicles = getVehicles(vehicleTypeId);
    var idx = -1;
    vehicles.forEach(function (v, i) { if (v.VehicleID === vehicleId) idx = i; });
    if (idx === -1) throw new Error('找不到車系：' + vehicleId);
    var targetIdx = idx + (direction < 0 ? -1 : 1);
    if (targetIdx < 0 || targetIdx >= vehicles.length) return vehicles;
    vehicles.forEach(function (v, i) { v.SortOrder = i; });
    var tmp = vehicles[idx].SortOrder;
    vehicles[idx].SortOrder = vehicles[targetIdx].SortOrder;
    vehicles[targetIdx].SortOrder = tmp;
    vehicles.forEach(function (v) { upsertRow_(SHEETS.VEHICLES, 'VehicleID', v); });
    return getVehicles(vehicleTypeId);
  });
}

/**
 * 車系代號重新命名：新增一列新代號、把所有引用舊代號的資料(銷售構成、銷貨成本、營業費用、
 * 費率覆寫、損益快照)一併改成新代號，最後刪掉舊代號那一列。開發總投是情境層級，不記車系，
 * 不受影響。
 */
function renameVehicle(vehicleTypeId, oldId, newId) {
  return withLock_(function () {
    newId = String(newId || '').trim();
    if (!oldId || !newId) throw new Error('車系代號不能為空');
    if (oldId === newId) return getVehicles(vehicleTypeId);
    var existing = getVehicles();
    var row = existing.filter(function (v) { return v.VehicleID === oldId; })[0];
    if (!row) throw new Error('找不到車系：' + oldId);
    if (existing.some(function (v) { return v.VehicleID === newId; })) {
      throw new Error('車系代號「' + newId + '」已經存在');
    }

    row.VehicleID = newId;
    upsertRow_(SHEETS.VEHICLES, 'VehicleID', row);
    deleteRow_(SHEETS.VEHICLES, 'VehicleID', oldId);

    [[SHEETS.SALES_MIX, 'RowID'], [SHEETS.COST_OF_SALES, 'RowID'],
      [SHEETS.OPERATING_EXPENSE, 'RowID'], [SHEETS.PARAMETERS, 'ParamID'],
      [SHEETS.PL_RESULT, 'ResultID']].forEach(function (pair) {
      var sheetName = pair[0], pk = pair[1];
      (sheetToObjects_(sheetName) || []).forEach(function (r) {
        if (r.VehicleID !== oldId) return;
        r.VehicleID = newId;
        upsertRow_(sheetName, pk, r);
      });
    });
    return getVehicles(vehicleTypeId);
  });
}

// ---- Scenarios（隸屬某個 VehicleType，同一車型可有多個情境版本並排比較） ----
function getScenarios(vehicleTypeId) {
  var rows = sheetToObjects_(SHEETS.SCENARIOS) || [];
  return vehicleTypeId ? rows.filter(function (r) { return r.VehicleTypeID === vehicleTypeId; }) : rows;
}
// 情境代號改用 GATE 別，情境名稱自訂；同一個 GATE 下可以有多個情境(GATE F 現況 / GATE F 目標)，
// 所以 ScenarioID 只是系統內部鍵值，由 upsertRow_ 自動產生，不需使用者自行編碼。
function validateScenarioRow_(rowObj) {
  if (!rowObj.Gate) throw new Error('請選擇 GATE 別');
  if (GATE_OPTIONS.indexOf(rowObj.Gate) === -1) throw new Error('GATE 別不正確：' + rowObj.Gate);
}
function saveScenario(rowObj) {
  return withLock_(function () {
    validateScenarioRow_(rowObj);
    // 用合併式 upsert：情境表單沒有攤提基準台數欄位，直接覆寫會把開發總投頁設定的值清掉
    return upsertRowMerge_(SHEETS.SCENARIOS, 'ScenarioID', rowObj);
  });
}
function deleteScenario(scenarioId) {
  return withLock_(function () { return deleteRow_(SHEETS.SCENARIOS, 'ScenarioID', scenarioId); });
}

/** 情境設定整批儲存（既有情境直接在表格上改名/改性質，按一次儲存） */
function saveScenarioGrid(vehicleTypeId, rows) {
  return withLock_(function () {
    var existingByPk = indexByPk_(sheetToObjects_(SHEETS.SCENARIOS), 'ScenarioID');
    var upserts = [];
    (rows || []).forEach(function (r) {
      if (!r.ScenarioID && !r.Gate && !r.ScenarioName) return;
      r.VehicleTypeID = vehicleTypeId;
      validateScenarioRow_(r);
      upserts.push(mergeRowForBatch_(SHEETS.SCENARIOS, 'ScenarioID', r, existingByPk));
    });
    batchWriteRows_(SHEETS.SCENARIOS, 'ScenarioID', upserts, []);
    return getScenarios(vehicleTypeId);
  });
}

/**
 * 以既有情境為基礎建立新情境。
 * 實務上新情境幾乎都是既有情境的變形（「GATE F 目標」通常就是「GATE F 現況」改幾個數字，
 * 而下一版的目標又是以上一版目標為底），從頭把銷售構成、成本、開發總投重打一次很不合理。
 * sourceScenarioId 留空就是建立一個空白情境。
 */
function createScenarioFrom(rowObj, sourceScenarioId, parts) {
  return withLock_(function () {
    var saved = saveScenario(rowObj);
    if (sourceScenarioId) {
      copyScenarioData(sourceScenarioId, saved.ScenarioID, parts);
    }
    return saved;
  });
}

// ---- SalesMix ----
function getSalesMix(scenarioId) {
  var rows = sheetToObjects_(SHEETS.SALES_MIX) || [];
  return scenarioId ? rows.filter(function (r) { return r.ScenarioID === scenarioId; }) : rows;
}
function saveSalesMixRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.SALES_MIX, 'RowID', rowObj); });
}
function deleteSalesMixRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.SALES_MIX, 'RowID', rowId); });
}

/**
 * 銷售構成表格：一定會依「車系設定」把該車型底下每個車系各列一列，
 * 已存在的 SalesMix 資料合併進去，沒有的就是空白列，使用者不需要自己一列一列新增。
 */
function getSalesMixGrid(scenarioId, vehicleTypeId) {
  var existing = getSalesMix(scenarioId);
  var rows = getVehicles(vehicleTypeId).map(function (v) {
    var row = existing.filter(function (r) { return r.VehicleID === v.VehicleID; })[0] || {};
    return {
      VehicleID: v.VehicleID,
      VehicleCode: v.VehicleCode || '',
      RowID: row.RowID || '',
      SalesMixPct: row.SalesMixPct === undefined || row.SalesMixPct === '' ? '' : toNumber_(row.SalesMixPct),
      MonthlyVolume: row.MonthlyVolume === undefined || row.MonthlyVolume === '' ? '' : toNumber_(row.MonthlyVolume),
      LifeCycleYears: row.LifeCycleYears === undefined || row.LifeCycleYears === '' ? '' : toNumber_(row.LifeCycleYears),
      ListPriceTaxIncl: row.ListPriceTaxIncl === undefined || row.ListPriceTaxIncl === '' ? '' : toNumber_(row.ListPriceTaxIncl),
      MandatoryAccessoryPrice: row.MandatoryAccessoryPrice === undefined || row.MandatoryAccessoryPrice === '' ? '' : toNumber_(row.MandatoryAccessoryPrice),
      ScrapFee: row.ScrapFee === undefined || row.ScrapFee === '' ? '' : toNumber_(row.ScrapFee),
      ScrapFeeTaxStatus: row.ScrapFeeTaxStatus || '含稅',
      HorizontalPartsPriceAdj: row.HorizontalPartsPriceAdj === undefined || row.HorizontalPartsPriceAdj === '' ? '' : toNumber_(row.HorizontalPartsPriceAdj),
      Notes: row.Notes || ''
    };
  });
  return { rows: rows, scrapFeeTaxStatusOptions: SCRAP_FEE_TAX_STATUS };
}

/** 銷售構成整批儲存（表格一次送出，不必逐列存檔） */
function saveSalesMixGrid(scenarioId, vehicleTypeId, rows) {
  return withLock_(function () {
    var upserts = (rows || []).map(function (r) { r.ScenarioID = scenarioId; return r; });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', upserts, []);
    return getSalesMixGrid(scenarioId, vehicleTypeId);
  });
}

/**
 * 銷售構成雙向輸入(台數/百分比)：
 *   - recalcSalesMixPctByVolume：以目前各車系已填的「預估銷售台數(月)」，
 *     依佔比反推並回寫 SalesMixPct。
 *   - recalcSalesMixVolumeByPct：以使用者輸入的「情境總銷售台數(月)」為基準，
 *     依各車系已填的 SalesMixPct 反推並回寫 MonthlyVolume。
 * 同一情境下的所有 SalesMix 列即為同一車型底下的各車系構成。
 */
function recalcSalesMixPctByVolume(scenarioId) {
  return withLock_(function () {
    var rows = getSalesMix(scenarioId);
    var total = rows.reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0);
    rows.forEach(function (r) {
      // SalesMixPct 以百分比數值儲存(0~100)
      r.SalesMixPct = total > 0 ? toNumber_(r.MonthlyVolume) / total * 100 : 0;
    });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', rows, []);
    return getSalesMix(scenarioId);
  });
}
function recalcSalesMixVolumeByPct(scenarioId, totalMonthlyVolume) {
  return withLock_(function () {
    var rows = getSalesMix(scenarioId);
    var total = toNumber_(totalMonthlyVolume);
    rows.forEach(function (r) {
      r.MonthlyVolume = Math.round(toNumber_(r.SalesMixPct) / 100 * total);
    });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', rows, []);
    return getSalesMix(scenarioId);
  });
}

// ---- CostOfSales 銷貨成本（原材料成本頁；LP/KD 皆為成本項目，成本科目可自由增刪） ----
function getCostOfSales(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.COST_OF_SALES) || [];
  return rows.filter(function (r) {
    return (!scenarioId || r.ScenarioID === scenarioId) && (!vehicleId || r.VehicleID === vehicleId);
  });
}
function saveCostOfSalesRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.COST_OF_SALES, 'RowID', rowObj); });
}
function deleteCostOfSalesRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.COST_OF_SALES, 'RowID', rowId); });
}

/* ------------------------------------------------------------------
 * 金額矩陣（列 = 科目、欄 = 車系）：銷貨成本與營業費用共用同一套邏輯，
 * 使用者在一張表格內把所有車系的金額一次填完、一次送出。
 * ---------------------------------------------------------------- */
function buildAmountMatrix_(sheetName, scenarioId, vehicleTypeId, lineOptions) {
  // 帶出各車系的銷售構成比：金額矩陣不顯示跨車系的「合計」(把不同車系的單台成本相加沒有意義)，
  // 改成用構成比加權的平均值，跟損益儀表板的加權平均欄位是同一個口徑。
  var mix = {};
  getSalesMix(scenarioId).forEach(function (r) { mix[r.VehicleID] = toNumber_(r.SalesMixPct); });
  var vehicles = getVehicles(vehicleTypeId).map(function (v) {
    return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '', SalesMixPct: mix[v.VehicleID] || 0 };
  });
  var rows = (sheetToObjects_(sheetName) || []).filter(function (r) { return r.ScenarioID === scenarioId; });

  var values = {};   // values[LineCode][VehicleID] = { RowID, Amount, Currency, Notes }
  rows.forEach(function (r) {
    if (!r.LineCode) return;
    if (!values[r.LineCode]) values[r.LineCode] = {};
    values[r.LineCode][r.VehicleID] = {
      RowID: r.RowID,
      Amount: r.Amount === '' || r.Amount === undefined ? '' : toNumber_(r.Amount),
      Currency: r.Currency || BASE_CURRENCY,
      Notes: r.Notes || ''
    };
  });

  return { lines: lineOptions, vehicles: vehicles, values: values };
}

/**
 * 矩陣頁面一次存檔動輒十幾個科目 × 好幾個車系，逐格呼叫 upsertRow_/deleteRow_ 會讓
 * 一次存檔打出幾百次 Sheets API 呼叫(每格各自掃 PK 欄、讀寫格式、寫入、寫稽核)，
 * 是存檔感覺卡的主因。改成先分類成「這一批要新增/更新的列」跟「要刪除的 RowID」，
 * 一次交給 batchWriteRows_ 整段讀一次、整段寫一次（見該函式的說明）。
 */
function saveAmountMatrix_(sheetName, scenarioId, cells) {
  return withLock_(function () {
    var upserts = [], deletePks = [];
    (cells || []).forEach(function (c) {
      var isEmpty = c.Amount === '' || c.Amount === null || c.Amount === undefined;
      if (isEmpty && !c.Notes) {
        // 清空的格子代表這個科目在這個車系沒有金額：有舊資料就刪掉，避免殘留
        if (c.RowID) deletePks.push(c.RowID);
        return;
      }
      c.ScenarioID = scenarioId;
      upserts.push(c);
    });
    batchWriteRows_(sheetName, 'RowID', upserts, deletePks);
    return true;
  });
}

/**
 * 銷貨成本矩陣：列 = 成本項目、欄 = 車系。
 * autoLines 是唯讀的自動計算科目(b5/b8/b13...)，讓這頁能看到 B 銷貨成本的全貌，
 * 不必再跑去儀表板才看得到模具/設備攤提與貨物稅算出多少。
 */
function getCostOfSalesMatrix(scenarioId, vehicleTypeId) {
  var matrix = buildAmountMatrix_(SHEETS.COST_OF_SALES, scenarioId, vehicleTypeId, getCostOfSalesLineOptions());
  matrix.currencies = getConfiguredCurrencies(scenarioId);
  var auto = getCostOfSalesAutoLines(scenarioId, matrix.vehicles);
  matrix.autoLines = auto.lines;
  matrix.autoValues = auto.values;
  matrix.commodityTaxDetail = auto.commodityTaxDetail || {};
  return matrix;
}
function saveCostOfSalesMatrix(scenarioId, cells) {
  return saveAmountMatrix_(SHEETS.COST_OF_SALES, scenarioId, cells);
}

/** 營業費用矩陣：列 = 科目、欄 = 車系。autoLines 同上，含季Margin、開發總投攤提的費用類科目 */
function getOperatingExpenseMatrix(scenarioId, vehicleTypeId) {
  var matrix = buildAmountMatrix_(SHEETS.OPERATING_EXPENSE, scenarioId, vehicleTypeId, getOperatingExpenseLineOptions());
  var auto = getOperatingExpenseAutoLines(scenarioId, matrix.vehicles);
  matrix.autoLines = auto.lines;
  matrix.autoValues = auto.values;
  return matrix;
}
function saveOperatingExpenseMatrix(scenarioId, cells) {
  return saveAmountMatrix_(SHEETS.OPERATING_EXPENSE, scenarioId, cells);
}

/**
 * 在銷貨成本／營業費用頁面直接新增科目（不必跑去「科目設定」頁）。
 * parentLine 決定這個科目屬於哪一段損益：B = 銷貨成本、E/G/I = 各段費用。
 * LineCode 自動產生（父科目字首 + 流水號），使用者只需要填科目名稱。
 */
function addLineItemInline(parentLine, lineName) {
  return withLock_(function () {
    if (!lineName) throw new Error('請輸入科目名稱');
    return upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineCode', newLineItemRow_(parentLine, lineName));
  });
}

/**
 * 產生一筆新科目（代碼與排序值都由系統決定，使用者只選父科目、填名稱）。
 * 呼叫端必須已經在 withLock_ 內，否則兩個同時新增的科目有機會拿到同一個代碼。
 */
function newLineItemRow_(parentLine, lineName) {
  return {
    LineCode: nextLineCode_(parentLine),
    LineName: lineName,
    ParentLine: parentLine,
    Category: parentLine === 'B' ? '成本明細' : '費用明細',
    SortOrder: nextSortOrder_(parentLine),
    AutoSource: ''
  };
}

/** 下一個可用的科目代碼：父科目字首 + 最小未使用號碼(b1、b2、d1...) */
function nextLineCode_(parentLine) {
  var prefix = LINE_CODE_PREFIX[parentLine];
  if (!prefix) throw new Error('父科目不正確：' + (parentLine || '(未選擇)'));
  var used = {};
  getPLLineItems().forEach(function (d) { used[d.LineCode] = true; });
  var n = 1;
  while (used[prefix + n]) n++;
  return prefix + n;
}

/** 新科目排在同一段的最後面(+0.5)，之後可在科目設定頁直接改排序值微調 */
function nextSortOrder_(parentLine) {
  var maxSort = 0;
  getPLLineItems().forEach(function (d) {
    if (d.ParentLine === parentLine) maxSort = Math.max(maxSort, toNumber_(d.SortOrder));
  });
  return (maxSort || 20) + 0.5;
}

/**
 * 刪除科目，並清掉該科目在「所有情境」已輸入的金額。
 * 科目表是全域的，只清當前情境會讓其他情境留下孤兒金額，
 * 那些金額不會顯示在任何頁面上，卻仍被計入銷貨成本，最難察覺。
 */
function deleteLineItemInline(lineCode) {
  return withLock_(function () {
    [SHEETS.COST_OF_SALES, SHEETS.OPERATING_EXPENSE].forEach(function (sheetName) {
      (sheetToObjects_(sheetName) || []).forEach(function (r) {
        if (r.LineCode === lineCode) deleteRow_(sheetName, 'RowID', r.RowID);
      });
    });
    return deletePLLineItem(lineCode);
  });
}

// ---- DevInvestment ----

/**
 * 一列開發總投要攤提到哪個損益科目：直接看 TargetLineCode（使用者在「開發總投」頁面自選）。
 * 舊資料(改版前建立、還沒有 TargetLineCode)才會走下面的相容判斷：
 * 舊資產類型直接查對照表；更舊的「費用」單一類型則靠 Department 是否等於 'BASE廠開發費' 判斷。
 */
function devAmortTargetOf_(row) {
  if (row.TargetLineCode) return row.TargetLineCode;
  var type = row.AssetType;
  if (type === DEV_ASSET_TYPE_LEGACY_EXPENSE) {
    return row.Department === DEV_INVESTMENT_BASE_FACTORY_DEPT ? 'f4' : 'f3';
  }
  return DEV_ASSET_TYPE_TARGET[type] || '';
}

/**
 * 開發總投「攤提落點」下拉選項：所有 AutoSource 屬於 DEV_AMORT_AUTO_SOURCES 的科目，
 * 含內建 4 個(b5/b8/f3/f4)與使用者自己新增的攤提落點科目。只給名稱、不帶科目代碼
 * （代碼對使用者選擇攤提落點沒有幫助，畫面只需要看得懂科目名稱）。
 * 每個選項都帶 category(設備/模具/費用)，前端先選大類、再從選中的大類裡選實際落點，
 * 避免自己新增的攤提落點越加越多之後，整個下拉選單混在一起不好找。
 */
function getDevAmortTargetOptions() {
  return getPLLineItems()
    .filter(function (d) { return DEV_AMORT_AUTO_SOURCES.indexOf(d.AutoSource) !== -1; })
    .map(function (d) {
      return { value: d.LineCode, label: d.LineName, parentLine: d.ParentLine, category: d.DevAmortCategory || '' };
    });
}

/**
 * 在「開發總投」頁面直接新增一個攤提落點科目（不必跑去「科目設定」頁），流程是先選部門、
 * 再選這筆投資屬於「設備/模具/費用」哪一大類、再選（或新增）實際攤提落點。
 * 大類直接決定父科目(設備/模具 -> B 銷貨成本，費用 -> G 產品貢獻前費用，跟內建的 b5/b8/f3/f4 一致)，
 * 新科目一律標記 AutoSource=DEV_AMORT，之後不會出現在「銷貨成本」「營業費用」的手動輸入選單裡，
 * 避免跟開發總投攤提的金額重複計列。
 */
function addDevAmortLineItem(category, lineName) {
  return withLock_(function () {
    if (!lineName) throw new Error('請輸入科目名稱');
    var parentLine = DEV_AMORT_CATEGORY_PARENT[category];
    if (!parentLine) throw new Error('大類不正確：' + (category || '(未選擇)'));
    var row = newLineItemRow_(parentLine, lineName);
    row.AutoSource = AUTO_SOURCE.DEV_AMORT;
    row.DevAmortCategory = category;
    return upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineCode', row);
  });
}

function getDevInvestment(scenarioId) {
  var rows = sheetToObjects_(SHEETS.DEV_INVESTMENT) || [];
  return scenarioId ? rows.filter(function (r) { return r.ScenarioID === scenarioId; }) : rows;
}
function saveDevInvestmentRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.DEV_INVESTMENT, 'RowID', rowObj); });
}
function deleteDevInvestmentRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.DEV_INVESTMENT, 'RowID', rowId); });
}
/**
 * 開發總投整批儲存（表格一次送出）；空白列(沒部門也沒金額)會被刪除。
 * 部門列的順序使用者可以在畫面上用上下移動鈕調整，這裡依送出時的陣列順序重新編號 SortOrder，
 * 讓 getDevInvestmentSummary 下次讀出來的順序跟畫面上調整過的一致（不是 Sheet 裡原本的列順序）。
 */
function saveDevInvestmentGrid(scenarioId, rows) {
  return withLock_(function () {
    var order = 0;
    var upserts = [], deletePks = [];
    (rows || []).forEach(function (r) {
      var isEmpty = !r.Department && (r.Amount === '' || r.Amount === null || r.Amount === undefined);
      if (isEmpty) {
        if (r.RowID) deletePks.push(r.RowID);
        return;
      }
      // 沒選攤提落點的列不會被攤提到任何科目，金額等於憑空消失，所以直接擋下來
      if (toNumber_(r.Amount) && !devAmortTargetOf_(r)) {
        throw new Error('「' + (r.Department || '未命名部門') + '」有金額但沒有選攤提落點，請選擇這筆投資要攤到哪個損益科目。');
      }
      r.ScenarioID = scenarioId;
      r.SortOrder = order++;
      upserts.push(r);
    });
    batchWriteRows_(SHEETS.DEV_INVESTMENT, 'RowID', upserts, deletePks);
    return getDevInvestmentSummary(scenarioId);
  });
}

/**
 * 目標情境用：從另一個情境把資料整批帶入後再調整低減目標。
 * 只覆蓋所選的資料類別，帶入前會先清掉目標情境同類別的既有資料。
 * 帶入的開發總投列，其挑戰低減目標一律歸零，由使用者自己填新的目標值。
 */
function copyScenarioData(sourceScenarioId, targetScenarioId, parts) {
  return withLock_(function () {
    if (!sourceScenarioId || !targetScenarioId) throw new Error('請選擇來源情境與目標情境');
    if (sourceScenarioId === targetScenarioId) throw new Error('來源情境與目標情境不能相同');
    // 銷售構成/成本/費用都是以 VehicleID(車系) 為鍵，跨車型帶入會把來源車型的車系搬進來，
    // 在目標車型的頁面上完全看不到那些列，卻仍被計入損益 —— 直接擋掉。
    var allScenarios = getScenarios();
    var findScenario = function (id) {
      return allScenarios.filter(function (s) { return s.ScenarioID === id; })[0];
    };
    var source = findScenario(sourceScenarioId);
    var target = findScenario(targetScenarioId);
    if (!source) throw new Error('找不到來源情境：' + sourceScenarioId);
    if (!target) throw new Error('找不到目標情境：' + targetScenarioId);
    if (source.VehicleTypeID !== target.VehicleTypeID) {
      throw new Error('只能從同一個車型底下的情境帶入（來源為 ' + (source.VehicleTypeID || '(未設定)') +
        '，目標為 ' + (target.VehicleTypeID || '(未設定)') + '）。');
    }
    parts = parts && parts.length ? parts : ['salesmix', 'costofsales', 'devinvestment', 'operatingexpense', 'parameters'];

    var map = {
      salesmix: SHEETS.SALES_MIX,
      costofsales: SHEETS.COST_OF_SALES,
      devinvestment: SHEETS.DEV_INVESTMENT,
      operatingexpense: SHEETS.OPERATING_EXPENSE,
      parameters: SHEETS.PARAMETERS
    };
    var pkOf = function (sheetName) { return sheetName === SHEETS.PARAMETERS ? 'ParamID' : 'RowID'; };
    var copied = {};

    parts.forEach(function (part) {
      var sheetName = map[part];
      if (!sheetName) return;
      var pk = pkOf(sheetName);
      var all = sheetToObjects_(sheetName) || [];

      var deletePks = all.filter(function (r) { return r.ScenarioID === targetScenarioId; })
        .map(function (r) { return r[pk]; });

      var sourceRows = all.filter(function (r) { return r.ScenarioID === sourceScenarioId; });
      var upserts = sourceRows.map(function (r) {
        var copy = {};
        SCHEMA[sheetName].forEach(function (h) { copy[h] = r[h]; });
        copy[pk] = '';                       // 產生新的鍵值，不要蓋到來源列
        copy.ScenarioID = targetScenarioId;
        if (sheetName === SHEETS.DEV_INVESTMENT) {
          // 低減目標屬於目標情境自己的假設，帶入後歸零讓使用者重新填
          copy.ChallengeReductionPct = '';
          // 舊資料只有 AssetType、沒有 TargetLineCode 的列，平常是靠畫面顯示時(devAmortTargetOf_)
          // 即時解析成攤提落點，使用者存檔那一刻才會真的寫回 Sheet —— 但帶入是直接複製原始列，
          // 不會經過那次存檔，複製過去的仍是「TargetLineCode 空白」的舊格式列。
          // 這裡直接把解析結果寫實，帶過去的列一律是已正規化的 TargetLineCode，
          // 不必等使用者手動按一次儲存才補上，也不會因為漏了這一步而在畫面上顯示「(請選擇)」。
          copy.TargetLineCode = devAmortTargetOf_(r);
        }
        return copy;
      });
      // 同一張表裡先刪目標情境的舊資料、再整批貼上來源情境的複本，一次(讀+寫)搞定，
      // 不是「先逐列刪、再逐列新增」— 情境資料多的話(開發總投/銷貨成本常常十幾二十列)
      // 逐列處理會是最容易卡住的一步。
      batchWriteRows_(sheetName, pk, upserts, deletePks);
      copied[part] = sourceRows.length;
    });

    return copied;
  });
}

/**
 * 開發總投的攤提基準台數（存在情境上）。
 * 實務上開發投資的攤提基準台數常與銷售構成的預估台數不同
 * （例如銷售估 365 台/月，但開發投資以 300 台/月 × 12 年攤提），所以獨立設定；
 * 留空就自動改用銷售構成推算的 LIFE CYCLE 總台數。
 */
function saveAmortBasis(scenarioId, monthlyVolume, lifeCycleYears) {
  return withLock_(function () {
    var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
    if (!scenario) throw new Error('找不到情境：' + scenarioId);
    scenario.AmortMonthlyVolume = monthlyVolume === '' || monthlyVolume === null ? '' : toNumber_(monthlyVolume);
    scenario.AmortLifeCycleYears = lifeCycleYears === '' || lifeCycleYears === null ? '' : toNumber_(lifeCycleYears);
    upsertRow_(SHEETS.SCENARIOS, 'ScenarioID', scenario);
    return getDevInvestmentSummary(scenarioId);
  });
}

/** 部門清單允許自由新增：回傳目前已出現過的部門，前端用來做輸入建議(datalist)，非強制下拉 */
function getKnownDepartments() {
  var rows = sheetToObjects_(SHEETS.DEV_INVESTMENT) || [];
  var set = {};
  rows.forEach(function (r) { if (r.Department) set[r.Department] = true; });
  return Object.keys(set);
}

// ---- OperatingExpense ----
function getOperatingExpense(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.OPERATING_EXPENSE) || [];
  return rows.filter(function (r) {
    return (!scenarioId || r.ScenarioID === scenarioId) && (!vehicleId || r.VehicleID === vehicleId);
  });
}
function saveOperatingExpenseRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.OPERATING_EXPENSE, 'RowID', rowObj); });
}
function deleteOperatingExpenseRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.OPERATING_EXPENSE, 'RowID', rowId); });
}

// ---- Parameters ----
function getParameters(scenarioId) {
  var rows = sheetToObjects_(SHEETS.PARAMETERS) || [];
  return scenarioId ? rows.filter(function (r) { return !r.ScenarioID || r.ScenarioID === scenarioId; }) : rows;
}
function saveParameterRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.PARAMETERS, 'ParamID', rowObj); });
}
function deleteParameterRow(paramId) {
  return withLock_(function () { return deleteRow_(SHEETS.PARAMETERS, 'ParamID', paramId); });
}

// 「參數設定」頁面拆成兩組管理：稅務/費用比率 vs 匯率設定，各自獨立的分頁籤與表格，
// 底層仍寫入同一張 Parameters 分頁，只是依 ParamName 篩選讀取範圍。
function getTaxRateParameters(scenarioId) {
  return getParameters(scenarioId).filter(function (p) { return TAX_RATE_PARAM_NAMES.indexOf(p.ParamName) !== -1; });
}
function getFxParameters(scenarioId) {
  return getParameters(scenarioId).filter(function (p) { return FX_PARAM_NAMES.indexOf(p.ParamName) !== -1; });
}

/**
 * 稅務/費用比率表格：同一車型各車系的費率大多相同，所以預設只填「全車系適用」那一列，
 * 各車系留白就自動沿用全車系值；只有真的不同的車系才需要填覆寫值。
 * 沒設定過的比率會帶入系統預設值(DEFAULT_PARAMS)，直接按儲存即可。
 */
function getRateGrid(scenarioId, vehicleTypeId) {
  var params = getTaxRateParameters(scenarioId).filter(function (p) { return p.ScenarioID === scenarioId; });
  var vehicles = getVehicles(vehicleTypeId).map(function (v) {
    return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' };
  });

  var find = function (name, vehicleId) {
    return params.filter(function (p) {
      return p.ParamName === name && (p.VehicleID || '') === (vehicleId || '');
    })[0];
  };

  var rates = TAX_RATE_PARAM_NAMES.map(function (name) {
    var global = find(name, '');
    var overrides = {};
    vehicles.forEach(function (v) {
      var row = find(name, v.VehicleID);
      overrides[v.VehicleID] = row ? { ParamID: row.ParamID, Value: toNumber_(row.Value) } : { ParamID: '', Value: '' };
    });
    return {
      ParamName: name,
      globalParamID: global ? global.ParamID : '',
      // 沒設定過就帶系統預設值，使用者確認後按儲存即可，不必每次自己查稅率
      globalValue: global ? toNumber_(global.Value) : (DEFAULT_PARAMS[name] !== undefined ? DEFAULT_PARAMS[name] : ''),
      isDefault: !global,
      overrides: overrides
    };
  });

  return { vehicles: vehicles, rates: rates };
}

/** 稅務/費用比率整批儲存：留白的車系覆寫值代表沿用全車系值，會刪掉舊的覆寫列 */
function saveRateGrid(scenarioId, rows) {
  return withLock_(function () {
    var upserts = [], deletePks = [];
    (rows || []).forEach(function (r) {
      var isEmpty = r.Value === '' || r.Value === null || r.Value === undefined;
      if (isEmpty) {
        if (r.ParamID) deletePks.push(r.ParamID);
        return;
      }
      upserts.push({
        ParamID: r.ParamID || '',
        ScenarioID: scenarioId,
        VehicleID: r.VehicleID || '',
        ParamName: r.ParamName,
        Currency: '',
        Value: r.Value,
        EffectiveDate: r.EffectiveDate || ''
      });
    });
    batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', upserts, deletePks);
    return true;
  });
}

/**
 * 匯率設定表格：以幣別管理，1 外幣 = Value 台幣。
 * 只有一種匯率(現況匯率)，銷貨成本與開發總投的外幣金額都用它換算；
 * 銷貨成本頁的幣別選單就是這裡設定過匯率的幣別。
 */
function getFxGrid(scenarioId) {
  var params = getFxParameters(scenarioId).filter(function (p) { return p.ScenarioID === scenarioId; });
  var currencies = {};
  params.forEach(function (p) { if (p.Currency) currencies[p.Currency] = true; });
  DEFAULT_FX_CURRENCIES.forEach(function (c) { currencies[c] = true; });

  var rows = Object.keys(currencies).sort().map(function (currency) {
    var cells = {};
    FX_PARAM_NAMES.forEach(function (name) {
      var row = params.filter(function (p) { return p.ParamName === name && p.Currency === currency; })[0];
      cells[name] = row ? { ParamID: row.ParamID, Value: toNumber_(row.Value) } : { ParamID: '', Value: '' };
    });
    return { Currency: currency, cells: cells };
  });

  return { baseCurrency: BASE_CURRENCY, paramNames: FX_PARAM_NAMES, rows: rows };
}

/** 匯率整批儲存；留白代表未設定該幣別的匯率，會刪掉舊資料 */
function saveFxGrid(scenarioId, cells) {
  return withLock_(function () {
    var upserts = [], deletePks = [];
    (cells || []).forEach(function (c) {
      var isEmpty = c.Value === '' || c.Value === null || c.Value === undefined;
      if (isEmpty) {
        if (c.ParamID) deletePks.push(c.ParamID);
        return;
      }
      if (!c.Currency) throw new Error('請選擇幣別');
      upserts.push({
        ParamID: c.ParamID || '',
        ScenarioID: scenarioId,
        VehicleID: '',
        ParamName: c.ParamName,
        Currency: c.Currency,
        Value: c.Value,
        EffectiveDate: ''
      });
    });
    batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', upserts, deletePks);
    return getFxGrid(scenarioId);
  });
}

/** 銷貨成本幣別選單：本位幣 + 匯率設定頁已經設定過匯率的幣別 */
function getConfiguredCurrencies(scenarioId) {
  var list = [BASE_CURRENCY];
  getFxParameters(scenarioId).forEach(function (p) {
    if (p.Currency && p.ParamName === COST_FX_PARAM_NAME && toNumber_(p.Value) && list.indexOf(p.Currency) === -1) {
      list.push(p.Currency);
    }
  });
  return list;
}

/** 依 ParamName(+可選VehicleID) 查值，找不到就用 DEFAULT_PARAMS，最後 fallback 0 */
function lookupParam_(paramsForScenario, paramName, vehicleId) {
  var match = paramsForScenario.filter(function (p) {
    return p.ParamName === paramName && (!p.VehicleID || p.VehicleID === vehicleId);
  });
  // 有指定車型的參數優先於全域參數
  var specific = match.filter(function (p) { return p.VehicleID === vehicleId; });
  var picked = specific.length ? specific[0] : match[0];
  if (picked) return toNumber_(picked.Value);
  return DEFAULT_PARAMS[paramName] !== undefined ? DEFAULT_PARAMS[paramName] : 0;
}

// ---- PLLineItems 科目設定（明細科目可自由新增/刪除） ----

/**
 * 把「由程式定義」的科目名稱與位置對回程式碼。
 *
 * 有兩類科目的名稱不屬於使用者：
 *   - 自動計算科目(AutoSource 有值)：金額是公式算出來的，名稱寫的就是那條公式
 *   - 結構科目(A/B/C/E/G/I/K)：名稱寫的是它跟哪些明細的加總關係
 * 這兩類一旦跟程式對不起來，畫面上就會出現「欄位寫廢車處理費、數字卻是強配件售價」——
 * 舊版的售價結構只有 8 列(P2 是廢車處理費)，改版重新編號成 9 列之後，
 * seedPLLineItems_() 又刻意不覆蓋既有科目(使用者可能自己改過名稱)，
 * 於是新代碼配著舊名稱一直留在 Sheet 上。名稱是描述公式的，就該由公式那一邊決定。
 *
 * 明細科目(b1/d1/f1/h1...)的名稱與排序仍然屬於使用者，這裡完全不動 ——
 * 要整個回復成內建預設值請用 restoreBuiltInLineItems()。
 */
function syncCodeOwnedLineItems_() {
  var existing = {};
  getPLLineItems().forEach(function (d) { existing[d.LineCode] = d; });

  var fixed = [];
  PL_LINE_ITEMS.forEach(function (line) {
    var isCodeOwned = line.AutoSource || PROTECTED_LINE_CODES.indexOf(line.LineCode) !== -1;
    if (!isCodeOwned) return;
    var current = existing[line.LineCode];
    if (!current) return;                       // 還沒建立的科目交給 seedPLLineItems_() 補
    var same = function (field) {
      var a = current[field] === undefined || current[field] === null ? '' : current[field];
      var b = line[field] === undefined || line[field] === null ? '' : line[field];
      return String(a) === String(b);
    };
    if (['LineName', 'ParentLine', 'Category', 'SortOrder', 'DevAmortCategory'].every(same)) return;

    var row = {};
    SCHEMA.PLLineItems.forEach(function (h) {
      row[h] = line[h] !== undefined ? line[h] : (current[h] !== undefined ? current[h] : '');
    });
    upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineCode', row);
    fixed.push(line.LineCode);
  });
  return fixed;
}

/**
 * 把所有內建科目(含明細科目)的名稱、父科目、分類、排序值整個回復成程式碼中的預設值。
 * 使用者自己新增的科目不受影響。排序值會一併回到實際損益試算表的列序。
 */
function restoreBuiltInLineItems() {
  return withLock_(function () {
    var upserts = PL_LINE_ITEMS.map(function (line) {
      var row = {};
      SCHEMA.PLLineItems.forEach(function (h) { row[h] = line[h] !== undefined ? line[h] : ''; });
      return row;
    });
    batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineCode', upserts, []);
    return getPLLineItems();
  });
}

function getPLLineItems() {
  return (sheetToObjects_(SHEETS.PL_LINE_ITEMS) || []).sort(function (a, b) { return a.SortOrder - b.SortOrder; });
}
function savePLLineItem(rowObj) {
  return withLock_(function () { return savePLLineItem_(rowObj); });
}

/**
 * 儲存一筆科目。沒有帶 LineCode 就視為新增，代碼與排序值由系統產生
 * （使用者只選父科目、填名稱，不必自己編碼，也不會跟既有科目撞號）。
 * 呼叫端必須已經在 withLock_ 內。
 */
function savePLLineItem_(rowObj) {
  if (!rowObj.LineName) throw new Error('科目名稱為必填');

  if (!rowObj.LineCode) {
    var created = newLineItemRow_(rowObj.ParentLine, rowObj.LineName);
    // 使用者若在新增列自己填了分類/排序值就尊重他的值，其餘沿用系統產生的預設
    if (rowObj.Category) created.Category = rowObj.Category;
    if (rowObj.SortOrder !== '' && rowObj.SortOrder !== undefined && rowObj.SortOrder !== null) {
      created.SortOrder = toNumber_(rowObj.SortOrder);
    }
    return upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineCode', created);
  }

  var existing = getPLLineItems().filter(function (d) { return d.LineCode === rowObj.LineCode; })[0];
  // 自動計算科目由 CalcEngine 產生，使用者新增的科目一律是手動輸入科目；
  // CommodityTaxDeduct(貨物稅完稅價格可扣除)等表單沒有的欄位由合併式 upsert 保留原值
  rowObj.AutoSource = existing ? (existing.AutoSource || '') : '';
  // 結構科目(A/B/C/E/G/I/K)與自動計算科目改掉父科目會讓損益鏈接錯段，一律沿用原值
  if (existing && (PROTECTED_LINE_CODES.indexOf(rowObj.LineCode) !== -1 || existing.AutoSource)) {
    rowObj.ParentLine = existing.ParentLine || '';
  }
  return upsertRowMerge_(SHEETS.PL_LINE_ITEMS, 'LineCode', rowObj);
}

/**
 * 科目設定整批儲存：整張表直接編輯、按一次儲存。
 * 沒有 LineCode 的列就是新增列，代碼由系統自動產生。
 *
 * 新增列跟既有列分兩段處理，不是圖方便，是新增列的代碼分配(nextLineCode_)必須看到
 * 「這一批已經配過的代碼」才不會撞號：同一批新增兩個科目，兩個都呼叫一次
 * nextLineCode_() 的話，沒看到前一個剛配好的代碼就會拿到同一組代碼。
 * 逐列呼叫 savePLLineItem_()／upsertRow_() 會在寫入後清快取，下一列重新讀最新代碼
 * 清單，天然沒有這個問題；新增列一次通常只有幾筆，逐列處理的成本可以忽略。
 * 既有列的代碼已經固定、不會撞號，這段才整批一次寫回。
 */
function savePLLineItemGrid(rows) {
  return withLock_(function () {
    var newRows = [], existingRows = [];
    (rows || []).forEach(function (r) {
      // 完全空白的新增列直接跳過，使用者按了「新增一列」又沒填東西不該報錯
      if (!r.LineCode && !r.LineName) return;
      (r.LineCode ? existingRows : newRows).push(r);
    });

    newRows.forEach(function (r) { savePLLineItem_(r); });

    if (existingRows.length) {
      var byCode = indexByPk_(getPLLineItems(), 'LineCode');
      var upserts = existingRows.map(function (r) {
        if (!r.LineName) throw new Error('科目名稱為必填');
        var existing = byCode[r.LineCode];
        // 自動計算科目由 CalcEngine 產生，使用者新增的科目一律是手動輸入科目；
        // CommodityTaxDeduct(貨物稅完稅價格可扣除)等表單沒有的欄位由合併補齊、保留原值
        r.AutoSource = existing ? (existing.AutoSource || '') : '';
        // 結構科目(A/B/C/E/G/I/K)與自動計算科目改掉父科目會讓損益鏈接錯段，一律沿用原值
        if (existing && (PROTECTED_LINE_CODES.indexOf(r.LineCode) !== -1 || existing.AutoSource)) {
          r.ParentLine = existing.ParentLine || '';
        }
        return mergeRowForBatch_(SHEETS.PL_LINE_ITEMS, 'LineCode', r, byCode);
      });
      batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineCode', upserts, []);
    }
    return getPLLineItems();
  });
}
function deletePLLineItem(lineCode) {
  return withLock_(function () {
    if (PROTECTED_LINE_CODES.indexOf(lineCode) !== -1) {
      throw new Error('「' + lineCode + '」是損益結構科目(小計/毛利/淨利)，刪除會讓損益鏈斷掉，不可刪除。');
    }
    var def = getPLLineItems().filter(function (d) { return d.LineCode === lineCode; })[0];
    if (def && def.AutoSource && def.AutoSource !== AUTO_SOURCE.DEV_AMORT) {
      throw new Error('「' + lineCode + ' ' + def.LineName + '」是自動計算科目，由比率設定或開發總投攤提產生，不可刪除。');
    }
    // DEV_AMORT 是使用者自己在「開發總投」頁面新增的攤提落點(非內建的模具/設備/CMC/BASE廠開發費四個)，
    // 使用者建的東西應該讓使用者刪得掉 —— 只要目前沒有任何情境的開發總投列還指到這裡就放行，
    // 否則那些列的金額會攤不到任何科目、憑空消失，所以先擋下來請使用者自己改選或刪除那些列。
    if (def && def.AutoSource === AUTO_SOURCE.DEV_AMORT) {
      var used = (sheetToObjects_(SHEETS.DEV_INVESTMENT) || []).filter(function (r) {
        return devAmortTargetOf_(r) === lineCode;
      });
      if (used.length) {
        throw new Error('「' + lineCode + ' ' + def.LineName + '」在「開發總投」還有 ' + used.length +
          ' 筆資料指到這個攤提落點，請先把那些列改選別的攤提落點或刪除，才能刪除這個科目。');
      }
    }
    return deleteRow_(SHEETS.PL_LINE_ITEMS, 'LineCode', lineCode);
  });
}

/**
 * 科目下拉選單選項：只回傳「可手動輸入」的明細科目(排除自動計算科目)，
 * 回傳 [{value, label}]，前端 renderForm 直接吃這個格式。
 */
function lineOptionsFor_(parentCodes, extraCodes) {
  var opts = getPLLineItems()
    .filter(function (d) {
      return !d.AutoSource &&
        (parentCodes.indexOf(d.ParentLine) !== -1 || (extraCodes || []).indexOf(d.LineCode) !== -1);
    })
    .map(function (d) { return { value: d.LineCode, label: d.LineCode + ' ' + d.LineName }; });
  return opts;
}
/** 銷貨成本頁的成本項目選單（B 底下、可手動輸入的科目） */
function getCostOfSalesLineOptions() {
  return lineOptionsFor_(['B']);
}
/** 營業費用頁的科目選單（E/G/I 底下可手動輸入的科目，外加 J 前瞻費用） */
function getOperatingExpenseLineOptions() {
  return lineOptionsFor_(['E', 'G', 'I'], ['J']);
}



// ===== src/CalcEngine.gs =====
/**
 * 損益計算引擎：重現 Gate F 損益試算的公式鏈。
 *
 * 設計原則：
 *   - 凡是「可以由比率或其他頁面的數字算出來的科目，就不讓使用者手動輸入」，
 *     避免同一筆金額在兩個地方各填一次而對不起來。目前自動計算的科目為：
 *       P1~P9 售價結構(營業稅、銷售佣金、廠價...)：由 SalesMix 售價欄位 + 比率設定推算
 *       b5 模具費用 / b8 新增專屬設備：開發總投(模具/設備)低減後金額 ÷ LIFE CYCLE 總台數
 *       b13 貨物稅：(廠價 - 水平配件外移調降 - 廣促margin) × 完稅價格計算率 ÷ (1+貨物稅率) × 貨物稅率
 *       d4 季Margin：廠價(未稅) × 季Margin率
 *       f3/f4 車型專案開發費用：開發總投(費用類) 低減後金額 ÷ LIFE CYCLE 總台數
 *   - 所有比率參數以百分比數值儲存(5 = 5%)，取用時一律經過 pct_() 轉成小數。
 *   - 外幣的銷貨成本用「匯率設定」頁的現況匯率換算，不在成本列上逐筆填匯率。
 */

/** 百分比數值(0~100) -> 小數 */
function pct_(v) {
  return toNumber_(v) / 100;
}

/**
 * 取某幣別換算台幣的匯率(1 外幣 = ? 台幣)。
 * 本位幣或沒設定匯率時回傳 1，讓金額原封不動帶入，不會因為忘了設匯率就被歸零。
 */
function fxRateFor_(params, currency, vehicleId) {
  if (!currency || currency === BASE_CURRENCY) return 1;
  var match = params.filter(function (p) {
    return p.ParamName === COST_FX_PARAM_NAME && p.Currency === currency &&
      (!p.VehicleID || p.VehicleID === vehicleId);
  });
  var specific = match.filter(function (p) { return p.VehicleID === vehicleId; });
  var picked = specific.length ? specific[0] : match[0];
  return picked ? (toNumber_(picked.Value) || 1) : 1;
}

/**
 * 貨物稅：完稅價格要先扣掉「水平配件外移調降廠價」與「廣促margin」，再乘上法定計算率、
 * 除以 (1+貨物稅率) 換算成完稅價格，最後乘貨物稅率。
 *   貨物稅 = (廠價 - 水平配件外移調降 - Σ(可扣除的d科目)) × 完稅價格計算率 ÷ (1+貨物稅率) × 貨物稅率
 * 哪些 d 科目可以扣除，由 PLLineItems 的 CommodityTaxDeduct 欄位決定(預設為廣宣/促銷/批標售/季Margin)。
 * 回傳完整的計算過程(不只是稅額)，讓「銷貨成本」頁可以把每一步都攤開顯示，
 * 使用者才看得到「廠價調整」實際上就是這些 d 科目扣除的加總，不是憑空跑出來的數字。
 */
function commodityTaxBreakdown_(exFactoryPrice, horizontalPartsAdj, dLines, taxRate, calcRate) {
  var deductCodes = commodityTaxDeductCodes_();
  var deduct = Object.keys(dLines).reduce(function (sum, code) {
    return sum + (deductCodes.indexOf(code) !== -1 ? dLines[code] : 0);
  }, 0);
  var adj = toNumber_(horizontalPartsAdj);
  var dutiableBase = (exFactoryPrice - adj - deduct) * (calcRate || 1);
  var tax = dutiableBase / (1 + taxRate) * taxRate;
  return {
    exFactoryPrice: exFactoryPrice, horizontalPartsAdj: adj, deductTotal: deduct,
    calcRate: calcRate || 1, taxRate: taxRate, dutiableBase: dutiableBase, tax: tax
  };
}

function commodityTaxDeductCodes_() {
  return getPLLineItems()
    .filter(function (d) { return String(d.CommodityTaxDeduct || '').toUpperCase() === 'Y'; })
    .map(function (d) { return d.LineCode; });
}

/**
 * 算損益並把結果寫回 PLResult 快照（快照給「損益儀表板」讀取用）。
 * 純計算(不寫入)請用 calculatePLCore_ —— 「銷貨成本」「營業費用」頁面只是想順便看一下
 * 自動計算科目算出多少，每次開頁就對每個車系都寫一次快照太浪費，之前也因此拖慢過整個
 * Script 的鎖定(LockService)，讓其他正在存檔的操作跟著逾時。
 */
function calculatePL(scenarioId, vehicleId) {
  var result = calculatePLCore_(scenarioId, vehicleId);
  var timestamp = new Date();
  writePLResult_(scenarioId, vehicleId, result.lineValues, result.revenue, result.exFactoryPrice, timestamp);
  return {
    scenarioId: result.scenarioId,
    vehicleId: result.vehicleId,
    calculatedAt: timestamp.toISOString(), // 巢狀 Date 物件會讓 google.script.run 整包回傳變 null，一律轉字串
    revenue: result.revenue,
    exFactoryPrice: result.exFactoryPrice,
    commodityTaxDetail: result.commodityTaxDetail,
    lines: result.lines
  };
}

/**
 * 純計算損益：不寫入 PLResult，只回傳算出來的結果。calculatePL() 在這之上加寫入快照。
 *
 * 同一次執行內以「情境|車系」為鍵記住結果：儀表板一次比較常常同時放「某情境的各車系」跟
 * 「同一情境的加權平均」，加權平均要把該情境每個車系都算一遍，等於每個車系被算了兩次；
 * 開發總投攤提、貨物稅等每一步也都要重新讀表過濾。記住之後每個(情境,車系)只算一次。
 * 任何寫入都會透過 invalidateSheetCache_ → resetExecutionCaches_ 清掉，不會讀到舊結果。
 */
var PL_CORE_MEMO_ = {};
function calculatePLCore_(scenarioId, vehicleId) {
  var key = String(scenarioId) + '|' + String(vehicleId);
  if (!PL_CORE_MEMO_[key]) PL_CORE_MEMO_[key] = calculatePLCoreUncached_(scenarioId, vehicleId);
  return PL_CORE_MEMO_[key];
}

function calculatePLCoreUncached_(scenarioId, vehicleId) {
  var salesMixRow = getSalesMix(scenarioId).filter(function (r) { return r.VehicleID === vehicleId; })[0];
  if (!salesMixRow) throw new Error('找不到 SalesMix 資料：' + scenarioId + ' / ' + vehicleId);

  var params = getParameters(scenarioId);
  var taxRate = pct_(lookupParam_(params, '營業稅率', vehicleId));
  var commissionRate = pct_(lookupParam_(params, '銷售佣金率', vehicleId));
  var marginRate = pct_(lookupParam_(params, '季Margin率', vehicleId));
  var commodityTaxRate = pct_(lookupParam_(params, '貨物稅率', vehicleId));

  // ---- 售價結構(P1~P9)：這一段以前只在程式裡算、儀表板看不到，現在逐列輸出 ----
  var listPrice = toNumber_(salesMixRow.ListPriceTaxIncl);                 // P1 建議零售價(含稅)
  var accessoryPrice = toNumber_(salesMixRow.MandatoryAccessoryPrice);     // P2 強配件售價
  var listPriceExAccessory = listPrice - accessoryPrice;                   // P3 建議零售價(不含強配,含稅)
  var scrapFeeRaw = toNumber_(salesMixRow.ScrapFee);
  // 廢車處理費可能用含稅或未稅金額登打，一律換算成含稅金額後再扣，
  // 確保跟 ListPriceTaxIncl(含稅零售價)口徑一致，全份損益試算稅別才不會混用。
  // 廢車處理費、營業稅、銷售佣金取到元(與 Gate F Excel 的 ROUND 一致)，避免對帳時出現角分差異
  var scrapFee = salesMixRow.ScrapFeeTaxStatus === '未稅'
    ? Math.round(scrapFeeRaw * (1 + taxRate)) : scrapFeeRaw;               // P4

  var actualRetailPrice = listPriceExAccessory - scrapFee;                 // P5 實際零售價(含稅)
  var salesTax = Math.round(actualRetailPrice * taxRate / (1 + taxRate));  // P6 營業稅(內含反推)
  var actualRetailPriceExTax = actualRetailPrice - salesTax;               // 實際零售價(未稅)
  var commission = Math.round(actualRetailPriceExTax * commissionRate);    // P7 銷售佣金(以未稅零售價為基礎)
  var exFactoryPrice = actualRetailPrice - salesTax - commission;          // P8 廠價(未稅)
  var accessoryRevenue = accessoryPrice / (1 + taxRate);                   // P9 強配收入(未稅)

  var revenueA = exFactoryPrice + accessoryRevenue;                        // A 收入(未稅,含強配)

  // ---- 開發總投攤提：每一列自選攤提落點科目，套到損益各段時依科目所屬的父科目分組 ----
  var devPerUnit = amortizeDevInvestmentPerUnit_(scenarioId);
  var lineDefsAll = getPLLineItems();

  // ---- Σd 銷售費用：貨物稅的完稅價格要扣廣促margin，所以 d 類要先算 ----
  var opexRows = getOperatingExpense(scenarioId, vehicleId);
  var dLines = pickLines_(opexRows, manualLineCodesFor_(['E']));
  dLines.d4 = exFactoryPrice * marginRate;                                 // 季Margin = 廠價(未稅) × 季Margin率
  applyDevAmortLines_(dLines, 'E', devPerUnit, lineDefsAll);
  var totalD = sumValues_(dLines);

  // ---- B 銷貨成本：手動輸入的成本列 + 自動計算的成本列 ----
  var costRows = getCostOfSales(scenarioId, vehicleId);
  var knownCodes = lineDefsAll.map(function (d) { return d.LineCode; });
  // 先把所有可手動輸入的成本科目都放進來(值 0)，沒填金額的科目才不會整列從儀表板消失 ——
  // 少了幾列的話，畫面上看到的 b 科目加起來會對不上 B 銷貨成本合計，看起來就像加總算錯。
  var bLines = {};
  manualLineCodesFor_(['B']).forEach(function (code) { bLines[code] = 0; });
  costRows.forEach(function (r) {
    var code = r.LineCode;
    // 科目已被刪除的殘留金額不計入，否則 B 會跟畫面上列出的 b 科目合計對不起來
    if (!code || knownCodes.indexOf(code) === -1) return;
    // 外幣成本用「匯率設定」頁該幣別的現況匯率換算，不在成本列逐筆填匯率
    bLines[code] = (bLines[code] || 0) + toNumber_(r.Amount) * fxRateFor_(params, r.Currency, vehicleId);
  });
  applyDevAmortLines_(bLines, 'B', devPerUnit, lineDefsAll);
  // 貨物稅完稅價格 = (廠價 - 水平配件外移調降 - 可扣除的d科目(廣宣/促銷/批標售/季Margin)) × 完稅價格計算率
  var commodityTaxBreakdown = commodityTaxBreakdown_(exFactoryPrice, toNumber_(salesMixRow.HorizontalPartsPriceAdj),
    dLines, commodityTaxRate, pct_(lookupParam_(params, '貨物稅完稅價格計算率', vehicleId)));
  bLines.b13 = commodityTaxBreakdown.tax;

  var totalB = sumValues_(bLines);
  var grossProfitC = revenueA - totalB;     // C 生產毛利
  var grossProfitE = grossProfitC - totalD; // E 銷貨毛利

  // ---- Σf 費用(f1 直接輸入 + 開發總投費用類攤提) ----
  var fLines = pickLines_(opexRows, manualLineCodesFor_(['G']));
  applyDevAmortLines_(fLines, 'G', devPerUnit, lineDefsAll);
  var totalF = sumValues_(fLines);
  var contributionG = grossProfitE - totalF; // G 產品貢獻

  // ---- Σh 固定營業費用 ----
  var hLines = pickLines_(opexRows, manualLineCodesFor_(['I']));
  applyDevAmortLines_(hLines, 'I', devPerUnit, lineDefsAll);
  var totalH = sumValues_(hLines);
  var operatingProfitI = contributionG - totalH; // I 營業淨利(未扣前瞻)

  var j = pickLines_(opexRows, ['J']).J || 0;
  var operatingProfitK = operatingProfitI - j; // K 營業淨利

  var lineValues = Object.assign(
    {
      P1: listPrice, P2: accessoryPrice, P3: listPriceExAccessory, P4: scrapFee,
      P5: actualRetailPrice, P6: salesTax, P7: commission, P8: exFactoryPrice, P9: accessoryRevenue,
      A: revenueA, B: totalB
    },
    bLines,
    { C: grossProfitC },
    dLines,
    { E: grossProfitE },
    fLines,
    { G: contributionG },
    hLines,
    { I: operatingProfitI, J: j, K: operatingProfitK }
  );

  return {
    scenarioId: scenarioId,
    vehicleId: vehicleId,
    revenue: revenueA,
    exFactoryPrice: exFactoryPrice,
    commodityTaxDetail: commodityTaxBreakdown,
    lineValues: lineValues,
    lines: buildResultLines_(lineValues, revenueA, exFactoryPrice)
  };
}

/**
 * 某情境(= 某車型)底下所有車系的損益，外加以銷售構成比加權的平均列。
 * 儀表板/比較欄位每次開頁、每切一次 % 基準、每加一欄比較都會呼叫到這裡 ——
 * 純粹是「看」，不是「存」，所以一律用不寫入快照的 calculatePLCore_()，
 * 不要每次都把整張 PLResult 表讀出來、清掉、再寫回去(見 writePLResult_ 的成本說明)。
 * 全系統目前也沒有任何地方會讀回 PLResult 快照(getPLResult() 沒有被呼叫)，
 * 寫這個快照對「看儀表板」這件事只有成本、沒有效益。
 */
function calculatePLAllVehicles(scenarioId) {
  var salesMix = getSalesMix(scenarioId);
  var results = salesMix.map(function (row) { return calculatePLCore_(scenarioId, row.VehicleID); });

  // 加權平均列（以 SalesMixPct 加權）
  var totalPct = salesMix.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0) || 1;
  var weighted = {};
  results.forEach(function (res, idx) {
    var pct = toNumber_(salesMix[idx].SalesMixPct) / totalPct;
    res.lines.forEach(function (line) {
      weighted[line.LineCode] = (weighted[line.LineCode] || 0) + line.Amount * pct;
    });
  });

  return {
    scenarioId: scenarioId,
    vehicles: results,
    weightedAverage: buildResultLines_(weighted, weighted.A || 0, weighted.P8 || 0)
  };
}

/** 單獨取某情境的加權平均損益（儀表板比較欄位用） */
function calculateScenarioWeighted(scenarioId) {
  return calculatePLAllVehicles(scenarioId).weightedAverage;
}

/**
 * 多車型/多情境比較：儀表板的核心 API。
 * selections = [{ ScenarioID, VehicleID }]，VehicleID 留空代表該情境的「加權平均」。
 *
 * 回傳的 lines 是所有欄位實際出現過科目的聯集(依 SortOrder 排序)，並且帶上 ParentLine，
 * 讓前端可以把明細科目縮排在它的小計底下 —— 這樣「哪幾列加起來等於哪一列」在畫面上是看得見的。
 * 某欄位沒有該科目時值為 null，前端顯示空白而不是 0。
 *
 * 每個欄位另外附一份 checks：把小計逐條重算一次(B=Σb、C=A-B、E=C-Σd...)，
 * 只有對不起來的才會出現在陣列裡，前端據此在畫面上示警，不用靠肉眼加總去發現錯誤。
 */
function calculateComparison(selections) {
  selections = selections || [];
  var vehicleTypes = getVehicleTypes();
  var scenarios = getScenarios();
  var vehicles = getVehicles();
  var lineDefs = getPLLineItems();

  var columns = selections.map(function (sel) {
    var scenario = scenarios.filter(function (s) { return s.ScenarioID === sel.ScenarioID; })[0] || {};
    var vehicle = vehicles.filter(function (v) { return v.VehicleID === sel.VehicleID; })[0];
    var vehicleType = vehicleTypes.filter(function (t) { return t.VehicleTypeID === scenario.VehicleTypeID; })[0] || {};

    // 加權平均是好幾個車系混出來的，貨物稅的計算過程沒有單一版本可以攤開顯示，只有選特定
    // 車系時才附上 commodityTaxDetail(見 CalcEngine.gs commodityTaxBreakdown_())。
    // 用 calculatePLCore_ 而非 calculatePL：儀表板只是「看」，不需要每次都寫一次 PLResult 快照。
    var vehicleCalc = sel.VehicleID ? calculatePLCore_(sel.ScenarioID, sel.VehicleID) : null;
    var lines = vehicleCalc ? vehicleCalc.lines : calculateScenarioWeighted(sel.ScenarioID);

    var amounts = {};
    lines.forEach(function (l) { amounts[l.LineCode] = l.Amount; });

    return {
      scenarioId: sel.ScenarioID,
      vehicleId: sel.VehicleID || '',
      vehicleTypeId: scenario.VehicleTypeID || '',
      vehicleTypeLabel: scenario.VehicleTypeID || vehicleType.VehicleTypeID || '',
      scenarioLabel: [scenario.Gate || '', scenario.ScenarioName || ''].filter(function (p) { return p; }).join(' '),
      scenarioType: scenario.ScenarioType || '',
      scenarioNotes: scenario.Notes || '',
      vehicleLabel: sel.VehicleID ? ((vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均',
      isWeighted: !sel.VehicleID,
      // 銷量資訊：儀表板用來 (1) hover 欄位標題時顯示這一欄的台數基礎 (2) 把單台金額換算成年度/LC 總額
      volume: columnVolumeInfo_(sel.ScenarioID, sel.VehicleID, vehicles),
      commodityTaxDetail: vehicleCalc ? vehicleCalc.commodityTaxDetail : null,
      label: [
        scenario.VehicleTypeID || vehicleType.VehicleTypeID || '',
        scenario.Gate || '',
        scenario.ScenarioName || '',
        sel.VehicleID ? ((vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均'
      ].filter(function (p) { return p; }).join(' / '),
      amounts: amounts,
      revenue: amounts.A || 0,
      exFactoryPrice: amounts.P8 || 0,
      checks: subtotalChecks_(amounts, lineDefs)
    };
  });

  // 只列出至少有一個比較欄位真的算出數字的科目(不同車型科目不同時，表格才不會塞滿空列)
  var usedLines = lineDefs.filter(function (def) {
    return columns.some(function (col) { return col.amounts[def.LineCode] !== undefined; });
  }).map(function (def) {
    return {
      LineCode: def.LineCode,
      LineName: def.LineName,
      Category: def.Category,
      ParentLine: def.ParentLine || '',
      SortOrder: toNumber_(def.SortOrder),
      AutoSource: def.AutoSource || '',
      isSubtotal: PROTECTED_LINE_CODES.indexOf(def.LineCode) !== -1,
      isPriceStructure: String(def.Category || '') === '售價結構'
    };
  });

  return { columns: columns, lines: usedLines, subtotalCodes: PROTECTED_LINE_CODES };
}

/**
 * 比較欄位的銷量基礎。
 * 單一車系：該車系在銷售構成表上的月銷量、LC 年限、構成比，總台數 = 月銷量 × 12 × LC年限。
 * 加權平均：月銷量/總台數是該情境所有車系加總，並附上各車系的構成比(mix)，
 * 讓儀表板 hover 標題時看得出「加權平均」是由哪幾個車系、各佔多少混出來的。
 * 儀表板的「年度總額 / LC 總額」就是用這裡的 monthlyVolume / units 去乘單台金額。
 */
function columnVolumeInfo_(scenarioId, vehicleId, vehicles) {
  var rows = getSalesMix(scenarioId);
  var nameOf = function (id) {
    var v = vehicles.filter(function (x) { return x.VehicleID === id; })[0];
    return (v && v.VehicleCode) || id;
  };
  var unitsOf = function (r) { return toNumber_(r.MonthlyVolume) * 12 * toNumber_(r.LifeCycleYears); };
  if (vehicleId) {
    var row = rows.filter(function (r) { return r.VehicleID === vehicleId; })[0] || {};
    return {
      monthlyVolume: toNumber_(row.MonthlyVolume),
      lifeCycleYears: toNumber_(row.LifeCycleYears),
      units: unitsOf(row),
      salesMixPct: toNumber_(row.SalesMixPct),
      mix: []
    };
  }
  var totalPct = rows.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0);
  var years = rows.map(function (r) { return toNumber_(r.LifeCycleYears); }).filter(function (y) { return y > 0; });
  return {
    monthlyVolume: rows.reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0),
    // 各車系 LC 年限通常一樣；不一樣時標題只顯示範圍，總台數仍是逐車系加總
    lifeCycleYears: years.length ? Math.min.apply(null, years) : 0,
    lifeCycleYearsMax: years.length ? Math.max.apply(null, years) : 0,
    units: rows.reduce(function (s, r) { return s + unitsOf(r); }, 0),
    salesMixPct: totalPct,
    mix: rows.map(function (r) {
      return { vehicleLabel: nameOf(r.VehicleID), pct: toNumber_(r.SalesMixPct), monthlyVolume: toNumber_(r.MonthlyVolume) };
    })
  };
}

/**
 * 小計驗算：把損益鏈上每一條「等式」重算一次，回傳對不起來的項目。
 * 一分損益表最容易出錯的地方就是加總 —— 明細改了、小計沒跟著動，或是某個明細科目
 * 被歸到錯的父科目而沒有被任何小計吃到。這裡直接用畫面上要顯示的同一組數字去驗，
 * 有問題就一定看得到，不必自己拿計算機加。
 */
function subtotalChecks_(amounts, lineDefs) {
  var v = function (code) { return Number(amounts[code]) || 0; };
  var sumChildren = function (parent) {
    return lineDefs.filter(function (d) { return d.ParentLine === parent; })
      .reduce(function (sum, d) { return sum + v(d.LineCode); }, 0);
  };

  var equations = [
    { code: 'A', label: 'A 收入 = P8 廠價 + P9 強配收入', expected: v('P8') + v('P9') },
    { code: 'B', label: 'B 銷貨成本 = Σ 成本明細', expected: sumChildren('B') },
    { code: 'C', label: 'C 生產毛利 = A - B', expected: v('A') - v('B') },
    { code: 'E', label: 'E 銷貨毛利 = C - Σ 銷售費用', expected: v('C') - sumChildren('E') },
    { code: 'G', label: 'G 產品貢獻 = E - Σ 產品貢獻前費用', expected: v('E') - sumChildren('G') },
    { code: 'I', label: 'I 營業淨利(未扣前瞻) = G - Σ 固定營業費用', expected: v('G') - sumChildren('I') },
    { code: 'K', label: 'K 營業淨利 = I - J 前瞻費用', expected: v('I') - v('J') }
  ];

  return equations.filter(function (eq) {
    // 容差 0.5 元：營業稅/佣金有四捨五入，差幾角不是錯誤
    return Math.abs(eq.expected - v(eq.code)) > 0.5;
  }).map(function (eq) {
    return { code: eq.code, label: eq.label, expected: eq.expected, actual: v(eq.code), diff: v(eq.code) - eq.expected };
  });
}

/** 儀表板比較欄位選擇器用：一次回傳車型 -> 情境/車系的完整選項樹 */
function getComparisonOptions() {
  var scenarios = getScenarios();
  var vehicles = getVehicles();
  return getVehicleTypes().map(function (t) {
    return {
      VehicleTypeID: t.VehicleTypeID,
      scenarios: scenarios.filter(function (s) { return s.VehicleTypeID === t.VehicleTypeID; })
        .map(function (s) {
          return { ScenarioID: s.ScenarioID, Gate: s.Gate || '', ScenarioName: s.ScenarioName || '' };
        }),
      vehicles: vehicles.filter(function (v) { return v.VehicleTypeID === t.VehicleTypeID; })
        .map(function (v) { return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' }; })
    };
  });
}

/**
 * 依 DevInvestment 攤提出單台開發成本，依每一列自選的攤提落點科目(TargetLineCode)分組加總。
 * 分母為該情境的 LIFE CYCLE 總台數 = Σ(月銷量 × 12 × LC年限)。
 * 回傳的 perUnit / totalsByLine 都是「科目代碼 -> 金額」的動態物件，
 * 落點不再限制成固定的 b5/b8/f3/f4 四個科目(見 applyDevAmortLines_ 如何套用到損益各段)。
 *
 * overrideRows 可選：開發總投頁面用來「先試算、還沒儲存」——使用者在畫面上調整金額/低減%時，
 * 直接把還沒送出的列傳進來算，不必先存檔才看得到下面投資總額/單台攤提會變成多少。
 * 不傳就照原本行為讀 Sheet 上已儲存的資料（損益計算/儀表板一律用這個，確保跟儲存的資料一致）。
 */
function amortizeDevInvestmentPerUnit_(scenarioId, overrideRows) {
  var devRows = overrideRows || getDevInvestment(scenarioId);
  var totalUnits = getLifeCycleUnits(scenarioId);
  var empty = { perUnit: {}, totalsByLine: {}, totalUnits: totalUnits };
  if (totalUnits <= 0) return empty;

  // 現況情境沒有挑戰低減目標，一律用原始金額；目標情境才套用低減率。
  var isBaseline = isBaselineScenario_(scenarioId);
  var params = getParameters(scenarioId);

  var totals = {};
  devRows.forEach(function (r) {
    var target = devAmortTargetOf_(r);
    if (!target) return;   // 沒選攤提落點的列不攤提(儲存時已擋下有金額卻沒選的情形)
    // 投入金額可用外幣登打(如 BASE廠開發費以 CNY 計)，換算方式與銷貨成本一致
    var amount = toNumber_(r.Amount) * fxRateFor_(params, r.Currency, '');
    // ChallengeReductionPct 以 0~100 的百分比數值儲存(如 15 代表 15%)
    var reduced = amount * (isBaseline ? 1 : 1 - pct_(r.ChallengeReductionPct));
    totals[target] = (totals[target] || 0) + reduced;
  });

  var perUnit = {};
  Object.keys(totals).forEach(function (code) { perUnit[code] = totals[code] / totalUnits; });

  return { perUnit: perUnit, totalsByLine: totals, totalUnits: totalUnits };
}

/**
 * 把開發總投攤提結果套進損益某一段的科目集合：只套用「這一段底下、攤提用的科目」，
 * 沒有任何一列選到的攤提落點科目也會補 0，確保畫面上一定看得到該科目那一列。
 */
function applyDevAmortLines_(targetDict, parentLine, devPerUnit, lineDefs) {
  lineDefs.filter(function (d) {
    return d.ParentLine === parentLine && DEV_AMORT_AUTO_SOURCES.indexOf(d.AutoSource) !== -1;
  }).forEach(function (d) {
    var amount = devPerUnit.perUnit[d.LineCode];
    // 內建的四個攤提落點(模具/設備/CMC/BASE廠開發費)一律顯示、即使 0，維持 Gate F 損益表固定列序。
    // 使用者自訂的攤提落點(AutoSource=DEV_AMORT)則只在「這個情境目前真的有開發總投列指到這裡」才顯示，
    // 不然使用者在開發總投頁面新增過的攤提落點只要試用過一次，就會永遠留在每一份損益表/矩陣頁面上洗不掉
    // (顯示成金額 0、不屬於任何目前看得到的資料)，而且還刪不掉(deletePLLineItem 會擋住還有資料指向它的科目)。
    if (amount === undefined && d.AutoSource === AUTO_SOURCE.DEV_AMORT) return;
    targetDict[d.LineCode] = amount || 0;
  });
}

/** 是否為現況情境（現況沒有挑戰低減目標） */
function isBaselineScenario_(scenarioId) {
  var s = getScenarios().filter(function (r) { return r.ScenarioID === scenarioId; })[0];
  return !s || !s.ScenarioType || s.ScenarioType === SCENARIO_TYPE_BASELINE;
}

/**
 * 開發總投攤提用的 LIFE CYCLE 總台數。
 * 情境若有填「攤提基準台數」(AmortMonthlyVolume × 12 × AmortLifeCycleYears)就以它為準，
 * 因為實務上開發投資的攤提基準台數常與銷售構成的預估台數不同(例如銷售估 365 台/月，
 * 但開發投資以 300 台/月 × 12 年攤提)。沒填就用銷售構成推算。
 */
function getLifeCycleUnits(scenarioId) {
  var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
  if (scenario) {
    var vol = toNumber_(scenario.AmortMonthlyVolume);
    var years = toNumber_(scenario.AmortLifeCycleYears);
    if (vol > 0 && years > 0) return vol * 12 * years;
  }
  return getSalesMixLifeCycleUnits(scenarioId);
}

/** 銷售構成推算的 LIFE CYCLE 總台數 = Σ(預估銷售台數(月) × 12 × LC年限) */
function getSalesMixLifeCycleUnits(scenarioId) {
  return getSalesMix(scenarioId).reduce(function (sum, r) {
    return sum + toNumber_(r.MonthlyVolume) * 12 * toNumber_(r.LifeCycleYears);
  }, 0);
}

/**
 * 開發總投頁面用：回傳低減後金額與單台攤提，讓使用者直接看到攤提結果。
 * 攤提落點(TargetLineCode)由使用者自己選，不再限制成固定的模具/設備/費用四種，
 * 也可以在頁面上新增新的攤提落點科目(見 getDevAmortTargetOptions / addDevAmortLineItem)。
 *
 * overrideRows 可選：見 amortizeDevInvestmentPerUnit_ 的說明，用來在還沒儲存前先試算
 * 下面「投資總額(低減後)/單台攤提」表會變成多少（見 previewDevInvestmentSummary）。
 * 這種情況下 rows 仍照 Sheet 上已儲存的資料回傳，不受 overrideRows 影響

 */
function getDevInvestmentSummary(scenarioId, overrideRows) {
  var perUnit = amortizeDevInvestmentPerUnit_(scenarioId, overrideRows);
  var isBaseline = isBaselineScenario_(scenarioId);
  var lineNames = {};
  getPLLineItems().forEach(function (d) { lineNames[d.LineCode] = d.LineName; });
  var targetOptions = getDevAmortTargetOptions();

  // 部門列的呈現順序使用者可以自己在畫面上調整(拖不動用上下移動鈕)，留白排最後、相對順序穩定
  var rows = sortByOrder_(getDevInvestment(scenarioId), 'SortOrder').map(function (r) {
    var pctValue = isBaseline ? 0 : toNumber_(r.ChallengeReductionPct);
    var target = devAmortTargetOf_(r);
    return {
      RowID: r.RowID,
      Department: r.Department,
      Currency: r.Currency || BASE_CURRENCY,
      Notes: r.Notes || '',
      Amount: toNumber_(r.Amount),
      ChallengeReductionPct: pctValue,
      ReducedAmount: toNumber_(r.Amount) * (1 - pctValue / 100),
      // 這一列的錢會攤到哪個科目，直接寫在畫面上（只給名稱，代碼對選擇沒有幫助）
      TargetLineCode: target,
      TargetLineName: target ? (lineNames[target] || target) : '',
      SortOrder: r.SortOrder === undefined || r.SortOrder === '' ? '' : r.SortOrder
    };
  });
  var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0] || {};
  return {
    lifeCycleUnits: perUnit.totalUnits,
    salesMixLifeCycleUnits: getSalesMixLifeCycleUnits(scenarioId),
    targetOptions: targetOptions,
    // 每個落點科目的投資總額(低減後)與單台攤提，讓「開發總投 → 損益科目」對得起來
    targets: targetOptions.map(function (opt) {
      var code = opt.value;
      return {
        LineCode: code, LineName: opt.label,
        Total: perUnit.totalsByLine[code] || 0,
        PerUnit: perUnit.totalUnits ? (perUnit.totalsByLine[code] || 0) / perUnit.totalUnits : 0
      };
    }),
    amortMonthlyVolume: scenario.AmortMonthlyVolume === undefined ? '' : scenario.AmortMonthlyVolume,
    amortLifeCycleYears: scenario.AmortLifeCycleYears === undefined ? '' : scenario.AmortLifeCycleYears,
    currencies: getConfiguredCurrencies(scenarioId),
    perUnit: perUnit, isBaseline: isBaseline, rows: rows
  };
}

/**
 * 開發總投頁面用：畫面上還沒按「儲存」的編輯內容，先試算一次下面的「投資總額(低減後)/單台攤提」表，
 * 讓使用者調整金額或挑戰低減目標(或直接改低減後金額反推)時馬上看得到攤提結果會變成怎樣，
 * 不必先存檔才知道。只回傳 targets 彙總表需要的部分，不寫入任何資料、不用鎖定。
 */
function previewDevInvestmentSummary(scenarioId, rows) {
  var summary = getDevInvestmentSummary(scenarioId, rows || []);
  return { targets: summary.targets, lifeCycleUnits: summary.lifeCycleUnits };
}

/** 某個父科目底下、可以手動輸入的明細科目代碼(排除自動計算科目) */
function manualLineCodesFor_(parentCodes) {
  return getPLLineItems()
    .filter(function (d) { return parentCodes.indexOf(d.ParentLine) !== -1 && !d.AutoSource; })
    .map(function (d) { return d.LineCode; });
}

function pickLines_(rows, codes) {
  var result = {};
  codes.forEach(function (c) { result[c] = 0; });
  rows.forEach(function (r) {
    if (codes.indexOf(r.LineCode) !== -1) {
      result[r.LineCode] += toNumber_(r.Amount);
    }
  });
  return result;
}

function sumValues_(obj) {
  return Object.keys(obj).reduce(function (s, k) { return s + obj[k]; }, 0);
}

/**
 * 寫入損益快照：先清掉該 scenario+vehicle 的舊快照再寫新的。
 * 舊資料用「整張重寫」而非逐列 deleteRow —— 儀表板一次比較多個欄位時，
 * 逐列刪除會累積成上百次 Sheet 異動，容易撞到執行時間上限。
 */
function writePLResult_(scenarioId, vehicleId, lineValues, revenue, exFactoryPrice, timestamp) {
  var sheet = getSheet_(SHEETS.PL_RESULT);
  var width = SCHEMA.PLResult.length;
  var lastRow = sheet.getLastRow();

  var kept = [];
  if (lastRow >= 2) {
    kept = sheet.getRange(2, 1, lastRow - 1, width).getValues().filter(function (row) {
      var isBlank = row.every(function (v) { return v === '' || v === null; });
      return !isBlank && !(samePk_(row[1], scenarioId) && String(row[2] || '') === String(vehicleId || ''));
    });
    sheet.getRange(2, 1, lastRow - 1, width).clearContent();
  }

  var rows = Object.keys(lineValues).map(function (code) {
    var amount = lineValues[code];
    return [generateId_('PR'), scenarioId, vehicleId, code, amount,
      revenue ? amount / revenue : 0, exFactoryPrice ? amount / exFactoryPrice : 0, timestamp];
  });

  var all = kept.concat(rows);
  if (all.length) sheet.getRange(2, 1, all.length, width).setValues(all);
  invalidateSheetCache_(SHEETS.PL_RESULT);
}

/**
 * 把計算結果攤成畫面用的列。
 * 每一列同時給兩個百分比基準：
 *   PctOfRevenue     — 對 A 收入(未稅,含強配)，就是 Gate F Excel 上那一欄 %
 *   PctOfExFactory   — 對 P8 廠價(未稅)
 * 沒有強配件時兩者相同；有強配收入時廠價比較能反映本業單價，所以兩個都留著讓使用者切換。
 */
function buildResultLines_(lineValues, revenue, exFactoryPrice) {
  var lineDefs = getPLLineItems();
  return lineDefs
    .filter(function (def) { return lineValues[def.LineCode] !== undefined; })
    .map(function (def) {
      var amount = lineValues[def.LineCode];
      return {
        LineCode: def.LineCode,
        LineName: def.LineName,
        Category: def.Category,
        ParentLine: def.ParentLine || '',
        AutoSource: def.AutoSource || '',
        Amount: amount,
        PctOfRevenue: revenue ? amount / revenue : 0,
        PctOfExFactory: exFactoryPrice ? amount / exFactoryPrice : 0
      };
    });
}

/**
 * 「銷貨成本」「營業費用」矩陣頁面用：把自動計算科目(開發總投攤提、貨物稅、季Margin等)
 * 依車系算出實際金額，讓這兩頁能把完整的損益明細攤開顯示，不必再跑去儀表板才看得到。
 * 只算「這個情境底下、已經有銷售構成資料」的車系，還沒建立銷售構成的車系無法計算，直接略過。
 */
function buildAutoLines_(scenarioId, vehicles, parentLines) {
  var devPerUnit = amortizeDevInvestmentPerUnit_(scenarioId);
  // 跟 applyDevAmortLines_ 同一個規則：使用者自訂的攤提落點只有這個情境目前真的用到才列出來，
  // 不然「銷貨成本」「營業費用」頁面的自動計算科目區塊會永遠多出一列用不到、也刪不掉的科目。
  var autoLineDefs = getPLLineItems().filter(function (d) {
    if (parentLines.indexOf(d.ParentLine) === -1 || !d.AutoSource) return false;
    if (d.AutoSource === AUTO_SOURCE.DEV_AMORT && devPerUnit.perUnit[d.LineCode] === undefined) return false;
    return true;
  });
  var result = { lines: autoLineDefs.map(function (d) { return { value: d.LineCode, label: d.LineName }; }), values: {} };
  if (!autoLineDefs.length) return result;
  autoLineDefs.forEach(function (d) { result.values[d.LineCode] = {}; });

  var salesMixIds = {};
  getSalesMix(scenarioId).forEach(function (r) { salesMixIds[r.VehicleID] = true; });

  vehicles.forEach(function (v) {
    if (!salesMixIds[v.VehicleID]) return;
    var pl;
    // 用不寫入 PLResult 的純計算版本 —— 這裡只是想顯示自動計算科目算出多少，
    // 每次開頁就對每個車系都重算一次還寫一次快照(calculatePL())太浪費，
    // 之前也因此讓存檔用的鎖定(LockService)排隊排很久甚至逾時。
    try { pl = calculatePLCore_(scenarioId, v.VehicleID); } catch (e) { return; }
    pl.lines.forEach(function (l) {
      if (result.values[l.LineCode]) result.values[l.LineCode][v.VehicleID] = l.Amount;
    });
    if (parentLines.indexOf('B') !== -1) {
      result.commodityTaxDetail = result.commodityTaxDetail || {};
      result.commodityTaxDetail[v.VehicleID] = pl.commodityTaxDetail;
    }
  });
  return result;
}

/** 銷貨成本頁用：B 底下的自動計算科目(b5/b8/b13...)，含貨物稅的完整計算過程 */
function getCostOfSalesAutoLines(scenarioId, vehicles) {
  return buildAutoLines_(scenarioId, vehicles, ['B']);
}
/** 營業費用頁用：E/G/I 底下的自動計算科目(季Margin、開發總投攤提費用類...) */
function getOperatingExpenseAutoLines(scenarioId, vehicles) {
  return buildAutoLines_(scenarioId, vehicles, ['E', 'G', 'I']);
}

function getPLResult(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.PL_RESULT);
  return rows.filter(function (r) { return r.ScenarioID === scenarioId && r.VehicleID === (vehicleId || ''); });
}
