/* ---------------- 選單(可搜尋、方向鍵、Enter) ---------------- */
function openFxPicker_(anchor, sections, onPick, onCancel, query) {
  closeFxPicker_();
  const box = document.createElement('div');
  box.className = 'fx-picker';
  box.innerHTML = `<input type="text" class="fx-picker-q" placeholder="搜尋科目、參數…（可以打代碼）"><div class="fx-picker-list"></div>`;
  document.body.appendChild(box);
  fxPicker_ = { box, sections, onPick, onCancel, hl: 0, flat: [] };
  const r = (anchor && anchor.getBoundingClientRect) ? anchor.getBoundingClientRect() : { left: 100, bottom: 100, top: 100 };
  const w = Math.min(360, window.innerWidth - 24);
  box.style.width = w + 'px';
  box.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
  const below = window.innerHeight - r.bottom;
  if (below < 300 && r.top > below) { box.style.bottom = (window.innerHeight - r.top + 4) + 'px'; } else { box.style.top = (r.bottom + 4) + 'px'; }
  const q = box.querySelector('.fx-picker-q');
  q.value = query || '';
  q.addEventListener('input', () => { fxPicker_.hl = 0; drawFxPicker_(); });
  q.addEventListener('keydown', e => {
    const n = fxPicker_.flat.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (n) fxPicker_.hl = (fxPicker_.hl + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
      drawFxPicker_();
    } else if (e.key === 'Enter') { e.preventDefault(); if (n) pickFx_(fxPicker_.hl); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelFxPicker_(); }
  });
  box.addEventListener('mousedown', e => {
    const el = e.target.closest('.fx-pk-item');
    if (el) { e.preventDefault(); pickFx_(Number(el.getAttribute('data-i'))); }
  });
  drawFxPicker_();
  q.focus();
  setTimeout(() => document.addEventListener('mousedown', fxPickerOutside_), 0);
}
function fxPickerOutside_(e) { if (fxPicker_ && !fxPicker_.box.contains(e.target)) cancelFxPicker_(); }
function drawFxPicker_() {
  const p = fxPicker_;
  const q = p.box.querySelector('.fx-picker-q').value.trim().toLowerCase();
  p.flat = [];
  const html = p.sections.map(g => {
    const items = g.items.filter(it => !q || it.label.toLowerCase().indexOf(q) !== -1 || String(it.search || '').toLowerCase() === q ||
      String(it.hint || '').toLowerCase().indexOf(q) !== -1);
    if (!items.length) return '';
    return `<div class="fx-pk-group">${esc(g.g)}</div>` + items.map(it => {
      const i = p.flat.length;
      p.flat.push(it);
      return `<div class="fx-pk-item kind-${it.kind || ''}${i === p.hl ? ' hl' : ''}${it.strong ? ' strong' : ''}" data-i="${i}" style="padding-left:${10 + (q ? 0 : (it.indent || 0) * 14)}px;">
        <div class="fx-pk-text"><span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</div><span class="fx-pk-v">${esc(it.value || '')}</span></div>`;
    }).join('');
  }).join('');
  const list = p.box.querySelector('.fx-picker-list');
  list.innerHTML = html || '<div class="muted" style="padding:10px;">找不到符合的項目</div>';
  scrollListTo_(list, list.querySelector('.hl'));
}
/** 只捲清單本身讓選到的項目看得到(scrollIntoView 會連外層的框、整頁一起捲) */
function scrollListTo_(list, item) {
  if (!list || !item) return;
  const lr = list.getBoundingClientRect(), ir = item.getBoundingClientRect();
  if (ir.top < lr.top) list.scrollTop -= lr.top - ir.top;
  else if (ir.bottom > lr.bottom) list.scrollTop += ir.bottom - lr.bottom;
}
function pickFx_(i) {
  const p = fxPicker_;
  const item = p && p.flat[i];
  if (!item) return;
  closeFxPicker_();
  p.onPick(item);
}
function cancelFxPicker_() {
  const p = fxPicker_;
  closeFxPicker_();
  if (p && p.onCancel) p.onCancel();
}
function closeFxPicker_() {
  if (!fxPicker_) return;
  document.removeEventListener('mousedown', fxPickerOutside_);
  if (fxPicker_.box.parentNode) fxPicker_.box.parentNode.removeChild(fxPicker_.box);
  fxPicker_ = null;
}

/* ================= GATE 審議報告(簡報)：現況與目標的差距、作法、說明 ================= */
let reportData = null;
let reportSel = { target: '', base: '', prev: '' };
let reportUnit = 1;              // 1 元 / 1000 千元 / 10000 萬元(全系統共用，見 loadAmountUnit_)
let reportActions = [];          // 編輯中的作法(目標情境)
let reportNoteEdits = {};        // { scenarioId: { LineCode: 說明 } } 還沒存的說明
let reportShowPrice = false;
/** 差距拆解的長條設定(每個車型各一份)：最多幾根、多小的併入「其他」、哪些科目合併成同一根 { LineCode: 合併後的名稱 } */
let reportBridgeCfg = null;
function defaultBridgeCfg_() { return { topN: 10, minAbs: 0, groups: {} }; }
const REPORT_PREFS_KEY_ = 'plReport.prefs.v1';

function loadReportPrefs_() {
  try {
    const p = JSON.parse(localStorage.getItem(REPORT_PREFS_KEY_) || 'null') || {};
    if (p.sel && p.sel[currentVehicleTypeId]) reportSel = Object.assign({ target: '', base: '', prev: '' }, p.sel[currentVehicleTypeId]);
    else reportSel = { target: '', base: '', prev: '' };
    if ([1, 1000, 10000].indexOf(p.unit) !== -1) reportUnit = p.unit;
    if (typeof p.showPrice === 'boolean') reportShowPrice = p.showPrice;
    reportBridgeCfg = Object.assign(defaultBridgeCfg_(), p.bridge && p.bridge[currentVehicleTypeId]);
  } catch (e) { reportBridgeCfg = defaultBridgeCfg_(); }
  reportUnit = loadAmountUnit_(reportUnit);   // 金額單位全系統共用
}
function saveReportPrefs_() {
  try {
    const p = JSON.parse(localStorage.getItem(REPORT_PREFS_KEY_) || 'null') || {};
    p.sel = p.sel || {};
    p.sel[currentVehicleTypeId] = reportSel;
    p.unit = reportUnit; p.showPrice = reportShowPrice;
    p.bridge = p.bridge || {};
    p.bridge[currentVehicleTypeId] = reportBridgeCfg;
    localStorage.setItem(REPORT_PREFS_KEY_, JSON.stringify(p));
  } catch (e) { /* 存不了就算了 */ }
}

/** 沒選過時的預設：目標 = 目前情境(若是目標情境)或最後一個目標情境；現況 = 同一個 GATE 的現況情境 */
function defaultReportSel_() {
  const scs = scenarioCache;
  const ids = scs.map(s => s.ScenarioID);
  const valid = id => id && ids.indexOf(id) !== -1;
  if (!valid(reportSel.target)) {
    const cur = scs.find(s => s.ScenarioID === currentScenarioId);
    const targets = scs.filter(s => s.ScenarioType === '目標');
    reportSel.target = cur && cur.ScenarioType === '目標' ? cur.ScenarioID : (targets.length ? targets[targets.length - 1].ScenarioID : (cur ? cur.ScenarioID : (ids[0] || '')));
  }
  if (reportSel.base && !valid(reportSel.base)) reportSel.base = '';
  if (reportSel.prev && !valid(reportSel.prev)) reportSel.prev = '';
  if (!reportSel.base) {
    const t = scs.find(s => s.ScenarioID === reportSel.target);
    const base = scs.find(s => s.ScenarioType !== '目標' && t && s.Gate === t.Gate && s.ScenarioID !== t.ScenarioID) ||
      scs.find(s => s.ScenarioType !== '目標' && s.ScenarioID !== reportSel.target);
    reportSel.base = base ? base.ScenarioID : '';
  }
}

    return;
  }
  loadReportPrefs_();

  const opt = (id, allowEmpty, emptyText) => (allowEmpty ? `<option value="">${emptyText}</option>` : '') +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === id ? ' selected' : ''}>${esc(scenarioLabel(s))}（${esc(s.ScenarioType || '現況')}）</option>`).join('');
  panel.innerHTML = `
    <div class="card no-print">
      <div class="report-controls">
        <label class="field rpt-pick base"><span><i class="rpt-dot"></i>現況（差距的比較基準）</span><select id="rpt-sel-base" onchange="setReportSel('base', this.value)">${opt(reportSel.base, true, '（不比較）')}</select></label>
        <span class="rpt-arrow" aria-hidden="true">→</span>
        <label class="field rpt-pick target"><span><i class="rpt-dot"></i>目標 / 本回</span><select id="rpt-sel-target" onchange="setReportSel('target', this.value)">${opt(reportSel.target)}</select></label>
        <label class="field rpt-pick prev"><span>前回（選填，跟本回比）</span><select id="rpt-sel-prev" onchange="setReportSel('prev', this.value)">${opt(reportSel.prev, true, '（不比較）')}</select></label>
      </div>
      <div class="report-controls" style="margin-top:12px;">
        <label class="field" data-tip="全系統共用：儀表板、GATE 報告、瀑布圖工具用同一個金額單位"><span>金額單位</span><div class="seg">
          ${AMOUNT_UNITS_.map(([u, t]) => `<button type="button" class="seg-btn${reportUnit === u ? ' active' : ''}" data-unit="${u}" onclick="setReportUnit(${u})">${t}/台</button>`).join('')}</div></label>
        <label class="chk" style="align-self:center;"><input type="checkbox" ${reportShowPrice ? 'checked' : ''} onchange="reportShowPrice=this.checked;saveReportPrefs_();drawReport_()"> 顯示售價結構</label>
        <label class="chk" style="align-self:center;" data-tip="兩項假設、看哪個結果，在「目標反推與敏感度」頁設定"><input type="checkbox" ${whatIfPrefs.sens.inReport ? 'checked' : ''} onchange="whatIfPrefs.sens.inReport=this.checked;saveWhatIfPrefs_();drawReport_()"> 附敏感度分析</label>
        <span style="flex:1"></span>
        <button type="button" class="btn secondary" onclick="createSnapshotDialog_(reportSel.target, (scenarioCache.find(s => s.ScenarioID === reportSel.target) || {}).ScenarioName ? scenarioLabel(scenarioCache.find(s => s.ScenarioID === reportSel.target)) : '')" data-tip="把目標情境現在的數字存一份，之後可以比較改了什麼">存成快照</button>
        <button type="button" class="btn secondary" onclick="loadReport_()">重新計算</button>
        <button type="button" class="btn" onclick="printReport_()">列印 / 存成 PDF</button>
      </div>
      <p class="help" style="margin:10px 0 0;">每一張卡片是一頁 16:9 投影片，列印時每頁一張。「說明」欄可以直接點進去改（就是銷貨成本、營業費用頁的「報告說明」，改哪邊都是同一份）；作法清單可以拖曳 ⠿ 排序。每張右上角的「複製」可以把表格貼進 PowerPoint / Excel。</p>
    </div>
    <div id="report-body"><p class="muted">計算中...</p></div>`;
  loadReport_();
}

function setReportSel(field, value) {
  const go = () => {
    reportSel[field] = value;
    saveReportPrefs_();
    loadReport_();
  };
  if (isDirty_()) confirmLeave_().then(ok => { if (ok) go(); }); else go();
}
function setReportUnit(u) {
  reportUnit = normAmountUnit_(u);
  saveAmountUnit_(reportUnit);
  saveReportPrefs_();
  document.querySelectorAll('#panel-report .report-controls .seg-btn[data-unit]').forEach(b => b.classList.toggle('active', Number(b.dataset.unit) === reportUnit));
  drawReport_();
}

function loadReport_() {
  const body = document.getElementById('report-body');
  if (!reportSel.target) { if (body) body.innerHTML = '<p class="muted">請選擇目標情境。</p>'; return; }
  if (body && !reportData) body.innerHTML = '<p class="muted">計算中...</p>';
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      clearDirty();
      reportData = data;
      reportActions = (data.actions || []).map(a => Object.assign({}, a));
      reportNoteEdits = {};
      drawReport_();
    }))
    .withFailureHandler(err => { if (body) body.innerHTML = `<div class="callout err">報告計算失敗：${esc(err.message)}</div>`; })
    .getGateReport(reportSel.target === reportSel.base ? '' : reportSel.base, reportSel.target, reportSel.prev === reportSel.target ? '' : reportSel.prev);
}

/* ---- 報告用的小工具 ---- */
function rAmt_(v) { return v === undefined || v === null ? '' : fmt(Number(v) / reportUnit, amountUnitDigits_(reportUnit)); }
function rSigned_(v) { return v === undefined || v === null ? '' : signed_(Number(v) / reportUnit, amountUnitDigits_(reportUnit)); }
function rUnit_() { return amountUnitText_(reportUnit) + '/台'; }
function rPct_(v, base) { return base ? (Number(v) / base * 100).toFixed(1) + '%' : ''; }
/** 目標情境的營業淨利科目(預設 K；K 被刪掉時後端指定損益表最底下的總計) */
function rK_() { return profitCodeOf_(reportData); }
/** 某個情境(目標/現況/前回)的營業淨利：各看自己車型的淨利科目，不同車型可能不是同一個代碼 */
function rProfit_(block) { return block ? (block.weighted[block.profitCode || rK_()] || 0) : 0; }
function reportLineName_(code) { const l = reportData.lines.find(x => x.LineCode === code); return l ? shortLineName(l.LineName) : code; }
function reportCodeNameMap_() { const m = {}; reportData.lines.forEach(l => { m[l.LineCode] = shortLineName(l.LineName); }); return m; }
function noteFor_(block, code) {
  const sid = block.meta.ScenarioID;
  if (reportNoteEdits[sid] && reportNoteEdits[sid][code] !== undefined) return reportNoteEdits[sid][code];
  return (block.notes || {})[code] || '';
}
function noteCellHtml_(block, code) {
  const sid = block.meta.ScenarioID;
  const dirty = reportNoteEdits[sid] && reportNoteEdits[sid][code] !== undefined;
  return `<td class="note${dirty ? ' dirty' : ''}" contenteditable="true" data-sc="${esc(sid)}" data-code="${esc(code)}" oninput="onReportNote(this)">${esc(noteFor_(block, code))}</td>`;
}
function onReportNote(el) {
  const sid = el.getAttribute('data-sc'), code = el.getAttribute('data-code');
  reportNoteEdits[sid] = reportNoteEdits[sid] || {};
  reportNoteEdits[sid][code] = el.innerText.replace(/\n+$/, '');
  el.classList.add('dirty');
  markDirty('report', saveReport_, () => { clearDirty(); loadReport_(); });
}
/** 科目對營業淨利的方向：收入類(A 底下或 A 本身) +1；成本/費用類 -1；小計與售價結構不算 */
function profitSign_(line) {
  if (line.isPriceStructure) return 0;
  if (line.LineCode === 'A') return 1;
  if (line.isSubtotal) return 0;
  let cur = line, guard = 0;
  while (cur && cur.ParentLine && guard++ < 20) {
    if (cur.ParentLine === 'A') return 1;
    cur = reportData.lines.find(l => l.LineCode === cur.ParentLine);
  }
  return -1;
}
function slideHtml_(no, title, sub, inner, copyId) {
  const t = reportData.target.meta;
  return `<section class="slide">
    <div class="slide-actions no-print">${copyId ? `<button type="button" class="btn secondary sm" onclick="copyReportTable('${copyId}')">複製表格</button>` : ''}</div>
    <div class="slide-head"><span class="slide-no">${esc(no)}</span><h2>${esc(title)}</h2><div class="slide-sub">${sub || ''}</div></div>
    ${inner}
    <div class="slide-foot"><span>${esc(reportData.vehicleTypeId)} 車型 ${esc(t.Gate)} 審議 · F/S 試算與目標成本作法說明</span><span>機密 · 單位：${esc(rUnit_())}</span></div>
  </section>`;
}

function drawReport_() {

  if (B) slides.push(slideHtml_(no(), '現況 → 目標：營業淨利差距拆解', '每一根長條 = 該科目讓營業淨利增加(綠)或減少(紅)多少', '<div id="rpt-bridge">' + reportBridgeHtml_() + '</div>'));

  if (B) slides.push(slideHtml_(no(), '作法對帳', '作法寫的效果，跟現況 → 目標的實際數字對得起來嗎？', '<div id="rpt-recon-wrap">' + reportReconHtml_() + '</div>', 'rpt-recon'));
  slides.push(slideHtml_(no(), `細車型 FS 損益狀況（${T.meta.label}）`, `${esc(T.meta.ScenarioType)}情境`, reportFsHtml_(T, 'rpt-fs-target'), 'rpt-fs-target'));
  if (B) slides.push(slideHtml_(no(), `細車型 FS 損益狀況（${B.meta.label}）`, `${esc(B.meta.ScenarioType)}情境，供參`, reportFsHtml_(B, 'rpt-fs-base'), 'rpt-fs-base'));

  slides.push(slideHtml_(no(), '開發總投（by 部門）', `攤提台數 ${fmt(T.dev.lifeCycleUnits)} 台`, reportDevHtml_(), 'rpt-dev'));
  const errCodes = Object.keys(T.errors || {});
  body.innerHTML = (errCodes.length ? `<div class="callout err no-print">目標情境有公式錯誤（以 0 計）：${errCodes.map(c => esc(reportLineName_(c)) + '：' + esc(T.errors[c])).join('；')}</div>` : '') + slides.join('');
  const sensBox = document.getElementById('rpt-sens');
  if (sensBox) runSensitivity_(sensBox, reportSel.target);
  makeSortable(document.getElementById('rpt-actions-body'), {
    items: 'tr[data-key]',
    onEnd: keys => {
      const old = reportActions;
      reportActions = keys.map(k => old[Number(k)]);

      markDirty('report', saveReport_, () => { clearDirty(); loadReport_(); });
    }

}

function reportSummaryHtml_() {
  const R = reportData, T = R.target, B = R.base;
  const tK = rProfit_(T), bK = B ? rProfit_(B) : null;
  const tRev = T.weighted.P8 || T.weighted.A || 0, bRev = B ? (B.weighted.P8 || B.weighted.A || 0) : 0;
  const tVol = T.volume.monthlyVolume || 0;
  const gap = B ? tK - bK : null;
  const effect = reportActions.reduce((s, a) => s + num(a.Effect), 0);
  const cover = gap && gap > 0 ? effect / gap : null;
  const byStatus = {};
  reportActions.forEach(a => { byStatus[a.Status] = (byStatus[a.Status] || 0) + num(a.Effect); });
  const statusColors = { '已結案': '#6a3dbd', '已確認': '#1c8a59', '進行中': '#3157d5', '規劃中': '#a3acc0' };
  const hero = (cls, label, numV, sub, name) => `<div class="hero ${cls}"><div class="hero-label">${label}</div>${name ? `<div class="hero-name" title="${esc(name)}">${esc(name)}</div>` : ''}<div class="hero-num${numV < 0 ? ' negative' : ''}">${rAmt_(numV)}</div><div class="hero-sub">${sub}</div></div>`;
  const keyCodes = ['A', 'B', 'C', 'E', 'G', 'I'].concat([rK_()]).filter((c, i, a) => a.indexOf(c) === i && T.weighted[c] !== undefined);
  return `
    <div class="kpi-hero">
      ${B ? hero('base', '現況 營業淨利/台', bK, `淨利率 ${rPct_(bK, bRev)}・月 ${fmt((B.volume.monthlyVolume || 0))} 台・月淨利 ${fmt(bK * (B.volume.monthlyVolume || 0) / 10000, 0)} 萬`, B.meta.label) : ''}
      ${hero('target', '目標 營業淨利/台', tK, `淨利率 ${rPct_(tK, tRev)}・月 ${fmt(tVol)} 台・月淨利 ${fmt(tK * tVol / 10000, 0)} 萬` +
        (T.breakEvenVolume !== null && T.breakEvenVolume !== undefined ? `<br>損益兩平月銷量 ≈ <b>${fmt(Math.ceil(T.breakEvenVolume))}</b> 台` : '<br>只靠台數無法損益兩平'), T.meta.label)}
      ${B ? `<div class="hero gap"><div class="hero-label">差距（目標 − 現況）</div><div class="hero-num${gap < 0 ? ' negative' : ''}">${rSigned_(gap)}</div>
        <div class="hero-sub">月效益 ${signed_(gap * tVol / 10000, 0)} 萬・LC ${fmt(T.lifeCycleUnits)} 台合計 ${signed_(gap * T.lifeCycleUnits / 1e8, 2)} 億</div></div>` : ''}
      <div class="hero cover"><div class="hero-label">作法覆蓋率</div>
        <div class="hero-num">${cover === null ? '—' : (cover * 100).toFixed(0) + '%'}</div>
        <div class="hero-sub">作法效果合計 ${rAmt_(effect)}${gap ? `・尚待補足 ${rAmt_(Math.max(0, gap - effect))}` : ''}
          ${B && reconRows_().some(r => r.tone !== 'ok') ? `<br><span class="negative">⚠ ${reconRows_().filter(r => r.tone !== 'ok').length} 個科目作法與數字對不起來</span>` : ''}</div>
        ${gap > 0 ? `<div class="cover-bar">${Object.keys(statusColors).map(st => byStatus[st] ? `<i style="width:${Math.min(100, byStatus[st] / gap * 100)}%;background:${statusColors[st]};" data-tip="${esc(st)} ${fmt(byStatus[st])}"></i>` : '').join('')}</div>` : ''}
      </div>
    </div>
    <div class="grid-scroll"><table class="rpt-table">
      <thead><tr><th style="text-align:left;">重點科目（加權平均）</th>${B ? '<th>現況</th><th>%</th>' : ''}<th>目標</th><th>%</th>${B ? '<th>差距</th>' : ''}<th style="text-align:left;">說明</th></tr></thead>
      <tbody>${keyCodes.map(c => {
        // 營業淨利這一行：現況看自己車型的淨利科目(可能跟目標的代碼不同)
        const bv = B ? (c === rK_() ? bK : B.weighted[c]) : undefined;
        const d = B ? (T.weighted[c] || 0) - (bv || 0) : 0;
        const good = (c === 'B' ? -d : d) > 0.5, bad = (c === 'B' ? -d : d) < -0.5;
        return `<tr class="${c === rK_() ? 'key' : 'subtotal'}"><td class="name">${esc(reportLineName_(c))}</td>
          ${B ? `<td>${rAmt_(bv)}</td><td class="pct">${rPct_(bv, bRev)}</td>` : ''}
          <td>${rAmt_(T.weighted[c])}</td><td class="pct">${rPct_(T.weighted[c], tRev)}</td>
          ${B ? `<td class="${good ? 'gap-good' : bad ? 'gap-bad' : ''}">${rSigned_(d)}</td>` : ''}
          ${noteCellHtml_(T, c)}</tr>`;

    </table></div>
    <p class="help">月銷 ${fmt(tVol)} 台・LC ${esc(String(T.volume.lifeCycleYears || ''))} 年・攤提台數 ${fmt(T.lifeCycleUnits)} 台；車系構成：${(T.vehicles || []).map(v => `${esc(v.VehicleCode)} ${fmt(v.salesMixPct, 1)}%`).join('・')}</p>`;
}

/** 差距拆解：每個科目對營業淨利的影響(已依科目方向換算)，依影響大小排序 */
function reportBridgeContribs_() {
  const R = reportData, T = R.target, B = R.base;
  return R.lines.map(l => {
    const sign = profitSign_(l);
    if (!sign) return null;
    if (R.lines.some(x => x.ParentLine === l.LineCode)) return null;   // 有子科目的群組不重複算
    const d = ((T.weighted[l.LineCode] || 0) - (B.weighted[l.LineCode] || 0)) * sign;
    return Math.abs(d) >= 0.5 ? { code: l.LineCode, label: shortLineName(l.LineName), value: d } : null;
  }).filter(x => x).sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
}
/**
 * 依設定把科目變成長條：同一個合併名稱的科目合成一根；影響小於門檻、或超過根數上限的併成「其他」。
 * 回傳 [{ label, value, tip }]
 */
function bridgeBars_(contribs, cfg) {
  const groups = cfg.groups || {};
  const items = [], byName = {};
  contribs.forEach(c => {
    const g = String(groups[c.code] || '').trim();
    if (!g) { items.push({ label: c.label, value: c.value, members: [c] }); return; }
    if (!byName[g]) { byName[g] = { label: g, value: 0, members: [] }; items.push(byName[g]); }
    byName[g].value += c.value;
    byName[g].members.push(c);
  });
  items.sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
  const topN = num(cfg.topN) > 0 ? Math.floor(num(cfg.topN)) : Infinity, minAbs = Math.max(0, num(cfg.minAbs));
  const shown = [], rest = [];
  items.forEach(it => { (shown.length < topN && Math.abs(it.value) >= minAbs && Math.abs(it.value) >= 0.5 ? shown : rest).push(it); });
  const tipOf = it => it.label + '\n' + signed_(it.value) + ' 元/台' +
    (it.members.length > 1 ? '\n' + it.members.map(m => `・${m.label} ${signed_(m.value)}`).join('\n') : '');
  const bars = shown.map(it => ({ label: it.label, value: it.value, tip: tipOf(it) }));
  const restMembers = [].concat.apply([], rest.map(it => it.members));
  const restSum = restMembers.reduce((a, m) => a + m.value, 0);
  if (restMembers.length && Math.abs(restSum) >= 0.5) {
    const other = { label: `其他 ${restMembers.length} 個科目`, value: restSum, members: restMembers };
    bars.push({ label: other.label, value: restSum, tip: tipOf(other) });
  }
  return bars;
}
/** 差距拆解的每一根(跟瀑布圖工具同一種 steps 格式，所以可以直接「在瀑布圖工具開啟」) */
function reportBridgeSteps_() {
  const R = reportData, T = R.target, B = R.base;
  const contribs = reportBridgeContribs_();
  const start = rProfit_(B), end = rProfit_(T);
  const steps = bridgeBars_(contribs, reportBridgeCfg || defaultBridgeCfg_()).map(b => ({ label: b.label, value: b.value, kind: 'delta', tip: b.tip }));
  const other = (end - start) - contribs.reduce((s, c) => s + c.value, 0);
  if (Math.abs(other) >= 1) steps.push({ label: '公式/取整差異', value: other, kind: 'delta' });
  return [{ label: '現況 營業淨利', value: start, kind: 'total' }].concat(steps, [{ label: '目標 營業淨利', value: end, kind: 'total' }]);
}
/** 差距拆解(瀑布圖)：現況營業淨利 → 各科目的影響 → 目標營業淨利。根數、合併方式可以在「調整長條」設定 */
function reportBridgeHtml_() {
  const contribs = reportBridgeContribs_();
  const cfg = reportBridgeCfg || defaultBridgeCfg_();
  const nGroups = Object.keys(cfg.groups || {}).filter(k => String(cfg.groups[k] || '').trim() && contribs.some(c => c.code === k)).length;
  const actionsByCode = {};
  reportActions.forEach(a => { if (a.LineCode) (actionsByCode[a.LineCode] = actionsByCode[a.LineCode] || []).push(a); });
  return `
    <div class="bridge-tools no-print"><button type="button" class="btn secondary sm" id="rpt-bridge-edit" onclick="editBridgeCfg_()">調整長條（合併科目／顯示幾根）…</button>
      <span class="muted">${num(cfg.topN) > 0 ? `最多 ${Math.floor(num(cfg.topN))} 根` : '不限根數'}${num(cfg.minAbs) > 0 ? `・影響小於 ${fmt(num(cfg.minAbs))} 元/台併入「其他」` : ''}${nGroups ? `・${nGroups} 個科目已合併` : ''}</span></div>
    <div class="bridge-legend"><span><i style="display:inline-block;width:10px;height:10px;background:#2d3748;border-radius:2px;"></i> 營業淨利</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#38a169;border-radius:2px;"></i> 改善</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#e53e3e;border-radius:2px;"></i> 惡化</span>
      <span class="spacer"></span><button type="button" class="btn secondary sm no-print" onclick="openInWaterfallTool_(reportBridgeSteps_(), '營業淨利：現況 → 目標 差距拆解')">在瀑布圖工具開啟</button></div>
    ${wfSvg_(reportBridgeSteps_(), { width: 1180, height: 380, labels: true, fmtV: v => shortAmount_(v / reportUnit) })}
    <div class="two-col" style="margin-top:10px;">
      <div><b style="font-size:13px;">改善最多</b><ul class="problem-list">${contribs.filter(c => c.value > 0).slice(0, 5).map(c =>
        `<li>${esc(c.label)} <b class="good">${rSigned_(c.value)}</b>${actionsByCode[c.code] ? ` — 作法：${actionsByCode[c.code].map(a => esc(a.Title)).join('、')}` : ''}</li>`).join('') || '<li class="muted">（無）</li>'}</ul></div>
      <div><b style="font-size:13px;">惡化最多</b><ul class="problem-list">${contribs.filter(c => c.value < 0).slice(0, 5).map(c =>
        `<li>${esc(c.label)} <b class="bad">${rSigned_(c.value)}</b></li>`).join('') || '<li class="muted">（無）</li>'}</ul></div>
    </div>`;
}
/** 調整長條：每個科目可以填「合併成」的名稱(同名的合成一根)，另外設最多幾根、多小的併入「其他」 */
function editBridgeCfg_() {
  const contribs = reportBridgeContribs_();
  const cfg = reportBridgeCfg || defaultBridgeCfg_();
  const names = Array.from(new Set(Object.keys(cfg.groups || {}).map(k => String(cfg.groups[k] || '').trim()).filter(x => x)));
  const body = `
    <p class="help">同一個「合併成」名稱的科目會合成一根長條（例如把關稅、技酬金、索賠都填「其他成本」）；留白 = 單獨一根。
      設定只存在這台電腦的瀏覽器，每個車型各一份。</p>
    <div class="field-row" style="margin-bottom:10px;">
      <label class="field"><span>最多顯示幾根（0 = 不限）</span><input type="number" min="0" step="1" id="bridge-topn" value="${esc(cfg.topN)}" style="width:120px;"></label>
      <label class="field"><span>影響小於多少元/台併入「其他」</span><input type="number" min="0" step="any" id="bridge-minabs" value="${esc(cfg.minAbs || 0)}" style="width:160px;"></label>
      <button type="button" class="btn secondary sm" style="align-self:flex-end;" onclick="this.closest('dialog').querySelectorAll('.bridge-group').forEach(i => { i.value = ''; })">全部取消合併</button>
    </div>
    <datalist id="bridge-group-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="grid-scroll" style="max-height:50vh;"><table class="grid-table">
      <thead><tr><th style="text-align:left;">科目</th><th>對淨利影響（元/台）</th><th style="text-align:left;">合併成</th></tr></thead>
      <tbody>${contribs.map(c => `<tr><td style="text-align:left;">${esc(c.label)}</td><td class="${c.value < 0 ? 'negative' : ''}" style="text-align:right;">${signed_(c.value)}</td>
        <td><input type="text" class="bridge-group" data-code="${esc(c.code)}" list="bridge-group-names" value="${esc((cfg.groups || {})[c.code] || '')}" placeholder="（單獨一根）" style="width:180px;"></td></tr>`).join('')}</tbody>
    </table></div>`;
  openModal({
    title: '調整差距拆解的長條', body, wide: true, okText: '套用',
    collect: dlg => {
      const groups = Object.assign({}, cfg.groups);   // 這次沒出現的科目(目前沒有差異)保留原本的設定
      dlg.querySelectorAll('.bridge-group').forEach(i => { const v = i.value.trim(); if (v) groups[i.dataset.code] = v; else delete groups[i.dataset.code]; });
      return { topN: Math.max(0, Math.floor(num(dlg.querySelector('#bridge-topn').value))), minAbs: Math.max(0, num(dlg.querySelector('#bridge-minabs').value)), groups };
    }
  }).then(res => {
    if (!res) return;
    reportBridgeCfg = res;
    saveReportPrefs_();
    const box = document.getElementById('rpt-bridge');
    if (box && reportData) box.innerHTML = reportBridgeHtml_();
  });
}
function reportCompareHtml_() {
  const R = reportData, T = R.target, B = R.base;
  const tRev = T.weighted.P8 || 0, bRev = B.weighted.P8 || 0;
  const actionsByCode = {};
  reportActions.forEach(a => { if (a.LineCode) (actionsByCode[a.LineCode] = actionsByCode[a.LineCode] || []).push(a); });
  const rows = R.lines.filter(l => reportShowPrice || !l.isPriceStructure);
  let section = '';
  return `<div class="grid-scroll"><table class="rpt-table" id="rpt-compare">
    <thead><tr><th style="text-align:left;">科目</th><th>現況</th><th>%</th><th>目標</th><th>%</th><th>差距</th><th>對淨利影響</th><th style="text-align:left;">對應作法</th><th style="text-align:left;">說明（目標）</th></tr></thead>
    <tbody>${rows.map(l => {
      let head = '';
      const sec = l.isPriceStructure ? '售價結構' : '損益';
      if (sec !== section) { section = sec; head = `<tr class="section"><td colspan="9">${sec}</td></tr>`; }
      const tv = T.weighted[l.LineCode], bv = B.weighted[l.LineCode];
      const d = (tv || 0) - (bv || 0);
      const sign = l.isSubtotal ? (l.LineCode === 'B' ? -1 : 1) : profitSign_(l);
      const eff = d * sign;
      const cls = !sign || Math.abs(eff) < 0.5 ? '' : eff > 0 ? 'gap-good' : 'gap-bad';
      const acts = actionsByCode[l.LineCode] || [];
      return head + `<tr class="${l.LineCode === rK_() ? 'key' : l.isSubtotal ? 'subtotal' : ''}">
        <td class="name" style="padding-left:${8 + (l.Depth || 0) * 14}px;">${esc(shortLineName(l.LineName))}</td>
        <td>${rAmt_(bv)}</td><td class="pct">${l.isPriceStructure ? '' : rPct_(bv, bRev)}</td>
        <td>${rAmt_(tv)}</td><td class="pct">${l.isPriceStructure ? '' : rPct_(tv, tRev)}</td>
        <td class="${cls}">${Math.abs(d) < 0.5 ? '' : rSigned_(d)}</td>
        <td class="${cls}">${!sign || Math.abs(eff) < 0.5 ? '' : rSigned_(eff)}</td>
        <td class="actions-cell">${acts.map(a => `• ${esc(a.Title)}`).join('<br>')}</td>
        ${noteCellHtml_(T, l.LineCode)}</tr>`;
    }).join('')}</tbody></table></div>`;
}

/**
 * 作法瀑布：現況營業淨利 → 每一項作法的效果 → 目標營業淨利。
 * 作法加總跟實際差距對不起來的部分單獨一根：差距比作法多 =「尚待補足」，作法比差距多 =「作法高估/其他惡化」。
 * 作法超過 10 項時，效果小的併成「其他作法」。表格上改作法，這張圖即時跟著變。
 */
function reportActionWfSteps_() {
  const R = reportData, T = R.target, B = R.base;
  if (!B) return [];
  const start = rProfit_(B), end = rProfit_(T);
  let acts = reportActions.filter(a => String(a.Title || '').trim() && num(a.Effect))
    .map(a => ({ label: a.Title, value: num(a.Effect), kind: 'delta', tip: `${a.Title}\n${[a.LineCode ? reportLineName_(a.LineCode) : '', a.Owner, a.Status].filter(x => x).join('｜')}\n${signed_(num(a.Effect))} 元/台` }));
  if (acts.length > 10) {
    const ranked = acts.slice().sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
    const drop = ranked.slice(9);
    acts = acts.filter(a => drop.indexOf(a) === -1);
    acts.push({ label: `其他 ${drop.length} 項作法`, value: drop.reduce((s, a) => s + a.value, 0), kind: 'delta' });
  }
  const steps = [{ label: `現況 ${reportLineName_(B.profitCode || rK_())}`, value: start, kind: 'total' }].concat(acts);
  const remain = (end - start) - acts.reduce((s, a) => s + a.value, 0);
  if (Math.abs(remain) >= 0.5) steps.push({ label: remain > 0 ? '其他改善（沒有寫成作法）' : '作法高估或其他惡化', value: remain, kind: 'delta', remain: true });
  steps.push({ label: `目標 ${reportLineName_(rK_())}`, value: end, kind: 'total' });
  return steps;
}
function reportActionWaterfallHtml_() {
  const R = reportData;
  if (!R.base) return '';
  const steps = reportActionWfSteps_();
  const start = steps[0].value, end = steps[steps.length - 1].value;
  const remainStep = steps.find(x => x.remain);
  const remain = remainStep ? remainStep.value : 0;
  const total = end - start - remain;
  return `${wfSvg_(steps, { width: 1180, height: 400, labels: true, fmtV: v => shortAmount_(v / reportUnit) })}
    <div class="field-row" style="margin-top:6px;"><span class="muted">作法效果合計 <b>${rSigned_(total)}</b>　現況 → 目標差距 <b>${rSigned_(end - start)}</b>${remainStep ? `　<span class="${remain < 0 ? 'bad' : ''}">${remain > 0 ? '差距中沒有對應作法' : '作法比實際改善多'} <b>${rSigned_(Math.abs(remain))}</b></span>` : '　作法與差距吻合'}</span>
      <span class="spacer"></span><button type="button" class="btn secondary sm no-print" onclick="openInWaterfallTool_(reportActionWfSteps_(), '營業淨利：現況 → 作法 → 目標')">在瀑布圖工具開啟</button></div>`;
}

function updateReportActionTotals_() {
  refreshRecon_();
  refreshActionWaterfall_();
  const R = reportData, vol = R.target.volume.monthlyVolume || 0;
  const total = reportActions.reduce((s, a) => s + num(a.Effect), 0);
  reportActions.forEach((a, i) => { const el = document.getElementById('rpt-act-month-' + i); if (el) el.textContent = fmt(num(a.Effect) * vol / 10000, 1); });
  const t = document.getElementById('rpt-act-total'); if (t) t.textContent = fmt(total);
  const tm = document.getElementById('rpt-act-total-m'); if (tm) tm.textContent = fmt(total * vol / 10000, 1);
  if (R.base) {
    const gap = rProfit_(R.target) - rProfit_(R.base);
    const r = document.getElementById('rpt-act-remain');
    if (r) { r.textContent = fmt(gap - total); r.className = gap - total > 0.5 ? 'negative' : 'good'; }
  }
}

/* ---- 作法對帳：作法寫的效果，跟現況 → 目標的實際數字對得起來嗎？ ---- */
/** 科目對營業淨利的方向(對帳用)：收入/毛利/淨利 +1；成本與費用(含自訂群組) −1；售價結構 0 */
function reconSign_(l) {
  if (!l || l.isPriceStructure) return 0;
  if (l.isProfit || ['A', 'C', 'E', 'G', 'I', 'K'].indexOf(l.LineCode) !== -1) return 1;
  let cur = l, guard = 0;
  while (cur && cur.ParentLine && guard++ < 20) {
    if (cur.ParentLine === 'A') return 1;
    cur = reportData.lines.find(x => x.LineCode === cur.ParentLine);
  }
  return -1;
}
/**
 * 每個科目一列：作法效果合計 vs 實際改善(目標 − 現況，換算成對營業淨利的影響)。
 * 容差：500 元或實際改善的 5%(取大)。沒有掛科目的作法另外列一列，不參與對帳。
 * 實際變動超過 1,000 元/台卻沒有任何作法的科目也列出來 —— 簡報上最容易被問「這個是怎麼降的？」
 */
function reconRows_() {
  const R = reportData, T = R.target, B = R.base;
  if (!B) return [];
  const byCode = {};
  reportActions.forEach(a => {
    if (!String(a.Title || '').trim() && !num(a.Effect)) return;
    const k = a.LineCode || '';
    (byCode[k] = byCode[k] || { effect: 0, actions: [] });
    byCode[k].effect += num(a.Effect);
    byCode[k].actions.push(a);
  });
  const rows = [];
  R.lines.forEach(l => {
    const sign = reconSign_(l);
    const hasKids = R.lines.some(x => x.ParentLine === l.LineCode);
    const actual = ((T.weighted[l.LineCode] || 0) - (B.weighted[l.LineCode] || 0)) * sign;
    const a = byCode[l.LineCode];
    if (!a && (hasKids || !sign || l.isSubtotal || Math.abs(actual) < 1000)) return;
    const effect = a ? a.effect : 0;
    const tol = Math.max(500, Math.abs(actual) * 0.05);
    let status, tone;
    if (!a) { status = actual > 0 ? '有改善但沒有寫作法' : '變差了，沒有對應說明'; tone = 'warn'; }
    else if (Math.abs(effect - actual) <= tol) { status = '吻合'; tone = 'ok'; }
    else if (effect > actual) { status = '作法高估：數字只改善 ' + fmt(actual); tone = 'err'; }
    else { status = '數字改善比作法多 ' + fmt(actual - effect) + '，可補寫作法'; tone = 'warn'; }
    rows.push({ code: l.LineCode, name: shortLineName(l.LineName), effect, actual, diff: effect - actual, status, tone, count: a ? a.actions.length : 0 });
  });
  if (byCode['']) rows.push({ code: '', name: '（作法沒有指定科目）', effect: byCode[''].effect, actual: null, diff: null, status: '無法對帳，建議指定科目', tone: 'warn', count: byCode[''].actions.length });
  return rows;
}

    <div class="grid-scroll"><table class="rpt-table" id="rpt-recon">

/* ================= 目標反推與敏感度分析 =================
 * 「月銷要多少台才損益兩平？」「材料成本要降到多少才達標？」「售價 × 台數的組合下營業淨利是多少？」
 * 所有試算都只在記憶體裡算(後端 WhatIfService.gs)，不會改到任何已存檔的資料。
 */
let whatIfOptions = null;
const WHATIF_PREFS_KEY_ = 'plWhatIf.prefs.v1';
// 目標反推只有一張卡片(multi)：每一列選一種方式(已知調整 / 負責金額 / 補足缺口)；只有一列補足缺口 = 單項反推。
let whatIfPrefs = {
  multi: { metric: 'K', basis: 'unit', target: 0, levers: null },
  sens: { metric: 'K', basis: 'unit', row: 'volume', rowSteps: '-20,-10,0,10,20', col: 'price', colSteps: '-10,-5,0,5,10', inReport: true,
    rowMode: 'pct', rowValues: '', colMode: 'pct', colValues: '' }
};
function loadWhatIfPrefs_() {
  try {
    const p = JSON.parse(localStorage.getItem(WHATIF_PREFS_KEY_) || 'null');
    if (p && p.sens) Object.assign(whatIfPrefs.sens, p.sens);
    if (p && p.multi) Object.assign(whatIfPrefs.multi, p.multi);
    // 舊版的單項反推設定：組合拳還沒設定過時，沿用它當成唯一的一項
    if (p && p.goal && !(p.multi && Array.isArray(p.multi.levers) && p.multi.levers.length)) {
      Object.assign(whatIfPrefs.multi, { metric: p.goal.metric || 'K', basis: p.goal.basis || 'unit', target: p.goal.target || 0,
        levers: [{ driver: p.goal.driver || 'volume', mode: 'fill' }] });
    }
  } catch (e) { /* 用預設 */ }
  if (Array.isArray(whatIfPrefs.multi.levers)) whatIfPrefs.multi.levers = whatIfPrefs.multi.levers.map(normLever_);
}
/**
 * 一列調整項目：{ driver, mode: 'known' | 'amount' | 'fill', by: 'pct' | 'abs' | 'to', known, amount, capPct }
 * 舊版的「固定為」= 已知調整(調到)；舊版的分攤比例拿掉了，其他舊列都當成補足缺口。
 */
function normLever_(l) {
  l = Object.assign({}, l);
  if (!l.mode) l.mode = l.fixed !== '' && l.fixed !== undefined && l.fixed !== null ? 'known' : 'fill';
  if (l.mode === 'known' && l.fixed !== undefined && (l.known === undefined || l.known === '')) { l.by = 'to'; l.known = l.fixed; }
  if (['known', 'amount', 'fill'].indexOf(l.mode) === -1) l.mode = 'fill';
  if (['pct', 'abs', 'to'].indexOf(l.by) === -1) l.by = 'pct';
  ['known', 'amount', 'capPct'].forEach(k => { if (l[k] === undefined || l[k] === null) l[k] = ''; });
  delete l.fixed; delete l.share;
  return l;
}
function saveWhatIfPrefs_() {
  try { localStorage.setItem(WHATIF_PREFS_KEY_, JSON.stringify(whatIfPrefs)); } catch (e) { /* 存不了就算了 */ }
}
/** driver 物件 ⇄ 下拉選單的值 */
function driverKey_(d) { return d.type === 'line' ? 'line:' + d.code : d.type === 'param' ? 'param:' + d.name : d.type === 'fx' ? 'fx:' + d.currency : d.type; }
function driverFromKey_(k) {
  const [t, x] = String(k).split(/:(.*)/);
  if (t === 'line') return { type: 'line', code: x };
  if (t === 'param') return { type: 'param', name: x };
  if (t === 'fx') return { type: 'fx', currency: x };

}
function whatIfDriverInfo_(key) { return whatIfOptions && whatIfOptions.drivers.find(d => driverKey_(d.driver) === key); }

}

/** 常見問題：一鍵帶入目標與調整項目。單項的直接算；組合拳要先確認目標值，不自動算 */
function whatIfPreset_(kind) {
  const m = whatIfPrefs.multi;
  const profit = profitCodeOf_(whatIfOptions);
  const one = driver => [normLever_({ driver, mode: 'fill' })];
  if (kind === 'breakeven-volume') Object.assign(m, { metric: profit, basis: 'unit', target: 0, levers: one('volume') });
  if (kind === 'breakeven-price') Object.assign(m, { metric: profit, basis: 'unit', target: 0, levers: one('price') });
  if (kind === 'material') {
    const lines = whatIfOptions.drivers.filter(d => d.driver.type === 'line').sort((a, b) => Math.abs(b.base) - Math.abs(a.base));
    Object.assign(m, { metric: profit, basis: 'unit', target: Math.max(0, Math.round((whatIfOptions.metrics.find(x => x.code === profit) || {}).value || 0)),
      levers: one(lines.length ? driverKey_(lines[0].driver) : 'volume') });
  }
  if (kind === 'combo') Object.assign(m, { metric: profit, levers: defaultLevers_() });
  saveWhatIfPrefs_();
  drawWhatIf_();
  if (kind !== 'combo') runMultiGoal_();

function parseSteps_(text) {
  const arr = String(text || '').split(/[,，\s]+/).map(x => x.trim()).filter(x => x !== '').map(Number).filter(x => !isNaN(x));
  const uniq = Array.from(new Set(arr.concat([0]))).sort((a, b) => a - b);
  return uniq.slice(0, 11);
}
/** 驅動因子的實際值：基準 × (1 + 幅度%)；參數/匯率也是等比例(5% 稅率 +10% → 5.5%) */
function stepValues_(key, steps) {
  const info = whatIfDriverInfo_(key);
  const base = info ? info.base : 0;
  return steps.map(p => base * (1 + p / 100));
}
/* ---------------- 敏感度分析 ----------------
 * 每一軸可以用「變動幅度 %」(基準 × (1 + %))或直接輸入「自訂值」(例：匯率 4.5, 4.6, 4.8)。
 * 兩種方式都會自動帶入目前的值，表格中間框起來的就是目前的數字。
 */
function sensMode_(axis) { return whatIfPrefs.sens[axis + 'Mode'] === 'value' ? 'value' : 'pct'; }
/** 自訂值：逗號、分號、空白、換行分隔(不要加千分位) */
function parseSensValues_(text) {
  return String(text || '').split(/[,，;；\s]+/).map(x => x.trim()).filter(x => x !== '').map(Number).filter(x => isFinite(x));
}
/** 依基準值的量級取整(4.77 → 0.01、445,556 → 1,000)，切換成自訂值時預填用 */
function roundLike_(v, base) {
  const mag = Math.abs(base) > 0 ? Math.pow(10, Math.floor(Math.log10(Math.abs(base))) - 2) : 1;
  return Number((Math.round(v / mag) * mag).toPrecision(12));
}
function sensPrefill_(axis, base) {
  return parseSteps_(whatIfPrefs.sens[axis + 'Steps']).map(p => roundLike_(base * (1 + p / 100), base)).join(', ');
}
/**
 * 一軸實際要算的值：[{ value, label, sub, isBase }]
 *   %      → 值 = 基準 × (1 + %)，標題「-10%」、副標是實際值
 *   自訂值 → 值照輸入，標題是值、副標是跟目前差幾 %；目前的值一定會加進去(跟輸入的值幾乎一樣時視為同一個)
 */
function sensAxis_(axis, base) {
  const s = whatIfPrefs.sens;
  const dg = v => Math.abs(v) < 100 ? 2 : 0;
  if (sensMode_(axis) === 'pct') {
    return parseSteps_(s[axis + 'Steps']).map(p => {
      const value = base * (1 + p / 100);
      return { value, label: p === 0 ? '目前' : signed_(p) + '%', sub: fmt(value, dg(value)), isBase: p === 0 };
    });
  }
  const same = (a, b) => Math.abs(a - b) <= Math.max(Math.abs(b), 1e-9) * 5e-4;
  const vals = parseSensValues_(s[axis + 'Values']).filter(v => !same(v, base)).slice(0, 10);
  vals.push(base);
  return vals.filter((v, i) => vals.findIndex(x => same(x, v)) === i).sort((a, b) => a - b).map(value => {
    const isBase = value === base;
    const pct = base ? (value / base - 1) * 100 : null;
    return { value, label: isBase ? '目前' : fmt(value, dg(value)),
      sub: isBase ? fmt(value, dg(value)) : pct === null ? '' : signed_(pct, Math.abs(pct) < 10 ? 1 : 0) + '%', isBase };
  });
}
function sensAxisFieldsHtml_(axis, name) {
  const s = whatIfPrefs.sens, mode = sensMode_(axis);
  const seg = `<div class="seg">
      <button type="button" class="seg-btn${mode === 'pct' ? ' active' : ''}" onclick="setSensMode_('${axis}','pct')" data-tip="目前的值 × (1 + %)">變動 %</button>
      <button type="button" class="seg-btn${mode === 'value' ? ' active' : ''}" onclick="setSensMode_('${axis}','value')" data-tip="直接輸入要試算的值，例如匯率 4.5, 4.6, 4.8">自訂值</button></div>`;
  const input = mode === 'pct'
    ? `<label class="field"><span>變動幅度（%，逗號分隔）</span><input type="text" id="wi-sens-${axis}-steps" value="${esc(s[axis + 'Steps'])}" style="width:180px;" oninput="whatIfPrefs.sens.${axis}Steps=this.value;saveWhatIfPrefs_()"></label>`
    : `<label class="field"><span>自訂值（逗號分隔，不要加千分位；目前的值會自動加入）</span><input type="text" id="wi-sens-${axis}-values" value="${esc(s[axis + 'Values'])}" style="width:300px;" oninput="whatIfPrefs.sens.${axis}Values=this.value;saveWhatIfPrefs_()"></label>`;
  return `<label class="field"><span>${name}：調整項目</span><select id="wi-sens-${axis}" onchange="setSensDriver_('${axis}',this.value)">${driverOptionsHtml_(s[axis])}</select></label>
    <div class="field"><span>&nbsp;</span>${seg}</div>${input}`;
}
function setSensMode_(axis, mode) {
  const s = whatIfPrefs.sens;
  s[axis + 'Mode'] = mode;
  if (mode === 'value' && !parseSensValues_(s[axis + 'Values']).length) {
    const info = whatIfDriverInfo_(s[axis]);
    s[axis + 'Values'] = info ? sensPrefill_(axis, info.base) : '';
  }
  saveWhatIfPrefs_();
  drawWhatIf_();
}
/** 換了調整項目：自訂值是上一個項目的數字，用不上了，依新項目的目前值重新預填 */
function setSensDriver_(axis, key) {
  const s = whatIfPrefs.sens;
  s[axis] = key;
  if (sensMode_(axis) === 'value') {
    const info = whatIfDriverInfo_(key);
    s[axis + 'Values'] = info ? sensPrefill_(axis, info.base) : '';
    const el = document.getElementById('wi-sens-' + axis + '-values');
    if (el) el.value = s[axis + 'Values'];

  saveWhatIfPrefs_();
}
function runSensitivity_(targetBox, scenarioId, done) {
  const s = whatIfPrefs.sens;
  const box = targetBox || document.getElementById('wi-sens-result');
  if (!box) return;
  box.innerHTML = '<p class="muted">計算中...</p>';
  const go = opts => {
    const info = k => opts.drivers.find(d => driverKey_(d.driver) === k);
    const ri = info(s.row) || opts.drivers[0], ci = info(s.col) || opts.drivers[1];
    const rows = sensAxis_('row', ri.base), cols = sensAxis_('col', ci.base);
    google.script.run
      .withSuccessHandler(safeHandler(t => { box.innerHTML = sensitivityTableHtml_(t, rows, cols, s, opts); if (done) done(); }))
      .withFailureHandler(err => { box.innerHTML = `<div class="callout err">${esc(err.message)}</div>`; })
      .sensitivityTable(scenarioId || currentScenarioId, { code: s.metric, basis: s.basis }, ri.driver, rows.map(r => r.value), ci.driver, cols.map(c => c.value));
  };
  // 目標反推頁上按「產生表格」：沿用那一頁已經載入的選項。
  // 其他地方(GATE 報告)：那一頁不一定開過(whatIfOptions 還是 null)，開過也可能是別的情境或改資料前載的，一律重新抓
  if (!targetBox && whatIfOptions) go(whatIfOptions);
  else {
    google.script.run.withSuccessHandler(safeHandler(go)).withFailureHandler(err => { box.innerHTML = `<div class="callout err">${esc(err.message)}</div>`; })
      .getWhatIfOptions(scenarioId || currentScenarioId);
  }
}
function sensitivityTableHtml_(t, rows, cols, s, opts) {
  const all = [].concat.apply([], t.cells);
  const maxAbs = Math.max.apply(null, all.map(Math.abs).concat([1]));
  const metric = (opts.metrics.find(m => m.code === s.metric) || {}).label || s.metric;
  const color = v => {
    const a = Math.min(1, Math.abs(v) / maxAbs);
    return v >= 0 ? `rgba(28,138,89,${0.08 + a * 0.32})` : `rgba(210,60,60,${0.08 + a * 0.32})`;
  };
  return `<div class="grid-scroll"><table class="grid-table sens-table">
    <thead>
      <tr><th rowspan="2">${esc(t.rowLabel)} ↓ ／ ${esc(t.colLabel)} →</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr>
      <tr>${cols.map(c => `<th class="th-sub">${esc(c.sub)}</th>`).join('')}</tr>
    </thead>
    <tbody>${t.cells.map((row, i) => `<tr>
      <td class="row-head">${esc(rows[i].label)} <span class="muted">${esc(rows[i].sub)}${rows[i].isBase || sensMode_('row') === 'pct' ? esc(t.rowUnit ? ' ' + t.rowUnit : '') : ''}</span></td>
      ${row.map((v, j) => `<td class="${rows[i].isBase && cols[j].isBase ? 'sens-base' : ''}${v < 0 ? ' negative' : ''}" style="background:${color(v)};">${fmt(v)}</td>`).join('')}
    </tr>`).join('')}</tbody>
  </table></div>
  <p class="help">表內數字：${esc(metric)}${s.basis === 'month' ? '（月總額，元）' : '（加權平均，元/台）'}。綠色 = 正、紅色 = 負，顏色越深絕對值越大。</p>`;
}

/* ---------------- 目標反推(組合拳) ----------------
 * 照會議上實際的講法，每一列選一種方式(後端 solveGoalPlan)：
 *   已知調整  「材料再降 3%」「售價加 5,000」「銷量就是 120 台」—— 直接套用
 *   負責金額  「採購負責 8,000 元/台」—— 算出這一項要調到多少
 *   補足缺口  「剩下的先靠材料(最多 5%)，不夠再漲價」—— 依列表順序補，前一項碰到上限才輪到下一項
 */
const LEVER_MODES_ = { known: '已知調整', amount: '負責金額', fill: '補足缺口' };
/** 組合拳範例：三種方式各一(最大的成本科目降 3%、開發總投負責 2,000、剩下先漲價最多 3%，不夠看銷量) */
function defaultLevers_() {
  const lines = whatIfOptions.drivers.filter(d => d.driver.type === 'line').sort((a, b) => Math.abs(b.base) - Math.abs(a.base));
  const out = [];
  if (lines[0]) out.push({ driver: driverKey_(lines[0].driver), mode: 'known', by: 'pct', known: -3 });
  out.push({ driver: 'dev', mode: 'amount', amount: 2000 });
  out.push({ driver: 'price', mode: 'fill', capPct: 3 });
  out.push({ driver: 'volume', mode: 'fill' });
  return out.map(normLever_);
}
function leverUnit_(info) { return info && info.unit ? info.unit : ''; }
/** 已知調整套用後的值(畫面上即時提示用) */
function knownValue_(l, info) {
  const k = Number(l.known);
  if (!info || l.known === '' || isNaN(k)) return null;
  return l.by === 'to' ? k : l.by === 'abs' ? info.base + k : info.base * (1 + k / 100);
}
function leverSettingHtml_(l, i, amountUnit) {
  const set = (field, redraw) => `whatIfPrefs.multi.levers[${i}].${field}=this.value;saveWhatIfPrefs_()${redraw ? ';drawWhatIf_()' : ''}`;
  const info = whatIfDriverInfo_(l.driver);
  const cap = `<span class="lever-inline">最多調 ±<input type="number" min="0" step="any" value="${esc(l.capPct)}" placeholder="不限" oninput="${set('capPct')}"> %</span>`;
  if (l.mode === 'known') {
    const kv = knownValue_(l, info);
    const dg = info && Math.abs(info.base) < 100 ? 2 : 0;
    return `<span class="lever-inline"><select onchange="${set('by', true)}">
        <option value="pct"${l.by === 'pct' ? ' selected' : ''}>調 %</option>
        <option value="abs"${l.by === 'abs' ? ' selected' : ''}>加減</option>
        <option value="to"${l.by === 'to' ? ' selected' : ''}>調到</option></select>
      <input type="number" step="any" value="${esc(l.known)}" placeholder="${l.by === 'pct' ? '例 -3' : l.by === 'abs' ? '例 -5000' : '例 120'}" onchange="${set('known', true)}">
      ${l.by === 'pct' ? '%' : esc(leverUnit_(info))}
      ${kv !== null ? `<span class="muted">→ ${fmt(kv, dg)} ${esc(leverUnit_(info))}</span>` : ''}</span>`;
  }
  if (l.mode === 'amount') {
    return `<span class="lever-inline">改善 <input type="number" min="0" step="any" value="${esc(l.amount)}" placeholder="例 8000" oninput="${set('amount')}"> ${amountUnit}</span>${cap}`;

}

function addLever_() {
  const used = whatIfPrefs.multi.levers.map(l => l.driver);
  const next = whatIfOptions.drivers.find(d => used.indexOf(driverKey_(d.driver)) === -1);
  if (!next) return;
  whatIfPrefs.multi.levers.push(normLever_({ driver: driverKey_(next.driver), mode: 'fill' }));
  saveWhatIfPrefs_();
  drawWhatIf_();
}
function installLeverSort_() {
  const body = document.getElementById('wi-lever-body');

    whatIfPrefs.multi.levers = keys.map(k => whatIfPrefs.multi.levers[Number(k)]);
    saveWhatIfPrefs_();
    drawWhatIf_();
  } });
}
let lastMultiResult_ = null;
function runMultiGoal_() {
  const m = whatIfPrefs.multi;

  if (m.levers.length === 1 && m.levers[0].mode === 'fill' && String(m.levers[0].capPct).trim() === '') { runGoalSeek_(); return; }
  const box = document.getElementById('wi-multi-result');

    .solveGoalPlan(currentScenarioId, { code: m.metric, basis: m.basis }, num(m.target), levers);

function multiGoalSteps_(r) {
  const metric = whatIfMetricLabel_(whatIfPrefs.multi.metric, whatIfPrefs.multi.basis);
  return [{ label: '目前 ' + metric, value: r.metricBase, kind: 'total' }]

        <td>${esc(l.label)}${l.capped ? '<span class="lever-cap">碰到上限</span>' : ''}${l.note ? `<span class="lever-cap">${esc(l.note)}</span>` : ''}${l.mode === 'fill' && l.value === l.base ? '<span class="muted">（前面的項目已經補滿，不用動）</span>' : ''}</td>

      <button type="button" class="btn secondary sm" onclick="openInWaterfallTool_(multiGoalSteps_(lastMultiResult_), '目標反推：' + whatIfMetricLabel_(whatIfPrefs.multi.metric, whatIfPrefs.multi.basis))">在瀑布圖工具開啟（可編輯、下載 PNG）</button></div>`;

/**
 * 把反推出來的假設寫成一個新情境(複製目前情境的全部資料，再把調整寫實)：

function saveWhatIfScenarioDialog_(levers, summary) {
  const cur = currentScenario || {};
  openModal({
    title: '另存成新情境',
    body: `<p class="help">複製「${esc(scenarioLabel(cur))}」的全部資料（銷售構成、成本、開發總投、費用、參數、報告說明、作法），再把這次反推的調整寫進去：<br><b>${esc(summary || '')}</b></p>`,
    fields: [
      { name: 'Gate', label: 'GATE 別', type: 'select', options: GATE_OPTIONS, value: cur.Gate || 'GATE F' },
      { name: 'ScenarioName', label: '情境名稱', value: (cur.ScenarioName || '') + ' 反推' },
      { name: 'ScenarioType', label: '類型', type: 'select', options: ['目標', '現況'], value: '目標' }

      .withSuccessHandler(safeHandler(res => {

        toast(`已建立「${res.scenario.Gate} ${res.scenario.ScenarioName}」，營業淨利 ${fmt(res.actual)} 元/台` + (diff > 1 ? `（與試算差 ${fmt(diff)}，有科目使用車系個別公式，請檢查）` : ''), diff > 1 ? 'warn' : 'ok', 4000);
        confirmModal('新情境已建立', `要切換到「${esc(res.scenario.Gate + ' ' + res.scenario.ScenarioName)}」嗎？`, '切換過去').then(ok => {
          loadScenarioSelector(ok ? res.scenario.ScenarioID : currentScenarioId);
        });
      }))
      .withFailureHandler(err => toast(err.message, 'err', 4000))
      .saveWhatIfAsScenario(currentScenarioId, levers, v);
  });
}

/* ===== src/ui/47-waterfall.js ===== */
/* ================= 瀑布圖工具 =================
 * 全系統的瀑布圖都集中在這裡(儀表板、GATE 報告、目標反推都有按鈕帶過來)：
 *   兩個情境的差異  現況 → 目標(或任兩個 車型×情境×車系)的營業淨利，差在哪些科目
 *   單一情境損益    一個欄位從收入一路扣到指定的小計，可以看到明細
 *   作法拆解        現況 → 每一項改善作法的效果 → 目標，沒寫作法的差異單獨一根
 *   自訂            自己輸入每一根(也可以把上面任何一張圖「轉成自訂」再改名稱、合併)
 * 圖是純 SVG(跟儀表板同一套)，可以下載 PNG / SVG、複製表格貼到 Excel / PPT。
 */

  end: 'K', level: 'major', basis: 'unit', volumeEffect: true, unit: 1,
  sort: 'pl', topN: 0, minAbs: 0, subtotals: true, labels: true, titles: {},

    { label: '目標營業淨利', value: '', kind: 'total' }

};

/* ---------------- 圖：瀑布 SVG ---------------- */
/**
 * steps = [{ label, value, kind: 'total' | 'delta', tip }]
 *   total = 從 0 畫到 value 的整根(起點、小計、終點)；delta = 從目前累計往上/往下的一段
 * opts = { width, height, fmtV, labels, title }

function wfSvg_(steps, opts) {
  opts = opts || {};
  const W = opts.width || 1100, H = opts.height || 420;
  const fmtV = opts.fmtV || shortAmount_;
  const showLabels = opts.labels !== false;
  const titleH = opts.title ? 26 : 0;
  if (!steps.length) {
    return `<svg class="chart-svg wf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%"><text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="#a0aec0" font-size="13">沒有可以畫的資料</text></svg>`;
  }
  // 先算每一根的上下緣
  let run = 0;
  const bars = steps.map(st => {
    const v = Number(st.value) || 0;
    if (st.kind === 'total') { run = v; return { st, y0: 0, y1: v }; }
    const b = { st, y0: run, y1: run + v };
    run += v;
    return b;
  });
  const vals = [0];
  bars.forEach(b => { vals.push(b.y0, b.y1); });
  let vMin = Math.min.apply(null, vals), vMax = Math.max.apply(null, vals);
  const span = (vMax - vMin) || Math.abs(vMax) || 1;
  if (showLabels) { vMax += span * 0.08; if (vMin < 0) vMin -= span * 0.08; }
  const axis = niceTicks_(vMin, vMax, 6);
  const tickFont = 11;
  const leftPad = Math.max.apply(null, axis.ticks.map(t => textWidth_(fmtV(t), tickFont))) + 14;
  const n = bars.length;
  const gw0 = (W - Math.max(52, leftPad) - 12) / n;
  const labelLines = gw0 < 70 ? 4 : 3;
  const m = { l: Math.max(52, leftPad), r: 12, t: 12 + titleH, b: 16 + labelLines * 13 };
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b;
  const y = v => m.t + plotH - (v - axis.lo) / (axis.hi - axis.lo) * plotH;
  const gw = plotW / n, bw = Math.min(gw * 0.66, 64);
  const xOf = i => m.l + i * gw + (gw - bw) / 2;
  const font = 'font-family="-apple-system,BlinkMacSystemFont,\'Segoe UI\',\'Noto Sans TC\',\'Microsoft JhengHei\',sans-serif"';
  let out = `<svg class="chart-svg wf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" role="img" ${font}>`;
  out += `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
  if (opts.title) out += `<text x="${W / 2}" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">${esc(opts.title)}</text>`;
  axis.ticks.forEach(t => {
    const yy = y(t);
    out += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${t === 0 ? '#718096' : '#e2e8f0'}" stroke-width="${t === 0 ? 1.2 : 1}"/>`;
    out += `<text x="${m.l - 6}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-size="${tickFont}" fill="#718096">${esc(fmtV(t))}</text>`;
  });
  bars.forEach((b, i) => {
    const top = Math.min(y(b.y0), y(b.y1)), bottom = Math.max(y(b.y0), y(b.y1));
    const h = Math.max(bottom - top, 1.5);
    const x = xOf(i);
    const v = b.y1 - b.y0;
    const isTotal = b.st.kind === 'total';
    const color = isTotal ? (b.y1 < 0 ? '#c53030' : '#2d3748') : (v >= 0 ? '#38a169' : '#e53e3e');
    out += `<rect class="bar wf-bar" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}" data-tip="${esc(b.st.tip || (b.st.label + '\n' + (isTotal ? '' : (v >= 0 ? '+' : '')) + fmt(isTotal ? b.y1 : v)))}"/>`;
    // 連接線：這一根的終點 → 下一根的起點
    if (i < n - 1) {
      const yy = y(b.y1);
      out += `<line x1="${(x + bw).toFixed(1)}" x2="${(xOf(i + 1)).toFixed(1)}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>`;
    }
    if (showLabels) {
      const text = isTotal ? fmtV(b.y1) : (v >= 0 ? '+' : '−') + fmtV(Math.abs(v));
      if (textWidth_(text, 10.5) <= gw - 2) {
        const up = isTotal ? b.y1 >= 0 : v >= 0;
        const ly = up ? top - 4 : bottom + 12;
        out += `<text class="bar-label" x="${(x + bw / 2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="${isTotal ? 600 : 400}" fill="#2d3748">${esc(text)}</text>`;
      }
    }
    const lines = wrapLabel_(String(b.st.label || '').replace(/\//g, '／'), gw - 4, 11, labelLines);
    const cx = m.l + i * gw + gw / 2;
    out += `<text class="x-label" x="${cx.toFixed(1)}" y="${(m.t + plotH + 15).toFixed(1)}" text-anchor="middle" font-size="11" fill="#4a5568" font-weight="${isTotal ? 600 : 400}" data-tip="${esc(b.st.label || '')}">`;
    lines.forEach((ln, k) => { out += `<tspan x="${cx.toFixed(1)}" dy="${k === 0 ? 0 : 13}">${esc(ln)}</tspan>`; });
    out += '</text>';
  });
  out += '</svg>';
  return out;
}

/** 自訂模式的列 → steps：小計列沒填數字 = 前面的累計 */
function wfManualSteps_(rows) {
  let run = 0;
  return (rows || []).filter(r => String(r.label || '').trim() || String(r.value) !== '').map(r => {
    const blank = r.value === '' || r.value === null || r.value === undefined || isNaN(Number(r.value));
    if (r.kind === 'total') {
      const v = blank ? run : Number(r.value);
      run = v;
      return { label: r.label, value: v, kind: 'total' };
    }
    const v = blank ? 0 : Number(r.value);
    run += v;
    return { label: r.label, value: v, kind: 'delta' };
  });
}

/* ---------------- 從損益結果組出 steps ---------------- */
/**
 * 看損益表的結構(不寫死科目代碼，自訂科目也適用)：
 *   最上層的科目依呈現順序走；公式引用其他上層科目的是「結果列」(生產毛利 = 收入 − 銷貨成本、營業淨利 = …)，
 *   其他是「增減項」(收入、銷貨成本、前瞻費用…)；結果列底下若有明細(銷貨毛利 = 生產毛利 − Σ明細)，那些明細也是增減項。
 *   對結果的方向：收入 +，其餘成本費用 −；「X + CHILDREN()」型的明細為 +。
 */
function wfStructure_(lines) {
  const pl = lines.filter(l => !l.isPriceStructure);
  const codes = new Set(pl.map(l => l.LineCode));
  const roots = pl.filter(l => !l.ParentLine || !codes.has(l.ParentLine));
  const rootCodes = new Set(roots.map(r => r.LineCode));
  const kids = code => pl.filter(l => l.ParentLine === code);
  const leaves = l => { const k = kids(l.LineCode); return k.length ? [].concat.apply([], k.map(leaves)) : [l]; };
  const isResult = l => (String(l.Formula || '').match(/[A-Za-z_][A-Za-z0-9_]*/g) || []).some(t => t !== l.LineCode && rootCodes.has(t));
  return { pl, roots, kids, leaves, isResult };
}
/** 可以選的「畫到哪一列」：結果列(生產毛利、銷貨毛利…營業淨利) */
function wfEndOptions_(lines) {
  const S = wfStructure_(lines);
  return S.roots.filter(S.isResult);
}
/**
 * 依設定把損益科目分成一根一根的項目，到 endCode 為止。
 * 回傳 [{ key, label, sign, codes, isResult }]，isResult 的項目是中間小計(只在單一情境模式畫)。
 */
function wfItems_(lines, endCode, level) {
  const S = wfStructure_(lines);
  const items = [];
  for (const r of S.roots) {
    const result = S.isResult(r);
    const children = S.kids(r.LineCode);
    if (result) {
      if (children.length) {
        const sign = /-\s*CHILDREN\s*\(/i.test(r.Formula || '') ? -1 : 1;
        if (level === 'detail') [].concat.apply([], children.map(S.leaves)).forEach(l => items.push({ key: l.LineCode, label: shortLineName(l.LineName), sign, codes: [l.LineCode] }));
        else items.push({ key: 'Σ' + r.LineCode, label: SUM_GROUP_NAMES_[r.LineCode] || (shortLineName(r.LineName) + ' 扣除項'), sign, codes: children.map(c => c.LineCode) });
      }
      items.push({ key: r.LineCode, label: shortLineName(r.LineName), isResult: true, codes: [r.LineCode] });
      if (r.LineCode === endCode) break;
      continue;
    }
    const sign = r.LineCode === 'A' || r.Category === '收入' ? 1 : -1;
    if (level === 'detail' && children.length) S.leaves(r).forEach(l => items.push({ key: l.LineCode, label: shortLineName(l.LineName), sign, codes: [l.LineCode] }));
    else items.push({ key: r.LineCode, label: shortLineName(r.LineName), sign, codes: [r.LineCode] });
  }
  return items;
}
function wfFactor_(col, basis) {
  const v = (col && col.volume) || {};
  if (basis === 'year') return (Number(v.monthlyVolume) || 0) * 12;
  if (basis === 'lc') return Number(v.units) || 0;
  return 1;
}
/** 欄位名稱：同車型比較時省略車型，加權平均不寫 */
function wfColName_(c, other) {
  const type = other && other.vehicleTypeLabel === c.vehicleTypeLabel ? '' : c.vehicleTypeLabel;
  return [type, c.scenarioLabel, c.isWeighted ? '' : c.vehicleLabel].filter(x => x).join(' ');
}
function wfBasisLabel_(basis) { return basis === 'year' ? '年度總額' : basis === 'lc' ? 'LC 總額' : '單台'; }
function wfValueOf_(col, codes) { return codes.reduce((s, c) => s + (Number(col.amounts[c]) || 0), 0); }

/** 排序、只留前 N 項、太小的併成「其他」 */
function wfTrim_(deltas) {
  let list = deltas.slice();
  if (wfPrefs.sort === 'abs') list.sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
  const minAbs = Math.abs(num(wfPrefs.minAbs)) * (num(wfPrefs.unit) || 1);
  const topN = Math.max(0, Math.floor(num(wfPrefs.topN)));
  let keep = list.filter(d => d.pinned || Math.abs(d.value) >= Math.max(minAbs, 0.5));
  let rest = list.filter(d => keep.indexOf(d) === -1);
  if (topN && keep.filter(d => !d.pinned).length > topN) {
    const ranked = keep.filter(d => !d.pinned).sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
    const drop = ranked.slice(topN);
    keep = keep.filter(d => drop.indexOf(d) === -1);
    rest = rest.concat(drop);
  }
  const restSum = rest.reduce((s, d) => s + d.value, 0);
  if (rest.length && Math.abs(restSum) >= 0.5) keep.push({ label: `其他（${rest.length} 項）`, value: restSum, kind: 'delta', tip: '其他：\n' + rest.map(d => `${d.label} ${fmt(d.value)}`).join('\n') });
  return keep;
}

function wfBridgeSteps_(cmp) {
  const [cf, ct] = cmp.columns;
  const lines = cmp.lines;
  const chosen = wfEndOptions_(lines).some(l => l.LineCode === wfPrefs.end) ? wfPrefs.end : '';
  // 畫到營業淨利時，兩欄各看自己車型的淨利科目(不同車型可能一個還是 K、一個已經換成別的科目)
  const pf = profitCodeOf_(cf), pt = profitCodeOf_(ct);
  const toProfit = !chosen || chosen === pf || chosen === pt;
  const endFrom = toProfit ? pf : chosen, endTo = toProfit ? pt : chosen;
  const rootOrder = wfStructure_(lines).roots.map(r => r.LineCode);
  const end = rootOrder.indexOf(endTo) >= rootOrder.indexOf(endFrom) ? endTo : endFrom;   // 扣除項列到比較後面的那一個
  const lineOf = code => lines.find(l => l.LineCode === code) || { LineName: code };
  const endLine = lineOf(end);
  const items = wfItems_(lines, end, wfPrefs.level).filter(it => !it.isResult);
  const ff = wfFactor_(cf, wfPrefs.basis), ft = wfFactor_(ct, wfPrefs.basis);
  const splitVolume = wfPrefs.basis !== 'unit' && wfPrefs.volumeEffect;
  const mFrom = (Number(cf.amounts[endFrom]) || 0), mTo = (Number(ct.amounts[endTo]) || 0);
  const start = mFrom * ff, finish = mTo * ft;
  const deltas = [];
  if (splitVolume && Math.abs(ft - ff) > 1e-9) {
    deltas.push({ label: '銷量影響', value: mFrom * (ft - ff), kind: 'delta', pinned: true,
      tip: `銷量影響\n${shortLineName(endLine.LineName)}(單台) ${fmt(mFrom)} × 台數差 ${fmt(ft - ff)}` });
  }
  items.forEach(it => {
    const a = wfValueOf_(cf, it.codes), b = wfValueOf_(ct, it.codes);
    const v = splitVolume ? it.sign * (b - a) * ft : it.sign * (b * ft - a * ff);
    deltas.push({ label: it.label, value: v, kind: 'delta',
      tip: `${it.label}\n${wfColName_(cf, ct)}：${fmt(a)}\n${wfColName_(ct, cf)}：${fmt(b)}（單台）\n對${shortLineName(endLine.LineName)}的影響 ${v >= 0 ? '+' : ''}${fmt(v)}` });
  });
  const residual = (finish - start) - deltas.reduce((s, d) => s + d.value, 0);
  if (Math.abs(residual) >= 0.5) deltas.push({ label: '其他（公式交互/尾差）', value: residual, kind: 'delta', pinned: true, tip: '不能直接歸到單一科目的差異（例如自訂公式的交互作用、四捨五入）' });
  return [{ label: `${wfColName_(cf, ct)} ${shortLineName(lineOf(endFrom).LineName)}`, value: start, kind: 'total' }]
    .concat(wfTrim_(deltas))
    .concat([{ label: `${wfColName_(ct, cf)} ${shortLineName(lineOf(endTo).LineName)}`, value: finish, kind: 'total' }]);
}

function wfStructureSteps_(cmp) {
  const col = cmp.columns[0];
  const lines = cmp.lines;
  const end = wfEndOptions_(lines).some(l => l.LineCode === wfPrefs.end) ? wfPrefs.end : profitCodeOf_(cmp.columns[0]);
  const f = wfFactor_(col, wfPrefs.basis);
  const items = wfItems_(lines, end, wfPrefs.level);
  const steps = [];
  let pending = [];
  const flush = () => { if (pending.length) { wfTrim_(pending).forEach(s => steps.push(s)); pending = []; } };
  items.forEach((it, idx) => {
    if (it.isResult) {
      flush();
      if (wfPrefs.subtotals || it.key === end) steps.push({ label: it.label, value: wfValueOf_(col, it.codes) * f, kind: 'total' });
      return;
    }
    const v = it.sign * wfValueOf_(col, it.codes) * f;
    // 第一根是收入(而且收入只有一根)：畫成從 0 起的整根
    if (idx === 0 && it.sign > 0 && !(items[1] && !items[1].isResult && items[1].sign > 0)) {
      steps.push({ label: it.label, value: v, kind: 'total' });
      return;
    }
    pending.push({ label: it.label, value: v, kind: 'delta', tip: `${it.label}\n${fmt(v)}` });
  });
  flush();
  return steps;
}

function wfActionSteps_(cmp, actions) {
  const [cf, ct] = cmp.columns;
  const mFrom = Number(cf.amounts[profitCodeOf_(cf)]) || 0, mTo = Number(ct.amounts[profitCodeOf_(ct)]) || 0;
  const nameOf = code => { const l = cmp.lines.find(x => x.LineCode === code); return l ? shortLineName(l.LineName) : ''; };
  const deltas = actions.filter(a => String(a.Title || '').trim() && num(a.Effect)).map(a => ({
    label: a.Title, value: num(a.Effect), kind: 'delta',
    tip: `${a.Title}\n${[nameOf(a.LineCode), a.Owner, a.Status].filter(x => x).join('｜')}\n效果 ${fmt(num(a.Effect))} 元/台`
  }));
  const residual = (mTo - mFrom) - deltas.reduce((s, d) => s + d.value, 0);
  if (Math.abs(residual) >= 0.5) deltas.push({ label: '其他差異（沒有對應作法）', value: residual, kind: 'delta', pinned: true, tip: '目標與現況的營業淨利差異中，沒有寫成作法的部分' });
  return [{ label: `${wfColName_(cf, ct)} 營業淨利`, value: mFrom, kind: 'total' }]
    .concat(wfTrim_(deltas))
    .concat([{ label: `${wfColName_(ct, cf)} 營業淨利`, value: mTo, kind: 'total' }]);
}

/* ---------------- 頁面 ---------------- */
function renderWaterfallPanel() {
  const panel = document.getElementById('panel-waterfall');
  if (!panel) return;
  loadWfPrefs_();
  panel.innerHTML = `<p class="page-intro">把任兩個欄位的差異、單一欄位的損益、改善作法，或自己輸入的數字畫成瀑布圖；可以下載 PNG / SVG 或複製表格貼到簡報。</p>
    <div id="wf-body"><p class="muted">載入中...</p></div>`;
  google.script.run
    .withSuccessHandler(safeHandler(res => {
      wfLists = res;
      wfDefaultsFromContext_();
      drawWaterfallTool_();
    }))
    .withFailureHandler(err => { document.getElementById('wf-body').innerHTML = `<div class="callout err">${esc(err.message)}</div>`; })
    .getWaterfallSources();
}
/** 沒選過起點/終點：終點 = 目前情境，起點 = 同車型的「現況」情境(沒有就第一個) */
function wfDefaultsFromContext_() {
  const ids = wfLists.scenarios.map(s => s.ScenarioID);
  if (ids.indexOf(wfPrefs.to.scenarioId) !== -1 && ids.indexOf(wfPrefs.from.scenarioId) !== -1) return;
  // 起點 = 現況、終點 = 目標：目前情境是現況就當起點，否則當終點
  const cur = wfLists.scenarios.find(s => s.ScenarioID === currentScenarioId) || wfLists.scenarios[0] || {};
  const same = wfLists.scenarios.filter(s => s.VehicleTypeID === cur.VehicleTypeID && s.ScenarioID !== cur.ScenarioID);
  const other = type => same.find(s => s.ScenarioType === type) || same[0] || cur;
  const pair = cur.ScenarioType === '現況' ? [cur, other('目標')] : [other('現況'), cur];
  wfPrefs.from = { scenarioId: pair[0].ScenarioID || '', vehicleId: '' };
  wfPrefs.to = { scenarioId: pair[1].ScenarioID || '', vehicleId: '' };
}
function wfScenarioSelectHtml_(side, onlyWeighted) {
  const sel = wfPrefs[side];
  const sc = wfLists.scenarios.find(s => s.ScenarioID === sel.scenarioId) || {};
  const byType = {};
  wfLists.scenarios.forEach(s => { (byType[s.VehicleTypeID] = byType[s.VehicleTypeID] || []).push(s); });
  const vehicles = wfLists.vehicles.filter(v => v.VehicleTypeID === sc.VehicleTypeID);
  return `<select id="wf-${side}-sc" onchange="wfPrefs.${side}={scenarioId:this.value,vehicleId:''};saveWfPrefs_();drawWaterfallTool_()">
      ${Object.keys(byType).map(t => `<optgroup label="${esc(t)}">${byType[t].filter(s => !s.isSnapshot).map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === sel.scenarioId ? ' selected' : ''}>${esc(t + ' ' + scenarioLabel(s))}</option>`).join('')}</optgroup>` +
        (byType[t].some(s => s.isSnapshot) ? `<optgroup label="${esc(t)} 情境快照">${byType[t].filter(s => s.isSnapshot).map(s => `<option value="${esc(s.ScenarioID)}"${s.ScenarioID === sel.scenarioId ? ' selected' : ''}>${esc(t + ' ' + scenarioLabel(s))}</option>`).join('')}</optgroup>` : '')).join('')}
    </select>
    ${onlyWeighted ? '' : `<select id="wf-${side}-v" onchange="wfPrefs.${side}.vehicleId=this.value;saveWfPrefs_();runWaterfall_()">
      <option value="">加權平均</option>
      ${vehicles.map(v => `<option value="${esc(v.VehicleID)}"${v.VehicleID === sel.vehicleId ? ' selected' : ''}>${esc(v.VehicleCode || v.VehicleID)}</option>`).join('')}
    </select>`}`;
}

function drawWaterfallTool_() {
  const body = document.getElementById('wf-body');
  if (!body || !wfLists) return;
  const p = wfPrefs;
  const modes = [['bridge', '兩個欄位的差異'], ['structure', '單一欄位損益'], ['actions', '作法拆解'], ['manual', '自訂']];
  const seg = (key, opts, cur) => `<div class="seg">${opts.map(([v, t]) => `<button type="button" class="seg-btn${String(cur) === String(v) ? ' active' : ''}" onclick="wfPrefs.${key}=${typeof v === 'number' ? v : `'${v}'`};saveWfPrefs_();drawWaterfallTool_()">${t}</button>`).join('')}</div>`;
  const chk = (key, label) => `<label class="chk"><input type="checkbox" ${p[key] ? 'checked' : ''} onchange="wfPrefs.${key}=this.checked;saveWfPrefs_();runWaterfall_()"> ${label}</label>`;
  let source = '';
  if (p.mode === 'bridge') {
    source = `<div class="field-row">
      <label class="field"><span>起點</span><div class="inline">${wfScenarioSelectHtml_('from')}</div></label>
      <label class="field"><span>終點</span><div class="inline">${wfScenarioSelectHtml_('to')}</div></label>
      <button type="button" class="btn secondary sm" style="align-self:flex-end;" onclick="wfSwap_()" data-tip="起點、終點對調">⇄</button></div>`;
  } else if (p.mode === 'structure') {
    source = `<div class="field-row"><label class="field"><span>欄位</span><div class="inline">${wfScenarioSelectHtml_('to')}</div></label></div>`;
  } else if (p.mode === 'actions') {
    source = `<div class="field-row">
      <label class="field"><span>現況情境</span><div class="inline">${wfScenarioSelectHtml_('from', true)}</div></label>
      <label class="field"><span>目標情境（作法掛在這個情境）</span><div class="inline">${wfScenarioSelectHtml_('to', true)}</div></label></div>
      <p class="help">加權平均營業淨利（元/台）：現況 → 目標情境每一項作法的效果 → 目標；作法加總跟實際差異對不起來的部分單獨一根。</p>`;
  }
  const lineOpts = p.mode === 'bridge' || p.mode === 'structure';
  // 不常改的選項收在「進階」；改過(不是預設值)就展開，才不會忘了自己設過

function wfSwap_() {
  const t = wfPrefs.from; wfPrefs.from = wfPrefs.to; wfPrefs.to = t;

function runWaterfall_() {
  const p = wfPrefs;
  const box = document.getElementById('wf-chart');
  if (!box) return;
  if (p.mode === 'manual') { wfLast = { steps: wfManualSteps_(p.manual), title: '' }; wfRedraw_(); return; }
  const sels = p.mode === 'structure' ? [p.to] : [p.from, p.to];
  if (sels.some(s => !s.scenarioId)) { box.innerHTML = '<p class="muted">請先選擇情境。</p>'; return; }
  const selections = sels.map(s => ({ ScenarioID: s.scenarioId, VehicleID: p.mode === 'actions' ? '' : (s.vehicleId || '') }));
  box.innerHTML = '<p class="muted">計算中...</p>';
  const fail = err => { box.innerHTML = `<div class="callout err">${esc(err.message)}</div>`; };
  google.script.run.withFailureHandler(fail).withSuccessHandler(safeHandler(cmp => {
    if (p.mode !== 'manual') wfFillEndOptions_(cmp.lines);
    const colName = c => wfColName_(c, cmp.columns.find(x => x !== c));
    if (p.mode === 'actions') {
      google.script.run.withFailureHandler(fail).withSuccessHandler(safeHandler(actions => {
        if (!actions.some(a => num(a.Effect))) toast('目標情境還沒有填效果的改善作法（GATE 報告「目標成本作法」可以填）', 'warn', 3000);
        wfLast = { steps: wfActionSteps_(cmp, actions), title: `營業淨利：${colName(cmp.columns[0])} → ${colName(cmp.columns[1])}（作法拆解，元/台）` };
        wfRedraw_();
      })).getActions(p.to.scenarioId);
      return;
    }
    const endLine = cmp.lines.find(l => l.LineCode === p.end) || cmp.lines.find(l => l.LineCode === profitCodeOf_(cmp.columns[0])) || {};
    const basis = wfBasisLabel_(p.basis);
    if (p.mode === 'bridge') {
      wfLast = { steps: wfBridgeSteps_(cmp), title: `${shortLineName(endLine.LineName || '')}差異：${colName(cmp.columns[0])} → ${colName(cmp.columns[1])}（${basis}）` };
    } else {
      wfLast = { steps: wfStructureSteps_(cmp), title: `${colName(cmp.columns[0])}：收入到${shortLineName(endLine.LineName || '')}（${basis}）` };
    }
    wfRedraw_();
  })).calculateComparison(selections);
}
function wfFillEndOptions_(lines) {
  const sel = document.getElementById('wf-end');
  if (!sel) return;
  const opts = wfEndOptions_(lines);
  if (!opts.some(o => o.LineCode === wfPrefs.end)) wfPrefs.end = opts.length ? opts[opts.length - 1].LineCode : 'K';
  sel.innerHTML = opts.map(o => `<option value="${esc(o.LineCode)}"${o.LineCode === wfPrefs.end ? ' selected' : ''}>${esc(shortLineName(o.LineName))}</option>`).join('');
}
function wfUnitText_() { const u = num(wfPrefs.unit) || 1; return u === 1000 ? '千元' : u === 10000 ? '萬元' : '元'; }
/** 圖上的數字要短，而且整張圖用同一個單位(刻度與標籤一致)：元 → 萬 / 億；千元、萬元照單位 */
function wfShortFmt_(steps) {
  const u = num(wfPrefs.unit) || 1;
  let run = 0, maxAbs = 0;
  (steps || []).forEach(st => { run = st.kind === 'total' ? Number(st.value) || 0 : run + (Number(st.value) || 0); maxAbs = Math.max(maxAbs, Math.abs(run), Math.abs(Number(st.value) || 0)); });
  if (u === 1 && maxAbs >= 1e8) return v => fmt((Number(v) || 0) / 1e8, 2) + '億';
  if (u === 1 && maxAbs >= 1e5) return v => fmt((Number(v) || 0) / 1e4, 1) + '萬';
  return v => fmt((Number(v) || 0) / u, u === 1 ? 0 : 1);
}
function wfFmt_(v) { const u = num(wfPrefs.unit) || 1; return fmt(v / u, u === 1 ? 0 : 1); }

function wfRedraw_() {
  const box = document.getElementById('wf-chart');
  if (!box || !wfLast) return;
  const title = String(wfTitle_()).trim() || wfLast.title || '';
  const heading = document.getElementById('wf-heading');
  if (heading) heading.textContent = title || '瀑布圖';
  const u = num(wfPrefs.unit) || 1;
  box.innerHTML = wfSvg_(wfLast.steps, { title, labels: wfPrefs.labels, fmtV: wfShortFmt_(wfLast.steps) });
  const tbl = document.getElementById('wf-table');
  if (!tbl) return;
  let run = 0;
  const start = wfLast.steps.length && wfLast.steps[0].kind === 'total' ? wfLast.steps[0].value : 0;
  const end = wfLast.steps.length ? wfLast.steps[wfLast.steps.length - 1] : null;
  const total = end && end.kind === 'total' && wfLast.steps.length > 1 ? end.value - start : null;
  tbl.innerHTML = `<div class="grid-scroll"><table class="grid-table wf-table"><thead><tr><th>項目</th><th>數值（${wfUnitText_()}）</th><th>累計</th>${total ? '<th>占總差異</th>' : ''}</tr></thead>
    <tbody>${wfLast.steps.map(s => {
      if (s.kind === 'total') run = s.value; else run += s.value;
      return `<tr class="${s.kind === 'total' ? 'subtotal' : ''}"><td>${esc(s.label)}</td>
        <td class="amt${s.value < 0 ? ' negative' : ''}">${s.kind === 'delta' && s.value > 0 ? '+' : ''}${wfFmt_(s.value)}</td>
        <td class="amt${run < 0 ? ' negative' : ''}">${wfFmt_(run)}</td>
        ${total ? `<td class="amt">${s.kind === 'delta' ? (s.value / total * 100).toFixed(1) + '%' : ''}</td>` : ''}</tr>`;
    }).join('')}</tbody></table></div>`;
}

/** 貼上兩欄(名稱、數值)，可以有第三欄寫「小計/合計/整根」 */
function wfPasteDialog_() {
  openModal({
    title: '從 Excel 貼上瀑布圖資料', wide: true, okText: '套用',
    body: '<p class="help">每列：名稱 ⇥ 數值（⇥ 類型，可省略）。第一列與最後一列自動當成整根；第三欄寫「小計」「合計」「整根」的也是整根。最後一列數值留空 = 自動累計。</p>',

  }).then(out => {
    if (!out) return;
    const rows = String(out.text || '').split(/\r?\n/).map(l => l.split('\t')).filter(c => c.join('').trim());
    if (!rows.length) return;
    wfPrefs.manual = rows.map((c, i) => {
      const v = parsePastedNumber_(c[1]);
      const isTotal = /小計|合計|整根|total/i.test(c[2] || '') || i === 0 || i === rows.length - 1;

  if (!wfLast || !wfLast.steps.length) return;
  wfPrefs.manual = wfLast.steps.map((s, i) => ({ label: s.label, value: s.kind === 'total' && i > 0 && i === wfLast.steps.length - 1 ? '' : Math.round(s.value), kind: s.kind }));

/**
 * 從其他頁面(儀表板、情境快照、GATE 報告)直接開一張瀑布圖：mode = 'bridge' 兩欄差異 / 'structure' 單一欄位損益 / 'actions' 作法拆解；
 * from/to = { scenarioId, vehicleId }，null = 不改；extra = 其他要一起設定的選項(如 { end: 'K' })。
 * 圖表標題清回自動，避免沿用上一次手動打的標題。
 */
function openWaterfallTool_(mode, from, to, extra) {

  wfPrefs.mode = mode;
  if (extra) Object.assign(wfPrefs, extra);
  if (from) wfPrefs.from = { scenarioId: from.scenarioId || '', vehicleId: from.vehicleId || '' };
  if (to) wfPrefs.to = { scenarioId: to.scenarioId || '', vehicleId: to.vehicleId || '' };

function openInWaterfallTool_(steps, title) {

  wfPrefs.manual = steps.map((s, i) => ({ label: s.label, value: s.kind === 'total' && i === steps.length - 1 && i > 0 ? '' : Math.round(s.value), kind: s.kind }));

/* ---------------- 匯出 ---------------- */
function wfFileName_(ext) {
  const t = String(wfTitle_() || (wfLast && wfLast.title) || '瀑布圖').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60);
  return t + '.' + ext;
}
function wfSaveBlob_(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function wfDownload_(kind) {
  const svg = document.querySelector('#wf-chart svg');
  if (!svg) return;
  const clone = svg.cloneNode(true);
  clone.removeAttribute('width');
  const vb = (svg.getAttribute('viewBox') || '0 0 1100 420').split(/\s+/).map(Number);
  clone.setAttribute('width', vb[2]); clone.setAttribute('height', vb[3]);
  const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  if (kind === 'svg') { wfSaveBlob_(new Blob([text], { type: 'image/svg+xml' }), wfFileName_('svg')); return; }
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = vb[2] * scale; canvas.height = vb[3] * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(b => { if (b) wfSaveBlob_(b, wfFileName_('png')); else toast('瀏覽器不允許輸出圖片，請改用下載 SVG', 'err'); }, 'image/png');
  };
  img.onerror = () => toast('無法轉成 PNG，請改用下載 SVG', 'err');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
}
function wfCopyTable_() {
  if (!wfLast) return;
  let run = 0;
  const rows = [['項目', '數值(' + wfUnitText_() + ')', '累計']].concat(wfLast.steps.map(s => {
    if (s.kind === 'total') run = s.value; else run += s.value;
    const u = num(wfPrefs.unit) || 1;
    return [s.label, String(Math.round(s.value / u * 10) / 10), String(Math.round(run / u * 10) / 10)];
  }));
  const tsv = rows.map(r => r.join('\t')).join('\n');
  const done = () => toast('已複製，可以直接貼到 Excel', 'ok', 1600);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = tsv; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗', 'err'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, fallback);
  else fallback();
}
