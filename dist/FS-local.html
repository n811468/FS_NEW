};
/** 已經併到別頁的舊分頁(記在瀏覽器裡的上次位置、其他頁的「前往」按鈕)：導到新的那一頁 */
const MERGED_TABS_ = { vehicletypes: 'masters', vehicles: 'masters', scenarios: 'masters', paramfx: 'paramrates',
  costofsales: 'costs', operatingexpense: 'costs' };

/* ---------------- 頁籤 / 上方選單 ---------------- */
function switchTab(key, force) {
  if (MATRIX_CONFIG[key]) costsView = key;   // 「前往銷貨成本/營業費用」：到成本與費用頁的那個子頁籤
  key = MERGED_TABS_[key] || key;
  if (!force && key !== currentTab && isDirty_()) {
    confirmLeave_().then(ok => { if (ok) switchTab(key, true); });
    return;
  }
  clearDirty();
  currentTab = key;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  const meta = PAGE_META[key] || ['', ''];
  const crumb = document.getElementById('page-crumb'), title = document.getElementById('page-title');
  if (crumb) crumb.textContent = meta[0];
  if (title) title.textContent = meta[1];
  document.body.classList.remove('nav-open');
  saveAppState_();
  renderTab(key);
}

/**
 * 記住「目前在哪一頁、選了哪個車型/情境」，讓整頁重新載入後能回到原本的位置。
 * 地端版匯入資料包、載入示範資料後都會整頁重新載入，使用者自己按 F5 也是；沒有這層記憶的話，
 * 畫面每次都會跳回「車型主檔」分頁、車型/情境選單也重設成第一筆。存最基本的三個狀態就好，
 * 表格編輯頁裡「還沒存檔的修改」本來就無法安全地跨頁面重新載入還原，不在這裡處理。
 */
const APP_STATE_KEY_ = 'plApp.state.v1';
function saveAppState_() {
  try {
    localStorage.setItem(APP_STATE_KEY_, JSON.stringify({
      tab: currentTab, vehicleTypeId: currentVehicleTypeId, scenarioId: currentScenarioId
    }));
  } catch (e) { /* 無痕模式等情況存不了就算了，不影響功能 */ }
}
function loadAppState_() {
  try {
    const s = JSON.parse(localStorage.getItem(APP_STATE_KEY_) || 'null');
    if (s && typeof s === 'object') return s;
  } catch (e) { /* 壞掉的資料當作沒有 */ }
  return {};
}

function renderTab(key) {
  if (silent) return;
  if (key === 'dashboard') loadComparisonPicker();
  else if (key === 'report') renderReportPanel();
  else if (key === 'whatif') renderWhatIfPanel();
  else if (key === 'waterfall') renderWaterfallPanel();
  else if (key === 'lineitems') renderChartPanel();
  else if (GRID_PANELS[key]) window[GRID_PANELS[key]]();
  else if (key === 'masters') renderMastersPanel();
}

/** 開場：車型 + 情境一次取回，期間不重繪，最後只渲染一次目前分頁 */
function loadVehicleTypeSelector(preferredId, preferredScenarioId) {
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(data => {
      renderVehicleTypeOptions(data.vehicleTypes || [], data.vehicleTypeId);
      currentVehicleTypeId = data.vehicleTypeId || '';
      renderScenarioOptions(data.scenarios || [], preferredScenarioId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); renderTab(currentTab); })
    .getBootstrap(preferredId || currentVehicleTypeId);
}

function renderVehicleTypeOptions(types, pick) {
  const sel = document.getElementById('vehicletype-selector');
  sel.innerHTML = '<option value="">-- 選擇車型 --</option>' +
    types.map(t => `<option value="${esc(t.VehicleTypeID)}">${esc(t.VehicleTypeID)}</option>`).join('');
  sel.value = pick || '';
}

/** 把情境選單畫出來並決定選哪一個，不觸發伺服器呼叫 */
function renderScenarioOptions(scenarios, preferredId) {
  scenarioCache = scenarios || [];
  const sel = document.getElementById('scenario-selector');
  sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
    scenarioCache.map(s => `<option value="${esc(s.ScenarioID)}">${esc(scenarioLabel(s))}</option>`).join('');
  const ids = scenarioCache.map(s => s.ScenarioID);
  const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
    : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
    : ids[0] || '';
  sel.value = pick;
  setCurrentScenario(pick);
}

/** 只更新目前情境狀態與標籤，渲染交給呼叫端決定 */
function setCurrentScenario(value) {
  currentScenarioId = value;
  currentScenario = scenarioCache.filter(s => s.ScenarioID === value)[0] || null;
  const badge = document.getElementById('scenario-type-badge');
  if (badge) {
    const t = currentScenario ? (currentScenario.ScenarioType || '現況') : '';
    badge.textContent = t;
    badge.className = 'type-badge t-' + t;
    badge.style.display = currentScenario ? 'inline-flex' : 'none';
  }
  saveAppState_();
}

function onVehicleTypeChange(value) {
  if (isDirty_()) {
    const sel = document.getElementById('vehicletype-selector');
    sel.value = currentVehicleTypeId;
    confirmLeave_().then(ok => { if (ok) { sel.value = value; onVehicleTypeChange(value); } });
    return;
  }
  currentVehicleTypeId = value;
  currentScenarioId = '';
  currentScenario = null;
  saveAppState_();
  // 車型換了之後情境清單也要換，換完才渲染一次，避免同一個分頁畫兩遍
  loadScenarioSelector();
}

function loadScenarioSelector(preferredId) {
  const sel = document.getElementById('scenario-selector');
  if (!currentVehicleTypeId) {
    sel.innerHTML = '<option value="">-- 請先選車型 --</option>';
    scenarioCache = [];
    setCurrentScenario('');
    renderTab(currentTab);
    return;
  }
  silent = true;
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      renderScenarioOptions(scenarios, preferredId);
      silent = false;
      renderTab(currentTab);
    }))
    .withFailureHandler(err => { silent = false; showGlobalError(err); })
    .getScenarios(currentVehicleTypeId);
}

function onScenarioChange(value) {
  if (isDirty_()) {
    const sel = document.getElementById('scenario-selector');
    sel.value = currentScenarioId;
    confirmLeave_().then(ok => { if (ok) { sel.value = value; onScenarioChange(value); } });
    return;
  }
  setCurrentScenario(value);
  renderTab(currentTab);
}

/* ================= 從 Excel 貼上 =================
 * 在任何表格的輸入格按 Ctrl+V，如果剪貼簿是從 Excel 複製的「一整塊」(有 Tab 或換行)，
 * 就從目前這一格開始往右、往下依序填進去，不必一格一格輸入。
 * 填完會觸發每一格原本的 input 事件，連動計算(構成比、加權平均、低減後金額…)與未儲存提醒都照常運作。
 */
/** Excel 複製出來的數字：去掉千分位逗號、空白、貨幣符號；(1,234) 視為負數；「-」視為 0；百分比去掉 % */
function parsePastedNumber_(s) {
  let t = String(s === undefined || s === null ? '' : s).trim();
  if (!t) return '';
  if (/^[-–—]$/.test(t)) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  t = t.replace(/[,\s$¥￥]|NT\$|TWD|元/gi, '').replace(/%$/, '');
  if (/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(t)) return (neg ? -1 : 1) * Number(t);
  return null;
}
/** 剪貼簿文字 → 二維陣列(去掉 Excel 多帶的最後一個空行) */
function parseClipboardGrid_(text) {
  const rows = String(text || '').replace(/\r/g, '').split('\n');
  while (rows.length && rows[rows.length - 1] === '') rows.pop();
  return rows.map(r => r.split('\t'));
}
function installExcelPaste_() {
  document.addEventListener('paste', e => {
    const el = e.target;
    if (!el || !el.closest || !/^(INPUT|SELECT)$/.test(el.tagName)) return;
    const td = el.closest('td');
    const table = el.closest('table.grid-table');
    if (!td || !table || el.closest('.modal')) return;
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!/[\t\n]/.test(String(text).replace(/\r?\n$/, ''))) return;   // 單一格就照瀏覽器原本的貼上
    e.preventDefault();
    const grid = parseClipboardGrid_(text);
    const tr = td.parentElement;
    const body = tr.parentElement;
    const rows = Array.from(body.children).filter(r => r.tagName === 'TR' && r.style.display !== 'none' && !r.hidden);
    const r0 = rows.indexOf(tr), c0 = Array.from(tr.children).indexOf(td);
    let filled = 0, skipped = 0;
    grid.forEach((cells, dr) => {
      const row = rows[r0 + dr];
      if (!row) { skipped += cells.length; return; }
      cells.forEach((raw, dc) => {
        const cell = row.children[c0 + dc];
        const input = cell && cell.querySelector('input:not([type=checkbox]):not([disabled]),select:not([disabled])');
        if (!input) { if (String(raw).trim()) skipped++; return; }
        let v = raw.trim();
        if (input.type === 'number') {
          const n = parsePastedNumber_(v);
          if (n === null) { skipped++; return; }
          v = n === '' ? '' : String(n);
        } else if (input.tagName === 'SELECT') {
          const opt = Array.from(input.options).find(o => o.value === v || o.text === v);
          if (!opt) { skipped++; return; }
          v = opt.value;
        }
        input.value = v;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        filled++;
      });
    });
    toast(`已從剪貼簿填入 ${filled} 格` + (skipped ? `，${skipped} 格無法填入（超出表格、唯讀或不是數字）` : '') + '。確認後記得儲存。', skipped ? 'warn' : 'ok', 4500);
  });
}

/* ===== src/ui/10-masters.js ===== */
/* ---------------- 主檔維護（表格直接編輯，不需要先按「編輯」） ----------------
 * 車型、車系、情境三個表格放在同一頁「車型與情境」(以前是三個分頁)：每個表格各有自己的儲存鈕，
 * 底部的「儲存」/Ctrl+S 會把每個改過的表格都存起來(見 markDirtyPart_)。 */
let entityRows = {};        // key -> 目前表格上的資料列（__existing 標記是否已存在於後端）
let pendingStatus = null;   // 重畫表格後才顯示的訊息（例如建立情境後整個面板會被重繪）

function renderMastersPanel() {
  const panel = document.getElementById('panel-masters');
  if (!panel) return;
  const vt = currentVehicleTypeId;
  const section = (key, title) => `<div class="card master-card" id="master-${key}">
      <div class="card-head"><h3>${title}</h3></div>
      ${ENTITIES[key].scopedBy === 'vehicleType' && !vt
        ? '<p class="muted">請先在上面建立車型，或在右上角選擇車型。</p>'
        : gridShell(key, ENTITIES[key].label, ENTITIES[key].intro)}
    </div>`;
  panel.innerHTML = section('vehicletypes', '車型') +
    section('vehicles', `車系${vt ? `<span class="muted">（${esc(vt)}）</span>` : ''}`) +
    section('scenarios', `情境${vt ? `<span class="muted">（${esc(vt)}）</span>` : ''}`) +
    (vt ? snapshotCardShellHtml_() : '');
  Object.keys(ENTITIES).forEach(key => { if (ENTITIES[key].scopedBy !== 'vehicleType' || vt) loadEntityData(key); });
  if (vt) loadSnapshotCard_();
}
function entityDirty_(key) {
  markDirtyPart_('masters', key, () => saveEntityGrid(key), () => { clearDirtyPart_(key); loadEntityData(key); });
}

/** ENTITIES 的 scopedBy 只有 'vehicleType' 或 null，剛好對應到快取鍵要區分到什麼程度 */
function entityCacheScope_(cfg) { return cfg.scopedBy === 'vehicleType' ? 'vehicleType' : 'none'; }

function loadEntityData(key) {
  const cfg = ENTITIES[key];
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId] : [];
  const cacheKey = panelCacheKey_(key, entityCacheScope_(cfg));
  const apply = rows => {
    // 使用者已經開始改這個表格了，背景回來的資料不要蓋掉畫面
    if (dirtyState_ && (dirtyState_.parts ? dirtyState_.parts[key] : dirtyState_.key === key)) return;
    entityRows[key] = (rows || []).map(r => Object.assign({}, r, { __existing: true }));
    drawEntityGrid(key);
  };
  if (panelDataCache_[cacheKey]) apply(panelDataCache_[cacheKey]);
  google.script.run
    .withSuccessHandler(safeHandler(rows => { panelDataCache_[cacheKey] = rows; apply(rows); }))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function drawEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = entityRows[key] || [];
  const toolbar = document.getElementById('toolbar-' + key);
  if (!toolbar) return;

  toolbar.innerHTML = (cfg.createUi === 'scenario' ? scenarioToolbarHtml() : cfg.createUi === 'vehicleType'
    ? `<button type="button" class="btn" onclick="createVehicleTypeDialog()">＋ 新增車型</button>`
    : `<button type="button" class="btn" onclick="addEntityRow('${key}')">＋ 新增一列</button>`) +
    `<span class="spacer"></span><button type="button" class="btn secondary" onclick="saveEntityGrid('${key}')">儲存</button>`;

  const sortable = cfg.sortable && rows.length > 1;
  const body = rows.length
    ? rows.map((r, i) => `<tr${r.__existing ? '' : ' class="new-row"'} data-key="${i}">
        ${sortable ? `<td class="row-actions">${r.__existing ? dragHandleHtml() : ''}</td>` : ''}
        ${cfg.columns.map(col => entityCellHtml(key, i, col, r)).join('')}
        <td class="row-actions">${entityRowActionHtml(key, i, r, rows.length)}</td>
      </tr>`).join('')
    : `<tr><td class="muted" colspan="${cfg.columns.length + 2}" style="text-align:center;padding:24px;">尚無資料</td></tr>`;

  document.getElementById('grid-' + key).innerHTML = `
    <div class="grid-scroll">
      <table class="grid-table entity-table">
        <thead><tr>${sortable ? '<th style="width:36px;"></th>' : ''}${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th>操作</th></tr></thead>
        <tbody id="entity-body-${key}">${body}</tbody>
      </table>
    </div>`;

  if (sortable) {
    makeSortable(document.getElementById('entity-body-' + key), {
      items: 'tr[data-key]',
      onEnd: keys => {
        const old = entityRows[key];
        entityRows[key] = keys.map(k => old[Number(k)]);
        if (entityRows[key].some(r => !r.__existing)) {
          drawEntityGrid(key);
          toast('新增的列還沒儲存，先按「儲存」後再調整順序會立即生效', 'warn');
          return;
        }
        const ids = entityRows[key].map(r => r[cfg.pk]);
        drawEntityGrid(key);
        google.script.run
          .withSuccessHandler(safeHandler(saved => {
            panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
            Object.keys(panelDataCache_).forEach(k => { if (k.indexOf(key + '::') !== 0) delete panelDataCache_[k]; });
            toast('已更新順序', 'ok', 1400);
            if (key === 'scenarios') refreshScenarioOptions(currentScenarioId);
          }))
          .withFailureHandler(err => { toast(err.message, 'err'); loadEntityData(key); })
          [cfg.sortable](currentVehicleTypeId, ids);
      }
    });
  }
  if (pendingStatus && pendingStatus.key === key) {
    setStatus(key, pendingStatus.text, pendingStatus.cls);
    pendingStatus = null;
  }
}

function entityCellHtml(key, i, col, row) {
  const value = row[col.name] === undefined || row[col.name] === null ? '' : row[col.name];
  const locked = col.readOnly || col.auto ||
    (col.lockAfterCreate && row.__existing) ||
    (col.lockIf && col.lockIf(row));
  const style = col.width ? ` style="width:${col.width}px;"` : '';

  if (locked) {
    const shown = col.auto && !value ? '(儲存時自動編號)' : value;
    return `<td class="row-head">${esc(shown)}</td>`;
  }
  if (col.type === 'select') {
    const options = col.options.map(o => {
      const [v, text] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}"${String(value) === String(v) ? ' selected' : ''}>${esc(text)}</option>`;
    }).join('');
    return `<td><select${style} onchange="onEntityField('${key}', ${i}, '${col.name}', this.value)">${options}</select></td>`;
  }
  return `<td><input type="${col.type || 'text'}" step="any" value="${esc(value)}"${style}
    oninput="onEntityField('${key}', ${i}, '${col.name}', this.value)"></td>`;
}

function entityRowActionHtml(key, i, row) {
  if (!row.__existing) {
    return `<button type="button" class="btn ghost sm" onclick="removeEntityRow('${key}', ${i})">移除</button>`;
  }
  const cfg = ENTITIES[key];
  const renameBtn = cfg.renameFn
    ? `<button type="button" class="btn ghost sm" onclick="renameEntityRow('${key}', ${i})">改代號</button>` : '';
  return renameBtn + `<button type="button" class="btn danger sm" onclick="deleteEntityRow('${key}', ${i})">刪除</button>`;
}

/**
 * 車型/車系代號重新命名：代號是其他表格的外鍵，不能直接在格子裡改字串，
 * 改用後端的 rename 函式一次把所有引用該代號的地方(含科目表、作法、車系個別公式)都更新過去。
 */
function renameEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const oldId = row[cfg.pk];
  openModal({
    title: '修改代號：' + oldId,
    body: '<p class="help">所有引用這個代號的資料（車系、情境、銷售構成、成本、科目表…）會一起改成新代號。</p>',
    fields: [{ name: 'id', label: '新的代號', value: oldId }],
    okText: '修改',
    validate: v => !v.id.trim() ? '代號不能空白' : ''
  }).then(v => {
    if (!v) return;
    const newId = v.id.trim();
    if (newId === oldId) return;
    const args = key === 'vehicles' ? [currentVehicleTypeId, oldId, newId] : [oldId, newId];
    setStatus(key, '修改中...');
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        pendingStatus = { key: key, text: `已將「${oldId}」改為「${newId}」`, cls: 'ok' };
        // 改的是目前的車型：同一頁下面的車系/情境標題也要跟著換，整頁重新載入
        if (key === 'vehicletypes' && currentVehicleTypeId === oldId) { currentVehicleTypeId = newId; loadVehicleTypeSelector(newId); return; }
        loadEntityData(key);
        afterEntityChange(key);
      }))
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
      [cfg.renameFn](...args);
  });
}

function onEntityField(key, i, field, value) {
  entityRows[key][i][field] = value;
  entityDirty_(key);
  if (key === 'scenarios' && (field === 'CreatedDate' || field === 'ScenarioType')) {
    autoFillScenarioName_(i);
  }
}

/** yyyy-MM-dd -> "MMDD"，用來組情境名稱的日期後綴 */
function dateToMMDD_(dateStr) {
  const m = String(dateStr || '').match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? m[1] + m[2] : '';
}

/**
 * 情境名稱自動帶入：選了建立日期(或改了情境性質)後，把名稱補成「情境性質+MMDD」(如「現況0901」)。
 * 只在名稱是空白、或還是上一次自動帶入的值時才覆蓋 —— 使用者手動打過的名稱不會被蓋掉。
 */
function autoFillScenarioName_(i) {
  const row = entityRows.scenarios[i];
  const suffix = dateToMMDD_(row.CreatedDate);
  if (!suffix) return;
  const auto = (row.ScenarioType || '') + suffix;
  if (!row.ScenarioName || row.ScenarioName === row.__scenarioNameAuto) {
    row.ScenarioName = auto;
    row.__scenarioNameAuto = auto;
    drawEntityGrid('scenarios');
  }
}

function addEntityRow(key) {
  const cfg = ENTITIES[key];
  const row = { __existing: false };
  cfg.columns.forEach(c => { row[c.name] = ''; });
  if (cfg.pk) row[cfg.pk] = '';
  entityRows[key].push(row);
  drawEntityGrid(key);
  entityDirty_(key);
  const inputs = document.querySelectorAll(`#entity-body-${key} tr:last-child input`);
  if (inputs[0]) inputs[0].focus();
}

/** 還沒存進後端的新增列，直接從畫面上拿掉就好 */
function removeEntityRow(key, i) {
  entityRows[key].splice(i, 1);
  drawEntityGrid(key);
}

function deleteEntityRow(key, i) {
  const cfg = ENTITIES[key];
  const row = entityRows[key][i];
  const label = row[cfg.pk] && cfg.pk !== 'ScenarioID' ? row[cfg.pk] : scenarioLabel(row);
  confirmModal('刪除「' + label + '」？', key === 'vehicletypes'
    ? '車型與它自己的科目表會一起刪除。底下的車系與情境資料不會被刪，但會看不到。這個動作無法復原。'
    : '這個動作無法復原。', '刪除', true).then(ok => {
    if (!ok) return;
    setStatus(key, '刪除中...');
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        pendingStatus = { key: key, text: '已刪除', cls: 'ok' };
        // 刪掉的是目前的車型：換到剩下的車型，同一頁下面的車系/情境一起換
        if (key === 'vehicletypes' && currentVehicleTypeId === row[cfg.pk]) { currentVehicleTypeId = ''; loadVehicleTypeSelector(''); return; }
        loadEntityData(key);
        afterEntityChange(key);
      }))
      .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
      [cfg.deleteFn](row[cfg.pk]);
  });
}

function saveEntityGrid(key) {
  const cfg = ENTITIES[key];
  const rows = (entityRows[key] || []).map(r => {
    const copy = {};
    cfg.columns.forEach(c => { copy[c.name] = r[c.name] === undefined ? '' : r[c.name]; });
    if (cfg.pk) copy[cfg.pk] = r[cfg.pk] === undefined ? '' : r[cfg.pk];
    return copy;
  });
  const args = cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId, rows] : [rows];

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(safeHandler(saved => {
      clearDirtyPart_(key);
      panelDataCache_[panelCacheKey_(key, entityCacheScope_(cfg))] = saved;
      entityRows[key] = (saved || []).map(r => Object.assign({}, r, { __existing: true }));
      drawEntityGrid(key);
      setStatus(key, '已儲存', 'ok');
      afterEntityChange(key);
    }))
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))
    [cfg.saveGridFn](...args);
}

/** 新增車型：同時決定這個車型的科目表從哪裡開始(標準範本，或複製某個既有車型) */

    google.script.run

/** 車型/情境改動後，上方的選單也要跟著更新（但不要重畫目前這個分頁） */
function afterEntityChange(key) {
  if (key === 'vehicletypes') refreshVehicleTypeOptions();
  if (key === 'scenarios') refreshScenarioOptions();
}

function refreshVehicleTypeOptions() {
  google.script.run.withSuccessHandler(safeHandler(types => {
    renderVehicleTypeOptions(types || [], currentVehicleTypeId);
  })).getVehicleTypes();
}

function refreshScenarioOptions(preferredId) {

/* ---- 情境：以既有情境為基礎建立 / 把既有情境的資料帶進目前情境 ----
 * 平常用不到的表單不佔畫面：兩顆按鈕，按了才跳出對話框(要帶入哪些資料的勾選也在對話框裡)。 */
function scenarioToolbarHtml() {
  const hasOthers = (entityRows.scenarios || []).some(s => s.__existing);
  return `<button type="button" class="btn" onclick="createScenarioDialog()">＋ 新增情境…</button>
    <button type="button" class="btn secondary" onclick="importIntoCurrentScenarioDialog()"${hasOthers && currentScenarioId ? '' : ' disabled'}
      data-tip="把另一個情境的資料(可勾選類別)複製進右上角目前選的情境">帶入目前情境…</button>`;
}
function scenarioSourceOptions_(excludeId) {
  return (entityRows.scenarios || []).filter(s => s.__existing && s.ScenarioID !== excludeId).map(s => [s.ScenarioID, scenarioLabel(s)]);
}
const COPY_PARTS_FIELD_ = () => ({ name: 'parts', label: '要帶入的資料', type: 'checks',
  options: SCENARIO_COPY_PARTS.map(p => [p.key, p.label]), value: SCENARIO_COPY_PARTS.map(p => p.key) });

function createScenarioDialog() {
  const autoName = type => type + dateToMMDD_(today());
  let lastAuto = autoName(SCENARIO_TYPES[0]);
  const done = openModal({
    title: '新增情境',
    fields: [
      { name: 'gate', label: 'GATE 別', type: 'select', options: GATE_OPTIONS, value: GATE_OPTIONS[0] },
      { name: 'type', label: '情境性質', type: 'select', options: SCENARIO_TYPES, value: SCENARIO_TYPES[0] },
      { name: 'name', label: '情境名稱', value: lastAuto, placeholder: '例：現況0901' },
      { name: 'source', label: '以既有情境為基礎', type: 'select', options: [['', '(不帶入，建立空白情境)']].concat(scenarioSourceOptions_('')), value: '' },
      Object.assign(COPY_PARTS_FIELD_(), { help: '有選「以既有情境為基礎」時才會帶入' })
    ],
    okText: '建立情境',
    validate: v => !v.name.trim() ? '請輸入情境名稱' : (v.source && !v.parts.length ? '請至少勾選一項要帶入的資料，或把來源改成「不帶入」' : '')
  });
  // 情境名稱還是自動帶入的值時，改情境性質就跟著換(現況0901 → 目標0901)
  const dlg = document.querySelector('dialog.modal:last-of-type');
  const typeEl = dlg && dlg.querySelector('#mf-1'), nameEl = dlg && dlg.querySelector('#mf-2');
  if (typeEl && nameEl) typeEl.addEventListener('change', () => {
    if (!nameEl.value || nameEl.value === lastAuto) { lastAuto = autoName(typeEl.value); nameEl.value = lastAuto; }
  });
  done.then(v => {
    if (!v) return;
    setStatus('scenarios', '建立中...');
    google.script.run
      .withSuccessHandler(safeHandler(saved => {
        pendingStatus = { key: 'scenarios', text: v.source ? '已建立情境，並帶入來源情境的資料' : '已建立情境', cls: 'ok' };
        loadEntityData('scenarios');
        refreshScenarioOptions(saved && saved.ScenarioID);
      }))
      .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
      .createScenarioFrom({
        ScenarioID: '', Gate: v.gate, ScenarioName: v.name.trim(), ScenarioType: v.type,
        VehicleTypeID: currentVehicleTypeId, CreatedDate: today(), Notes: ''
      }, v.source, v.source ? v.parts : []);
  });
}

function importIntoCurrentScenarioDialog() {
  if (!currentScenarioId) { toast('請先在右上角選擇要帶入的目標情境', 'warn'); return; }
  const sources = scenarioSourceOptions_(currentScenarioId);
  if (!sources.length) { toast('這個車型沒有其他情境可以帶入', 'warn'); return; }
  openModal({
    title: '帶入目前情境：' + (currentScenario ? scenarioLabel(currentScenario) : ''),
    body: '<p class="help">會先清掉目前情境所勾選類別的資料，再整批複製來源情境的內容（開發總投的挑戰低減目標會清空，請重新填寫）。</p>',
    fields: [
      { name: 'source', label: '來源情境', type: 'select', options: sources, value: sources[0][0] },
      COPY_PARTS_FIELD_()
    ],
    okText: '帶入', danger: true,
    validate: v => !v.parts.length ? '請至少勾選一項要帶入的資料' : ''
  }).then(v => {
    if (!v) return;
    setStatus('scenarios', '帶入中...');
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
        setStatus('scenarios', '已帶入來源情境的資料（開發總投的挑戰低減目標已清空，請重新填寫）', 'ok');
      }))
      .withFailureHandler(err => setStatus('scenarios', '錯誤：' + err.message, 'err'))
      .copyScenarioData(v.source, currentScenarioId, v.parts);
  });
}

function today() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ================= 情境快照(版本紀錄) =================
 * 審議前後數字常常改：存一份快照，之後在儀表板、瀑布圖工具把「快照」當成一個唯讀情境，
 * 直接跟現在的數字並排比較、拆解差異。快照存的是當時的計算結果，之後資料怎麼改都不受影響。
 */
function createSnapshotDialog_(scenarioId, label) {
  if (!scenarioId) { toast('請先選擇情境', 'warn'); return; }
  const d = new Date();
  const today = `${d.getMonth() + 1}/${d.getDate()}`;
  openModal({
    title: '存成情境快照',
    body: `<p class="help">把「${esc(label || '')}」目前算出來的損益（加權平均與每個車系）存一份。之後輸入資料怎麼改都不影響快照，
      在儀表板或瀑布圖工具選「情境快照」就能跟現在的數字比較。</p>`,
    fields: [
      { name: 'name', label: '快照名稱', value: `${today} 版`, placeholder: '例：GATE F 審議版' },
      { name: 'notes', label: '備註（選填）', type: 'textarea', placeholder: '例：審議會前送出的版本' }
    ],
    okText: '存快照',
    validate: v => String(v.name || '').trim() ? '' : '請輸入快照名稱'
  }).then(v => {
    if (!v) return;
    google.script.run
      .withSuccessHandler(safeHandler(() => {
        toast(`已存快照「${v.name}」`, 'ok', 2500);
        loadSnapshotCard_();
      }))
      .withFailureHandler(err => toast(err.message, 'err', 4000))
      .createSnapshot(scenarioId, v.name, v.notes || '');
  });
}

let snapshotList_ = [];
function snapshotCardShellHtml_() {
  return `<div class="card" id="snapshot-card" style="margin-top:16px;">
    <div class="card-head"><h3>情境快照（版本紀錄）</h3><span class="muted">存下某個時間點的損益數字，之後跟現在比較「差在哪」</span>

function compareSnapshotNow_(i) {

function deleteSnapshot_(i) {

let salesMixRows = [];

function renderSalesMixPanel() {

function smDirty_() { markDirty('salesmix', saveSalesMixGrid, () => { clearDirty(); renderSalesMixPanel(); }); }
function onSalesMixField(i, field, value) { salesMixRows[i][field] = value; updateSalesMixTotals(); smDirty_(); }

/** 改台數：總台數 = 各車系台數加總，所有構成比依台數重算 */
function onSalesMixVolumeInput(i, value) {
  salesMixRows[i].MonthlyVolume = value === '' ? '' : num(value);
  smDirty_();
  const total = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  salesMixRows.forEach(r => { r.SalesMixPct = total > 0 ? round2(num(r.MonthlyVolume) / total * 100) : ''; });
  document.getElementById('sm-total').value = total || '';
  syncSalesMixInputs({ skipVolumeIndex: i });
}

/** 改構成比：以車型月總台數為基準反推該車系台數，其餘車系的構成比再依台數回算 */
function onSalesMixPctInput(i, value) {
  salesMixRows[i].SalesMixPct = value === '' ? '' : num(value);
  smDirty_();
  const total = num(val('sm-total'));
  if (total > 0) {
    // 台數保留小數：構成比 5% × 365 台 = 18.25 台，四捨五入會讓構成比對不回去
    salesMixRows[i].MonthlyVolume = round2(num(value) / 100 * total);
  }
  syncSalesMixInputs({ skipPctIndex: i });
}

/** 改車型月總台數：各車系依目前構成比重新分配台數 */
function onSalesMixTotalInput() {
  smDirty_();
  const total = num(val('sm-total'));
  if (total > 0) {
    salesMixRows.forEach(r => { r.MonthlyVolume = round2(num(r.SalesMixPct) / 100 * total); });
  }
  syncSalesMixInputs({});
}

function round2(n) { return Math.round(n * 100) / 100; }

/** 把 salesMixRows 的值寫回輸入框（跳過使用者正在輸入的那一格，避免游標跳動） */
function syncSalesMixInputs(opts) {
  const rows = document.querySelectorAll('#grid-salesmix tbody tr');
  salesMixRows.forEach((r, i) => {
    const tr = rows[i];
    if (!tr) return;
    const pctInput = tr.children[1].querySelector('input');
    const volInput = tr.children[2].querySelector('input');
    if (opts.skipPctIndex !== i) pctInput.value = r.SalesMixPct === '' ? '' : r.SalesMixPct;
    if (opts.skipVolumeIndex !== i) volInput.value = r.MonthlyVolume === '' ? '' : r.MonthlyVolume;
  });
  updateSalesMixTotals();
}

function updateSalesMixTotals() {
  const sumPct = salesMixRows.reduce((s, r) => s + num(r.SalesMixPct), 0);
  const sumUnits = salesMixRows.reduce((s, r) => s + num(r.MonthlyVolume), 0);
  let sumLc = 0;
  salesMixRows.forEach((r, i) => {
    const lc = num(r.MonthlyVolume) * 12 * num(r.LifeCycleYears);
    sumLc += lc;
    const cell = document.getElementById('sm-lc-' + i);
    if (cell) cell.textContent = fmt(lc);
  });
  const pctCell = document.getElementById('sm-sum-pct');
  if (pctCell) {
    pctCell.textContent = fmt(sumPct, 2) + '%';
    // 構成比合計不是 100% 時標紅，避免加權平均被算錯還沒發現
    pctCell.className = 'calc' + (Math.abs(sumPct - 100) > 0.01 && sumPct !== 0 ? ' negative' : '');
  }
  const unitCell = document.getElementById('sm-sum-units');
  if (unitCell) unitCell.textContent = fmt(sumUnits);
  const lcCell = document.getElementById('sm-sum-lc');
  if (lcCell) lcCell.textContent = fmt(sumLc);
}

/** 公式/攤提的計算過程文字(hover 用)：公式換成看得懂的名稱，再列出每個引用到的值 */
function traceText_(trace, codeNameMap) {
  if (!trace) return '';
  if (trace.kind === 'dev') {
    return `開發總投攤提\n投資總額(低減後) ${fmt(trace.total)} ÷ 攤提台數 ${fmt(trace.units)}\n= 全車系分攤 ${fmt(trace.total && trace.units ? trace.total / trace.units : 0)}\n本車系合計 ${fmt(trace.perUnit)}（含只攤給部分車系的金額）`;
  }
  const lines = ['= ' + humanizeFormula_(trace.formula, codeNameMap)];
  Object.keys(trace.refs || {}).forEach(k => {
    let label = k;
    if (/^[A-Za-z][A-Za-z0-9_]*$/.test(k)) label = codeNameMap[k] ? `${codeNameMap[k]}(${k})` : k;
    else if (k === 'CHILDREN()') label = 'Σ子科目';
    else if (k === 'TAXDEDUCT()') label = 'Σ可扣除貨物稅的科目';
    lines.push(`${label}：${fmt(trace.refs[k], 4)}`);
  });
  return lines.join('\n');
}

function importMatrixDialog(key) {
  if (isDirty_()) { toast('先儲存目前的修改再匯入', 'warn'); return; }
  const data = matrixData[key];
  const cfg = MATRIX_CONFIG[key];
  openModal({
    title: '從 Excel 貼上整張表（' + cfg.title + '）', wide: true,
    body: `<p class="help">在 Excel 選取「科目名稱那一欄 + 各車系的金額」(標題列可以一起選)，複製後貼在下面。<br>
      科目依名稱對應（空白、全形半形括號不影響）；車系依標題列的名稱對應，沒有標題列就依畫面上的車系順序：
      ${data.vehicles.map(v => esc(v.VehicleCode || v.VehicleID)).join('、')}。</p>`,
    fields: [{ name: 'text', label: '貼上', type: 'textarea', placeholder: '科目 → 3人貨車 → 9人客貨車(商用) …（直接從 Excel 複製貼上）' }],
    okText: '下一步：檢查對應'
  }).then(v => {
    if (!v || !v.text.trim()) return;
    const parsed = parseMatrixPaste_(v.text, data.vehicles);
    if (!parsed.rows.length) { toast('沒有讀到任何「科目名稱 + 金額」的列', 'err'); return; }
    const known = new Set(data.lines.map(l => normalizeNameKey_(matrixLineName(l))));
    const auto = new Set((data.autoLines || []).map(l => normalizeNameKey_(l.label)));
    const isNew = r => !known.has(normalizeNameKey_(r.name)) && !auto.has(normalizeNameKey_(r.name));
    const newOnes = parsed.rows.filter(isNew);
    const vehicleName = id => { const x = data.vehicles.find(v2 => v2.VehicleID === id); return x ? (x.VehicleCode || id) : id; };
    const body = `

function normalizeNameKey_(s) {
  return String(s || '').replace(/（/g, '(').replace(/）/g, ')').replace(/[－—–]/g, '-').replace(/\s+/g, '').toLowerCase();
}
/** 解析貼上的整張表：找車系標題列、每一列的第一個文字當科目名稱、數字依欄位對到車系 */
function parseMatrixPaste_(text, vehicles) {
  const grid = parseClipboardGrid_(text);
  const keyOf = v => [normalizeNameKey_(v.VehicleCode), normalizeNameKey_(v.VehicleID)];
  let headerRow = -1, colMap = {};
  grid.forEach((cells, ri) => {
    if (headerRow !== -1) return;
    const map = {};
    cells.forEach((c, ci) => {
      const k = normalizeNameKey_(c);
      if (!k) return;
      const v = vehicles.find(x => keyOf(x).indexOf(k) !== -1);
      if (v && !Object.values(map).includes(v.VehicleID)) map[ci] = v.VehicleID;
    });
    if (Object.keys(map).length) { headerRow = ri; colMap = map; }
  });
  const rows = [];
  let positional = null;
  grid.forEach((cells, ri) => {
    if (ri === headerRow) return;
    const nameIdx = cells.findIndex(c => String(c).trim() && parsePastedNumber_(c) === null);
    if (nameIdx === -1) return;
    const values = {};
    if (headerRow !== -1) {
      Object.keys(colMap).forEach(ci => { const n = parsePastedNumber_(cells[ci]); if (n !== null && n !== '') values[colMap[ci]] = n; });
    } else {
      const nums = [];
      cells.forEach((c, ci) => { if (ci > nameIdx) { const n = parsePastedNumber_(c); if (n !== null && n !== '') nums.push({ ci, n }); } });
      if (!positional && nums.length) positional = nums.map(x => x.ci);
      nums.forEach((x, i) => { if (vehicles[i]) values[vehicles[i].VehicleID] = x.n; });
    }
    if (Object.keys(values).length) rows.push({ name: String(cells[nameIdx]).trim(), values });
  });
  const columns = headerRow !== -1
    ? Object.keys(colMap).map(ci => ({ index: Number(ci), header: grid[headerRow][ci], vehicleId: colMap[ci] }))
    : vehicles.slice(0, (positional || []).length).map((v, i) => ({ index: positional[i], header: '', vehicleId: v.VehicleID }));
  return { rows, columns, byHeader: headerRow !== -1 };
}

/** 公式/攤提科目的格子：唯讀，滑鼠移過去看計算過程 */
function autoLineCellHtml(data, lineCode, vehicleId, codeNameMap) {
  const amt = (data.autoValues[lineCode] || {})[vehicleId];
  if (amt === undefined) return '<td class="calc muted">—</td>';
  const trace = ((data.autoTraces || {})[lineCode] || {})[vehicleId];
  const err = ((data.autoErrors || {})[lineCode] || {})[vehicleId];
  const tipText = (err ? '⚠ 公式錯誤：' + err + '\n' : '') + traceText_(trace, codeNameMap || {});
  const tip = tipText ? ` tabindex="0" data-tip="${esc(tipText)}"` : '';
  return `<td class="calc${err ? ' negative' : ''}"${tip}>${err ? '⚠ ' : ''}${fmt(amt)}</td>`;
}

/** 同一列(科目)的幣別/備註是列層級設定，讀取時取該列第一個有值的格子 */
function firstCellProp(data, lineCode, prop) {
  const row = data.values[lineCode] || {};
  const key = Object.keys(row).filter(k => row[k] && row[k][prop])[0];
  return key ? row[key][prop] : '';
}

/**
 * 右邊那一欄是「加權平均」而不是合計：一列是同一個成本項目在各車系的單台金額，相加沒有意義。
 * 表尾則是各車系自己的科目合計（同一車系各科目相加是有意義的）。
 */
function updateMatrixTotals(key) {
  const data = matrixData[key];
  const mix = {};
  let mixTotal = 0;
  data.vehicles.forEach(v => { mix[v.VehicleID] = num(v.SalesMixPct); mixTotal += num(v.SalesMixPct); });

  const colSum = {};
  let weightedGrand = 0;
  data.lines.forEach(line => {
    let weighted = 0;
    document.querySelectorAll(`#grid-${key} input[data-line="${line.value}"]`).forEach(inp => {
      const v = num(inp.value);
      colSum[inp.dataset.vehicle] = (colSum[inp.dataset.vehicle] || 0) + v;
      weighted += v * (mix[inp.dataset.vehicle] || 0);
    });
    weighted = mixTotal ? weighted / mixTotal : 0;
    weightedGrand += weighted;
    const cell = document.getElementById(`${key}-sum-${line.value}`);
    if (cell) cell.textContent = mixTotal ? fmt(weighted) : '—';
  });

  const autoSum = {};
  (data.autoLines || []).forEach(line => {
    data.vehicles.forEach(v => {
      const amt = (data.autoValues[line.value] || {})[v.VehicleID];
      if (amt !== undefined) autoSum[v.VehicleID] = (autoSum[v.VehicleID] || 0) + amt;
    });
  });

  data.vehicles.forEach(v => {
    const cell = document.getElementById(`${key}-colsum-${v.VehicleID}`);
    if (cell) cell.textContent = fmt(colSum[v.VehicleID] || 0);
    const withAutoCell = document.getElementById(`${key}-colsum-withauto-${v.VehicleID}`);
    if (withAutoCell) withAutoCell.textContent = fmt((colSum[v.VehicleID] || 0) + (autoSum[v.VehicleID] || 0));
  });
  const g = document.getElementById(`${key}-grandsum`);
  if (g) g.textContent = mixTotal ? fmt(weightedGrand) : '—';
}

function saveMatrix(key) {
  const cfg = MATRIX_CONFIG[key];
  const cells = [], lineNotes = {};
  document.querySelectorAll(`#grid-${key} input[data-line]`).forEach(inp => {
    const line = inp.dataset.line;
    const cell = {
      RowID: inp.dataset.rowid || '',
      VehicleID: inp.dataset.vehicle,
      LineCode: line,
      Amount: inp.value === '' ? '' : num(inp.value),
      Notes: ''
    };
    if (cfg.hasCurrency) cell.Currency = val(`${key}-cur-${line}`) || 'TWD';
    cells.push(cell);
    lineNotes[line] = val(`${key}-note-${line}`);
  });

  setStatus(key, '儲存中...');
  google.script.run
    .withSuccessHandler(() => { clearDirty(); setStatus(key, '已儲存', 'ok'); renderMatrixPanel(key); })
    .withFailureHandler(err => setStatus(key, '錯誤：' + err.message, 'err'))

}

 *
 * v2.1 重新設計，目標是「不懂代碼也能直覺操作」：
 *   - 左邊長得像損益表：科目縮排在它的小計底下，旁邊直接顯示目前情境算出來的金額(加權平均)，

 *   - 右邊一步一步：① 怎麼算(三選一) ② 公式/輸入說明 ③ 結果，進階設定收起來。

/* ---------------- 公式的「名稱版」：代碼 ⇄ [科目名稱] ---------------- */
function chartLineByCode_(code) { return chartEditor ? chartEditor.lines.find(l => l.LineCode === code) : null; }
function chartCodeNameMap_() {
  const map = {};
  (chartEditor ? chartEditor.lines : []).forEach(l => { map[l.LineCode] = l.LineName; });
  return map;
}
/** 系統變數與參數名稱：[名稱] 會先被解讀成這些，所以撞名的科目只能用代碼表示 */
function chartReservedNames_() {
  const set = new Set();
  ((chartEditor && chartEditor.variables) || []).forEach(v => set.add(v.name));
  ((chartEditor && chartEditor.params) || []).forEach(p => set.add(p.ParamName));
  return set;
}
/** 這個科目能不能用 [名稱] 表示：名稱裡沒有 ]、不跟變數/參數撞名、沒有其他科目同名 */
function chartNameUsable_(line) {
  if (!line || /[\[\]"]/.test(line.LineName) || /^[A-Za-z]{3}匯率$/.test(line.LineName)) return false;
  if (chartReservedNames_().has(line.LineName)) return false;
  return chartEditor.lines.filter(l => l.LineName === line.LineName).length === 1;
}
/** 存的公式(代碼) → 畫面上編輯用的名稱版 */
function toNameForm_(formula) {
  if (!formula || !chartEditor) return formula || '';
  return String(formula).replace(/"[^"]*"|'[^']*'|\[[^\]]*\]|[A-Za-z_][A-Za-z0-9_]*/g, (tok, offset, str) => {
    if (/^["'\[]/.test(tok)) return tok;
    if (/^\s*\(/.test(str.slice(offset + tok.length))) return tok;   // 函式名稱
    const line = chartLineByCode_(tok);
    return line && chartNameUsable_(line) ? '[' + line.LineName + ']' : tok;
  });
}
function draftFromLine_(line) {
  const d = JSON.parse(JSON.stringify(line));
  d.Formula = toNameForm_(d.Formula);
  const vf = d.VehicleFormulas || {};
  Object.keys(vf).forEach(k => { vf[k] = toNameForm_(vf[k]); });
  d.VehicleFormulas = vf;
  return d;
}

/** 目前情境的加權平均金額(依銷售構成比)；沒有銷售構成時回傳 null */
function chartWeightedValue_(code, source) {
  const pv = source || (chartEditor && chartEditor.preview);
  if (!pv || !pv.values) return null;
  let sum = 0, w = 0;
  Object.keys(pv.values).forEach(vid => {
    const v = pv.values[vid][code];
    if (v === undefined) return;
    const wt = num((pv.weights || {})[vid]);
    sum += v * wt; w += wt;
  });
  return w ? sum / w : null;
}

/** 科目樹：售價結構一段、損益一段；子科目縮排在小計底下、可收合，各層各自拖曳排序 */
function drawChartTreeBody_() {
  const body = document.getElementById('chart-tree-body');
  if (!body) return;
  const lines = chartEditor.lines;
  const kids = {};
  const codes = {};
  lines.forEach(l => { codes[l.LineCode] = true; });
  lines.forEach(l => { const p = l.ParentLine && codes[l.ParentLine] ? l.ParentLine : ''; (kids[p] = kids[p] || []).push(l); });
  const problemsOf = {};
  chartEditor.problems.forEach(p => { (problemsOf[p.code] = problemsOf[p.code] || []).push(p); });
  const q = chartFilter.trim().toLowerCase();
  const matches = l => !q || l.LineName.toLowerCase().indexOf(q) !== -1 || l.LineCode.toLowerCase() === q;
  const subtreeMatches = l => matches(l) || (kids[l.LineCode] || []).some(subtreeMatches);

  const rowHtml = (l, depth) => {
    const probs = problemsOf[l.LineCode] || [];
    const hasErr = probs.some(p => p.level === 'error'), hasWarn = probs.some(p => p.level === 'warning');
    const isGroup = (kids[l.LineCode] || []).length > 0;
    const collapsed = isGroup && !q && chartCollapsed.has(l.LineCode);
    const v = chartWeightedValue_(l.LineCode);
    const cls = ['tree-row', isGroup ? 'group' : '', l.isProtected ? 'subtotal-row' : '', chartSelected === l.LineCode ? 'selected' : '', q && !matches(l) ? 'dimmed' : ''].filter(c => c).join(' ');
    const info = CALC_TYPE_INFO[l.CalcType];
    const typeTip = info[0] + (l.CalcType === 'FORMULA' ? '：' + humanizeFormula_(l.Formula, chartCodeNameMap_(), l.LineCode) : '');
    return `<div class="${cls}" style="padding-left:${6 + depth * 18}px;" onclick="selectChartLine('${esc(l.LineCode)}')">
      ${q ? '<span class="tree-spacer"></span>' : dragHandleHtml('拖曳調整「' + l.LineName + '」的順序')}
      ${isGroup ? `<button type="button" class="tree-toggle${collapsed ? ' collapsed' : ''}" onclick="event.stopPropagation();toggleChartGroup('${esc(l.LineCode)}')" aria-label="收合/展開">▾</button>` : '<span class="tree-toggle-space"></span>'}
      <span class="tree-name" title="${esc(l.LineName)}">${esc(l.LineName)}</span>
      ${hasErr ? '<span class="tree-err" data-tip="公式有錯誤，暫時以 0 計">!</span>' : hasWarn ? '<span class="tree-warn" data-tip="沒有被算進營業淨利">?</span>' : ''}
      ${isGroup ? `<button type="button" class="tree-add" onclick="event.stopPropagation();startNewChartLine('${esc(l.LineCode)}')" data-tip="在「${esc(l.LineName)}」底下新增科目">＋</button>` : ''}
      <span class="tree-val${v !== null && v < 0 ? ' negative' : ''}">${v === null ? '' : fmt(v)}</span>
      <b class="ti ti-${esc(l.CalcType)}" data-tip="${esc(typeTip)}">${info[2]}</b>
      ${chartShowCodes ? `<span class="tree-code">${esc(l.LineCode)}</span>` : ''}
    </div>`;
  };
  const blockHtml = (l, depth) => {
    if (q && !subtreeMatches(l)) return '';
    const children = kids[l.LineCode] || [];
    const collapsed = !q && chartCollapsed.has(l.LineCode);
    const childBox = children.length ? `<div class="tree-children" data-parent="${esc(l.LineCode)}"${collapsed ? ' hidden' : ''}>${children.map(c => blockHtml(c, depth + 1)).join('')}</div>` : '';
    // 扣減型小計(銷貨毛利 = 生產毛利 − Σ明細)跟 Excel 一樣：明細在上、小計列在下
    return isFooterGroupLine_(l) && childBox
      ? `<div class="tree-block footer-group" data-key="${esc(l.LineCode)}">${childBox}${rowHtml(l, depth)}</div>`
      : `<div class="tree-block" data-key="${esc(l.LineCode)}">${rowHtml(l, depth)}${childBox}</div>`;
  };
  const top = kids[''] || [];
  const price = top.filter(l => l.Category === '售價結構');
  const pl = top.filter(l => l.Category !== '售價結構');
  const priceCollapsed = !q && chartCollapsed.has('__price__');
  body.innerHTML = `
    ${price.length ? `<button type="button" class="tree-section" onclick="toggleChartGroup('__price__')">${priceCollapsed ? '▸' : '▾'} 售價結構（P1~P9，由售價與稅率推算）</button>
      <div class="tree-top" data-parent="" data-section="price"${priceCollapsed ? ' hidden' : ''}>${price.map(l => blockHtml(l, 0)).join('')}</div>` : ''}
    <div class="tree-section static">損益</div><div class="tree-top" data-parent="" data-section="pl">${pl.map(l => blockHtml(l, 0)).join('')}</div>`;
  if (q) return;
  body.querySelectorAll('.tree-top, .tree-children').forEach(container => {
    makeSortable(container, { items: '.tree-block', direct: true, onEnd: () => saveChartOrderFromDom_() });
  });
}

function toggleChartGroup(code) {
  if (chartCollapsed.has(code)) chartCollapsed.delete(code); else chartCollapsed.add(code);
  saveChartPrefs_();
  drawChartTreeBody_();
}
function toggleAllChartGroups_() {
  const groups = chartEditor.lines.filter(p => chartEditor.lines.some(l => l.ParentLine === p.LineCode)).map(l => l.LineCode).concat(['__price__']);
  const anyOpen = groups.some(g => !chartCollapsed.has(g));
  chartCollapsed = new Set(anyOpen ? groups : []);
  saveChartPrefs_();
  drawChartTreeBody_();
}

/** 拖曳放開後：依畫面上的樹狀順序組出完整順序(含父科目)一次送後端 */
function saveChartOrderFromDom_() {
  const items = [];
  const walk = (container, parent) => {
    Array.from(container.children).forEach(block => {
      if (!block.classList.contains('tree-block')) return;
      items.push({ LineCode: block.getAttribute('data-key'), ParentLine: parent });
      const childBox = block.querySelector(':scope > .tree-children');
      if (childBox) walk(childBox, block.getAttribute('data-key'));
    });
  };
  document.querySelectorAll('#chart-tree-body .tree-top').forEach(top => walk(top, ''));
  google.script.run
    .withSuccessHandler(safeHandler(() => {
      Object.keys(panelDataCache_).forEach(k => delete panelDataCache_[k]);
      toast('已更新科目順序', 'ok', 1400);
      loadChartEditor_(true);
    }))
    .withFailureHandler(err => { toast(err.message, 'err'); loadChartEditor_(true); })
    .setLineOrder(currentVehicleTypeId, items);
}

function selectChartLine(code) {
  if (code === chartSelected) return;
  const go = () => {
    clearDirty();
    chartSelected = code;
    const line = chartLineByCode_(code);
    chartDraft = line ? draftFromLine_(line) : null;
    chartPreview = null;
    // 選到被收合的子科目時，把它的父科目展開
    let p = line && line.ParentLine, g = 0;
    while (p && g++ < 20) { chartCollapsed.delete(p); const pl = chartLineByCode_(p); p = pl && pl.ParentLine; }
    if (line && line.Category === '售價結構') chartCollapsed.delete('__price__');
    drawChartTreeBody_();
    const pane = document.getElementById('chart-editor-pane');
    if (pane) pane.innerHTML = chartEditorPaneHtml_();
    afterChartEditorRender_();
  };
  if (isDirty_()) confirmLeave_().then(ok => { if (ok) go(); }); else go();
}

function startNewChartLine(parent) {
  const go = () => {
    clearDirty();
    chartSelected = '__new__';
    const parentLine = parent && chartLineByCode_(parent) ? parent : 'B';
    chartDraft = { LineCode: '', LineName: '', ParentLine: parentLine, CalcType: 'INPUT', Formula: '', VehicleFormulas: {}, CommodityTaxDeduct: '', DevAmortCategory: '', Description: '', isProtected: false };
    chartPreview = null;
    chartCollapsed.delete(parentLine);
    drawChartTreeBody_();
    document.getElementById('chart-editor-pane').innerHTML = chartEditorPaneHtml_();
    afterChartEditorRender_();
    const name = document.getElementById('ce-name');
    if (name) name.focus();
  };
  if (isDirty_()) confirmLeave_().then(ok => { if (ok) go(); }); else go();
}

/** 父科目選項：公式裡有 CHILDREN() 的科目(會把子科目加總起來的才適合當父科目)，或目前已經有子科目的科目 */
function chartParentOptions_(selfCode) {
  const lines = chartEditor.lines;
  const descendants = {};
  const mark = code => lines.filter(l => l.ParentLine === code).forEach(l => { descendants[l.LineCode] = true; mark(l.LineCode); });
  if (selfCode) mark(selfCode);
  const opts = lines.filter(l => l.LineCode !== selfCode && !descendants[l.LineCode] &&
    ((l.CalcType === 'FORMULA' && /CHILDREN\s*\(/i.test(l.Formula || '')) || lines.some(x => x.ParentLine === l.LineCode)));
  return [['', '（不計入任何小計）']].concat(opts.map(l => [l.LineCode, l.LineName]));
}

function chartIsCostSection_(d) {
  let cur = d, guard = 0;
  while (cur && cur.ParentLine && guard++ < 20) {
    if (cur.ParentLine === 'B') return true;
    cur = chartLineByCode_(cur.ParentLine);
  }
  return false;
}

function afterChartEditorRender_() {
  if (chartDraft) schedulePreview_(true);

/* ---------------- 公式輸入：自動完成 ---------------- */
/** 可以放進公式的東西：科目(用名稱)、系統變數、參數、匯率 */
function formulaCandidates_() {
  const out = [];
  chartEditor.lines.forEach(l => {
    if (chartDraft && l.LineCode === chartDraft.LineCode) return;
    out.push({ kind: '科目', label: l.LineName, insert: chartNameUsable_(l) ? '[' + l.LineName + ']' : l.LineCode, hint: l.LineCode });
  });
  (chartEditor.params || []).forEach(p => out.push({ kind: '參數', label: p.ParamName, insert: '[' + p.ParamName + ']', hint: p.Unit === '%' ? '%' : '數值' }));
  (chartEditor.variables || []).forEach(v => out.push({ kind: '變數', label: v.name, insert: '[' + v.name + ']', hint: '' }));
  (chartEditor.currencies || ['CNY', 'USD', 'JPY', 'EUR']).forEach(c => out.push({ kind: '匯率', label: c + '匯率', insert: '[' + c + '匯率]', hint: '1 ' + c + ' = ? 元' }));
  return out;
}
/** 游標前面是不是一個還沒關起來的 [ ：是的話回傳 [ 的位置與已經打的字 */
function openBracketAt_(text, caret) {
  const before = text.slice(0, caret);
  const i = before.lastIndexOf('[');
  if (i === -1 || before.indexOf(']', i) !== -1) return null;
  return { start: i, query: before.slice(i + 1) };
}
function onFormulaInput_(ta) {
  chartDraft.Formula = ta.value;
  chartDirty_();
  schedulePreview_();
  const ob = openBracketAt_(ta.value, ta.selectionStart || 0);
  if (!ob) { closeFormulaAc_(); return; }
  const q = ob.query.trim().toLowerCase();
  const items = formulaCandidates_().filter(c => !q || c.label.toLowerCase().indexOf(q) !== -1 || (c.hint || '').toLowerCase() === q).slice(0, 40);
  if (!items.length) { closeFormulaAc_(); return; }
  chartAc_ = { items, index: 0, start: ob.start };
  drawFormulaAc_();
}
function drawFormulaAc_() {
  const box = document.getElementById('ce-ac');
  if (!box || !chartAc_) return;
  let lastKind = '';
  box.innerHTML = chartAc_.items.map((c, i) => {
    const head = c.kind !== lastKind ? `<div class="ac-group">${esc(c.kind)}</div>` : '';

/* ================= 公式編輯器：一行一項 + 自由公式(膠囊) =================

 * 科目設定頁 ② 公式 的編輯介面，取代原本「空白文字框 + 常用寫法按鈕」：
 *   - 一行一項(預設)：損益表的公式大多是「幾個東西加加減減，每個東西再乘/除幾個比率」，

 *     點選單插入科目/參數/函式，鍵盤直接打數字與運算符號。還可以切成純文字輸入(進階、貼上用)。
 * 兩種模式存的都是同一個「名稱版」公式文字(chartDraft.Formula)，存檔時後端照樣換成代碼。
 * 每一行/每顆膠囊的值，是把那一段公式當成「探測公式」(Probes)跟著試算一起送給後端算的加權平均。
 */
let fxMode = 'rows';        // 'rows' 一行一項 / 'chips' 自由公式(膠囊) / 'text' 文字輸入
let fxTerms = [];           // 一行一項：[{ sign: 1|-1, src: 原子, factors: [{ op: '*'|'/', a: 原子 }] }]

const FX_SPECIAL_FNS_ = { CHILDREN: '子科目合計', TAXDEDUCT: '可扣除貨物稅科目合計' };

/* ---------------- 公式文字 ⇄ token ---------------- */
/** 名稱版公式拆成 token；有引號字串等膠囊表達不了的寫法時回傳 null(只能用文字輸入) */
function fxTokenize_(text) {
  const s = String(text || '')
    .replace(/[×＊]/g, '*').replace(/[÷／]/g, '/').replace(/[−–—－]/g, '-').replace(/＋/g, '+')
    .replace(/（/g, '(').replace(/）/g, ')').replace(/，/g, ',').replace(/［/g, '[').replace(/］/g, ']')
    .replace(/％/g, '%').replace(/＝/g, '=').replace(/＜/g, '<').replace(/＞/g, '>').replace(/[“”]/g, '"').replace(/^\s*=/, '');
  const out = [];
  let i = 0;
  while (i < s.length) {
    const ch = s.charAt(i), rest = s.slice(i);
    let m;
    if (/\s/.test(ch)) { i++; continue; }
    if ((m = /^(\d+\.?\d*|\.\d+)(\s*%)?/.exec(rest))) {
      out.push({ t: 'num', v: m[1] + (m[2] ? '%' : '') });
      i += m[0].length; continue;
    }
    if (ch === '[') {
      const end = s.indexOf(']', i);
      if (end === -1) return null;
      out.push({ t: 'name', v: s.slice(i + 1, end).trim() });
      i = end + 1; continue;
    }
    if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
      const id = m[0], up = id.toUpperCase(), after = s.slice(i + id.length);
      if (/^\s*\(/.test(after)) {
        let mm;
        if (FX_SPECIAL_FNS_[up] && (mm = /^\s*\(\s*\)/.exec(after))) { out.push({ t: 'fn0', v: up }); i += id.length + mm[0].length; continue; }
        if (up === 'REF') {
          mm = /^\s*\(\s*"([^"]*)"\s*,\s*"([^"]*)"\s*(?:,\s*"([^"]*)"\s*)?\)/.exec(after);
          if (!mm) return null;
          out.push({ t: 'ref', sc: mm[1], code: mm[2], vid: mm[3] || '' });
          i += id.length + mm[0].length; continue;
        }
        const open = /^\s*\(/.exec(after)[0];
        out.push({ t: 'fn', v: up });
        i += id.length + open.length; continue;
      }
      out.push({ t: 'code', v: id });
      i += id.length; continue;
    }
    const two = s.substr(i, 2);
    if (two === '<=' || two === '>=' || two === '<>' || two === '!=') { out.push({ t: 'op', v: two === '!=' ? '<>' : two }); i += 2; continue; }
    if ('+-*/^(),%<>='.indexOf(ch) !== -1) { out.push({ t: 'op', v: ch }); i++; continue; }
    return null;
  }
  return out;
}
function fxTokText_(t) {
  if (!t) return '';
  if (t.t === 'name') return '[' + t.v + ']';
  if (t.t === 'fn0') return t.v + '()';
  if (t.t === 'fn') return t.v + '(';
  if (t.t === 'ref') return `REF("${t.sc}", "${t.code}"${t.vid ? `, "${t.vid}"` : ''})`;
  if (t.t === 'onePlus') return '(1 + ' + fxTokText_(t.a) + ')';
  return String(t.v);
}
const FX_BIN_OPS_ = ['+', '-', '*', '/', '^', '<', '>', '<=', '>=', '=', '<>'];
/** token → 公式文字：二元運算子前後空一格，負號、括號、逗號照一般寫法 */
function fxToksToText_(toks) {
  let out = '', prev = null;
  toks.forEach(t => {
    if (t.t === 'op' && FX_BIN_OPS_.indexOf(t.v) !== -1) {
      const unary = (t.v === '-' || t.v === '+') && (!prev || prev.t === 'fn' || (prev.t === 'op' && prev.v !== ')' && prev.v !== '%'));
      out += unary ? t.v : ' ' + t.v + ' ';
    } else if (t.t === 'op' && t.v === ',') out += ', ';
    else out += fxTokText_(t);
    prev = t;
  });
  return out.replace(/\s+/g, ' ').replace(/\(\s+/g, '(').replace(/\s+\)/g, ')').trim();
}

/* ---------------- token ⇄ 一行一項 ---------------- */
const FX_ATOM_TYPES_ = ['name', 'code', 'fn0', 'ref', 'num'];
/** 拆得成「± 來源 (×÷ 係數)*」就回傳各行；拆不成(有函式、括號巢狀、比較…)回傳 null */
function fxTermsFromToks_(toks) {
  if (!toks) return null;
  if (!toks.length) return [];
  let i = 0;
  const isOp = (v, k) => { const t = toks[k === undefined ? i : k]; return !!t && t.t === 'op' && t.v === v; };
  const atom = () => { const t = toks[i]; if (t && FX_ATOM_TYPES_.indexOf(t.t) !== -1) { i++; return Object.assign({}, t); } return null; };
  const terms = [];
  let sign = 1;
  if (isOp('-')) { sign = -1; i++; } else if (isOp('+')) i++;
  for (;;) {
    const src = atom();
    if (!src) return null;
    const factors = [];
    while (isOp('*') || isOp('/')) {
      const op = toks[i++].v;
      let a = atom();
      if (!a) {
        // (1 + 參數)：常見的「÷ (1 + 營業稅率)」
        const inner = toks[i + 3];
        if (isOp('(') && toks[i + 1] && toks[i + 1].t === 'num' && toks[i + 1].v === '1' && isOp('+', i + 2) &&
          inner && (inner.t === 'name' || inner.t === 'code') && isOp(')', i + 4)) {
          a = { t: 'onePlus', a: Object.assign({}, inner) };
          i += 5;
        } else return null;
      }
      factors.push({ op, a });
    }
    terms.push({ sign, src, factors });
    if (i >= toks.length) break;
    if (isOp('+')) sign = 1; else if (isOp('-')) sign = -1; else return null;
    i++;
  }
  return terms;
}
function fxAtomComplete_(a) { return !!a && (a.t !== 'num' || String(a.v).replace('%', '').trim() !== '' && !isNaN(Number(String(a.v).replace('%', '')))); }
/** 一行的公式(不含正負號)；還沒選來源的行回傳空字串 */
function fxTermCore_(t) {
  if (!fxAtomComplete_(t.src)) return '';
  return fxTokText_(t.src) + t.factors.filter(f => fxAtomComplete_(f.a.t === 'onePlus' ? f.a.a : f.a)).map(f => ` ${f.op} ${fxTokText_(f.a)}`).join('');
}
function fxTermsText_(terms) {
  let out = '';
  terms.forEach(t => {
    const core = fxTermCore_(t);
    if (!core) return;
    out += out ? (t.sign < 0 ? ' - ' : ' + ') + core : (t.sign < 0 ? '-' : '') + core;
  });
  return out;
}

/* ---------------- 原子的顯示名稱、種類 ---------------- */
function fxParamDef_(name) { return ((chartEditor && chartEditor.params) || []).find(p => p.ParamName === name); }
function fxAtomInfo_(a) {
  if (!a) return { label: '', kind: 'empty' };
  if (a.t === 'onePlus') { const inner = fxAtomInfo_(a.a); return { label: '(1 + ' + inner.label + ')', kind: inner.kind }; }
  if (a.t === 'num') return { label: a.v, kind: 'num' };
  if (a.t === 'fn0') return { label: FX_SPECIAL_FNS_[a.v] || a.v, kind: 'special' };
  if (a.t === 'fn') return { label: a.v + '(', kind: 'fn' };
  if (a.t === 'ref') {
    const sc = ((chartEditor && chartEditor.referenceScenarios) || []).find(r => r.ScenarioID === a.sc);
    const line = chartLineByCode_(a.code);
    return { label: `${sc ? sc.label : a.sc} 的 ${line ? line.LineName : a.code}`, kind: 'ref' };
  }
  if (a.t === 'code') {
    const line = chartLineByCode_(a.code || a.v);
    return line ? { label: line.LineName, kind: 'line' } : { label: a.v, kind: 'bad', hint: '找不到這個科目代碼' };
  }
  if (a.t === 'name') {
    if (fxParamDef_(a.v)) return { label: a.v, kind: 'param' };
    if (((chartEditor && chartEditor.variables) || []).some(v => v.name === a.v)) return { label: a.v, kind: 'var' };
    if (/^[A-Za-z]{3}匯率$/.test(a.v)) return { label: a.v, kind: 'var' };
    if (chartEditor && chartEditor.lines.some(l => l.LineName === a.v)) return { label: a.v, kind: 'line' };
    return { label: a.v, kind: 'bad', hint: '找不到這個科目或參數' };
  }
  return { label: String(a.v || ''), kind: 'op' };
}
/** 值的顯示：% 參數顯示百分比；小數字留小數；金額取整 */
function fxFmtVal_(v, a) {
  if (v === undefined) return '…';
  if (v === null || isNaN(v)) return '—';
  const inner = a && a.t === 'onePlus' ? null : a;
  const p = inner && inner.t === 'name' ? fxParamDef_(inner.v) : null;
  if (p && p.Unit === '%') return fmt(v * 100, 3) + '%';
  if (Math.abs(v) < 100 && Math.round(v) !== v) return fmt(v, 4);
  return fmt(v);
}
/** 可以放進探測的公式片段(數字、函式開頭這類不需要問後端) */
function fxProbeText_(a) { return a && (a.t !== 'num' && a.t !== 'fn' && a.t !== 'op') ? fxTokText_(a) : ''; }
function fxProbeSpan_(text, a, cls) {
  if (!text) return '';
  return `<span class="${cls || 'v'}" data-probe="${esc(text)}" data-fmt="${esc(JSON.stringify(a || null))}">${fxFmtVal_(fxProbeVals[text], a)}</span>`;
}

/* ---------------- 試算：探測公式 ---------------- */
function fxProbeList_() {
  const set = [];
  const add = s => { if (s && set.indexOf(s) === -1) set.push(s); };
  if (!chartDraft || chartDraft.CalcType !== 'FORMULA') return set;
  if (fxMode === 'rows') {
    fxTerms.forEach(t => {
      add(fxProbeText_(t.src));
      t.factors.forEach(f => add(fxProbeText_(f.a)));
      if (t.factors.length) add(fxTermCore_(t));
    });
  } else if (fxMode === 'chips') fxToks.forEach(t => add(fxProbeText_(t)));
  return set;
}
/** 試算結果回來：算各探測公式的加權平均、更新畫面上的數字(不重畫，輸入框不會掉焦點) */
function fxApplyProbes_(preview, probes) {
  fxProbeScenario_ = currentScenarioId;
  if (!preview || !preview.probes) {
    probes.forEach(text => { fxProbeVals[text] = null; });   // 算不出來(沒有情境、試算失敗)：顯示 —，不留舊數字
  } else {
    probes.forEach((text, idx) => {
      let sum = 0, w = 0, any = false;
      Object.keys(preview.probes).forEach(vid => {
        const v = preview.probes[vid][idx];
        if (v === null || v === undefined) return;
        const wt = num((preview.weights || {})[vid]);
        sum += v * wt; w += wt; any = true;
      });
      fxProbeVals[text] = any && w ? sum / w : null;
    });
  }
  fxRefreshValues_();
}
function fxRefreshValues_() {
  if (typeof document === 'undefined') return;
  document.querySelectorAll('#ce-calc-body [data-probe]').forEach(el => {
    const text = el.getAttribute('data-probe');
    let a = null;
    try { a = JSON.parse(el.getAttribute('data-fmt') || 'null'); } catch (e) { a = null; }
    const v = fxProbeVals[text];
    el.textContent = el.hasAttribute('data-signed') && v !== undefined && v !== null ? fxSigned_(v * Number(el.getAttribute('data-signed'))) : fxFmtVal_(v, a);
  });
  const total = document.getElementById('ce-fx-total');
  if (total) total.textContent = fxTotalText_();
}
function fxSigned_(v) { return (v < 0 ? '−' : '') + fxFmtVal_(Math.abs(v)); }
function fxTotalText_() {
  if (!chartDraft || !String(chartDraft.Formula || '').trim()) return '—';
  const pv = chartPreview && chartPreview.preview;
  if (!pv) return chartPreview && chartPreview.problems && chartPreview.problems.length ? '—' : '…';
  const v = chartWeightedValue_(chartSelected === '__new__' ? '__NEW__' : chartDraft.LineCode, pv);
  return v === null ? '—' : fmt(v);
}

/* ---------------- 模式 ---------------- */
/** 換科目時：拆得成一行一項就用一行一項，否則自由公式；同一個科目重畫時保留使用者選的模式 */
function fxInitForDraft_() {
  const key = chartSelected + '|' + (chartDraft ? chartDraft.LineCode : '');
  const text = chartDraft ? chartDraft.Formula || '' : '';
  const toks = fxTokenize_(text);
  const terms = fxTermsFromToks_(toks);
  if (fxProbeScenario_ !== currentScenarioId) { fxProbeScenario_ = currentScenarioId; fxProbeVals = {}; }
  if (fxDraftKey_ !== key) {
    fxDraftKey_ = key;
    fxProbeVals = {};
    fxMode = terms ? 'rows' : toks ? 'chips' : 'text';
  } else if (fxMode === 'rows' && !terms) fxMode = toks ? 'chips' : 'text';
  else if (fxMode === 'chips' && !toks) fxMode = 'text';
  fxTerms = terms || [];
  fxToks = toks || [];
  fxCaret = fxToks.length;
  fxSelTok = -1;
}
function setFxMode(mode) {
  if (!chartDraft || mode === fxMode) return;
  const text = chartDraft.Formula || '';
  const toks = fxTokenize_(text);
  if (mode === 'rows') {
    const terms = fxTermsFromToks_(toks);
    if (!terms) { toast('這個公式有函式、括號或比較，拆不成一行一項，請用自由公式編輯', 'warn', 4000); return; }
    fxTerms = terms;
  } else if (mode === 'chips') {
    if (!toks) { toast('公式裡有引號字串等寫法，膠囊沒辦法表示，請用文字輸入', 'warn', 4000); return; }
    fxToks = toks; fxCaret = toks.length; fxSelTok = -1;
  }
  fxMode = mode;
  fxRedraw_();
  if (mode === 'text') { const ta = document.getElementById('ce-formula'); if (ta) ta.focus(); }
  if (mode === 'chips') { const bar = document.getElementById('ce-chips'); if (bar) bar.focus(); }
}
function fxRedraw_() {
  closeFxPicker_();
  const body = document.getElementById('ce-fx-body');
  if (body) body.innerHTML = fxModeBodyHtml_();
  document.querySelectorAll('.fx-mode .seg-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === (fxMode === 'text' ? 'chips' : fxMode)));
  fxRefreshValues_();
}
/** 一行一項/膠囊改了之後：寫回公式文字 → 未儲存 → 重新試算 */
function fxCommit_(redraw) {
  chartDraft.Formula = fxMode === 'rows' ? fxTermsText_(fxTerms) : fxToksToText_(fxToks);
  chartDirty_();
  if (redraw !== false) fxRedraw_();
  schedulePreview_();
}

/* ---------------- 畫面 ---------------- */
function fxEditorHtml_() {
  closeFxPicker_();   // 編輯器整個重畫(存檔、換科目…)：舊選單記的行號已經不對，直接關掉
  fxInitForDraft_();
  const segMode = fxMode === 'text' ? 'chips' : fxMode;
  return `<div class="ed-step-title"><span class="step-no">2</span>公式
      <span class="seg fx-mode" style="margin-left:auto;">
        <button type="button" class="seg-btn${segMode === 'rows' ? ' active' : ''}" data-mode="rows" onclick="setFxMode('rows')"
          data-tip="每行一個科目或參數，可以再乘/除比率；大部分的公式都這樣寫">一行一項</button>
        <button type="button" class="seg-btn${segMode === 'chips' ? ' active' : ''}" data-mode="chips" onclick="setFxMode('chips')"
          data-tip="有 IF、ROUND、括號的公式用這個">自由公式</button>
      </span></div>
    <div id="ce-fx-body">${fxModeBodyHtml_()}</div>
    <div class="formula-status" id="ce-status"></div>`;
}
function fxModeBodyHtml_() {
  if (fxMode === 'rows') return fxRowsHtml_();
  if (fxMode === 'chips') return fxChipsHtml_();

}

/* --- 一行一項 --- */
function fxSlotHtml_(a, onclick, placeholder) {
  if (!a) return `<button type="button" class="fx-slot empty" onclick="${onclick}">${esc(placeholder)}</button>`;
  const info = fxAtomInfo_(a);
  return `<button type="button" class="fx-slot kind-${info.kind}" onclick="${onclick}"${info.hint ? ` data-tip="${esc(info.hint)}"` : ''}>
    <span class="nm">${esc(info.label)}</span>${fxProbeSpan_(fxProbeText_(a), a)}</button>`;
}
function fxRowsHtml_() {
  const name = chartDraft.LineName || '這個科目';
  const rows = fxTerms.map((t, i) => {
    const src = t.src;
    let srcHtml;
    if (src && src.t === 'num') {
      // 固定金額，或像「15% × 某科目」這種寫在最前面的百分比(數字框不能放 %，單位另外切換)
      const pct = /%$/.test(src.v);

        oninput="fxSetNum_(${i}, -1, this.value)"><span class="seg fx-unit">

        <button type="button" class="seg-btn${pct ? ' active' : ''}" onclick="fxSetPct_(${i}, -1, true)">%</button></span>
        <button type="button" class="link-btn" onclick="fxPickSrc_(${i}, this)">換</button></span>`;
    } else if (src && src.t === 'ref') {
      const scs = chartEditor.referenceScenarios || [];
      srcHtml = `<span class="fx-inline fx-ref">
        <select onchange="fxSetRef_(${i}, 'sc', this.value)">${scs.map(r => `<option value="${esc(r.ScenarioID)}"${r.ScenarioID === src.sc ? ' selected' : ''}>${esc(r.label)}</option>`).join('')}
          ${scs.some(r => r.ScenarioID === src.sc) ? '' : `<option selected>${esc(src.sc)}</option>`}</select> 的
        <select onchange="fxSetRef_(${i}, 'code', this.value)">${chartEditor.lines.map(l => `<option value="${esc(l.LineCode)}"${l.LineCode === src.code ? ' selected' : ''}>${esc(l.LineName)}</option>`).join('')}</select>
        ${fxProbeSpan_(fxProbeText_(src), src)} <button type="button" class="link-btn" onclick="fxPickSrc_(${i}, this)">換</button></span>`;
    } else {
      srcHtml = fxSlotHtml_(src, `fxPickSrc_(${i}, this)`, '選一個科目、參數…');
    }
    const factors = src ? t.factors.map((f, k) => {
      const op = `<button type="button" class="fx-op" onclick="fxFlipOp_(${i}, ${k})" data-tip="點一下切換 × / ÷">${f.op === '/' ? '÷' : '×'}</button>`;
      const rm = `<button type="button" class="fx-x" onclick="fxDelFactor_(${i}, ${k})" data-tip="拿掉這個係數">✕</button>`;
      if (f.a.t === 'num') {
        const pct = /%$/.test(f.a.v);
        return `<span class="fx-factor">${op}<input type="number" step="any" class="fx-num sm" value="${esc(String(f.a.v).replace('%', ''))}"
          oninput="fxSetNum_(${i}, ${k}, this.value)"><span class="seg fx-unit">
          <button type="button" class="seg-btn${pct ? '' : ' active'}" onclick="fxSetPct_(${i}, ${k}, false)">倍</button>
          <button type="button" class="seg-btn${pct ? ' active' : ''}" onclick="fxSetPct_(${i}, ${k}, true)">%</button></span>${rm}</span>`;
      }
      return `<span class="fx-factor">${op}${fxSlotHtml_(f.a, `fxPickFactor_(${i}, ${k}, this)`, '')}${rm}</span>`;
    }).join('') : '';
    return `<div class="fx-row">
      <button type="button" class="fx-sign ${t.sign < 0 ? 'minus' : 'plus'}" onclick="fxToggleSign_(${i})" data-tip="點一下切換加 / 減">${t.sign < 0 ? '−' : '＋'}</button>
      <div class="fx-row-main">${srcHtml}${factors}
        ${src ? `<button type="button" class="fx-add-factor" onclick="fxPickFactor_(${i}, -1, this)">× 乘 / ÷ 除…</button>` : ''}</div>
      ${fxRowValHtml_(t)}
      <button type="button" class="fx-del" onclick="fxDelTerm_(${i})" data-tip="刪除這一行">✕</button>
    </div>`;
  }).join('');
  return `<div class="fx-eq-head"><b>${esc(name)}</b> =</div>
    ${fxTerms.length ? `<div class="fx-rows">${rows}</div>`
      : '<div class="callout info"><div>按「＋ 加一項」開始，例如：材料成本-KD × 關稅率。要扣掉的東西用「− 減一項」。</div></div>'}
    <div class="fx-add-row">
      <button type="button" class="btn sm secondary" onclick="fxAddTerm_(1, this)">＋ 加一項</button>
      <button type="button" class="btn sm secondary" onclick="fxAddTerm_(-1, this)">− 減一項</button>
    </div>
    ${fxTerms.length ? `<div class="fx-total"><span>${esc(name)}（目前情境加權平均）</span><b id="ce-fx-total">${fxTotalText_()}</b></div>` : ''}`;
}

/** 固定數字的值：15% → 0.15 */
function fxNumValue_(v) { const s = String(v || ''); return /%$/.test(s) ? Number(s.replace('%', '')) / 100 : Number(s); }
/** 一行右邊的小計：有乘除就問後端整行的值，沒有就是來源本身的值(固定金額直接顯示) */
function fxRowValHtml_(t) {
  const core = fxTermCore_(t);
  if (!core) return '<span class="fx-row-val muted">—</span>';

}

/* --- 自由公式(膠囊) --- */

function fxChipsBarInner_() {

  return h;
}
function fxChipsHtml_() {

  return `<div class="fx-eq-head"><b>${esc(chartDraft.LineName || '這個科目')}</b> =</div>
    <div class="fx-chips" id="ce-chips" tabindex="0" onkeydown="fxChipKey_(event)" onmousedown="fxChipMouse_(event)">${fxChipsBarInner_()}</div>

      <button type="button" class="btn sm" onmousedown="event.preventDefault()" onclick="fxPickChip_(this, 'item')">＋ 科目 / 參數</button>

/* --- 文字輸入(進階) --- */
function fxTextHtml_() {

  return `<div class="formula-box" id="ce-formula-box">

        oninput="onFormulaInput_(this)" onkeydown="onFormulaKeydown_(event)" onblur="onFormulaBlur_(this)"
        placeholder="例：[廠價(未稅)] * [季Margin率]　　輸入 [ 會跳出科目與參數清單">${esc(d.Formula || '')}</textarea>

/* ---------------- 一行一項：操作 ---------------- */
function fxAddTerm_(sign, btn) {
  fxTerms.push({ sign, src: null, factors: [] });
  fxRedraw_();
  const i = fxTerms.length - 1;
  const slot = document.querySelectorAll('#ce-fx-body .fx-row')[i];
  fxPickSrc_(i, slot ? slot.querySelector('.fx-slot') : btn);
}
function fxDelTerm_(i) { fxTerms.splice(i, 1); fxCommit_(); }
function fxToggleSign_(i) { fxTerms[i].sign *= -1; fxCommit_(); }
function fxFlipOp_(i, k) { const f = fxTerms[i].factors[k]; f.op = f.op === '/' ? '*' : '/'; fxCommit_(); }
function fxDelFactor_(i, k) { fxTerms[i].factors.splice(k, 1); fxCommit_(); }
function fxSetNum_(i, k, value) {
  const a = k < 0 ? fxTerms[i].src : fxTerms[i].factors[k].a;
  const pct = /%$/.test(a.v);
  a.v = String(value).trim() + (pct ? '%' : '');
  fxCommit_(false);   // 不重畫：游標留在輸入框，只換掉這一行的小計
  const row = document.querySelectorAll('#ce-fx-body .fx-row')[i];

}
function fxSetPct_(i, k, pct) {

  fxCommit_();
}
function fxSetRef_(i, field, value) { fxTerms[i].src[field] = value; fxCommit_(); }
function fxPickSrc_(i, anchor) {
  const row = fxTerms[i];
  openFxPicker_(anchor, fxSourceSections_(), item => {
    if (fxTerms[i] !== row) return;
    if (item.special === 'const') { fxTerms[i].src = { t: 'num', v: '' }; fxCommit_(); fxFocusNum_(i, -1); return; }
    if (item.special === 'ref') {
      const sc = (chartEditor.referenceScenarios || []).find(r => r.ScenarioID !== currentScenarioId) || (chartEditor.referenceScenarios || [])[0];
      if (!sc) { toast('還沒有其他情境可以參考', 'warn'); return; }
      fxTerms[i].src = { t: 'ref', sc: sc.ScenarioID, code: chartDraft.LineCode || chartEditor.lines[0].LineCode, vid: '' };
      fxCommit_();
      return;
    }
    fxTerms[i].src = item.tok;
    fxCommit_();
  }, () => { if (fxTerms[i] === row && !row.src) { fxTerms.splice(i, 1); fxRedraw_(); } });
}
function fxPickFactor_(i, k, anchor) {
  const row = fxTerms[i];
  openFxPicker_(anchor, fxFactorSections_(), item => {
    const t = fxTerms[i];
    if (t !== row) return;
    const set = a => { if (k < 0) t.factors.push({ op: item.op || '*', a }); else { t.factors[k].a = a; if (item.op) t.factors[k].op = item.op; } };
    if (item.special === 'pct' || item.special === 'mul') {
      set({ t: 'num', v: item.special === 'pct' ? '%' : '' });
      fxCommit_();
      fxFocusNum_(i, k < 0 ? t.factors.length - 1 : k);
      return;
    }
    if (item.special === 'onePlus') {
      openFxPicker_(anchor, fxParamSections_(), p => { set({ t: 'onePlus', a: p.tok }); fxCommit_(); });
      return;

    set(item.tok);
    fxCommit_();
  });
}
/** 第 i 行的數字輸入框(k = -1 是來源的固定金額，其餘是第 k 個係數) */
function fxFocusNum_(i, k) {
  const row = document.querySelectorAll('#ce-fx-body .fx-row')[i];
  if (!row) return;

/* ---------------- 膠囊：操作 ---------------- */
function fxRedrawChips_() {
  const bar = document.getElementById('ce-chips');
  if (bar) bar.innerHTML = fxChipsBarInner_();
  fxRefreshValues_();
}
function fxInsertTok_(t) {
  if (fxSelTok >= 0) { fxToks[fxSelTok] = t; fxCaret = fxSelTok + 1; fxSelTok = -1; }
  else { fxToks.splice(fxCaret, 0, t); fxCaret++; }
  fxCommit_(false);
  fxRedrawChips_();
  const bar = document.getElementById('ce-chips');
  if (bar) bar.focus();
}
function fxChipMouse_(e) {
  const el = e.target.closest('.fx-chip');
  if (el) { const i = Number(el.getAttribute('data-i')); fxSelTok = fxSelTok === i ? -1 : i; fxCaret = i + 1; }
  else { fxSelTok = -1; fxCaret = fxToks.length; }
  fxRedrawChips_();
}
function fxChipKey_(e) {
  const k = e.key;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'Backspace' || k === 'Delete') {
    e.preventDefault();
    if (fxSelTok >= 0) { fxToks.splice(fxSelTok, 1); fxCaret = fxSelTok; fxSelTok = -1; }
    else if (k === 'Backspace' && fxCaret > 0) {
      const t = fxToks[fxCaret - 1];
      if (t.t === 'num' && String(t.v).length > 1) t.v = String(t.v).slice(0, -1);
      else { fxToks.splice(fxCaret - 1, 1); fxCaret--; }
    } else if (k === 'Delete' && fxCaret < fxToks.length) fxToks.splice(fxCaret, 1);
    fxCommit_(false); fxRedrawChips_();
  } else if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Home' || k === 'End') {
    e.preventDefault();
    fxSelTok = -1;
    fxCaret = k === 'Home' ? 0 : k === 'End' ? fxToks.length : Math.max(0, Math.min(fxToks.length, fxCaret + (k === 'ArrowLeft' ? -1 : 1)));
    fxRedrawChips_();
  } else if (/^[0-9.%]$/.test(k)) {
    e.preventDefault();
    const prev = fxToks[fxCaret - 1];
    if (fxSelTok < 0 && prev && prev.t === 'num' && !/%$/.test(prev.v)) { prev.v += k; fxCommit_(false); fxRedrawChips_(); }
    else if (k === '%') fxInsertTok_({ t: 'op', v: '%' });
    else fxInsertTok_({ t: 'num', v: k });
  } else if ('+-*/^(),<>='.indexOf(k) !== -1 && k.length === 1) {
    e.preventDefault();
    fxInsertTok_({ t: 'op', v: k });
  } else if (k === 'Escape') {
    fxSelTok = -1; fxRedrawChips_();
  } else if (k.length === 1 && /\S/.test(k) || k === 'Process' || k === 'Enter') {
    // 打字(含中文輸入法)：打開選單，字直接進搜尋框
    e.preventDefault();
    const btn = document.querySelector('#ce-fx-body .fx-keys .btn');
    fxPickChip_(btn, 'item', k.length === 1 && k !== '[' ? k : '');
  }
}
function fxPickChip_(anchor, what, query) {
  const sections = what === 'fn' ? fxFunctionSections_() : fxSourceSections_(true).concat(fxFunctionSections_());
  openFxPicker_(anchor, sections, item => {
    if (item.fn) { fxInsertTok_({ t: 'fn', v: item.fn }); return; }
    if (item.special === 'ref') { fxRefModal_().then(t => { if (t) fxInsertTok_(t); }); return; }
    if (item.special === 'const') { fxInsertTok_({ t: 'num', v: '0' }); return; }
    fxInsertTok_(item.tok);
  }, null, query);
}
function fxRefModal_() {
  const lineOpts = chartEditor.lines.map(l => [l.LineCode, l.LineName]);
  return openModal({
    title: '另一個情境（或車型）的科目',

    fields: [
      { name: 'sc', label: '參考的情境', type: 'select', options: (chartEditor.referenceScenarios || []).map(r => [r.ScenarioID, r.label]) },
      { name: 'code', label: '參考的科目', type: 'select', options: lineOpts, value: chartDraft.LineCode || (lineOpts[0] || [''])[0] }
    ], okText: '插入'

/* ---------------- 選單內容 ---------------- */
function fxLineTok_(l) { return chartNameUsable_(l) ? { t: 'name', v: l.LineName } : { t: 'code', v: l.LineCode }; }
function fxLineSections_() {
  const depth = {};
  const lines = chartEditor.lines.filter(l => !chartDraft || l.LineCode !== chartDraft.LineCode);
  chartEditor.lines.forEach(l => { let n = 0, cur = l, g = 0; while (cur && cur.ParentLine && g++ < 20) { n++; cur = chartLineByCode_(cur.ParentLine); } depth[l.LineCode] = n; });
  const isGroup = code => chartEditor.lines.some(x => x.ParentLine === code);
  const item = l => ({ label: l.LineName, hint: chartShowCodes ? l.LineCode : '', search: l.LineCode, value: fxFmtVal_(chartWeightedValue_(l.LineCode)),
    indent: depth[l.LineCode] || 0, strong: isGroup(l.LineCode) || l.isProtected, tok: fxLineTok_(l), kind: 'line' });
  return [
    { g: '售價結構', items: lines.filter(l => l.Category === '售價結構').map(item) },
    { g: '損益表科目', items: lines.filter(l => l.Category !== '售價結構').map(item) }
  ];
}
function fxParamSections_() {
  const pv = chartEditor.paramValues || {};
  return [
    { g: '參數（參數與比率頁）', items: (chartEditor.params || []).map(p => ({ label: p.ParamName, hint: p.Description || '', kind: 'param',
      value: pv[p.ParamName] === undefined ? (p.Unit === '%' ? '%' : '') : fxFmtVal_(pv[p.ParamName], { t: 'name', v: p.ParamName }), tok: { t: 'name', v: p.ParamName } })) },
    { g: '系統變數（每個車系各自的值）', items: (chartEditor.variables || []).map(v => ({ label: v.name, hint: v.desc, kind: 'var', tok: { t: 'name', v: v.name } }))
      .concat((chartEditor.currencies || ['CNY', 'USD', 'JPY', 'EUR']).map(c => ({ label: c + '匯率', hint: '1 ' + c + ' = ? 元', kind: 'var', tok: { t: 'name', v: c + '匯率' } }))) }
  ];
}
function fxSourceSections_(forChips) {
  // 新增中的科目還沒有代碼，也不會有子科目(否則 ParentLine 空白的頂層科目全部會被當成它的子科目)
  const kids = chartDraft && chartDraft.LineCode ? chartEditor.lines.filter(l => l.ParentLine === chartDraft.LineCode) : [];
  const kidsSum = kids.reduce((s, l) => s + (chartWeightedValue_(l.LineCode) || 0), 0);
  const special = { g: '特殊', items: [
    { label: '子科目合計', kind: 'special', tok: { t: 'fn0', v: 'CHILDREN' },
      hint: kids.length ? kids.map(l => l.LineName).join('、') : '把其他科目的「計入」選成這個科目，就會加進來', value: kids.length ? fxFmtVal_(kidsSum) : '' },
    { label: '可扣除貨物稅科目合計', kind: 'special', tok: { t: 'fn0', v: 'TAXDEDUCT' }, hint: '進階設定勾了「貨物稅完稅價格可以扣除」的科目' },
    { label: '另一個情境（或車型）的科目…', kind: 'special', special: 'ref', hint: '例：DE 實績的一般材料' },
    { label: forChips ? '數字' : '固定金額…', kind: 'special', special: 'const', hint: forChips ? '也可以直接用鍵盤打' : '每台固定 N 元' }
  ] };
  return fxLineSections_().concat(fxParamSections_(), [special]);
}
function fxFactorSections_() {
  const fixed = { g: '固定數字', items: [
    { label: '固定百分比…', hint: '例：× 15%', kind: 'num', special: 'pct' },
    { label: '固定倍數…', hint: '例：× 1.2', kind: 'num', special: 'mul' },
    { label: '÷ (1 + 參數)…', hint: '例：含稅 ÷ (1 + 營業稅率) = 未稅', kind: 'special', special: 'onePlus', op: '/' }
  ] };
  return fxParamSections_().concat([fixed], fxLineSections_());
}
function fxFunctionSections_() {
  // 跟文字輸入的「函式與變數說明」同一份清單(30-chart.js 的 FORMULA_FUNCTIONS_UI)；REF 用「另一個情境的科目…」插入
  const fns = FORMULA_FUNCTIONS_UI.map(f => ({ fn: (/^([A-Z]+)\(/.exec(f[0]) || [])[1], usage: f[0], desc: f[1] }))
    .filter(f => f.fn && !FX_SPECIAL_FNS_[f.fn] && f.fn !== 'REF');
  return [{ g: '函式', items: fns.map(f => ({ label: f.fn + '(　)', hint: f.usage + '：' + f.desc, kind: 'fn', fn: f.fn, search: f.desc })) }];
