  return withLock_(function () {
    var upserts = (rows || []).map(function (r) { r.ScenarioID = scenarioId; return r; });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', upserts, []);
    return getSalesMixGrid(scenarioId, vehicleTypeId);
  });
}

/**
 * 銷售構成雙向輸入(台數/百分比)：
 *   - recalcSalesMixPctByVolume：以目前各車系已填的「預估銷售台數(月)」，
 *     依佔比反推並回寫 SalesMixPct。
 *   - recalcSalesMixVolumeByPct：以使用者輸入的「情境總銷售台數(月)」為基準，
 *     依各車系已填的 SalesMixPct 反推並回寫 MonthlyVolume。
 * 同一情境下的所有 SalesMix 列即為同一車型底下的各車系構成。
 */
function recalcSalesMixPctByVolume(scenarioId) {
  return withLock_(function () {
    var rows = getSalesMix(scenarioId);
    var total = rows.reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0);
    rows.forEach(function (r) {
      // SalesMixPct 以百分比數值儲存(0~100)
      r.SalesMixPct = total > 0 ? toNumber_(r.MonthlyVolume) / total * 100 : 0;
    });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', rows, []);
    return getSalesMix(scenarioId);
  });
}
function recalcSalesMixVolumeByPct(scenarioId, totalMonthlyVolume) {
  return withLock_(function () {
    var rows = getSalesMix(scenarioId);
    var total = toNumber_(totalMonthlyVolume);
    rows.forEach(function (r) {
      r.MonthlyVolume = Math.round(toNumber_(r.SalesMixPct) / 100 * total);
    });
    batchWriteRows_(SHEETS.SALES_MIX, 'RowID', rows, []);
    return getSalesMix(scenarioId);
  });
}

// ---- CostOfSales 銷貨成本（原材料成本頁；LP/KD 皆為成本項目，成本科目可自由增刪） ----
function getCostOfSales(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.COST_OF_SALES) || [];
  return rows.filter(function (r) {
    return (!scenarioId || r.ScenarioID === scenarioId) && (!vehicleId || r.VehicleID === vehicleId);
  });
}
function saveCostOfSalesRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.COST_OF_SALES, 'RowID', rowObj); });
}
function deleteCostOfSalesRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.COST_OF_SALES, 'RowID', rowId); });
}

/* ------------------------------------------------------------------
 * 金額矩陣（列 = 科目、欄 = 車系）：銷貨成本與營業費用共用同一套邏輯，
 * 使用者在一張表格內把所有車系的金額一次填完、一次送出。
 * ---------------------------------------------------------------- */
function buildAmountMatrix_(sheetName, scenarioId, vehicleTypeId, lineOptions) {
  // 帶出各車系的銷售構成比：金額矩陣不顯示跨車系的「合計」(把不同車系的單台成本相加沒有意義)，
  // 改成用構成比加權的平均值，跟損益儀表板的加權平均欄位是同一個口徑。
  var mix = {};
  getSalesMix(scenarioId).forEach(function (r) { mix[r.VehicleID] = toNumber_(r.SalesMixPct); });
  var vehicles = getVehicles(vehicleTypeId).map(function (v) {
    return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '', SalesMixPct: mix[v.VehicleID] || 0 };
  });
  var rows = (sheetToObjects_(sheetName) || []).filter(function (r) { return r.ScenarioID === scenarioId; });

  var values = {};   // values[LineCode][VehicleID] = { RowID, Amount, Currency, Notes }
  rows.forEach(function (r) {
    if (!r.LineCode) return;
    if (!values[r.LineCode]) values[r.LineCode] = {};
    values[r.LineCode][r.VehicleID] = {
      RowID: r.RowID,
      Amount: r.Amount === '' || r.Amount === undefined ? '' : toNumber_(r.Amount),
      Currency: r.Currency || BASE_CURRENCY,
      Notes: r.Notes || ''
    };
  });

  return { lines: lineOptions, vehicles: vehicles, values: values, lineNotes: getLineNotes(scenarioId) };
}

/**
 * 矩陣頁面一次存檔動輒十幾個科目 × 好幾個車系，逐格呼叫 upsertRow_/deleteRow_ 會讓
 * 一次存檔打出幾百次 Sheets API 呼叫(每格各自掃 PK 欄、讀寫格式、寫入、寫稽核)，
 * 是存檔感覺卡的主因。改成先分類成「這一批要新增/更新的列」跟「要刪除的 RowID」，
 * 一次交給 batchWriteRows_ 整段讀一次、整段寫一次（見該函式的說明）。
 */
function saveAmountMatrix_(sheetName, scenarioId, cells, lineNotes) {
  return withLock_(function () {
    // 科目說明(備註)統一存在 LineNotes：報告/簡報的「說明」欄跟這裡是同一份
    if (lineNotes) saveLineNotes(scenarioId, lineNotes);
    var upserts = [], deletePks = [];
    (cells || []).forEach(function (c) {
      var isEmpty = c.Amount === '' || c.Amount === null || c.Amount === undefined;
      if (isEmpty && !c.Notes) {
        // 清空的格子代表這個科目在這個車系沒有金額：有舊資料就刪掉，避免殘留
        if (c.RowID) deletePks.push(c.RowID);
        return;
      }
      c.ScenarioID = scenarioId;
      upserts.push(c);
    });
    batchWriteRows_(sheetName, 'RowID', upserts, deletePks);
    return true;
  });
}

/**
 * 銷貨成本矩陣：列 = 成本項目、欄 = 車系。
 * autoLines 是唯讀的自動計算科目(b5/b8/b13...)，讓這頁能看到 B 銷貨成本的全貌，
 * 不必再跑去儀表板才看得到模具/設備攤提與貨物稅算出多少。
 */
function getCostOfSalesMatrix(scenarioId, vehicleTypeId) {
  var matrix = buildAmountMatrix_(SHEETS.COST_OF_SALES, scenarioId, vehicleTypeId, getCostOfSalesLineOptions(vehicleTypeId));
  matrix.currencies = getConfiguredCurrencies(scenarioId);
  var auto = getCostOfSalesAutoLines(scenarioId, matrix.vehicles);
  matrix.autoLines = auto.lines;
  matrix.autoValues = auto.values;
  matrix.autoTraces = auto.traces;
  matrix.autoErrors = auto.errors;
  return matrix;
}
function saveCostOfSalesMatrix(scenarioId, cells, lineNotes) {
  return saveAmountMatrix_(SHEETS.COST_OF_SALES, scenarioId, cells, lineNotes);
}

/** 營業費用矩陣：列 = 科目、欄 = 車系。autoLines 同上，含季Margin、開發總投攤提的費用類科目 */
function getOperatingExpenseMatrix(scenarioId, vehicleTypeId) {
  var matrix = buildAmountMatrix_(SHEETS.OPERATING_EXPENSE, scenarioId, vehicleTypeId, getOperatingExpenseLineOptions(vehicleTypeId));
  var auto = getOperatingExpenseAutoLines(scenarioId, matrix.vehicles);
  matrix.autoLines = auto.lines;
  matrix.autoValues = auto.values;
  matrix.autoTraces = auto.traces;
  matrix.autoErrors = auto.errors;
  return matrix;
}
function saveOperatingExpenseMatrix(scenarioId, cells, lineNotes) {
  return saveAmountMatrix_(SHEETS.OPERATING_EXPENSE, scenarioId, cells, lineNotes);
}

// ---- DevInvestment ----

/**
 * 一列開發總投要攤提到哪個損益科目：直接看 TargetLineCode（使用者在「開發總投」頁面自選）。
 * 舊資料(改版前建立、還沒有 TargetLineCode)才會走下面的相容判斷：
 * 舊資產類型直接查對照表；更舊的「費用」單一類型則靠 Department 是否等於 'BASE廠開發費' 判斷。
 */
function devAmortTargetOf_(row) {
  if (row.TargetLineCode) return row.TargetLineCode;
  var type = row.AssetType;
  if (type === DEV_ASSET_TYPE_LEGACY_EXPENSE) {
    return row.Department === DEV_INVESTMENT_BASE_FACTORY_DEPT ? 'f4' : 'f3';
  }
  return DEV_ASSET_TYPE_TARGET[type] || '';
}

function getDevInvestment(scenarioId) {
  var rows = sheetToObjects_(SHEETS.DEV_INVESTMENT) || [];
  return scenarioId ? rows.filter(function (r) { return r.ScenarioID === scenarioId; }) : rows;
}
function saveDevInvestmentRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.DEV_INVESTMENT, 'RowID', rowObj); });
}
function deleteDevInvestmentRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.DEV_INVESTMENT, 'RowID', rowId); });
}
/**
 * 開發總投整批儲存（表格一次送出）；空白列(沒部門也沒金額)會被刪除。
 * 部門列的順序使用者可以在畫面上用上下移動鈕調整，這裡依送出時的陣列順序重新編號 SortOrder，
 * 讓 getDevInvestmentSummary 下次讀出來的順序跟畫面上調整過的一致（不是 Sheet 裡原本的列順序）。
 */
function saveDevInvestmentGrid(scenarioId, rows) {
  return withLock_(function () {
    var order = 0;
    var upserts = [], deletePks = [];
    (rows || []).forEach(function (r) {
      var isEmpty = !r.Department && (r.Amount === '' || r.Amount === null || r.Amount === undefined);
      if (isEmpty) {
        if (r.RowID) deletePks.push(r.RowID);
        return;
      }
      // 沒選攤提落點的列不會被攤提到任何科目，金額等於憑空消失，所以直接擋下來
      if (toNumber_(r.Amount) && !devAmortTargetOf_(r)) {
        throw new Error('「' + (r.Department || '未命名部門') + '」有金額但沒有選攤提落點，請選擇這筆投資要攤到哪個損益科目。');
      }
      r.ScenarioID = scenarioId;
      r.SortOrder = order++;
      upserts.push(r);
    });
    batchWriteRows_(SHEETS.DEV_INVESTMENT, 'RowID', upserts, deletePks);
    return getDevInvestmentSummary(scenarioId);
  });
}

/**
 * 目標情境用：從另一個情境把資料整批帶入後再調整低減目標。
 * 只覆蓋所選的資料類別，帶入前會先清掉目標情境同類別的既有資料。
 * 帶入的開發總投列，其挑戰低減目標一律歸零，由使用者自己填新的目標值。
 */
function copyScenarioData(sourceScenarioId, targetScenarioId, parts, opts) {
  return withLock_(function () {
    if (!sourceScenarioId || !targetScenarioId) throw new Error('請選擇來源情境與目標情境');
    if (sourceScenarioId === targetScenarioId) throw new Error('來源情境與目標情境不能相同');
    // 銷售構成/成本/費用都是以 VehicleID(車系) 為鍵，跨車型帶入會把來源車型的車系搬進來，
    // 在目標車型的頁面上完全看不到那些列，卻仍被計入損益 —— 直接擋掉。
    var allScenarios = getScenarios();
    var findScenario = function (id) {
      return allScenarios.filter(function (s) { return s.ScenarioID === id; })[0];
    };
    var source = findScenario(sourceScenarioId);
    var target = findScenario(targetScenarioId);
    if (!source) throw new Error('找不到來源情境：' + sourceScenarioId);
    if (!target) throw new Error('找不到目標情境：' + targetScenarioId);
    if (source.VehicleTypeID !== target.VehicleTypeID) {
      throw new Error('只能從同一個車型底下的情境帶入（來源為 ' + (source.VehicleTypeID || '(未設定)') +
        '，目標為 ' + (target.VehicleTypeID || '(未設定)') + '）。');
    }
    parts = parts && parts.length ? parts : ['salesmix', 'costofsales', 'devinvestment', 'operatingexpense', 'parameters', 'linenotes'];

    var map = {
      salesmix: SHEETS.SALES_MIX,
      costofsales: SHEETS.COST_OF_SALES,
      devinvestment: SHEETS.DEV_INVESTMENT,
      operatingexpense: SHEETS.OPERATING_EXPENSE,
      parameters: SHEETS.PARAMETERS,
      linenotes: SHEETS.LINE_NOTES,
      actions: SHEETS.ACTIONS
    };
    var pkOf = function (sheetName) {
      return sheetName === SHEETS.PARAMETERS ? 'ParamID' : sheetName === SHEETS.ACTIONS ? 'ActionID' : 'RowID';
    };
    var copied = {};

    parts.forEach(function (part) {
      var sheetName = map[part];
      if (!sheetName) return;
      var pk = pkOf(sheetName);
      var all = sheetToObjects_(sheetName) || [];

      var deletePks = all.filter(function (r) { return r.ScenarioID === targetScenarioId; })
        .map(function (r) { return r[pk]; });

      var sourceRows = all.filter(function (r) { return r.ScenarioID === sourceScenarioId; });
      var upserts = sourceRows.map(function (r) {
        var copy = {};
        SCHEMA[sheetName].forEach(function (h) { copy[h] = r[h]; });
        copy[pk] = '';                       // 產生新的鍵值，不要蓋到來源列
        copy.ScenarioID = targetScenarioId;
        if (sheetName === SHEETS.DEV_INVESTMENT) {
          // 低減目標屬於目標情境自己的假設，帶入後歸零讓使用者重新填
          // (目標反推另存成情境時要原封不動：opts.keepChallenge)
          if (!(opts && opts.keepChallenge)) copy.ChallengeReductionPct = '';
          // 舊資料只有 AssetType、沒有 TargetLineCode 的列，平常是靠畫面顯示時(devAmortTargetOf_)
          // 即時解析成攤提落點，使用者存檔那一刻才會真的寫回 Sheet —— 但帶入是直接複製原始列，
          // 不會經過那次存檔，複製過去的仍是「TargetLineCode 空白」的舊格式列。
          // 這裡直接把解析結果寫實，帶過去的列一律是已正規化的 TargetLineCode，
          // 不必等使用者手動按一次儲存才補上，也不會因為漏了這一步而在畫面上顯示「(請選擇)」。
          copy.TargetLineCode = devAmortTargetOf_(r);
        }
        return copy;
      });
      // 同一張表裡先刪目標情境的舊資料、再整批貼上來源情境的複本，一次(讀+寫)搞定，
      // 不是「先逐列刪、再逐列新增」— 情境資料多的話(開發總投/銷貨成本常常十幾二十列)
      // 逐列處理會是最容易卡住的一步。
      batchWriteRows_(sheetName, pk, upserts, deletePks);
      copied[part] = sourceRows.length;
    });

    return copied;
  });
}

/**
 * 開發總投的攤提基準台數（存在情境上）。
 * 實務上開發投資的攤提基準台數常與銷售構成的預估台數不同
 * （例如銷售估 365 台/月，但開發投資以 300 台/月 × 12 年攤提），所以獨立設定；
 * 留空就自動改用銷售構成推算的 LIFE CYCLE 總台數。
 */
function saveAmortBasis(scenarioId, monthlyVolume, lifeCycleYears) {
  return withLock_(function () {
    var scenario = getScenarios().filter(function (s) { return s.ScenarioID === scenarioId; })[0];
    if (!scenario) throw new Error('找不到情境：' + scenarioId);
    scenario.AmortMonthlyVolume = monthlyVolume === '' || monthlyVolume === null ? '' : toNumber_(monthlyVolume);
    scenario.AmortLifeCycleYears = lifeCycleYears === '' || lifeCycleYears === null ? '' : toNumber_(lifeCycleYears);
    upsertRow_(SHEETS.SCENARIOS, 'ScenarioID', scenario);
    return getDevInvestmentSummary(scenarioId);
  });
}

/** 部門清單允許自由新增：回傳目前已出現過的部門，前端用來做輸入建議(datalist)，非強制下拉 */
function getKnownDepartments() {
  var rows = sheetToObjects_(SHEETS.DEV_INVESTMENT) || [];
  var set = {};
  rows.forEach(function (r) { if (r.Department) set[r.Department] = true; });
  return Object.keys(set);
}

// ---- OperatingExpense ----
function getOperatingExpense(scenarioId, vehicleId) {
  var rows = sheetToObjects_(SHEETS.OPERATING_EXPENSE) || [];
  return rows.filter(function (r) {
    return (!scenarioId || r.ScenarioID === scenarioId) && (!vehicleId || r.VehicleID === vehicleId);
  });
}
function saveOperatingExpenseRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.OPERATING_EXPENSE, 'RowID', rowObj); });
}
function deleteOperatingExpenseRow(rowId) {
  return withLock_(function () { return deleteRow_(SHEETS.OPERATING_EXPENSE, 'RowID', rowId); });
}

// ---- Parameters ----
function getParameters(scenarioId) {
  var rows = sheetToObjects_(SHEETS.PARAMETERS) || [];
  return scenarioId ? rows.filter(function (r) { return !r.ScenarioID || r.ScenarioID === scenarioId; }) : rows;
}
function saveParameterRow(rowObj) {
  return withLock_(function () { return upsertRow_(SHEETS.PARAMETERS, 'ParamID', rowObj); });
}
function deleteParameterRow(paramId) {
  return withLock_(function () { return deleteRow_(SHEETS.PARAMETERS, 'ParamID', paramId); });
}

// 「參數設定」頁面拆成兩組管理：稅務/費用比率 vs 匯率設定，各自獨立的分頁籤與表格，
// 底層仍寫入同一張 Parameters 分頁，只是依 ParamName 篩選讀取範圍。
function getTaxRateParameters(scenarioId) {
  var names = getParamDefs().map(function (d) { return d.ParamName; });
  return getParameters(scenarioId).filter(function (p) { return names.indexOf(p.ParamName) !== -1; });
}
function getFxParameters(scenarioId) {
  return getParameters(scenarioId).filter(function (p) { return FX_PARAM_NAMES.indexOf(p.ParamName) !== -1; });
}

/**
 * 稅務/費用比率表格：同一車型各車系的費率大多相同，所以預設只填「全車系適用」那一列，
 * 各車系留白就自動沿用全車系值；只有真的不同的車系才需要填覆寫值。
 * 沒設定過的比率會帶入系統預設值(DEFAULT_PARAMS)，直接按儲存即可。
 */
function getRateGrid(scenarioId, vehicleTypeId) {
  var params = getTaxRateParameters(scenarioId).filter(function (p) { return p.ScenarioID === scenarioId; });
  var vehicles = getVehicles(vehicleTypeId).map(function (v) {
    return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' };
  });

  var find = function (name, vehicleId) {
    return params.filter(function (p) {
      return p.ParamName === name && (p.VehicleID || '') === (vehicleId || '');
    })[0];
  };

  var rates = getParamDefs().map(function (def) {
    var name = def.ParamName;
    var global = find(name, '');
    var overrides = {};
    vehicles.forEach(function (v) {
      var row = find(name, v.VehicleID);
      overrides[v.VehicleID] = row ? { ParamID: row.ParamID, Value: toNumber_(row.Value) } : { ParamID: '', Value: '' };
    });
    return {
      ParamName: name,
      globalParamID: global ? global.ParamID : '',
      // 沒設定過就帶系統預設值，使用者確認後按儲存即可，不必每次自己查稅率
      globalValue: global ? toNumber_(global.Value) : (def.DefaultValue !== '' && def.DefaultValue !== undefined ? def.DefaultValue :
        (DEFAULT_PARAMS[name] !== undefined ? DEFAULT_PARAMS[name] : '')),
      isDefault: !global,
      unit: def.Unit, description: def.Description, isPreset: def.isPreset, defaultValue: def.DefaultValue,
      overrides: overrides
    };
  });

  return { vehicles: vehicles, rates: rates, units: PARAM_UNITS };
}

/** 稅務/費用比率整批儲存：留白的車系覆寫值代表沿用全車系值，會刪掉舊的覆寫列 */
function saveRateGrid(scenarioId, rows) {
  return withLock_(function () {
    var upserts = [], deletePks = [];
    (rows || []).forEach(function (r) {
      var isEmpty = r.Value === '' || r.Value === null || r.Value === undefined;
      if (isEmpty) {
        if (r.ParamID) deletePks.push(r.ParamID);
        return;
      }
      upserts.push({
        ParamID: r.ParamID || '',
        ScenarioID: scenarioId,
        VehicleID: r.VehicleID || '',
        ParamName: r.ParamName,
        Currency: '',
        Value: r.Value,
        EffectiveDate: r.EffectiveDate || ''
      });
    });
    batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', upserts, deletePks);
    return true;
  });
}

/**
 * 匯率設定表格：以幣別管理，1 外幣 = Value 台幣。
 * 只有一種匯率(現況匯率)，銷貨成本與開發總投的外幣金額都用它換算；
 * 銷貨成本頁的幣別選單就是這裡設定過匯率的幣別。
 */
function getFxGrid(scenarioId) {
  var params = getFxParameters(scenarioId).filter(function (p) { return p.ScenarioID === scenarioId; });
  var currencies = {};
  params.forEach(function (p) { if (p.Currency) currencies[p.Currency] = true; });
  DEFAULT_FX_CURRENCIES.forEach(function (c) { currencies[c] = true; });

  var rows = Object.keys(currencies).sort().map(function (currency) {
    var cells = {};
    FX_PARAM_NAMES.forEach(function (name) {
      var row = params.filter(function (p) { return p.ParamName === name && p.Currency === currency; })[0];
      cells[name] = row ? { ParamID: row.ParamID, Value: toNumber_(row.Value) } : { ParamID: '', Value: '' };
    });
    return { Currency: currency, cells: cells };
  });

  return { baseCurrency: BASE_CURRENCY, paramNames: FX_PARAM_NAMES, rows: rows };
}

/** 匯率整批儲存；留白代表未設定該幣別的匯率，會刪掉舊資料 */
function saveFxGrid(scenarioId, cells) {
  return withLock_(function () {
    var upserts = [], deletePks = [];
    (cells || []).forEach(function (c) {
      var isEmpty = c.Value === '' || c.Value === null || c.Value === undefined;
      if (isEmpty) {
        if (c.ParamID) deletePks.push(c.ParamID);
        return;
      }
      if (!c.Currency) throw new Error('請選擇幣別');
      upserts.push({
        ParamID: c.ParamID || '',
        ScenarioID: scenarioId,
        VehicleID: '',
        ParamName: c.ParamName,
        Currency: c.Currency,
        Value: c.Value,
        EffectiveDate: ''
      });
    });
    batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', upserts, deletePks);
    return getFxGrid(scenarioId);
  });
}

/** 銷貨成本幣別選單：本位幣 + 匯率設定頁已經設定過匯率的幣別 */
function getConfiguredCurrencies(scenarioId) {
  var list = [BASE_CURRENCY];
  getFxParameters(scenarioId).forEach(function (p) {
    if (p.Currency && p.ParamName === COST_FX_PARAM_NAME && toNumber_(p.Value) && list.indexOf(p.Currency) === -1) {
      list.push(p.Currency);
    }
  });
  return list;
}

/** 依 ParamName(+可選VehicleID) 查值，找不到就用 DEFAULT_PARAMS，最後 fallback 0 */
function lookupParam_(paramsForScenario, paramName, vehicleId) {
  var match = paramsForScenario.filter(function (p) {
    return p.ParamName === paramName && (!p.VehicleID || p.VehicleID === vehicleId);
  });
  // 有指定車型的參數優先於全域參數
  var specific = match.filter(function (p) { return p.VehicleID === vehicleId; });
  var picked = specific.length ? specific[0] : match[0];
  if (picked) return toNumber_(picked.Value);
  return DEFAULT_PARAMS[paramName] !== undefined ? DEFAULT_PARAMS[paramName] : 0;
}


// ---- 從 Excel 貼上整張表(銷貨成本/營業費用) ----

/** 科目名稱比對用：去空白、全形半形括號一致、英文不分大小寫(「材料成本 - KD」=「材料成本-KD」) */
function normalizeLineNameKey_(s) {
  return String(s || '').replace(/[（]/g, '(').replace(/[）]/g, ')').replace(/[－—–]/g, '-')
    .replace(/\s+/g, '').toLowerCase();
}

/**
 * 把從 Excel 複製的整張表匯入銷貨成本(kind='cost')或營業費用(kind='opex')。
 * rows = [{ name: 科目名稱, values: { 車系ID: 金額 } }]，前端已經把欄位對到車系。
 * 依科目名稱比對這個車型的科目表：
 *   - 對到手動輸入科目 → 寫入/覆蓋金額(沒貼到的車系不動)
 *   - 對到公式或開發總投攤提科目 → 略過(那些金額是算出來的，不能輸入)
 *   - 對不到 → createMissing 時新增成手動輸入科目(掛在 parentForNew 底下)，否則列在 unmatched
 * 整批一次寫入，回傳摘要給前端顯示。
 */
function importMatrixRows(scenarioId, vehicleTypeId, kind, rows, createMissing, parentForNew) {
  return withLock_(function () {
    if (!scenarioId || !vehicleTypeId) throw new Error('請先選擇車型與情境');
    var isCost = kind === 'cost';
    ensureTypeChart_(vehicleTypeId);
    var parent = parentForNew || (isCost ? 'B' : 'E');
    var report = { updated: 0, created: [], skipped: [], unmatched: [], matched: [] };
    var vehicleIds = {};
    getVehicles(vehicleTypeId).forEach(function (v) { vehicleIds[v.VehicleID] = true; });

    var findLine = function () {
      var byKey = {};
      getPLLineItems(vehicleTypeId).forEach(function (d) {
        var k = normalizeLineNameKey_(d.LineName);
        if (!byKey[k]) byKey[k] = d;
      });
      return byKey;
    };
    var byKey = findLine();
    var defs = getPLLineItems(vehicleTypeId);
    var targets = [];
    (rows || []).forEach(function (r) {
      var name = String(r.name || '').trim();
      if (!name) return;
      var d = byKey[normalizeLineNameKey_(name)];
      if (d && (d.CalcType !== CALC_TYPES.INPUT || isCostSectionLine_(d, defs) !== isCost)) {
        report.skipped.push({ name: name, reason: d.CalcType !== CALC_TYPES.INPUT ? '是' + CALC_TYPE_LABELS[d.CalcType] + '科目' : '屬於' + (isCost ? '營業費用' : '銷貨成本') + '頁' });
        return;
      }
      if (!d) {
        if (!createMissing) { report.unmatched.push(name); return; }
        var row = newLineItemRow_(parent, name, vehicleTypeId);
        upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineID', row);
        byKey = findLine();
        defs = getPLLineItems(vehicleTypeId);
        d = byKey[normalizeLineNameKey_(name)];
        report.created.push(name);
      } else {
        report.matched.push(name);
      }
      targets.push({ code: d.LineCode, values: r.values || {} });
    });

    var sheetName = isCost ? SHEETS.COST_OF_SALES : SHEETS.OPERATING_EXPENSE;
    var existing = {};
    (sheetToObjects_(sheetName) || []).forEach(function (r) {
      if (r.ScenarioID === scenarioId) existing[r.LineCode + '|' + r.VehicleID] = r;
    });
    var upserts = [];
    targets.forEach(function (t) {
      Object.keys(t.values).forEach(function (vid) {
        if (!vehicleIds[vid]) return;
        var v = t.values[vid];
        if (v === '' || v === null || v === undefined || isNaN(Number(v))) return;
        var cur = existing[t.code + '|' + vid];
        var row = {};
        SCHEMA[sheetName].forEach(function (h) { row[h] = cur && cur[h] !== undefined ? cur[h] : ''; });
        row.RowID = cur ? cur.RowID : '';
        row.ScenarioID = scenarioId; row.VehicleID = vid; row.LineCode = t.code; row.Amount = Number(v);
        if (isCost && !row.Currency) row.Currency = BASE_CURRENCY;
        upserts.push(row);
        report.updated++;
      });
    });
    if (upserts.length) batchWriteRows_(sheetName, 'RowID', upserts, []);
    return report;
  });
}


// ===== src/ChartService.gs =====
/**
 * 科目表服務：每個車型各自一份科目表 + 公式式的計算來源。
 *
 * 為什麼科目表要依車型分開：同一個 GATE、甚至同一類車型之間，損益科目都差很多
 * (有的車型有 KD 件、有的沒有；有的要拆 TNCAP 模具、有的不用)。以前整個系統只有一份全域科目表，
 * 以 DA 的 Gate F 表為基底，替別的車型加科目會出現在所有車型上、刪科目會清掉所有車型的金額，
 * 誤差跟干擾都很大。現在：
 *   - VehicleTypeID 留白的那一組是「標準範本」，建立新車型時可以選擇從範本或從某個既有車型複製
 *   - 之後每個車型各改各的，互不影響
 *   - 舊資料(只有一份全域科目表)開頁時自動轉成「範本 + 每個車型各複製一份」，數字完全不變
 *
 * 計算來源(CalcType)：INPUT 手動輸入 / FORMULA 公式 / DEV_AMORT 開發總投攤提。
 * 內建的售價結構、貨物稅、季Margin、各段小計也都只是「預設公式」，畫面上看得到、改得動，
 * 也可以替個別車系另外指定公式(VehicleFormulas)，處理同一車型內不同車系算法不同的情況。
 */

var TEMPLATE_KEY_ = '*';

function lineIdOf_(vehicleTypeId, lineCode) {
  return (vehicleTypeId || TEMPLATE_KEY_) + '|' + lineCode;
}

/** 某個情境屬於哪個車型 */
function vehicleTypeOfScenario_(scenarioId) {
  var s = getScenarios().filter(function (r) { return r.ScenarioID === scenarioId; })[0];
  return s ? (s.VehicleTypeID || '') : '';
}

/** 科目表所有列(含範本與各車型)，未經整理 */
function allLineItemRows_() {
  return sheetToObjects_(SHEETS.PL_LINE_ITEMS) || [];
}

/**
 * 科目的計算來源：新資料直接看 CalcType；舊資料(改版前)依 AutoSource 推算，結果跟改版前的計算完全一樣。
 */
function lineCalcType_(def) {
  if (def.CalcType && CALC_TYPES[def.CalcType]) return def.CalcType;
  var auto = def.AutoSource || '';
  if (DEV_AMORT_AUTO_SOURCES.indexOf(auto) !== -1) return CALC_TYPES.DEV_AMORT;
  if (auto) return CALC_TYPES.FORMULA;
  // 舊版有預設公式的科目(售價結構、各段小計、貨物稅、季Margin)全都是自動計算科目
  if (DEFAULT_FORMULAS[def.LineCode] || PROTECTED_LINE_CODES.indexOf(def.LineCode) !== -1) return CALC_TYPES.FORMULA;
  return CALC_TYPES.INPUT;
}

/** 某個科目在某個車系實際使用的公式：有車系個別公式就用它，否則用科目的公式(舊資料沒公式時用預設公式) */
function lineFormulaFor_(def, vehicleId) {
  var overrides = parseVehicleFormulas_(def.VehicleFormulas);
  if (vehicleId && overrides[vehicleId] !== undefined && String(overrides[vehicleId]).trim() !== '') {
    return String(overrides[vehicleId]);
  }
  if (def.Formula !== undefined && def.Formula !== null && String(def.Formula).trim() !== '') return String(def.Formula);
  return DEFAULT_FORMULAS[def.LineCode] || '';
}

function parseVehicleFormulas_(v) {
  if (!v) return {};
  if (typeof v === 'object') return v;
  try { var o = JSON.parse(v); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; }
}

/**
 * 公式裡的 [科目名稱] 換成科目代碼(存檔用)。名稱同時也是系統變數/參數/匯率時保留原樣
 * (計算時這些名稱優先，換掉會改變意思)。字串常數(REF 的參數)與函式名稱不動。
 */
function codifyFormulaNames_(formula, defs) {
  if (!formula) return formula;
  var reserved = formulaReservedNames_();
  var byName = {};
  defs.forEach(function (d) { if (!byName[d.LineName]) byName[d.LineName] = d.LineCode; });
  return mapFormulaTokens_(formula, function (tok) {
    if (tok.charAt(0) !== '[') return tok;
    var name = tok.slice(1, -1).trim();
    if (reserved[name] || /^[A-Za-z]{3}匯率$/.test(name)) return tok;
    return byName[name] ? byName[name] : tok;
  });
}

/** 把公式裡的 [舊名稱] 換成科目代碼(科目改名時用) */
function replaceNameRef_(formula, oldName, code) {
  if (!formula) return formula;
  return mapFormulaTokens_(formula, function (tok) {
    return tok.charAt(0) === '[' && tok.slice(1, -1).trim() === oldName ? code : tok;
  });
}

/** 系統變數與參數名稱(公式裡 [名稱] 會優先解讀成這些) */
function formulaReservedNames_() {
  var out = {};
  SYSTEM_VARIABLES.forEach(function (v) { out[v.name] = true; });
  getParamDefs().forEach(function (p) { out[p.ParamName] = true; });
  return out;
}

/** 依序走過公式的 "字串"、[名稱]、其他片段，讓呼叫端替換 [名稱]；其他內容原封不動 */
function mapFormulaTokens_(formula, fn) {
  return String(formula).replace(/"[^"]*"|'[^']*'|\[[^\]]*\]/g, function (tok) {
    return tok.charAt(0) === '[' ? fn(tok) : tok;
  });
}

/** 把讀出來的科目列整理成計算/畫面用的樣子(補 CalcType、Formula) */
function normalizeLineDef_(row) {
  var d = {};
  SCHEMA.PLLineItems.forEach(function (h) { d[h] = row[h] === undefined || row[h] === null ? '' : row[h]; });
  d.SortOrder = toNumber_(row.SortOrder);
  d.CalcType = lineCalcType_(row);
  if (d.CalcType === CALC_TYPES.FORMULA && !String(d.Formula).trim()) d.Formula = DEFAULT_FORMULAS[d.LineCode] || '';
  return d;
}

function sortLineDefs_(rows) {
  return rows.slice().sort(function (a, b) { return toNumber_(a.SortOrder) - toNumber_(b.SortOrder); });
}

/** 「前一個小計 − 明細」型的小計(銷貨毛利 = 生產毛利 − Σ明細)：跟 Excel 一樣，明細列在上、小計列在下 */
function isFooterGroupLine_(def) {
  return !!def && lineCalcType_(def) === CALC_TYPES.FORMULA && /-\s*CHILDREN\s*\(\s*\)/i.test(String(def.Formula || ''));
}

/**
 * 科目的呈現順序(儀表板、報告、科目樹、輸入頁共用)，照 Excel 損益表的讀法：
 *   - 同一層依 SortOrder；
 *   - 一般群組(例：銷貨成本合計 = Σ明細)：群組列在上、明細在下；
 *   - 扣減型小計(例：銷貨毛利 = 生產毛利 − Σ明細)：明細在上、小計在下。
 * 這樣就算 SortOrder 被舊版拖曳改成「父科目在前」，畫面仍然是 Excel 的順序。
 */
function displayOrderDefs_(defs) {
  var sorted = sortLineDefs_(defs);
  var codes = {};
  sorted.forEach(function (d) { codes[d.LineCode] = true; });
  var kids = {};
  sorted.forEach(function (d) {
    var p = d.ParentLine && d.ParentLine !== d.LineCode && codes[d.ParentLine] ? d.ParentLine : '';
    (kids[p] = kids[p] || []).push(d);
  });
  var out = [], seen = {};
  var emit = function (d) {
    if (seen[d.LineCode]) return;
    seen[d.LineCode] = true;
    var children = kids[d.LineCode] || [];
    if (children.length && isFooterGroupLine_(d)) { children.forEach(emit); out.push(d); }
    else { out.push(d); children.forEach(emit); }
  };
  (kids[''] || []).forEach(emit);
  sorted.forEach(function (d) { if (!seen[d.LineCode]) { seen[d.LineCode] = true; out.push(d); } });   // 父子循環的保險
  return out;
}

/** 標準範本的科目 */
function getTemplateLineItems_() {
  return displayOrderDefs_(allLineItemRows_().filter(function (r) { return !r.VehicleTypeID; }).map(normalizeLineDef_));
}

function hasOwnChart_(vehicleTypeId) {
  if (!vehicleTypeId) return false;
  return allLineItemRows_().some(function (r) { return r.VehicleTypeID === vehicleTypeId; });
}

/**
 * 某個車型的科目表；這個車型還沒有自己的科目表時讀標準範本(唯讀沿用，第一次修改時才複製一份)。
 * 不帶車型 = 標準範本。
 */
function getPLLineItems(vehicleTypeId) {
  if (vehicleTypeId && hasOwnChart_(vehicleTypeId)) {
    return displayOrderDefs_(allLineItemRows_().filter(function (r) { return r.VehicleTypeID === vehicleTypeId; })
      .map(normalizeLineDef_));
  }
  return getTemplateLineItems_();
}

/** 依情境取科目表(計算引擎用) */
function lineDefsForScenario_(scenarioId) {
  return getPLLineItems(vehicleTypeOfScenario_(scenarioId));
}

/**
 * 確保車型有自己的一份科目表(還沒有就從 sourceTypeId 或標準範本複製)。呼叫端必須在 withLock_ 內。
 * 回傳是否有新建立。
 */
function ensureTypeChart_(vehicleTypeId, sourceTypeId) {
  if (!vehicleTypeId || hasOwnChart_(vehicleTypeId)) return false;
  var source = sourceTypeId && hasOwnChart_(sourceTypeId) ? getPLLineItems(sourceTypeId) : getTemplateLineItems_();
  var rows = source.map(function (d) { return copyLineRow_(d, vehicleTypeId); });
  batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', rows, []);
  return true;
}

function copyLineRow_(d, vehicleTypeId) {
  var row = {};
  SCHEMA.PLLineItems.forEach(function (h) { row[h] = d[h] === undefined ? '' : d[h]; });
  row.VehicleTypeID = vehicleTypeId || '';
  row.LineID = lineIdOf_(vehicleTypeId, d.LineCode);
  if (typeof row.VehicleFormulas === 'object') row.VehicleFormulas = JSON.stringify(row.VehicleFormulas);
  // 車系個別公式掛的是來源車型的車系代號，複製到別的車型就對不到了
  if (vehicleTypeId && d.VehicleTypeID && d.VehicleTypeID !== vehicleTypeId) row.VehicleFormulas = '';
  return row;
}

/**
 * 資料模型升級(每次開頁/載入資料包時都會跑，已經升級過的資料不會被動到)：
 *   1. 舊版全域科目表：補 LineID、標成標準範本
 *   2. 補 CalcType / Formula；名稱還是舊版「名稱裡寫公式」的換成新名稱(使用者改過的名稱不動)
 *   3. 每個車型都複製一份自己的科目表(materializeCharts = true 時)
 *   4. 內建參數補上參數定義
 */
function migrateDataModel_(materializeCharts) {
  var rows = allLineItemRows_();
  var upserts = [], deletes = [];
  rows.forEach(function (r) {
    var changed = false;
    var row = {};
    SCHEMA.PLLineItems.forEach(function (h) { row[h] = r[h] === undefined || r[h] === null ? '' : r[h]; });
    if (!row.LineID) {
      row.LineID = lineIdOf_(row.VehicleTypeID, row.LineCode);
      changed = true;
    }
    if (!row.CalcType) {
      row.CalcType = lineCalcType_(r);
      if (row.CalcType === CALC_TYPES.FORMULA && !row.Formula) row.Formula = DEFAULT_FORMULAS[row.LineCode] || '';
      if (LEGACY_LINE_NAMES[row.LineCode] && row.LineName === LEGACY_LINE_NAMES[row.LineCode]) {
        var builtIn = PL_LINE_ITEMS.filter(function (d) { return d.LineCode === row.LineCode; })[0];
        if (builtIn) row.LineName = builtIn.LineName;
      }
      changed = true;
    }
    if (changed) upserts.push(row);
  });
  if (upserts.length || deletes.length) {
    // 主鍵欄從 LineCode 改成 LineID：舊列的 LineID 是空的，整批寫入時用 LineCode 當比對依據會對不到，
    // 所以先把整張表依 LineCode 對應好再一次寫回
    var byCode = {};
    upserts.forEach(function (u) { byCode[(u.VehicleTypeID || '') + '|' + u.LineCode] = u; });
    var all = rows.map(function (r) {
      var key = (r.VehicleTypeID || '') + '|' + r.LineCode;
      if (byCode[key]) return byCode[key];
      var row = {};
      SCHEMA.PLLineItems.forEach(function (h) { row[h] = r[h] === undefined || r[h] === null ? '' : r[h]; });
      return row;
    });
    rewriteTable_(SHEETS.PL_LINE_ITEMS, all);
  }

  if (materializeCharts) {
    getVehicleTypes().forEach(function (t) { ensureTypeChart_(t.VehicleTypeID); });
  }
  seedParamDefs_();
}

/** 整張表換成 rows(依 SCHEMA 欄序)。給一次性的資料升級用 */
function rewriteTable_(sheetName, rows) {
  var sheet = getSheet_(sheetName);
  var headers = SCHEMA[sheetName];
  var lastRow = sheet.getLastRow();
  if (lastRow >= 2) sheet.getRange(2, 1, lastRow - 1, headers.length).clearContent();
  if (rows.length) {
    var range = sheet.getRange(2, 1, rows.length, headers.length);
    applyTextColumnFormats_(range, headers, sheetName);
    range.setValues(rows.map(function (r) { return headers.map(function (h) { return r[h] === undefined ? '' : r[h]; }); }));
  }
  invalidateSheetCache_(sheetName);
}

/* ---------------------------------------------------------------
 * 科目代碼/排序
 * ------------------------------------------------------------- */

/** 父科目字首：內建四段沿用 b/d/f/h，其他自訂群組用父科目代碼小寫，頂層科目用 S */
function lineCodePrefixFor_(parentLine) {
  if (LINE_CODE_PREFIX[parentLine]) return LINE_CODE_PREFIX[parentLine];
  if (!parentLine) return 'S';
  return String(parentLine).toLowerCase().replace(/[^a-z0-9]/g, '') + '_';
}

/** 下一個可用的科目代碼(同一個車型內唯一) */
function nextLineCode_(parentLine, vehicleTypeId) {
  var prefix = lineCodePrefixFor_(parentLine);
  var used = {};
  getPLLineItems(vehicleTypeId).forEach(function (d) { used[d.LineCode] = true; });
  var n = 1;
  while (used[prefix + n]) n++;
  return prefix + n;
}

/** 新科目排在同一段的最後面 */
function nextSortOrder_(parentLine, vehicleTypeId) {
  var defs = getPLLineItems(vehicleTypeId);
  var maxSort = 0;
  defs.forEach(function (d) { if (d.ParentLine === parentLine) maxSort = Math.max(maxSort, toNumber_(d.SortOrder)); });
  if (!maxSort) {
    var parent = defs.filter(function (d) { return d.LineCode === parentLine; })[0];
    maxSort = parent ? toNumber_(parent.SortOrder) : 90;
  }
  return maxSort + 0.5;
}

function newLineItemRow_(parentLine, lineName, vehicleTypeId) {
  var code = nextLineCode_(parentLine, vehicleTypeId);
  return {
    LineID: lineIdOf_(vehicleTypeId, code),
    VehicleTypeID: vehicleTypeId || '',
    LineCode: code,
    LineName: lineName,
    ParentLine: parentLine || '',
    Category: COST_SECTION_PARENTS.indexOf(parentLine) !== -1 ? '成本明細' : (parentLine ? '費用明細' : '自訂'),
    SortOrder: nextSortOrder_(parentLine, vehicleTypeId),
    CalcType: CALC_TYPES.INPUT,
    Formula: '', VehicleFormulas: '', AutoSource: '', CommodityTaxDeduct: '', DevAmortCategory: '', Description: ''
  };
}

/** 一個科目的手動輸入金額存在哪一頁：銷貨成本(B 段，含 B 底下的子群組)或營業費用 */
function isCostSectionLine_(def, defs) {
  var byCode = {};
  defs.forEach(function (d) { byCode[d.LineCode] = d; });
  var cur = def, guard = 0;
  while (cur && cur.ParentLine && guard++ < 20) {
    if (COST_SECTION_PARENTS.indexOf(cur.ParentLine) !== -1) return true;
    cur = byCode[cur.ParentLine];
  }
  return false;
}

/* ---------------------------------------------------------------
 * 給手動輸入頁面/開發總投頁面的科目選項
 * ------------------------------------------------------------- */

function inputLineOptions_(vehicleTypeId, costSection) {
  var defs = getPLLineItems(vehicleTypeId);
  return defs.filter(function (d) {
    return d.CalcType === CALC_TYPES.INPUT && isCostSectionLine_(d, defs) === costSection;
  }).map(function (d) { return { value: d.LineCode, label: d.LineCode + ' ' + d.LineName, parentLine: d.ParentLine }; });
}
/** 銷貨成本頁的成本項目(B 段底下、手動輸入) */
function getCostOfSalesLineOptions(vehicleTypeId) { return inputLineOptions_(vehicleTypeId, true); }
/** 營業費用頁的科目(B 段以外、手動輸入，含 J 前瞻費用) */
function getOperatingExpenseLineOptions(vehicleTypeId) { return inputLineOptions_(vehicleTypeId, false); }

/** 開發總投「攤提落點」選項：計算來源是開發總投攤提的科目 */
function getDevAmortTargetOptions(vehicleTypeId) {
  return getPLLineItems(vehicleTypeId)
    .filter(function (d) { return d.CalcType === CALC_TYPES.DEV_AMORT; })
    .map(function (d) {
      return { value: d.LineCode, label: d.LineName, parentLine: d.ParentLine, category: d.DevAmortCategory || '' };
    });
}

/* ---------------------------------------------------------------
 * 新增/修改/刪除科目
 * ------------------------------------------------------------- */

/** 在銷貨成本/營業費用頁面直接新增手動輸入科目 */
function addLineItemInline(parentLine, lineName, vehicleTypeId) {
  return withLock_(function () {
    if (!lineName) throw new Error('請輸入科目名稱');
    ensureTypeChart_(vehicleTypeId);
    return upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineID', newLineItemRow_(parentLine, lineName, vehicleTypeId));
  });
}

/** 在開發總投頁面直接新增攤提落點科目(設備/模具 → B 段，費用 → G 段) */
function addDevAmortLineItem(category, lineName, vehicleTypeId) {
  return withLock_(function () {
    if (!lineName) throw new Error('請輸入科目名稱');
    var parentLine = DEV_AMORT_CATEGORY_PARENT[category];
    if (!parentLine) throw new Error('大類不正確：' + (category || '(未選擇)'));
    ensureTypeChart_(vehicleTypeId);
    var row = newLineItemRow_(parentLine, lineName, vehicleTypeId);
    row.CalcType = CALC_TYPES.DEV_AMORT;
    row.AutoSource = AUTO_SOURCE.DEV_AMORT;
    row.DevAmortCategory = category;
    return upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineID', row);
  });
}

/**
 * 儲存一個科目(科目設定頁的明細編輯器)。沒有 LineCode 就是新增。
 * 存檔前檢查：公式語法、引用到不存在的科目/名稱、循環引用 —— 擋在存檔這一步，
 * 不要讓一個打錯的公式把整張損益表弄壞。
 */
function saveChartLine(vehicleTypeId, line) {
  return withLock_(function () {
    ensureTypeChart_(vehicleTypeId);
    var defs = getPLLineItems(vehicleTypeId);
    var existing = line.LineCode ? defs.filter(function (d) { return d.LineCode === line.LineCode; })[0] : null;
    if (line.LineCode && !existing) throw new Error('找不到科目：' + line.LineCode);
    if (!String(line.LineName || '').trim()) throw new Error('科目名稱為必填');

    var row = existing ? copyLineRow_(existing, vehicleTypeId) : newLineItemRow_(line.ParentLine || '', line.LineName, vehicleTypeId);
    ['LineName', 'ParentLine', 'Category', 'CalcType', 'Formula', 'CommodityTaxDeduct', 'DevAmortCategory', 'Description']
      .forEach(function (f) { if (line[f] !== undefined) row[f] = line[f] === null ? '' : line[f]; });
    row.LineName = String(row.LineName).trim();
    if (!CALC_TYPES[row.CalcType]) throw new Error('計算來源不正確：' + row.CalcType);
    // 公式可以用 [科目名稱] 寫(畫面上就是這樣顯示的)，存檔時一律換成科目代碼：
    // 代碼不會變，之後科目改名也不會讓公式斷掉
    var normalize = function (f) { return codifyFormulaNames_(cleanFormulaText_(f), defs); };
    if (line.VehicleFormulas !== undefined) {
      var vf = parseVehicleFormulas_(line.VehicleFormulas);
      var cleaned = {};
      Object.keys(vf).forEach(function (k) { if (String(vf[k] || '').trim()) cleaned[k] = normalize(vf[k]); });
      row.VehicleFormulas = Object.keys(cleaned).length ? JSON.stringify(cleaned) : '';
    }
    row.Formula = row.CalcType === CALC_TYPES.FORMULA ? normalize(row.Formula) : '';
    if (row.CalcType === CALC_TYPES.FORMULA && !row.Formula) throw new Error('請輸入公式');
    if (row.CalcType === CALC_TYPES.DEV_AMORT && !row.DevAmortCategory) {
      row.DevAmortCategory = row.ParentLine === 'G' ? '費用' : '模具';
    }
    if (row.CalcType === CALC_TYPES.DEV_AMORT && !row.AutoSource) row.AutoSource = AUTO_SOURCE.DEV_AMORT;
    if (row.CalcType !== CALC_TYPES.DEV_AMORT && DEV_AMORT_AUTO_SOURCES.indexOf(row.AutoSource) !== -1) row.AutoSource = '';
    if (row.ParentLine && row.ParentLine === row.LineCode) throw new Error('科目不能當自己的父科目');
    if (row.ParentLine && !defs.some(function (d) { return d.LineCode === row.ParentLine; })) {
      throw new Error('父科目不存在：' + row.ParentLine);
    }
    if (!existing) {
      // 新增時父科目可能換過，代碼與排序要照最後的父科目重新配
      var fresh = newLineItemRow_(row.ParentLine, row.LineName, vehicleTypeId);
      row.LineCode = fresh.LineCode; row.LineID = fresh.LineID; row.SortOrder = fresh.SortOrder;
      if (!line.Category) row.Category = fresh.Category;
    } else if (row.ParentLine !== existing.ParentLine) {
      row.SortOrder = nextSortOrder_(row.ParentLine, vehicleTypeId);
    }

    // 改名：其他公式裡還用舊名稱 [舊名稱] 引用這個科目的(舊資料、或直接寫在車系個別公式裡的)，一併換成代碼
    var renamed = [];
    if (existing && existing.LineName !== row.LineName) {
      defs.forEach(function (d) {
        if (d.LineCode === row.LineCode) return;
        var changed = false;
        var r2 = copyLineRow_(d, vehicleTypeId);
        var fix = function (f) {
          var out = replaceNameRef_(f, existing.LineName, row.LineCode);
          if (out !== f) changed = true;
          return out;
        };
        if (r2.Formula) r2.Formula = fix(r2.Formula);
        var vf2 = parseVehicleFormulas_(r2.VehicleFormulas);
        Object.keys(vf2).forEach(function (k) { vf2[k] = fix(vf2[k]); });
        if (Object.keys(vf2).length) r2.VehicleFormulas = JSON.stringify(vf2);
        if (changed) renamed.push(r2);
      });
    }

    var touched = {};
    renamed.forEach(function (r) { touched[r.LineCode] = r; });
    var nextDefs = defs.filter(function (d) { return d.LineCode !== row.LineCode; })
      .map(function (d) { return touched[d.LineCode] ? normalizeLineDef_(touched[d.LineCode]) : d; })
      .concat([normalizeLineDef_(row)]);
    var problems = chartProblems_(nextDefs, vehicleTypeId).filter(function (p) { return p.level === 'error'; });
    if (problems.length) throw new Error(problems.map(function (p) { return p.message; }).join('\n'));

    if (renamed.length) batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', renamed, []);
    upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineID', row);
    return { line: normalizeLineDef_(row), editor: getChartEditor(vehicleTypeId, line.__scenarioId || '') };
  });
}

/** 整批儲存(舊介面相容：科目設定表格一次送出) */
function savePLLineItemGrid(rows, vehicleTypeId) {
  return withLock_(function () {
    ensureTypeChart_(vehicleTypeId);
    (rows || []).forEach(function (r) {
      if (!r.LineCode && !r.LineName) return;
      var defs = getPLLineItems(vehicleTypeId);
      var existing = r.LineCode ? defs.filter(function (d) { return d.LineCode === r.LineCode; })[0] : null;
      if (!r.LineName) throw new Error('科目名稱為必填');
      var row;
      if (existing) {
        row = copyLineRow_(existing, vehicleTypeId);
        row.LineName = r.LineName;
        if (r.Category !== undefined) row.Category = r.Category;
        if (r.SortOrder !== undefined && r.SortOrder !== '') row.SortOrder = toNumber_(r.SortOrder);
        if (r.ParentLine !== undefined && existing.CalcType === CALC_TYPES.INPUT) row.ParentLine = r.ParentLine;
      } else {
        row = newLineItemRow_(r.ParentLine, r.LineName, vehicleTypeId);
        if (r.Category) row.Category = r.Category;
        if (r.SortOrder !== '' && r.SortOrder !== undefined && r.SortOrder !== null) row.SortOrder = toNumber_(r.SortOrder);
      }
      upsertRow_(SHEETS.PL_LINE_ITEMS, 'LineID', row);
    });
    return getPLLineItems(vehicleTypeId);
  });
}
function savePLLineItem(rowObj) {
  return savePLLineItemGrid([rowObj], rowObj.VehicleTypeID || '')[0];
}

/** 公式裡明確引用某個科目代碼的科目 */
function lineReferencedBy_(defs, lineCode) {
  return defs.filter(function (d) {
    if (d.LineCode === lineCode) return false;
    var formulas = [d.CalcType === CALC_TYPES.FORMULA ? d.Formula : ''];
    var vf = parseVehicleFormulas_(d.VehicleFormulas);
    Object.keys(vf).forEach(function (k) { formulas.push(vf[k]); });
    return formulas.some(function (f) {
      if (!f) return false;
      var info = inspectFormula_(f);
      if (!info.ok) return false;
      if (info.refs.codes.indexOf(lineCode) !== -1) return true;
      var target = defs.filter(function (x) { return x.LineCode === lineCode; })[0];
      return target && info.refs.names.indexOf(target.LineName) !== -1;
    });
  });
}

/**
 * 刪除科目，連同這個車型所有情境裡該科目已輸入的金額/說明。
 * 所有科目(含預設的小計/毛利/淨利)都可以刪；只會擋下會讓資料壞掉的情況：還有其他科目公式引用它、還有子科目、還有開發總投列攤提到這裡。
 */
function deletePLLineItem(lineCode, vehicleTypeId) {
  return withLock_(function () {
    ensureTypeChart_(vehicleTypeId);
    var defs = getPLLineItems(vehicleTypeId);
    var def = defs.filter(function (d) { return d.LineCode === lineCode; })[0];
    if (!def) return false;
    var users = lineReferencedBy_(defs, lineCode);
    if (users.length) {
      throw new Error('「' + def.LineName + '」被這些科目的公式引用：' +
        users.map(function (u) { return u.LineName; }).join('、') + '。請先修改那些公式再刪除。');
    }
    var kids = defs.filter(function (d) { return d.ParentLine === lineCode; });
    if (kids.length) {
      throw new Error('「' + def.LineName + '」底下還有 ' + kids.length + ' 個子科目，請先把子科目移走或刪除。');
    }
    var scenarioIds = {};
    getScenarios(vehicleTypeId || undefined).forEach(function (s) { scenarioIds[s.ScenarioID] = true; });
    var inScope = function (r) { return vehicleTypeId ? scenarioIds[r.ScenarioID] : true; };
    if (def.CalcType === CALC_TYPES.DEV_AMORT) {
      var used = (sheetToObjects_(SHEETS.DEV_INVESTMENT) || []).filter(function (r) {
        return inScope(r) && devAmortTargetOf_(r) === lineCode;
      });
      if (used.length) {
        throw new Error('「' + def.LineName + '」在「開發總投」還有 ' + used.length +
          ' 筆資料指到這個攤提落點，請先把那些列改選別的攤提落點或刪除，才能刪除這個科目。');
      }
    }
    [SHEETS.COST_OF_SALES, SHEETS.OPERATING_EXPENSE, SHEETS.LINE_NOTES].forEach(function (sheetName) {
      var pks = (sheetToObjects_(sheetName) || []).filter(function (r) { return r.LineCode === lineCode && inScope(r); })
        .map(function (r) { return r.RowID; });
      if (pks.length) batchWriteRows_(sheetName, 'RowID', [], pks);
    });
    return deleteRow_(SHEETS.PL_LINE_ITEMS, 'LineID', def.LineID || lineIdOf_(vehicleTypeId, lineCode));
  });
}
/** 舊介面：銷貨成本/營業費用頁的「刪除」 */
function deleteLineItemInline(lineCode, vehicleTypeId) { return deletePLLineItem(lineCode, vehicleTypeId); }

/**
 * 調整科目順序/層級(科目設定頁拖曳後一次送出)。
 * items = [{LineCode, ParentLine}]，依陣列順序重新編排序值；任何科目都可以換父科目。
 */
function setLineOrder(vehicleTypeId, items) {
  return withLock_(function () {
    ensureTypeChart_(vehicleTypeId);
    var defs = getPLLineItems(vehicleTypeId);
    var byCode = {};
    defs.forEach(function (d) { byCode[d.LineCode] = d; });
    var seen = {};
    var upserts = [];
    (items || []).forEach(function (it, i) {
      var d = byCode[it.LineCode];
      if (!d || seen[it.LineCode]) return;
      seen[it.LineCode] = true;
      var row = copyLineRow_(d, vehicleTypeId);
      row.SortOrder = (i + 1) * 10;
      if (it.ParentLine !== undefined && it.ParentLine !== d.ParentLine) {
        if (it.ParentLine && !byCode[it.ParentLine]) throw new Error('父科目不存在：' + it.ParentLine);
        if (it.ParentLine === d.LineCode) throw new Error('科目不能當自己的父科目');
        row.ParentLine = it.ParentLine;
      }
      upserts.push(row);
    });
    // 沒出現在 items 裡的科目排到最後，維持原本相對順序
    var n = upserts.length;
    defs.forEach(function (d) {
      if (seen[d.LineCode]) return;
      var row = copyLineRow_(d, vehicleTypeId);
      row.SortOrder = (++n) * 10;
      upserts.push(row);
    });
    // 依呈現順序(扣減型小計排在明細後面)重新編號，讓存下來的 SortOrder 本身就是 Excel 的順序
    var posOf = {};
    displayOrderDefs_(upserts.map(normalizeLineDef_)).forEach(function (d, i) { posOf[d.LineCode] = i; });
    upserts.forEach(function (row) { row.SortOrder = (posOf[row.LineCode] + 1) * 10; });
    var problems = chartProblems_(upserts.map(normalizeLineDef_), vehicleTypeId).filter(function (p) { return p.level === 'error'; });
    if (problems.length) throw new Error(problems.map(function (p) { return p.message; }).join('\n'));
    batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', upserts, []);
    return getPLLineItems(vehicleTypeId);
  });
}

/**
 * 把車型的科目表換成另一份(標準範本或另一個車型)。
 * 代碼相同的科目沿用(已輸入的金額照樣對得到)；新科目表沒有的科目，金額留著但不會被計入，畫面會列出提醒。
 */
function copyChartFromType(targetTypeId, sourceTypeId) {
  return withLock_(function () {
    if (!targetTypeId) throw new Error('請先選擇車型');
    if (sourceTypeId === targetTypeId) throw new Error('來源跟目標是同一個車型');
    var source = sourceTypeId ? getPLLineItems(sourceTypeId) : getTemplateLineItems_();
    var oldPks = allLineItemRows_().filter(function (r) { return r.VehicleTypeID === targetTypeId; })
      .map(function (r) { return r.LineID; });
    var rows = source.map(function (d) { return copyLineRow_(d, targetTypeId); });
    batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', rows, oldPks);
    return getChartEditor(targetTypeId, '');
  });
}

/** 把這個車型的科目表存成標準範本(之後新建的車型預設複製這一份) */
function saveChartAsTemplate(vehicleTypeId) {
  return withLock_(function () {
    if (!vehicleTypeId) throw new Error('請先選擇車型');
    var source = getPLLineItems(vehicleTypeId);
    var oldPks = allLineItemRows_().filter(function (r) { return !r.VehicleTypeID; }).map(function (r) { return r.LineID; });
    var rows = source.map(function (d) { var r = copyLineRow_(d, ''); r.VehicleFormulas = ''; return r; });
    batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', rows, oldPks);
    return getTemplateLineItems_().length;
  });
}

/** 把內建科目的名稱/公式/位置回復成系統預設值(自訂科目不受影響) */
function restoreBuiltInLineItems(vehicleTypeId) {
  return withLock_(function () {
    ensureTypeChart_(vehicleTypeId);
    var current = {};
    getPLLineItems(vehicleTypeId).forEach(function (d) { current[d.LineCode] = d; });
    var upserts = PL_LINE_ITEMS.map(function (line) {
      var row = copyLineRow_(line, vehicleTypeId);
      if (current[line.LineCode]) row.VehicleFormulas = current[line.LineCode].VehicleFormulas || '';
      return row;
    });
    batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', upserts, []);
    // 預設公式會用到預設參數：之前刪掉(墓碑)的預設參數一起補回來，公式才不會出錯
    var tomb = (sheetToObjects_(SHEETS.PARAM_DEFS) || []).filter(function (r) {
      return r.Unit === DELETED_PARAM_UNIT && TAX_RATE_PARAM_NAMES.indexOf(r.ParamName) !== -1;
    }).map(function (r) { return r.ParamName; });
    if (tomb.length) { batchWriteRows_(SHEETS.PARAM_DEFS, 'ParamName', [], tomb); seedParamDefs_(); }
    return getPLLineItems(vehicleTypeId);
  });
}

/* ---------------------------------------------------------------
 * 公式檢查
 * ------------------------------------------------------------- */

/** 公式可以用的 [名稱]：系統變數、參數、匯率、科目名稱 */
function formulaNameCatalog_(defs) {
  var params = getParamDefs();
  return {
    variables: SYSTEM_VARIABLES.map(function (v) { return v.name; }),
    params: params.map(function (p) { return p.ParamName; }),
    lineNames: defs.map(function (d) { return d.LineName; })
  };
}

function isKnownFormulaName_(name, catalog) {
  if (catalog.variables.indexOf(name) !== -1 || catalog.params.indexOf(name) !== -1) return true;
  if (catalog.lineNames.indexOf(name) !== -1) return true;
  return /^[A-Za-z]{3}匯率$/.test(name);
}

/**
 * 檢查整張科目表：公式語法、引用不存在的科目/名稱、循環引用(error)，
 * 以及「這個科目的金額沒有被任何小計算進去」(warning) —— 公式可以自由改之後最容易犯的錯，
 * 就是加了科目卻沒有任何小計把它加進去，損益表上看得到這個數字、營業淨利卻沒扣。
 */
function chartProblems_(defs, vehicleTypeId) {
  var problems = [];
  var byCode = {};
  defs.forEach(function (d) { byCode[d.LineCode] = d; });
  var catalog = formulaNameCatalog_(defs);
  var deps = {};

  defs.forEach(function (d) {
    var formulas = [];
    if (d.CalcType === CALC_TYPES.FORMULA) formulas.push({ f: d.Formula, who: '' });
    var vf = parseVehicleFormulas_(d.VehicleFormulas);
    Object.keys(vf).forEach(function (k) { formulas.push({ f: vf[k], who: k }); });
    deps[d.LineCode] = [];
    formulas.forEach(function (item) {
      var label = '「' + d.LineName + '」' + (item.who ? '(車系 ' + item.who + ' 個別公式)' : '');
      var info = inspectFormula_(item.f);
      if (!info.ok) { problems.push({ level: 'error', code: d.LineCode, message: label + '公式錯誤：' + info.error }); return; }
      info.refs.codes.forEach(function (c) {
        if (!byCode[c]) problems.push({ level: 'error', code: d.LineCode, message: label + '引用了不存在的科目代碼 ' + c });
        else deps[d.LineCode].push(c);
      });
      info.refs.names.forEach(function (n) {
        if (!isKnownFormulaName_(n, catalog)) {
          problems.push({ level: 'error', code: d.LineCode, message: label + '的 [' + n + '] 不是系統變數、參數，也不是科目名稱' });
          return;
        }
        var target = defs.filter(function (x) { return x.LineName === n; })[0];
        if (target && catalog.variables.indexOf(n) === -1 && catalog.params.indexOf(n) === -1) deps[d.LineCode].push(target.LineCode);
      });
      if (info.refs.calls.indexOf('CHILDREN') !== -1) {
        defs.forEach(function (x) { if (x.ParentLine === d.LineCode) deps[d.LineCode].push(x.LineCode); });
      }
      if (info.refs.calls.indexOf('TAXDEDUCT') !== -1) {
        defs.forEach(function (x) { if (String(x.CommodityTaxDeduct).toUpperCase() === 'Y') deps[d.LineCode].push(x.LineCode); });
      }
    });
  });

  // 循環引用：DFS
  var state = {};
  var cycles = [];
  function visit(code, path) {
    if (state[code] === 2) return;
    if (state[code] === 1) {
      var start = path.indexOf(code);
      cycles.push(path.slice(start).concat([code]));
      return;
    }
    state[code] = 1;
    (deps[code] || []).forEach(function (c) { visit(c, path.concat([code])); });
    state[code] = 2;
  }
  defs.forEach(function (d) { visit(d.LineCode, []); });
  cycles.forEach(function (cyc) {
    problems.push({
      level: 'error', code: cyc[0],
      message: '循環引用：' + cyc.map(function (c) { return byCode[c] ? byCode[c].LineName : c; }).join(' → ') + '（公式互相引用，算不出結果）'
    });
  });

  // 沒有被算進營業淨利的科目
  var profitCode = profitLineCode_(defs);
  if (profitCode) {
    var reach = {};
    (function mark(code) {
      if (reach[code]) return;
      reach[code] = true;
      (deps[code] || []).forEach(mark);
    })(profitCode);
    defs.forEach(function (d) {
      if (reach[d.LineCode] || d.Category === '售價結構') return;
      if (d.ParentLine && !reach[d.ParentLine]) return;   // 父科目已經會被提醒，不重複
      problems.push({
        level: 'warning', code: d.LineCode,
        message: '「' + d.LineName + '」沒有被任何小計算進營業淨利(父科目的公式沒有用 CHILDREN()，也沒有其他公式引用它)'
      });
    });
  }
  return problems;
}

/**
 * 科目設定頁的資料：科目表、參數與變數清單、檢查結果，以及目前情境各車系的試算值(邊改邊看)。
 */
function getChartEditor(vehicleTypeId, scenarioId) {
  var defs = getPLLineItems(vehicleTypeId);
  var vehicles = vehicleTypeId ? getVehicles(vehicleTypeId).map(function (v) {
    return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' };
  }) : [];
  var preview = null;
  if (scenarioId && vehicleTypeOfScenario_(scenarioId) === vehicleTypeId) {
    preview = chartPreviewValues_(scenarioId, vehicles, null);
  }
  var usage = lineUsageCounts_(vehicleTypeId);
  var profitCode = profitLineCode_(defs);
  // 目前情境的參數值(公式編輯器的選單顯示用；% 參數是小數)。
  // 參數可以每個車系各設一個值：有試算資料時跟每一行的數字一樣用銷售構成加權平均，否則看情境共用的值
  var paramValues = {};
  if (scenarioId) {
    var scenarioParams = calcParameters_(scenarioId);
    var weights = {};
    if (preview) Object.keys(preview.values).forEach(function (vid) { weights[vid] = toNumber_(preview.weights[vid]); });
    var totalWeight = Object.keys(weights).reduce(function (s, vid) { return s + weights[vid]; }, 0);
    getParamDefs().forEach(function (p) {
      if (!totalWeight) { paramValues[p.ParamName] = paramValueForFormula_(scenarioParams, p, ''); return; }
      paramValues[p.ParamName] = Object.keys(weights).reduce(function (s, vid) {
        return s + paramValueForFormula_(scenarioParams, p, vid) * weights[vid];
      }, 0) / totalWeight;
    });
  }
  return {
    vehicleTypeId: vehicleTypeId || '',
    ownChart: hasOwnChart_(vehicleTypeId),
    lines: defs.map(function (d) {
      var out = {};
      Object.keys(d).forEach(function (k) { out[k] = d[k]; });
      out.VehicleFormulas = parseVehicleFormulas_(d.VehicleFormulas);
      out.isProtected = PROTECTED_LINE_CODES.indexOf(d.LineCode) !== -1;
      out.isDefaultFormula = d.CalcType === CALC_TYPES.FORMULA && DEFAULT_FORMULAS[d.LineCode] === d.Formula;
      out.usage = usage[d.LineCode] || 0;
      return out;
    }),
    vehicles: vehicles,
    profitCode: profitCode,
    // 刪掉目前的營業淨利之後會改用哪個科目(刪除確認視窗說明用)
    nextProfitCode: profitLineCode_(defs.filter(function (d) { return d.LineCode !== profitCode; })),
    paramValues: paramValues,
    variables: SYSTEM_VARIABLES,
    params: getParamDefs(),
    calcTypeLabels: CALC_TYPE_LABELS,
    devCategories: DEV_AMORT_CATEGORIES,
    problems: chartProblems_(defs, vehicleTypeId),
    preview: preview,
    otherTypes: getVehicleTypes().map(function (t) { return t.VehicleTypeID; }).filter(function (id) { return id !== vehicleTypeId; }),
    referenceScenarios: getScenarios().map(function (s) {
      return { ScenarioID: s.ScenarioID, label: [s.VehicleTypeID, s.Gate, s.ScenarioName].filter(function (x) { return x; }).join(' ') };
    })
  };
}

/** 每個科目在這個車型的情境裡有幾筆手動輸入金額(刪科目前提醒用) */
function lineUsageCounts_(vehicleTypeId) {
  var ids = {};
  getScenarios(vehicleTypeId || undefined).forEach(function (s) { ids[s.ScenarioID] = true; });
  var counts = {};
  [SHEETS.COST_OF_SALES, SHEETS.OPERATING_EXPENSE].forEach(function (name) {
    (sheetToObjects_(name) || []).forEach(function (r) {
      if (!ids[r.ScenarioID] || r.Amount === '' || r.Amount === undefined) return;
      counts[r.LineCode] = (counts[r.LineCode] || 0) + 1;
    });
  });
  return counts;
}

/** 目前情境各車系的科目值；overrideDefs 有值時用改到一半(還沒存)的科目表試算 */
function chartPreviewValues_(scenarioId, vehicles, overrideDefs, probe) {
  var mix = {};
  getSalesMix(scenarioId).forEach(function (r) { mix[r.VehicleID] = true; });
  var out = { scenarioId: scenarioId, values: {}, errors: {}, traces: {}, weights: {}, probes: {} };
  getSalesMix(scenarioId).forEach(function (r) { out.weights[r.VehicleID] = toNumber_(r.SalesMixPct); });
  vehicles.forEach(function (v) {
    if (!mix[v.VehicleID]) return;
    try {
      var res = overrideDefs ? calculatePLWithDefs_(scenarioId, v.VehicleID, overrideDefs, probe) : calculatePLCore_(scenarioId, v.VehicleID);
      out.values[v.VehicleID] = res.lineValues;
      if (res.probes) out.probes[v.VehicleID] = res.probes;
      out.errors[v.VehicleID] = res.errors;
      out.traces[v.VehicleID] = res.traces;
    } catch (e) {
      out.errors[v.VehicleID] = { '*': e.message };
    }
  });
  return out;
}

/**
 * 科目設定頁「邊打公式邊看結果」：用畫面上還沒存的那一個科目試算，不寫入任何資料。
 * 回傳每個車系的結果與錯誤；公式本身有問題時回傳 problems。
 * 還沒新增的科目(LineCode 空白)用暫時代碼 NEW_LINE_PREVIEW_CODE 試算。
 * line.Probes = [公式...]：另外算每一段公式的值(公式編輯器的每一行/每一顆膠囊)，放在 preview.probes。
 */
var NEW_LINE_PREVIEW_CODE = '__NEW__';
function previewLineFormula(vehicleTypeId, scenarioId, line) {
  var defs = getPLLineItems(vehicleTypeId);
  var code = line.LineCode || NEW_LINE_PREVIEW_CODE;
  var patchLine = function (d) {
    var p = {};
    Object.keys(d).forEach(function (k) { p[k] = d[k]; });
    ['CalcType', 'Formula', 'CommodityTaxDeduct', 'ParentLine'].forEach(function (f) { if (line[f] !== undefined) p[f] = line[f]; });
    if (line.VehicleFormulas !== undefined) p.VehicleFormulas = JSON.stringify(parseVehicleFormulas_(line.VehicleFormulas));
    return p;
  };
  var patched = line.LineCode
    ? defs.map(function (d) { return d.LineCode === line.LineCode ? patchLine(d) : d; })
    : defs.concat([patchLine({ LineCode: code, LineName: String(line.LineName || '').trim() || code, ParentLine: '', SortOrder: 9999 })]);
  var problems = chartProblems_(patched, vehicleTypeId).filter(function (p) { return p.code === code && p.level === 'error'; });
  if (!scenarioId) return { problems: problems, preview: null };
  var vehicles = getVehicles(vehicleTypeId).map(function (v) { return { VehicleID: v.VehicleID, VehicleCode: v.VehicleCode || '' }; });
  var probe = Array.isArray(line.Probes) && line.Probes.length ? { code: code, formulas: line.Probes.slice(0, 80).map(String) } : null;
  if (problems.length) {
    // 公式有錯也照樣算每一行/每顆膠囊：這個科目先當成手動輸入，算得出來的行顯示數字，有錯的那一行是 null
    var out = { problems: problems, preview: null };
    if (probe) {
      var safe = patched.map(function (d) {
        if (d.LineCode !== code) return d;
        var p = {};
        Object.keys(d).forEach(function (k) { p[k] = d[k]; });
        p.CalcType = CALC_TYPES.INPUT; p.Formula = ''; p.VehicleFormulas = '';
        return p;
      });
      var pv = chartPreviewValues_(scenarioId, vehicles, safe, probe);
      out.probes = { probes: pv.probes, weights: pv.weights };
    }
    return out;
  }
  return { problems: [], preview: chartPreviewValues_(scenarioId, vehicles, patched, probe) };
}

/* ---------------------------------------------------------------
 * 參數定義(稅率/費率之外，使用者可以自己加參數給公式用)
 * ------------------------------------------------------------- */

function seedParamDefs_() {
  var existing = indexByPk_(sheetToObjects_(SHEETS.PARAM_DEFS) || [], 'ParamName');
  var add = [];
  TAX_RATE_PARAM_NAMES.forEach(function (name, i) {
    if (existing[name]) return;
    add.push({ ParamName: name, Unit: BUILTIN_PARAM_UNITS[name] || '%', DefaultValue: DEFAULT_PARAMS[name], Description: '內建參數', SortOrder: i + 1 });
  });
  if (add.length) batchWriteRows_(SHEETS.PARAM_DEFS, 'ParamName', add, []);
}

/**
 * 參數定義。稅率、佣金率…這幾個是「預設參數」(系統一開始幫你建好)，跟自訂參數一樣可以改單位、預設值、改名或刪除。
 * 刪掉的預設參數留一列墓碑(Unit = DELETED_PARAM_UNIT)，資料升級時才不會又被補回來；同名再新增就會復活。
 */
var DELETED_PARAM_UNIT = 'DELETED';
function getParamDefs() {
  var all = sortByOrder_(sheetToObjects_(SHEETS.PARAM_DEFS) || [], 'SortOrder');
  var names = all.map(function (r) { return r.ParamName; });
  // 還沒跑過資料升級(例如 Node 驗算直接呼叫)時，預設參數仍然要在
  TAX_RATE_PARAM_NAMES.forEach(function (name) {
    if (names.indexOf(name) === -1) all.push({ ParamName: name, Unit: BUILTIN_PARAM_UNITS[name] || '%', DefaultValue: DEFAULT_PARAMS[name], Description: '預設參數', SortOrder: '' });
  });
  return all.filter(function (r) { return r.Unit !== DELETED_PARAM_UNIT; }).map(function (r) {
    return {
      ParamName: r.ParamName, Unit: r.Unit || '%',
      DefaultValue: r.DefaultValue === undefined ? '' : r.DefaultValue,
      Description: r.Description === '內建參數' ? '預設參數' : (r.Description || ''), SortOrder: r.SortOrder,
      isPreset: TAX_RATE_PARAM_NAMES.indexOf(r.ParamName) !== -1
    };
  });
}

function validateParamName_(name) {
  if (!name) throw new Error('請輸入參數名稱');
  if (/[\[\]"]/.test(name)) throw new Error('參數名稱不能包含 [ ] 或引號');
  if (FX_PARAM_NAMES.indexOf(name) !== -1) throw new Error('「' + name + '」是匯率，請到「參數與比率」頁下方的匯率表維護');
  if (SYSTEM_VARIABLES.some(function (v) { return v.name === name; })) throw new Error('「' + name + '」是系統變數名稱，請換一個名稱');
}

/** 新增/修改參數定義(預設參數也一樣可以改單位與預設值) */
function saveParamDef(def) {
  return withLock_(function () {
    var name = String(def.ParamName || '').trim();
    validateParamName_(name);
    var existing = indexByPk_(sheetToObjects_(SHEETS.PARAM_DEFS) || [], 'ParamName')[name];
    if (existing && existing.Unit === DELETED_PARAM_UNIT) existing = null;
    var row = {
      ParamName: name, Unit: PARAM_UNITS.indexOf(def.Unit) !== -1 ? def.Unit : '%',
      DefaultValue: def.DefaultValue === '' || def.DefaultValue === undefined || def.DefaultValue === null ? '' : toNumber_(def.DefaultValue),
      Description: def.Description || '',
      SortOrder: existing ? existing.SortOrder : (getParamDefs().length + 1)
    };
    upsertRow_(SHEETS.PARAM_DEFS, 'ParamName', row);
    return getParamDefs();
  });
}

/** 參數改名：公式裡的 [舊名稱]、各情境填的數值一起改過去 */
function renameParamDef(oldName, newName) {
  return withLock_(function () {
    newName = String(newName || '').trim();
    if (oldName === newName) return getParamDefs();
    validateParamName_(newName);
    var defs = getParamDefs();
    var def = defs.filter(function (d) { return d.ParamName === oldName; })[0];
    if (!def) throw new Error('找不到參數：' + oldName);
    if (defs.some(function (d) { return d.ParamName === newName; })) throw new Error('已經有參數叫「' + newName + '」');
    if (allLineItemRows_().some(function (r) { return r.LineName === newName; })) throw new Error('已經有科目叫「' + newName + '」，請換一個名稱');
    var deletes = TAX_RATE_PARAM_NAMES.indexOf(oldName) === -1 ? [oldName] : [];
    var adds = [{ ParamName: newName, Unit: def.Unit, DefaultValue: def.DefaultValue, Description: def.Description, SortOrder: def.SortOrder }];
    // 預設參數改名後留墓碑，資料升級才不會把舊名稱補回來
    if (TAX_RATE_PARAM_NAMES.indexOf(oldName) !== -1) adds.push({ ParamName: oldName, Unit: DELETED_PARAM_UNIT, DefaultValue: '', Description: '已改名為 ' + newName, SortOrder: '' });
    batchWriteRows_(SHEETS.PARAM_DEFS, 'ParamName', adds, deletes);
    var pUps = (sheetToObjects_(SHEETS.PARAMETERS) || []).filter(function (r) { return r.ParamName === oldName; }).map(function (r) {
      var c = {}; SCHEMA.Parameters.forEach(function (h) { c[h] = r[h]; }); c.ParamName = newName; return c;
    });
    if (pUps.length) batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', pUps, []);
    var lineUps = [];
    allLineItemRows_().forEach(function (r) {
      var f = replaceNameRef_(r.Formula, oldName, '[' + newName + ']');
      var vf = parseVehicleFormulas_(r.VehicleFormulas), vfChanged = false;
      Object.keys(vf).forEach(function (k) { var nf = replaceNameRef_(vf[k], oldName, '[' + newName + ']'); if (nf !== vf[k]) { vf[k] = nf; vfChanged = true; } });
      if (f === r.Formula && !vfChanged) return;
      var c = {}; SCHEMA.PLLineItems.forEach(function (h) { c[h] = r[h] === undefined ? '' : r[h]; });
      c.Formula = f;
      if (vfChanged) c.VehicleFormulas = JSON.stringify(vf);
      lineUps.push(c);
    });
    if (lineUps.length) batchWriteRows_(SHEETS.PL_LINE_ITEMS, 'LineID', lineUps, []);
    return getParamDefs();
  });
}

function deleteParamDef(name) {
  return withLock_(function () {
    var usedBy = [];
    var seen = {};
    allLineItemRows_().map(normalizeLineDef_).forEach(function (d) {
      var fs = [d.Formula];
      var vf = parseVehicleFormulas_(d.VehicleFormulas);
      Object.keys(vf).forEach(function (k) { fs.push(vf[k]); });
      if (fs.some(function (f) { var i = f ? inspectFormula_(f) : null; return i && i.ok && i.refs.names.indexOf(name) !== -1; })) {
        var label = (d.VehicleTypeID || '範本') + ' ' + d.LineName;
        if (!seen[label]) { seen[label] = true; usedBy.push(label); }
      }
    });
    if (usedBy.length) throw new Error('參數「' + name + '」被這些科目的公式使用：' + usedBy.join('、') + '。請先修改那些公式再刪除。');
    var pks = (sheetToObjects_(SHEETS.PARAMETERS) || []).filter(function (p) { return p.ParamName === name; })
      .map(function (p) { return p.ParamID; });
    if (pks.length) batchWriteRows_(SHEETS.PARAMETERS, 'ParamID', [], pks);
    if (TAX_RATE_PARAM_NAMES.indexOf(name) !== -1) upsertRow_(SHEETS.PARAM_DEFS, 'ParamName', { ParamName: name, Unit: DELETED_PARAM_UNIT, DefaultValue: '', Description: '已刪除', SortOrder: '' });
    else deleteRow_(SHEETS.PARAM_DEFS, 'ParamName', name);
    return getParamDefs();
  });
}

/** 參數的值(給公式用)：% 單位自動換算成小數 */
function paramValueForFormula_(params, def, vehicleId) {
  var raw;
  var has = params.some(function (p) { return p.ParamName === def.ParamName && (!p.VehicleID || p.VehicleID === vehicleId); });
  if (has) raw = lookupParam_(params, def.ParamName, vehicleId);
  else if (def.DefaultValue !== '' && def.DefaultValue !== undefined) raw = toNumber_(def.DefaultValue);
  else raw = DEFAULT_PARAMS[def.ParamName] !== undefined ? DEFAULT_PARAMS[def.ParamName] : 0;
  return def.Unit === '%' ? raw / 100 : raw;
}

/* ---------------------------------------------------------------
 * 科目說明(報告/簡報的「說明」欄)
 * ------------------------------------------------------------- */

/**
 * 某情境的科目說明 { LineCode: 說明 }。沒有另外寫說明的科目，沿用銷貨成本/營業費用頁的備註，
 * 這樣以前填過的備註不必重打一次就會出現在報告上。
 */
function getLineNotes(scenarioId) {
  var notes = {};
  [SHEETS.COST_OF_SALES, SHEETS.OPERATING_EXPENSE].forEach(function (name) {
    (sheetToObjects_(name) || []).forEach(function (r) {
      if (r.ScenarioID === scenarioId && r.Notes && !notes[r.LineCode]) notes[r.LineCode] = String(r.Notes);
    });
  });
  (sheetToObjects_(SHEETS.LINE_NOTES) || []).forEach(function (r) {
    if (r.ScenarioID === scenarioId && !r.VehicleID) notes[r.LineCode] = r.Notes === undefined ? '' : String(r.Notes);
  });
  return notes;
}

/** 儲存科目說明 notes = { LineCode: 說明 }(只送有改的也可以) */
function saveLineNotes(scenarioId, notes) {
  return withLock_(function () {
    if (!scenarioId) throw new Error('請先選擇情境');
    var existing = {};
    (sheetToObjects_(SHEETS.LINE_NOTES) || []).forEach(function (r) {
      if (r.ScenarioID === scenarioId && !r.VehicleID) existing[r.LineCode] = r;
    });
    var upserts = [];
    Object.keys(notes || {}).forEach(function (code) {
      var text = notes[code] === undefined || notes[code] === null ? '' : String(notes[code]);
      var row = existing[code];
      upserts.push({ RowID: row ? row.RowID : '', ScenarioID: scenarioId, LineCode: code, VehicleID: '', Notes: text });
    });
    if (upserts.length) batchWriteRows_(SHEETS.LINE_NOTES, 'RowID', upserts, []);
    return getLineNotes(scenarioId);
  });
}

/* ---------------------------------------------------------------
 * 改善作法(現況 → 目標的差距要靠哪些作法補起來)
 * ------------------------------------------------------------- */

function getActions(scenarioId) {
  return sortByOrder_((sheetToObjects_(SHEETS.ACTIONS) || []).filter(function (r) { return r.ScenarioID === scenarioId; }), 'SortOrder')
    .map(function (r) {
      return {
        ActionID: r.ActionID, ScenarioID: r.ScenarioID, VehicleTypeID: r.VehicleTypeID || '',
        LineCode: r.LineCode || '', Title: r.Title || '', Detail: r.Detail || '', Owner: r.Owner || '',
        Effect: r.Effect === '' || r.Effect === undefined ? '' : toNumber_(r.Effect),
        Status: r.Status || ACTION_STATUSES[0], DueDate: r.DueDate || '', SortOrder: r.SortOrder
      };
    });
}

/** 整批儲存作法：依陣列順序編排序；作法名稱跟效果都空白的列視為刪除 */
function saveActions(scenarioId, rows) {
  return withLock_(function () {
    if (!scenarioId) throw new Error('請先選擇目標情境');
    var typeId = vehicleTypeOfScenario_(scenarioId);
    var keep = {};
    var upserts = [];
    (rows || []).forEach(function (r) {
      var empty = !String(r.Title || '').trim() && (r.Effect === '' || r.Effect === null || r.Effect === undefined);
      if (empty) return;
      var row = {
        ActionID: r.ActionID || '', VehicleTypeID: typeId, ScenarioID: scenarioId,
        LineCode: r.LineCode || '', Title: String(r.Title || '').trim(), Detail: r.Detail || '', Owner: r.Owner || '',
        Effect: r.Effect === '' || r.Effect === null || r.Effect === undefined ? '' : toNumber_(r.Effect),
        Status: ACTION_STATUSES.indexOf(r.Status) !== -1 ? r.Status : ACTION_STATUSES[0],
        DueDate: r.DueDate || '', SortOrder: upserts.length + 1
      };
      upserts.push(row);
      if (row.ActionID) keep[row.ActionID] = true;
    });
    var deletes = (sheetToObjects_(SHEETS.ACTIONS) || []).filter(function (r) {
      return r.ScenarioID === scenarioId && !keep[r.ActionID];
    }).map(function (r) { return r.ActionID; });
    batchWriteRows_(SHEETS.ACTIONS, 'ActionID', upserts, deletes);
    return getActions(scenarioId);
  });
}

/* ---------------------------------------------------------------
 * 排序(拖曳後一次送出完整順序，取代一格一格的上下移動鈕)
 * ------------------------------------------------------------- */

function setVehicleOrder(vehicleTypeId, vehicleIds) {
  return withLock_(function () {
    var vehicles = getVehicles(vehicleTypeId);
    var pos = {};
    (vehicleIds || []).forEach(function (id, i) { pos[id] = i; });
    var ordered = vehicles.slice().sort(function (a, b) {
      var pa = pos[a.VehicleID] === undefined ? 1e6 : pos[a.VehicleID];
      var pb = pos[b.VehicleID] === undefined ? 1e6 : pos[b.VehicleID];
      return pa - pb;
    });
    var upserts = ordered.map(function (v, i) {
      var row = {};
      SCHEMA.Vehicles.forEach(function (h) { row[h] = v[h] === undefined ? '' : v[h]; });
      row.SortOrder = i + 1;
      return row;
    });
    batchWriteRows_(SHEETS.VEHICLES, 'VehicleID', upserts, []);
    return getVehicles(vehicleTypeId);
  });
}

function setScenarioOrder(vehicleTypeId, scenarioIds) {
  return withLock_(function () {
    var scenarios = getScenarios(vehicleTypeId);
    var pos = {};
    (scenarioIds || []).forEach(function (id, i) { pos[id] = i; });
    var upserts = scenarios.map(function (s) {
      var row = {};
      SCHEMA.Scenarios.forEach(function (h) { row[h] = s[h] === undefined ? '' : s[h]; });
      row.SortOrder = pos[s.ScenarioID] === undefined ? 1e6 : pos[s.ScenarioID] + 1;
      return row;
    });
    batchWriteRows_(SHEETS.SCENARIOS, 'ScenarioID', upserts, []);
    return getScenarios(vehicleTypeId);
  });
}

/* ---------------------------------------------------------------
 * 建立車型(同時決定科目表從哪裡複製)
 * ------------------------------------------------------------- */

function createVehicleType(vehicleTypeId, notes, chartSourceTypeId) {
  return withLock_(function () {
    var id = String(vehicleTypeId || '').trim();
    if (!id) throw new Error('請輸入車型代號');
    if (getVehicleTypes().some(function (t) { return String(t.VehicleTypeID) === id; })) throw new Error('車型「' + id + '」已經存在');
    upsertRow_(SHEETS.VEHICLE_TYPES, 'VehicleTypeID', { VehicleTypeID: id, Notes: notes || '' });
    ensureTypeChart_(id, chartSourceTypeId || '');
    return getVehicleTypes();
  });
}


// ===== src/CalcEngine.gs =====
/**
 * 損益計算引擎：依每個車型自己的科目表(公式)算損益。
 *
 * 以前 Gate F 的公式鏈(售價結構 → 收入 → 銷貨成本 → … → 營業淨利)寫死在這裡；現在每個科目的
 * 計算來源都是資料(見 ChartService.gs)：手動輸入 / 公式 / 開發總投攤提。標準範本的預設公式
 * 跟原本寫死的算法逐格相同(tools/verify-gatef.js 用實際 Gate F 表驗算 317 格)：
 *   P6 營業稅 = ROUND(P5 × 稅率 ÷ (1+稅率))、P7 佣金 = ROUND((P5-P6) × 佣金率)、P8 廠價 = P5-P6-P7
 *   b13 貨物稅 = (P8 - 水平配件調降 - TAXDEDUCT()) × 完稅價格計算率 ÷ (1+貨物稅率) × 貨物稅率
 *   d4 季Margin = P8 × 季Margin率；B/E/G/I 小計 = CHILDREN()；K = I - J
 *   開發總投攤提 = 低減後投資額 ÷ LIFE CYCLE 總台數(可以只攤給部分車系)
 * 所有比率參數以百分比數值儲存(5 = 5%)，公式裡用 [參數名] 取用時自動換成小數。
 * 外幣的成本/開發投資用「匯率設定」頁的現況匯率換算。
 */

/** 百分比數值(0~100) -> 小數 */
function pct_(v) {
  return toNumber_(v) / 100;
}

/**
 * 取某幣別換算台幣的匯率(1 外幣 = ? 台幣)。
 * 本位幣或沒設定匯率時回傳 1，讓金額原封不動帶入，不會因為忘了設匯率就被歸零。
 */
function fxRateFor_(params, currency, vehicleId) {
  if (!currency || currency === BASE_CURRENCY) return 1;
  var match = params.filter(function (p) {
    return p.ParamName === COST_FX_PARAM_NAME && p.Currency === currency &&
      (!p.VehicleID || p.VehicleID === vehicleId);
  });
  var specific = match.filter(function (p) { return p.VehicleID === vehicleId; });
  var picked = specific.length ? specific[0] : match[0];
  return picked ? (toNumber_(picked.Value) || 1) : 1;
}

/* ---------------------------------------------------------------
 * 假設分析(What-if)：目標反推與敏感度表要「假設月銷量變成 N、售價調 x%、某科目降 y%…」重算損益，
 * 但完全不能動到存檔的資料。做法是在計算期間掛一組只存在記憶體裡的覆寫(CALC_OVERRIDES_)，
 * 計算引擎讀銷售構成/參數/科目金額時套上去，算完立刻拿掉(見 WhatIfService.gs withOverrides_)。
 *   { scenarioId, volume: 倍數, price: 倍數, lineScale: {科目: 倍數}, dev: 倍數,
 *     params: {參數名稱: 值(原單位)}, fx: {幣別: 匯率} }
 * 只套在指定的情境上；REF 引用到的其他情境照原本的資料算。
 * --------------------------------------------------------------- */
var CALC_OVERRIDES_ = null;
function overridesFor_(scenarioId) {
  return CALC_OVERRIDES_ && CALC_OVERRIDES_.scenarioId === scenarioId ? CALC_OVERRIDES_ : null;
}
function calcSalesMix_(scenarioId) {
  var rows = getSalesMix(scenarioId);
  var o = overridesFor_(scenarioId);
  if (!o || (!o.volume && !o.price)) return rows;
  return rows.map(function (r) {
    var c = {};
    Object.keys(r).forEach(function (k) { c[k] = r[k]; });
    if (o.volume) c.MonthlyVolume = toNumber_(r.MonthlyVolume) * o.volume;
    if (o.price) c.ListPriceTaxIncl = toNumber_(r.ListPriceTaxIncl) * o.price;
    return c;
  });
}
function calcParameters_(scenarioId) {
  var params = getParameters(scenarioId);
  var o = overridesFor_(scenarioId);
  if (!o || (!o.params && !o.fx)) return params;
  var p = o.params || {}, fx = o.fx || {};
  var out = params.filter(function (r) {
    if (p[r.ParamName] !== undefined) return false;
    if (r.ParamName === COST_FX_PARAM_NAME && fx[r.Currency] !== undefined) return false;
    return true;
  });
  Object.keys(p).forEach(function (name) { out.push({ ParamName: name, VehicleID: '', ScenarioID: scenarioId, Value: p[name], Currency: '' }); });
  Object.keys(fx).forEach(function (cur) { out.push({ ParamName: COST_FX_PARAM_NAME, VehicleID: '', ScenarioID: scenarioId, Value: fx[cur], Currency: cur }); });
  return out;
}
function overrideLineScale_(scenarioId, code) {
  var o = overridesFor_(scenarioId);
  return o && o.lineScale && o.lineScale[code] !== undefined ? o.lineScale[code] : 1;
}
function overrideDevScale_(scenarioId) {
  var o = overridesFor_(scenarioId);
  return o && o.dev !== undefined ? o.dev : 1;
}

/**
 * 算損益並把結果寫回 PLResult 快照（快照給外部讀取用，畫面一律用不寫入的 calculatePLCore_）。
 */
function calculatePL(scenarioId, vehicleId) {
  var result = calculatePLCore_(scenarioId, vehicleId);
  var timestamp = new Date();
  writePLResult_(scenarioId, vehicleId, result.lineValues, result.revenue, result.exFactoryPrice, timestamp);
  return {
    scenarioId: result.scenarioId,
    vehicleId: result.vehicleId,
    calculatedAt: timestamp.toISOString(), // 巢狀 Date 物件會讓 google.script.run 整包回傳變 null，一律轉字串
    revenue: result.revenue,
    exFactoryPrice: result.exFactoryPrice,
    errors: result.errors,
    traces: result.traces,
    lines: result.lines
  };
}

/**
 * 純計算損益：不寫入 PLResult，只回傳算出來的結果。
 * 同一次執行內以「情境|車系」為鍵記住結果(儀表板/報告常常同一個車系被好幾欄用到)。
 * 任何寫入都會透過 invalidateSheetCache_ → resetExecutionCaches_ 清掉，不會讀到舊結果。
 */
var PL_CORE_MEMO_ = {};
var REF_STACK_ = [];   // 跨情境引用(REF)正在計算中的情境|車系，用來擋循環引用
function calculatePLCore_(scenarioId, vehicleId) {
  // 假設分析(目標反推/敏感度)改的數字只在記憶體裡，不能讀/寫一般的計算記憶
  if (CALC_OVERRIDES_ && CALC_OVERRIDES_.scenarioId === scenarioId) return calculatePLWithDefs_(scenarioId, vehicleId, null);
  var key = String(scenarioId) + '|' + String(vehicleId);
  if (!PL_CORE_MEMO_[key]) PL_CORE_MEMO_[key] = calculatePLWithDefs_(scenarioId, vehicleId, null);
  return PL_CORE_MEMO_[key];
}

/**
 * 系統變數：公式裡的 [建議零售價]、[LC總台數] 這類名稱的值(每個車系各一份)。
 */
function systemVariables_(scenarioId, salesMixRow, salesMix, params, vehicleId) {
  var taxRate = pct_(lookupParam_(params, '營業稅率', vehicleId));
  var scrapRaw = toNumber_(salesMixRow.ScrapFee);
  var totalPct = salesMix.reduce(function (s, r) { return s + toNumber_(r.SalesMixPct); }, 0);
  var monthly = toNumber_(salesMixRow.MonthlyVolume);
  var years = toNumber_(salesMixRow.LifeCycleYears);
  return {
    '建議零售價': toNumber_(salesMixRow.ListPriceTaxIncl),
    '強配件售價': toNumber_(salesMixRow.MandatoryAccessoryPrice),
    '廢車處理費': scrapRaw,
    // 廢車處理費可能用含稅或未稅登打，一律換算成含稅(取整，與 Gate F Excel 的 ROUND 一致)，全份損益稅別口徑才一致
    '廢車處理費(含稅)': salesMixRow.ScrapFeeTaxStatus === '未稅' ? Math.round(scrapRaw * (1 + taxRate)) : scrapRaw,
    '水平配件調降': toNumber_(salesMixRow.HorizontalPartsPriceAdj),
    '月銷量': monthly,
    'LC年限': years,
    'LC總台數': monthly * 12 * years,
    '構成比': totalPct ? toNumber_(salesMixRow.SalesMixPct) / totalPct : 0,
    '車型月總台數': salesMix.reduce(function (s, r) { return s + toNumber_(r.MonthlyVolume); }, 0),
    '攤提總台數': getLifeCycleUnits(scenarioId)
  };
}

/**
 * 依科目表(公式)算某情境某車系的損益。overrideDefs 有值時用它取代存檔的科目表(科目設定頁試算用)。
 *
 * 每個科目依計算來源取值：
 *   INPUT     銷貨成本/營業費用頁該車系輸入的金額(外幣依匯率設定換算)
 *   DEV_AMORT 開發總投攤提到這個科目的單台金額(含只攤給部分車系的金額)
 *   FORMULA   公式(車系有個別公式時用個別公式)
 * 公式之間的相依順序由求值時遞迴決定(用到誰就先算誰)，循環引用會被擋下並記錄在 errors。
 * 單一科目的公式出錯不會讓整張損益表掛掉：那一格以 0 計，錯誤訊息放在 errors 給畫面顯示。
 */
/**
 * probe(選用，科目設定頁的公式編輯器用)：{ code, formulas: [...] } —— 整張損益算完之後，
 * 用 code 這個科目的計算環境(CHILDREN() 指它的子科目)另外算每一段公式，回傳在 probes(算不出來是 null)。
 * 公式編輯器靠它顯示「每一行」「每一顆膠囊」目前是多少。
 */
function calculatePLWithDefs_(scenarioId, vehicleId, overrideDefs, probe) {
  var salesMix = calcSalesMix_(scenarioId);
  var salesMixRow = salesMix.filter(function (r) { return r.VehicleID === vehicleId; })[0];
  if (!salesMixRow) throw new Error('找不到 SalesMix 資料：' + scenarioId + ' / ' + vehicleId);

  var defs = overrideDefs || lineDefsForScenario_(scenarioId);
  var params = calcParameters_(scenarioId);
  var vars = systemVariables_(scenarioId, salesMixRow, salesMix, params, vehicleId);
  var paramDefs = {};
  getParamDefs().forEach(function (d) { paramDefs[d.ParamName] = d; });

  var byCode = {}, byName = {}, children = {};
  defs.forEach(function (d) {
    byCode[d.LineCode] = d;
    if (!byName[d.LineName]) byName[d.LineName] = d;
    if (d.ParentLine) (children[d.ParentLine] = children[d.ParentLine] || []).push(d.LineCode);
  });
  var taxDeductCodes = defs.filter(function (d) { return String(d.CommodityTaxDeduct || '').toUpperCase() === 'Y'; })
    .map(function (d) { return d.LineCode; });

  // 手動輸入金額：銷貨成本 + 營業費用兩頁合併，依科目代碼加總(科目已刪除的殘留金額不計入)
  var inputs = {};
  getCostOfSales(scenarioId, vehicleId).concat(getOperatingExpense(scenarioId, vehicleId)).forEach(function (r) {
    if (!r.LineCode || !byCode[r.LineCode]) return;
    inputs[r.LineCode] = (inputs[r.LineCode] || 0) + toNumber_(r.Amount) * fxRateFor_(params, r.Currency, vehicleId);
  });
  var dev = amortizeDevInvestmentPerUnit_(scenarioId, null);

  var values = {}, errors = {}, traces = {}, visiting = {}, excluded = {};

  function devAmount(code) {
    var all = dev.perUnit[code];
    var own = (dev.perVehicle[vehicleId] || {})[code];
    if (all === undefined && own === undefined) return undefined;
    return (all || 0) + (own || 0);
  }

  function valueOf(code) {
    if (values[code] !== undefined) return values[code];
    var d = byCode[code];
    if (!d) throw formulaError_('找不到科目代碼 ' + code);
    if (visiting[code]) throw formulaError_('循環引用（' + d.LineName + '）');
    visiting[code] = true;
    var v = 0;
    try {
      var formula = lineFormulaFor_(d, vehicleId);
      var useFormula = d.CalcType === CALC_TYPES.FORMULA || formula !== '' && parseVehicleFormulas_(d.VehicleFormulas)[vehicleId];
      if (useFormula) {
        v = evalLineFormula_(code, formula);
      } else if (d.CalcType === CALC_TYPES.DEV_AMORT) {
